                ['Account', visit.customer_id ? 'linked' : 'none'],
              ].map(([k, v]) => (
                <div key={k} className="rb-fact">
                  <span className="rb-fact-k">{k}</span>
                  <span className="rb-fact-v" style={v === '—' || v === 'none' ? { color: 'var(--hot)' } : undefined}>{v}</span>
                </div>
              ))}
            </div>
          </div>

          <div className="form-card">
            <h3>Items</h3>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 9 }}>
              {items.map(i => (
                <div key={i.id} style={{ display: 'flex', gap: 10, alignItems: 'baseline' }}>
                  <span style={{ minWidth: 0, display: 'flex', flexDirection: 'column' }}>
                    {formatLineItem(i).brand && <span style={{ font: '400 10px/1 var(--mono)', color: 'var(--faint)', marginBottom: 3 }}>{formatLineItem(i).brand}</span>}
                    <span style={{ font: '400 12px/1.35 var(--sans)' }}>{formatLineItem(i).name}</span>
                    {formatLineItem(i).sku && <span style={{ font: '400 10px/1 var(--mono)', color: 'var(--faint)', marginTop: 3 }}>{formatLineItem(i).sku}</span>}
                  </span>
                  <span style={{ marginLeft: 'auto', font: '400 10px/1 var(--mono)', color: 'var(--faint)', whiteSpace: 'nowrap' }}>
                    {money(i.retail_price)}{i.retail_price != null && i.price_basis === 'per_sqft' ? '/sf' : ''}
                  </span>
                </div>
              ))}
            </div>
          </div>

          </div>
          </div>
          </div>

          {dirty && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '11px 22px', borderTop: '1px solid var(--line2)', background: 'var(--panel2)', flexShrink: 0, flexWrap: 'wrap' }}>
              <span style={{ font: '400 10px/1 var(--mono)', letterSpacing: '0.12em', color: 'var(--gold)', whiteSpace: 'nowrap' }}>UNCOMMITTED</span>
              <span style={{ font: '400 12px/1.4 var(--sans)', color: 'var(--dim)', textWrap: 'pretty' }}>
                {[eName !== null && 'Name set', eEmail !== null && 'Email set', ePhone !== null && 'Phone set'].filter(Boolean).join(' · ')}
                {emailOk ? ' · the recap can send with all ' + items.length + ' item' + (items.length === 1 ? '' : 's') : ' · still no valid email'}
              </span>
              <span style={{ marginLeft: 'auto', display: 'flex', gap: 8, flexShrink: 0 }}>
                <button className="opsq-alt" disabled={saving || sending} onClick={() => { setEName(null); setEEmail(null); setEPhone(null); }}>Discard</button>
                <button className="opsq-alt" disabled={saving || sending || !N.trim()} onClick={() => saveContact(false)}>{saving ? 'Saving…' : 'Save'}</button>
                <button className="recd-exc-primary" disabled={saving || sending || !emailOk || !N.trim()} onClick={() => saveContact(true)}>
                  {saving || sending ? 'Working…' : (emailOk ? 'Save and send recap' : 'Email required')}
                </button>
              </span>
            </div>
          )}
        </div>
      );
    }

    // ========== AuditLogView ==========
    function AuditLogView({ navigate }) {
      const [logs, setLogs] = useState([]);
      const [loading, setLoading] = useState(true);
      const [page, setPage] = useState(0); // 0-based offset paging
      const [actionFilter, setActionFilter] = useState('');
      const [entityFilter, setEntityFilter] = useState('');
      const LIMIT = 50;

      const load = () => {
        setLoading(true);
        let url = '/api/admin/audit-log?limit=' + LIMIT + '&offset=' + (page * LIMIT);
        if (actionFilter) url += '&action=' + encodeURIComponent(actionFilter);
        if (entityFilter) url += '&entity_type=' + encodeURIComponent(entityFilter);
        adminFetch(url)
          .then(data => { setLogs(data.entries || []); setLoading(false); })
          .catch(() => setLoading(false));
      };

      useEffect(load, [page, actionFilter, entityFilter]);

      const inputStyle = { padding: '0.4rem 0.6rem', border: '1px solid var(--stone-300)', fontSize: '0.8125rem' };

      return (
        <div>
          <div className="content-header">
            <h1>Audit Log</h1>
            <button className="btn btn-secondary" onClick={() => navigate('staff')}>\u2190 Staff</button>
          </div>
          <div style={{ display: 'flex', gap: '0.75rem', marginBottom: '1rem', alignItems: 'center', flexWrap: 'wrap' }}>
            <input type="text" value={actionFilter} onChange={e => { setActionFilter(e.target.value); setPage(0); }}
              placeholder="action \u2014 e.g. staff.login" style={{ ...inputStyle, minWidth: '200px' }} />
            <input type="text" value={entityFilter} onChange={e => { setEntityFilter(e.target.value); setPage(0); }}
              placeholder="entity type \u2014 e.g. staff_accounts" style={{ ...inputStyle, minWidth: '200px' }} />
            <span style={{ marginLeft: 'auto', fontSize: '0.8125rem', color: 'var(--stone-400)' }}>Page {page + 1}</span>
          </div>
          {loading ? <div className="loading">Loading...</div> : (
            <div className="table-scroll-wrapper">
            <table className="data-table">
              <thead>
                <tr>
                  <th>When</th>
                  <th>Actor</th>
                  <th>Action</th>
                  <th>Entity</th>
                  <th>Details</th>
                  <th>IP</th>
                </tr>
              </thead>
              <tbody>
                {logs.map(log => (
                  <tr key={log.id}>
                    <td style={{ fontSize: '0.8125rem', color: 'var(--stone-500)', whiteSpace: 'nowrap' }}>{new Date(log.created_at).toLocaleString()}</td>
                    <td style={{ fontSize: '0.8125rem' }}>{log.staff_name || log.staff_email || '\u2014'}</td>
                    <td style={{ fontWeight: 500, fontSize: '0.8125rem' }}>{log.action}</td>
                    <td style={{ fontSize: '0.8125rem', color: 'var(--stone-500)' }}>{log.entity_type ? log.entity_type + (log.entity_id ? ' #' + String(log.entity_id).slice(0, 8) : '') : '\u2014'}</td>
                    <td style={{ fontSize: '0.75rem', color: 'var(--stone-400)', maxWidth: '300px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                      {log.details ? (typeof log.details === 'string' ? log.details : JSON.stringify(log.details)) : '\u2014'}
                    </td>
                    <td style={{ fontSize: '0.75rem', color: 'var(--stone-400)' }}>{log.ip_address || '\u2014'}</td>
                  </tr>
                ))}
                {logs.length === 0 && (
                  <tr><td colSpan="6" style={{ textAlign: 'center', color: 'var(--stone-400)', padding: '2rem' }}>No audit log entries found</td></tr>
                )}
              </tbody>
            </table>
            </div>
          )}
          <div style={{ display: 'flex', justifyContent: 'center', gap: '0.5rem', marginTop: '1rem' }}>
            <button className="btn btn-secondary btn-sm" disabled={page <= 0} onClick={() => setPage(p => p - 1)}>Previous</button>
            <button className="btn btn-secondary btn-sm" disabled={logs.length < LIMIT} onClick={() => setPage(p => p + 1)}>Next</button>
          </div>
        </div>
      );
    }

    // ========== DataQualityView ==========
    // Surfaces conformance violations from the rules engine (naming lint,
    // selling-convention violations, price-basis outliers).
    function DataQualityView({ navigate }) {
      const LIMIT = 100;
      const [summary, setSummary] = useState(null);
      const [summaryLoading, setSummaryLoading] = useState(true);
      const [running, setRunning] = useState(false);
      const [runMsg, setRunMsg] = useState(null);
      const [checkImages, setCheckImages] = useState(false);

      // Violations list filters + paging
      const [statusFilter, setStatusFilter] = useState('open');
      const [ruleFilter, setRuleFilter] = useState('');
      const [vendorFilter, setVendorFilter] = useState('');
      const [sevFilter, setSevFilter] = useState('');
      const [qInput, setQInput] = useState('');
      const [q, setQ] = useState('');
      const [page, setPage] = useState(0);
      const [violations, setViolations] = useState([]);
      const [total, setTotal] = useState(0);
      const [listLoading, setListLoading] = useState(true);

      // Collapsible sections
      const [showVendors, setShowVendors] = useState(true);
      const [showExemptions, setShowExemptions] = useState(false);

      // Add-exemption form
      const [exRule, setExRule] = useState('');
      const [exVendor, setExVendor] = useState('');
      const [exNote, setExNote] = useState('');
      const [exSaving, setExSaving] = useState(false);

      const listRef = React.useRef(null);

      const loadSummary = () => {
        adminFetch('/api/admin/quality/summary')
          .then(d => { setSummary(d); setSummaryLoading(false); })
          .catch(() => setSummaryLoading(false));
      };
      useEffect(loadSummary, []);

      // Debounce free-text search
      useEffect(() => {
        const t = setTimeout(() => { setQ(qInput); setPage(0); }, 350);
        return () => clearTimeout(t);
      }, [qInput]);

      const loadViolations = () => {
        setListLoading(true);
        let url = '/api/admin/quality/violations?status=' + statusFilter + '&limit=' + LIMIT + '&offset=' + (page * LIMIT);
        if (ruleFilter) url += '&rule=' + encodeURIComponent(ruleFilter);
        if (vendorFilter) url += '&vendor=' + encodeURIComponent(vendorFilter);
        if (sevFilter) url += '&severity=' + sevFilter;
        if (q) url += '&q=' + encodeURIComponent(q);
        adminFetch(url)
          .then(d => { setViolations(d.violations || []); setTotal(d.total || 0); setListLoading(false); })
          .catch(() => setListLoading(false));
      };
      useEffect(loadViolations, [statusFilter, ruleFilter, vendorFilter, sevFilter, q, page]);

      const refreshAll = () => { loadSummary(); loadViolations(); };

      const rules = (summary && summary.rules) || [];
      const byRuleMap = {};
      ((summary && summary.by_rule) || []).forEach(r => { byRuleMap[r.rule_key] = r; });
      const byVendor = (summary && summary.by_vendor) || [];
      const exemptions = (summary && summary.exemptions) || [];
      const lastRun = ((summary && summary.recent_runs) || [])[0] || null;

      const openErrors = ((summary && summary.by_rule) || []).reduce((n, r) => n + (r.severity === 'error' ? Number(r.open || 0) : 0), 0);
      const openWarns = ((summary && summary.by_rule) || []).reduce((n, r) => n + (r.severity !== 'error' ? Number(r.open || 0) : 0), 0);
      const openTotal = openErrors + openWarns;

      const fmtShort = d => d ? new Date(d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '—';
      const fmtWhen = d => d ? new Date(d).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—';
      const sevBadge = sev => (
        <span className={'quality-badge ' + (sev === 'error' ? 'quality-poor' : 'quality-fair')}>{sev === 'error' ? 'error' : 'warn'}</span>
      );

      const filterTo = (patch) => {
        setStatusFilter('open');
        setRuleFilter(patch.rule != null ? patch.rule : '');
        setVendorFilter(patch.vendor != null ? patch.vendor : '');
        if (patch.severity != null) setSevFilter(patch.severity);
        setPage(0);
        if (listRef.current) listRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };

      const runAudit = () => {
        if (running) return;
        setRunning(true);
        setRunMsg(null);
        adminFetch('/api/admin/quality/run', { method: 'POST', body: JSON.stringify({ check_images: checkImages }) })
          .then(d => {
            setRunning(false);
            setRunMsg({ msg: 'Audit complete — ' + d.newCount + ' new, ' + d.reopenedCount + ' reopened, ' + d.fixedCount + ' fixed, ' + d.openTotal + ' open.' });
            refreshAll();
          })
          .catch(err => {
            setRunning(false);
            const already = /already|409/i.test(err.message || '');
            setRunMsg({ err: true, msg: already ? 'An audit is already running — try again in a bit.' : err.message });
            if (already) loadSummary();
          });
      };

      const waiveOne = (v) => {
        const note = window.prompt('Waive this violation — optional note:', '');
        if (note === null) return;
        adminFetch('/api/admin/quality/violations/' + v.id + '/waive', { method: 'POST', body: JSON.stringify({ note: note.trim() }) })
          .then(refreshAll)
          .catch(err => alert(err.message));
      };

      const reopenOne = (v) => {
        adminFetch('/api/admin/quality/violations/' + v.id + '/reopen', { method: 'POST', body: JSON.stringify({}) })
          .then(refreshAll)
          .catch(err => alert(err.message));
      };

      const waiveAllForRule = (ruleDef, openCount) => {
        if (!window.confirm('Waive ALL ' + openCount + ' open violation(s) of “' + ruleDef.title + '”? They stay on record as waived.')) return;
        const note = window.prompt('Note for this bulk waive (goes on every violation):', '');
        if (note === null) return;
        adminFetch('/api/admin/quality/violations/waive-bulk', { method: 'POST', body: JSON.stringify({ rule_key: ruleDef.key, note: note.trim() }) })
          .then(d => { setRunMsg({ msg: 'Waived ' + (d.waived != null ? d.waived : openCount) + ' violation(s) of “' + ruleDef.title + '”.' }); refreshAll(); })
          .catch(err => alert(err.message));
      };

      const addExemption = () => {
        if (!exRule || !exVendor.trim()) { alert('Pick a rule and enter a vendor code.'); return; }
        setExSaving(true);
        adminFetch('/api/admin/quality/exemptions', { method: 'POST', body: JSON.stringify({ rule_key: exRule, vendor_code: exVendor.trim().toUpperCase(), note: exNote.trim() }) })
          .then(() => { setExSaving(false); setExRule(''); setExVendor(''); setExNote(''); refreshAll(); })
          .catch(err => { setExSaving(false); alert(err.message); });
      };

      const deleteExemption = (ex) => {
        if (!window.confirm('Remove the exemption for ' + (ex.vendor_code || '?') + ' / ' + ex.rule_key + '? The next audit will check this vendor again.')) return;
        adminFetch('/api/admin/quality/exemptions/' + ex.id, { method: 'DELETE' })
          .then(refreshAll)
          .catch(err => alert(err.message));
      };

      const auditRunning = running || !!(summary && summary.audit_running);
      const pageStart = total === 0 ? 0 : page * LIMIT + 1;
      const pageEnd = Math.min(total, page * LIMIT + violations.length);

      if (summaryLoading && !summary) return <div className="loading">Loading data quality...</div>;

      return (
        <div>
          <div className="content-header">
            <h1>Data Quality</h1>
            <button className="btn btn-secondary" onClick={() => navigate('products')}>Products →</button>
          </div>

          {/* Summary cards */}
          <div className="stat-grid" style={{ marginBottom: '1rem' }}>
            <div className="stat-card">
              <div className="stat-card-label">Open Violations</div>
              <div className="stat-card-value">{openTotal}</div>
              <div style={{ marginTop: '0.375rem', display: 'flex', gap: '0.375rem', flexWrap: 'wrap' }}>
                <span className="quality-badge quality-poor">{openErrors} errors</span>
                <span className="quality-badge quality-fair">{openWarns} warnings</span>
              </div>
            </div>
            <div className="stat-card">
              <div className="stat-card-label">Last Run</div>
              <div className="stat-card-value" style={{ fontSize: '1.125rem' }}>{lastRun ? fmtWhen(lastRun.finished_at || lastRun.started_at) : 'Never'}</div>
              {lastRun && (
                <div style={{ marginTop: '0.375rem', fontSize: '0.75rem', color: 'var(--stone-500)' }}>
                  {lastRun.triggered_by || 'system'} · {lastRun.new_count} new · {lastRun.fixed_count} fixed
                  {lastRun.error && <span style={{ color: 'var(--red)' }}> · error: {lastRun.error}</span>}
                </div>
              )}
            </div>
            <div className="stat-card">
              <div className="stat-card-label">Audit</div>
              <button className="btn btn-primary btn-sm" style={{ marginTop: '0.375rem' }} disabled={auditRunning} onClick={runAudit}>
                {auditRunning ? 'Running…' : 'Run audit now'}
              </button>
              <label style={{ display: 'flex', alignItems: 'center', gap: '0.375rem', marginTop: '0.5rem', fontSize: '0.6875rem', color: 'var(--stone-500)', cursor: 'pointer' }}>
                <input type="checkbox" checked={checkImages} onChange={e => setCheckImages(e.target.checked)} disabled={auditRunning} />
                include image checks (slow, samples 1000)
              </label>
            </div>
          </div>
          {runMsg && (
            <div style={{ marginBottom: '1rem', padding: '0.625rem 0.875rem', borderRadius: 'var(--radius-sm)', fontSize: '0.8125rem',
              background: runMsg.err ? 'var(--red-light)' : 'var(--green-light)', color: runMsg.err ? 'var(--red)' : 'var(--green)' }}>
              {runMsg.msg}
            </div>
          )}

          {/* By rule + by vendor */}
          <div className="dq-panels">
            <div>
              <h2 style={{ fontSize: '0.9375rem', marginBottom: '0.625rem' }}>By rule</h2>
              <div className="table-scroll-wrapper">
                <table className="admin-table">
                  <thead>
                    <tr>
                      <th>Rule</th>
                      <th>Severity</th>
                      <th>Open</th>
                      <th>Waived</th>
                      <th>Fixed 30d</th>
                      <th>Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    {rules.map(r => {
                      const agg = byRuleMap[r.key] || {};
                      const open = Number(agg.open || 0);
                      return (
                        <tr key={r.key}>
                          <td>
                            <div style={{ fontWeight: 500 }}>{r.title}{r.heavy ? <span title="Heavy rule — only runs on full audits" style={{ color: 'var(--stone-400)' }}> ⚙</span> : null}</div>
                            <div className="dq-rule-key">{r.key}</div>
                          </td>
                          <td>{sevBadge(r.severity)}</td>
                          <td>
                            <button className="dq-count-link" disabled={open === 0} onClick={() => filterTo({ rule: r.key })}>{open}</button>
                          </td>
                          <td style={{ color: 'var(--stone-500)' }}>{Number(agg.waived || 0)}</td>
                          <td style={{ color: 'var(--stone-500)' }}>{Number(agg.fixed_30d || 0)}</td>
                          <td className="actions">
                            {open > 0 && (
                              <button className="btn btn-secondary btn-sm" onClick={() => waiveAllForRule(r, open)}>Waive all…</button>
                            )}
                          </td>
                        </tr>
                      );
                    })}
                    {rules.length === 0 && (
                      <tr><td colSpan="6" style={{ textAlign: 'center', color: 'var(--stone-400)', padding: '1.5rem' }}>No rules registered</td></tr>
                    )}
                  </tbody>
                </table>
              </div>
            </div>

            <div>
              <button className="dq-section-toggle" style={{ marginBottom: '0.625rem' }} onClick={() => setShowVendors(v => !v)}>
                <span style={{ fontSize: '0.6875rem' }}>{showVendors ? '▼' : '▶'}</span> By vendor
              </button>
              {showVendors && (
                <div className="table-scroll-wrapper">
                  <table className="admin-table">
                    <thead>
                      <tr>
                        <th>Vendor</th>
                        <th>Open</th>
                        <th>Errors</th>
                      </tr>
                    </thead>
                    <tbody>
                      {byVendor.map(v => (
                        <tr key={v.vendor_code || v.vendor_id}>
                          <td>
                            <div style={{ fontWeight: 500 }}>{v.vendor_name || '—'}</div>
                            <div className="dq-rule-key">{v.vendor_code}</div>
                          </td>
                          <td>
                            <button className="dq-count-link" disabled={!Number(v.open)} onClick={() => filterTo({ vendor: v.vendor_code })}>{Number(v.open || 0)}</button>
                          </td>
                          <td>
                            {Number(v.open_errors) > 0
                              ? <span className="quality-badge quality-poor">{Number(v.open_errors)}</span>
                              : <span style={{ color: 'var(--stone-400)' }}>0</span>}
                          </td>
                        </tr>
                      ))}
                      {byVendor.length === 0 && (
                        <tr><td colSpan="3" style={{ textAlign: 'center', color: 'var(--stone-400)', padding: '1.5rem' }}>No open violations by vendor</td></tr>
                      )}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          </div>

          {/* Violations list */}
          <div ref={listRef}>
            <h2 style={{ fontSize: '0.9375rem', marginBottom: '0.625rem' }}>Violations</h2>
            <div className="filter-bar" style={{ marginBottom: '1rem' }}>
              <select value={statusFilter} onChange={e => { setStatusFilter(e.target.value); setPage(0); }}>
                <option value="open">Open</option>
                <option value="waived">Waived</option>
                <option value="fixed">Fixed</option>
                <option value="all">All statuses</option>
              </select>
              <select value={ruleFilter} onChange={e => { setRuleFilter(e.target.value); setPage(0); }}>
                <option value="">All rules</option>
                {rules.map(r => <option key={r.key} value={r.key}>{r.title}</option>)}
              </select>
              <select value={vendorFilter} onChange={e => { setVendorFilter(e.target.value); setPage(0); }}>
                <option value="">All vendors</option>
                {byVendor.map(v => <option key={v.vendor_code || v.vendor_id} value={v.vendor_code}>{(v.vendor_name || v.vendor_code) + ' (' + v.vendor_code + ')'}</option>)}
              </select>
              <select value={sevFilter} onChange={e => { setSevFilter(e.target.value); setPage(0); }}>
                <option value="">Any severity</option>
                <option value="error">Errors</option>
                <option value="warn">Warnings</option>
              </select>
              <input type="text" value={qInput} onChange={e => setQInput(e.target.value)} placeholder="Search summary / SKU…" />
              <span className="filter-count" style={{ marginLeft: 'auto' }}>
                {listLoading ? 'Loading…' : total === 0 ? 'No violations' : pageStart + '–' + pageEnd + ' of ' + total}
              </span>
            </div>
            <div className="table-scroll-wrapper">
              <table className="admin-table">
                <thead>
                  <tr>
                    <th>Sev</th>
                    <th>Rule</th>
                    <th>Summary</th>
                    <th>Vendor</th>
                    <th>First seen</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {violations.map(v => (
                    <tr key={v.id}>
                      <td>{sevBadge(v.severity)}</td>
                      <td><span className="dq-rule-key">{v.rule_key}</span></td>
                      <td className="dq-summary-cell">
                        <div>{v.summary}</div>
                        {v.internal_sku && (
                          <div className="dq-rule-key" style={{ marginTop: '0.125rem' }}>
                            {v.product_id
                              ? <a href={'#product-edit/' + v.product_id} onClick={e => { e.preventDefault(); navigate('product-edit', v.product_id); }} style={{ color: 'var(--stone-400)' }}>{v.internal_sku}</a>
                              : v.internal_sku}
                          </div>
                        )}
                        {v.status === 'waived' && (
                          <div className="dq-waive-note" title={v.waive_note || ''}>
                            waived {v.waived_by ? 'by ' + v.waived_by : ''}{v.waived_at ? ' · ' + fmtShort(v.waived_at) : ''}{v.waive_note ? ' — ' + v.waive_note : ''}
                          </div>
                        )}
                        {v.status === 'fixed' && (
                          <div className="dq-waive-note">fixed · last seen {fmtShort(v.last_seen)}</div>
                        )}
                      </td>
                      <td><span className="dq-rule-key" style={{ color: 'var(--stone-500)' }}>{v.vendor_code || '—'}</span></td>
                      <td style={{ whiteSpace: 'nowrap', color: 'var(--stone-500)', fontSize: '0.8125rem' }} title={v.first_seen ? new Date(v.first_seen).toLocaleString() : ''}>{fmtShort(v.first_seen)}</td>
                      <td className="actions">
                        {v.status === 'open' && <button className="btn btn-secondary btn-sm" onClick={() => waiveOne(v)}>Waive</button>}
                        {v.status === 'waived' && <button className="btn btn-secondary btn-sm" onClick={() => reopenOne(v)}>Reopen</button>}
                      </td>
                    </tr>
                  ))}
                  {!listLoading && violations.length === 0 && (
                    <tr><td colSpan="6" style={{ textAlign: 'center', color: 'var(--stone-400)', padding: '2rem' }}>No violations match these filters</td></tr>
                  )}
                </tbody>
              </table>
            </div>
            <div style={{ display: 'flex', justifyContent: 'center', gap: '0.5rem', marginTop: '1rem' }}>
              <button className="btn btn-secondary btn-sm" disabled={page <= 0} onClick={() => setPage(p => p - 1)}>Previous</button>
              <button className="btn btn-secondary btn-sm" disabled={pageEnd >= total} onClick={() => setPage(p => p + 1)}>Next</button>
            </div>
          </div>

          {/* Exemptions */}
          <div style={{ marginTop: '2rem', marginBottom: '2rem' }}>
            <button className="dq-section-toggle" onClick={() => setShowExemptions(v => !v)}>
              <span style={{ fontSize: '0.6875rem' }}>{showExemptions ? '▼' : '▶'}</span> Exemptions ({exemptions.length})
            </button>
            <div style={{ fontSize: '0.75rem', color: 'var(--stone-400)', marginTop: '0.25rem' }}>
              Exempted vendor/rule pairs are skipped by the audit entirely.
            </div>
            {showExemptions && (
              <div style={{ marginTop: '0.75rem' }}>
                <div className="table-scroll-wrapper">
                  <table className="admin-table">
                    <thead>
                      <tr>
                        <th>Rule</th>
                        <th>Vendor</th>
                        <th>Note</th>
                        <th>Added</th>
                        <th>Actions</th>
                      </tr>
                    </thead>
                    <tbody>
                      {exemptions.map(ex => (
                        <tr key={ex.id}>
                          <td><span className="dq-rule-key" style={{ color: 'var(--stone-500)' }}>{ex.rule_key}</span></td>
                          <td style={{ fontWeight: 500 }}>{ex.vendor_name || '—'} <span className="dq-rule-key">{ex.vendor_code}</span></td>
                          <td className="dq-summary-cell" style={{ color: 'var(--stone-500)', fontSize: '0.8125rem' }}>{ex.note || '—'}</td>
                          <td style={{ whiteSpace: 'nowrap', color: 'var(--stone-500)', fontSize: '0.8125rem' }}>{fmtShort(ex.created_at)}{ex.created_by ? ' · ' + ex.created_by : ''}</td>
                          <td className="actions">
                            <button className="btn btn-danger btn-sm" onClick={() => deleteExemption(ex)}>Delete</button>
                          </td>
                        </tr>
                      ))}
                      {exemptions.length === 0 && (
                        <tr><td colSpan="5" style={{ textAlign: 'center', color: 'var(--stone-400)', padding: '1.5rem' }}>No exemptions</td></tr>
                      )}
                    </tbody>
                  </table>
                </div>
                <div className="filter-bar" style={{ marginTop: '0.75rem' }}>
                  <select value={exRule} onChange={e => setExRule(e.target.value)}>
                    <option value="">Rule…</option>
                    {rules.map(r => <option key={r.key} value={r.key}>{r.title}</option>)}
                  </select>
                  <input type="text" value={exVendor} onChange={e => setExVendor(e.target.value)} placeholder="Vendor code (e.g. MSI)" style={{ minWidth: '160px', textTransform: 'uppercase' }} />
                  <input type="text" value={exNote} onChange={e => setExNote(e.target.value)} placeholder="Why is this vendor intentionally different?" style={{ minWidth: '260px' }} />
                  <button className="btn btn-primary btn-sm" disabled={exSaving || !exRule || !exVendor.trim()} onClick={addExemption}>
                    {exSaving ? 'Adding…' : 'Add exemption'}
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ========== PurchaseOrdersListView ==========
    function PurchaseOrdersListView({ navigate, staffRole }) {
      const [pos, setPOs] = useState([]);
      const [loading, setLoading] = useState(true);
      const [statusGroup, setStatusGroup] = useState('open');
      const [vendorFilter, setVendorFilter] = useState('');
      const [search, setSearch] = useState('');
      const [vendors, setVendors] = useState([]);
      const [showCreate, setShowCreate] = useState(false);
      const [newVendorId, setNewVendorId] = useState('');
      const [newNotes, setNewNotes] = useState('');
      const [creating, setCreating] = useState(false);

      const load = () => {
        setLoading(true);
        const params = new URLSearchParams();
        if (vendorFilter) params.set('vendor_id', vendorFilter);
        if (search) params.set('search', search);
        adminFetch('/api/admin/purchase-orders?' + params.toString())
          .then(data => { setPOs(data.purchase_orders || []); setLoading(false); })
          .catch(() => setLoading(false));
      };
      useEffect(load, [vendorFilter]);

      useEffect(() => {
        adminFetch('/api/admin/vendors').then(data => setVendors(data.vendors || [])).catch(() => {});
      }, []);

      const handleSearch = () => load();

      const createPO = async () => {
        if (!newVendorId) return;
        setCreating(true);
        try {
          const data = await adminFetch('/api/admin/purchase-orders', {
            method: 'POST', body: JSON.stringify({ vendor_id: newVendorId, notes: newNotes || null })
          });
          if (data.error) throw new Error(data.error);
          setShowCreate(false); setNewVendorId(''); setNewNotes('');
          navigate('purchase-order-detail', data.purchase_order.id);
        } catch (err) { alert(err.message); }
        setCreating(false);
      };

      const statusBadge = (s) => {
        const cls = { draft: 'badge-draft', sent: 'badge-sent', acknowledged: 'badge-acknowledged', fulfilled: 'badge-fulfilled', cancelled: 'badge-cancelled' };
        return <span className={'badge ' + (cls[s] || 'badge-draft')}>{s}</span>;
      };

      if (loading) return <div className="loading">Loading purchase orders...</div>;

      const openStatuses = ['draft', 'sent', 'acknowledged'];
      const closedStatuses = ['fulfilled', 'cancelled'];

      const filtered = pos.filter(o => {
        const inGroup = statusGroup === 'open' ? openStatuses.includes(o.status) : closedStatuses.includes(o.status);
        return inGroup;
      });

      return (
        <div>
          <div className="content-header">
            <h1>Purchase Orders</h1>
            {['admin', 'manager'].includes(staffRole) && (
              <button className="btn btn-primary" onClick={() => setShowCreate(true)}>+ New Purchase Order</button>
            )}
          </div>
          <div style={{ display: 'flex', gap: '0.5rem', marginBottom: '1rem', alignItems: 'center', flexWrap: 'wrap' }}>
            <button className={statusGroup === 'open' ? 'btn btn-primary btn-sm' : 'btn btn-secondary btn-sm'} onClick={() => setStatusGroup('open')}>Open</button>
            <button className={statusGroup === 'closed' ? 'btn btn-primary btn-sm' : 'btn btn-secondary btn-sm'} onClick={() => setStatusGroup('closed')}>Closed</button>
            <select value={vendorFilter} onChange={e => setVendorFilter(e.target.value)}
              style={{ marginLeft: '0.5rem', padding: '0.4rem 0.6rem', fontSize: '0.8125rem', border: '1px solid var(--stone-300)', borderRadius: '6px' }}>
              <option value="">All Vendors</option>
              {vendors.filter(v => v.active_product_count > 0).map(v => <option key={v.id} value={v.id}>{v.name}</option>)}
            </select>
            <input type="text" placeholder="Search PO#, vendor, order#..." value={search}
              onChange={e => setSearch(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && handleSearch()}
              style={{ marginLeft: '0.5rem', padding: '0.4rem 0.6rem', fontSize: '0.8125rem', border: '1px solid var(--stone-300)', borderRadius: '6px', width: '220px' }} />
            <span style={{ marginLeft: 'auto', fontSize: '0.8125rem', color: 'var(--stone-400)' }}>{filtered.length} PO{filtered.length !== 1 ? 's' : ''}</span>
          </div>
          <div className="table-scroll-wrapper">
          <table className="admin-table">
            <thead>
              <tr>
                <th>PO #</th>
                <th>Vendor</th>
                <th>Order #</th>
                <th>Items</th>
                <th>Subtotal</th>
                <th>Status</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(po => (
                <tr key={po.id}>
                  <td style={{ fontWeight: 500 }}>{po.po_number}</td>
                  <td>{po.vendor_name}</td>
                  <td>{po.order_number ? <span style={{ color: 'var(--gold)', cursor: 'pointer' }} onClick={() => navigate('order-detail', po.order_id)}>{po.order_number}</span> : <span style={{ color: 'var(--stone-400)', fontStyle: 'italic' }}>Standalone</span>}</td>
                  <td>{po.item_count}</td>
                  <td>${parseFloat(po.subtotal || 0).toFixed(2)}</td>
                  <td>{statusBadge(po.status)}</td>
                  <td style={{ fontSize: '0.8125rem', color: 'var(--stone-500)' }}>{new Date(po.created_at).toLocaleDateString()}</td>
                  <td className="actions">
                    <button className="btn btn-secondary btn-sm" onClick={() => navigate('purchase-order-detail', po.id)}>View</button>
                  </td>
                </tr>
              ))}
              {filtered.length === 0 && <tr><td colSpan="8" style={{ textAlign: 'center', padding: '2rem', color: 'var(--stone-400)' }}>No {statusGroup} purchase orders found</td></tr>}
            </tbody>
          </table>
          </div>

          {/* Create PO Modal */}
          {showCreate && (
            <div className="modal-backdrop" onClick={() => setShowCreate(false)}>
              <div className="modal-content" onClick={e => e.stopPropagation()} style={{ maxWidth: '480px' }}>
                <div className="modal-header"><h2>New Purchase Order</h2></div>
                <div className="modal-body">
                  <div className="form-group">
                    <label>Vendor *</label>
                    <select value={newVendorId} onChange={e => setNewVendorId(e.target.value)}
                      style={{ width: '100%', padding: '0.5rem', border: '1px solid var(--stone-300)', borderRadius: '6px' }}>
                      <option value="">Select vendor...</option>
                      {vendors.filter(v => v.active_product_count > 0).map(v => <option key={v.id} value={v.id}>{v.name}</option>)}
                    </select>
                  </div>
                  <div className="form-group">
                    <label>Notes</label>
                    <textarea value={newNotes} onChange={e => setNewNotes(e.target.value)} placeholder="Optional notes..."
                      style={{ width: '100%', minHeight: '80px', padding: '0.5rem', border: '1px solid var(--stone-300)', borderRadius: '6px', fontFamily: 'Inter, sans-serif', resize: 'vertical' }} />
                  </div>
                </div>
                <div className="modal-footer">
                  <button className="btn btn-secondary" onClick={() => setShowCreate(false)}>Cancel</button>
                  <button className="btn btn-primary" disabled={!newVendorId || creating} onClick={createPO}>
                    {creating ? 'Creating...' : 'Create PO'}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ========== PurchaseOrderDetailView ==========
    function PurchaseOrderDetailView({ navigate, editId, staffRole }) {
      const [po, setPO] = useState(null);
      const [items, setItems] = useState([]);
      const [activity, setActivity] = useState([]);
      const [loading, setLoading] = useState(true);
      const [poUpdating, setPoUpdating] = useState(false);
      const [addingItem, setAddingItem] = useState(false);
      const [addItemMode, setAddItemMode] = useState('sku');
      const [addItemSku, setAddItemSku] = useState('');
      const [skuSearchResults, setSkuSearchResults] = useState([]);
      const [skuSearching, setSkuSearching] = useState(false);
      const [skuSearchError, setSkuSearchError] = useState(null);
      const skuSearchTimer = useRef(null);
      const skuSearchCounter = useRef(0);
      const [newPOItem, setNewPOItem] = useState({ product_name: '', vendor_sku: '', qty: 1, cost: '', sell_by: 'box' });

      const load = async () => {
        setLoading(true);
        try {
          const data = await adminFetch('/api/admin/purchase-orders/' + editId + '/detail');
          setPO(data.purchase_order);
          setItems(data.purchase_order.items || []);
          setActivity(data.activity || []);
        } catch (err) { console.error(err); }
        setLoading(false);
      };
      useEffect(() => { load(); }, [editId]);

      const isDraft = po && po.status === 'draft';
      const isSentOrLater = po && ['sent', 'acknowledged', 'fulfilled'].includes(po.status);
      const canManage = ['admin', 'manager'].includes(staffRole);

      const updatePOStatus = async (newStatus) => {
        const labels = { sent: 'Mark as Sent', acknowledged: 'Mark as Acknowledged', fulfilled: 'Mark as Fulfilled', cancelled: 'Cancel', draft: 'Revert to Draft' };
        if (!confirm((labels[newStatus] || newStatus) + ' this PO?')) return;
        setPoUpdating(true);
        try {
          await adminFetch('/api/admin/purchase-orders/' + editId + '/status', {
            method: 'PUT', body: JSON.stringify({ status: newStatus })
          });
          load();
        } catch (err) { alert(err.message); }
        setPoUpdating(false);
      };

      const updatePONotes = async (notes) => {
        try {
          await adminFetch('/api/admin/purchase-orders/' + editId, {
            method: 'PUT', body: JSON.stringify({ notes })
          });
        } catch (err) { alert(err.message); }
      };

      const updatePOItem = async (itemId, updates) => {
        try {
          await adminFetch('/api/admin/purchase-orders/' + editId + '/items/' + itemId, {
            method: 'PUT', body: JSON.stringify(updates)
          });
          load();
        } catch (err) { alert(err.message); }
      };

      const addPOItem = async (itemData) => {
        try {
          await adminFetch('/api/admin/purchase-orders/' + editId + '/items', {
            method: 'POST', body: JSON.stringify(itemData)
          });
          load();
        } catch (err) { alert(err.message); }
      };

      const deletePOItem = async (itemId) => {
        if (!confirm('Delete this line item?')) return;
        try {
          await adminFetch('/api/admin/purchase-orders/' + editId + '/items/' + itemId, {
            method: 'DELETE'
          });
          load();
        } catch (err) { alert(err.message); }
      };

      const sendPOToVendor = async () => {
        const ediEnabled = (() => { try { const cfg = typeof po.edi_config === 'string' ? JSON.parse(po.edi_config) : po.edi_config; return cfg && cfg.enabled; } catch { return false; } })();
        const method = ediEnabled ? 'EDI' : 'email';
        if (!confirm('Send this PO to the vendor via ' + method + '?')) return;
        setPoUpdating(true);
        try {
          const result = await adminFetch('/api/admin/purchase-orders/' + editId + '/send', { method: 'POST' });
          if (result.sent_via === 'edi') {
            alert('PO sent via EDI successfully (' + (result.edi?.docs_sent || 1) + ' document(s))');
          } else if (result.email_sent === false) {
            alert('PO status updated but email could not be sent. Check server SMTP configuration.');
          }
          load();
        } catch (err) { alert(err.message); }
        setPoUpdating(false);
      };

      // Manual placement: staff called the vendor or ordered on their site. Marks
      // the PO sent and records how, without any EDI/email transmission.
      const markPOManual = async (channel) => {
        const phrase = channel === 'phone' ? 'over the phone' : 'online';
        if (!confirm('Mark this PO as ordered ' + phrase + '? No email or EDI will be sent to the vendor.')) return;
        setPoUpdating(true);
        try {
          await adminFetch('/api/admin/purchase-orders/' + editId + '/send', { method: 'POST', body: JSON.stringify({ method: channel }) });
          load();
        } catch (err) { alert(err.message); }
        setPoUpdating(false);
      };

      const updatePOItemStatus = async (itemId, status) => {
        try {
          await adminFetch('/api/admin/purchase-orders/' + editId + '/items/' + itemId + '/status', {
            method: 'PUT', body: JSON.stringify({ status })
          });
          load();
        } catch (err) { alert(err.message); }
      };

      const bulkUpdatePOItemStatus = async (status) => {
        if (!confirm('Set all non-terminal items to ' + status + '?')) return;
        try {
          await adminFetch('/api/admin/purchase-orders/' + editId + '/items/bulk-status', {
            method: 'PUT', body: JSON.stringify({ status })
          });
          load();
        } catch (err) { alert(err.message); }
      };

      const handleSkuSearch = (q) => {
        setAddItemSku(q);
        setSkuSearchError(null);
        if (skuSearchTimer.current) clearTimeout(skuSearchTimer.current);
        if (q.length >= 2) {
          setSkuSearching(true);
          const thisSearch = ++skuSearchCounter.current;
          skuSearchTimer.current = setTimeout(async () => {
            try {
              const data = await adminFetch('/api/admin/skus/search?q=' + encodeURIComponent(q));
              if (thisSearch !== skuSearchCounter.current) return;
              setSkuSearchResults((data.results || []).map(r => ({
                sku_id: r.sku_id, product_name: r.product_name || r.collection || '', variant_name: r.variant_name || '',
                color: r.color || '', vendor_sku: r.vendor_sku || '', internal_sku: r.internal_sku || '',
                vendor_name: r.vendor_name || '', sell_by: r.sell_by || 'box', cost: r.vendor_cost || 0,
                retail_price: r.retail_price || 0, price_basis: r.price_basis || 'per_sqft',
                sqft_per_box: r.sqft_per_box || 1,
                primary_image: r.primary_image || null
              })));
            } catch (err) {
              if (thisSearch !== skuSearchCounter.current) return;
              console.error('[SKU Search] Error:', err.message || err);
              setSkuSearchError(err.message || 'Search failed');
            }
            if (thisSearch === skuSearchCounter.current) setSkuSearching(false);
          }, 250);
        } else { setSkuSearchResults([]); setSkuSearching(false); setSkuSearchError(null); }
      };

      const selectSkuResult = async (r) => {
        const isPerSqft = r.price_basis === 'per_sqft' || r.price_basis === 'sqft';
        const sqftPerBox = parseFloat(r.sqft_per_box || 1);
        const rawCost = parseFloat(r.cost || 0);
        const rawRetail = parseFloat(r.retail_price || 0);
        const itemCost = isPerSqft ? rawCost * sqftPerBox : rawCost;
        const itemRetail = isPerSqft ? rawRetail * sqftPerBox : rawRetail;
        await addPOItem({
          sku_id: r.sku_id, product_name: r.display_name || r.product_name,
          vendor_sku: r.vendor_sku || r.internal_sku, qty: 1,
          cost: itemCost.toFixed(2), retail_price: itemRetail > 0 ? itemRetail.toFixed(2) : null,
          sell_by: r.sell_by
        });
        setAddItemSku(''); setSkuSearchResults([]); setAddingItem(false);
      };

      const actionLabel = (action) => {
        const labels = { sent: 'Sent', resent: 'Resent', revised_and_sent: 'Revised & Sent', acknowledged: 'Acknowledged', fulfilled: 'Fulfilled', cancelled: 'Cancelled', reverted: 'Reverted to Draft', created: 'Created', notes_updated: 'Notes Updated', edi_sent: 'Sent via EDI', edi_acknowledged: 'EDI Acknowledged', edi_ack_rejected: 'EDI Rejected', edi_ack_partial: 'EDI Partial Ack', confirmation_attached: 'Confirmation Attached', edi_shipped: 'EDI Ship Notice', edi_invoiced: 'EDI Invoice Received' };
        return labels[action] || action;
      };

      const statusBadge = (s) => {
        const cls = { draft: 'badge-draft', sent: 'badge-sent', acknowledged: 'badge-acknowledged', fulfilled: 'badge-fulfilled', cancelled: 'badge-cancelled' };
        return <span className={'badge ' + (cls[s] || 'badge-draft')}>{s}</span>;
      };

      if (loading) return <div className="loading">Loading purchase order...</div>;
      if (!po) return <div className="loading">Purchase order not found</div>;

      return (
        <div>
          <div className="content-header">
            <button className="btn btn-secondary btn-sm" onClick={() => navigate('purchase-orders')}>&larr; Back to Purchase Orders</button>
          </div>

          <div style={{ display: 'flex', alignItems: 'center', gap: '1rem', marginBottom: '1.5rem' }}>
            <h1 style={{ margin: 0 }}><code style={{ fontSize: 'inherit', background: 'var(--stone-50)', padding: '0.1rem 0.5rem', borderRadius: '6px', border: '1px solid var(--stone-200)' }}>{po.po_number}</code></h1>
            {statusBadge(po.status)}
            {po.sent_via && (
              <span style={{ fontSize: '0.72rem', color: 'var(--stone-600)', background: 'var(--stone-100)', padding: '0.15rem 0.5rem', borderRadius: '6px', border: '1px solid var(--stone-200)' }}>
                {{ edi: 'via EDI', email: 'via email', phone: 'ordered by phone', online: 'ordered online' }[po.sent_via] || ('via ' + po.sent_via)}
              </span>
            )}
          </div>

          {/* PO Status Stepper */}
          {(() => {
            const steps = ['draft', 'sent', 'acknowledged', 'fulfilled'];
            const stepLabels = { draft: 'Draft', sent: 'Sent', acknowledged: 'Acknowledged', fulfilled: 'Fulfilled' };
            const stepTimestamps = {
              draft: po.created_at,
              sent: activity.find(a => a.action === 'sent' || a.action === 'edi_sent')?.created_at,
              acknowledged: activity.find(a => a.action === 'acknowledged' || a.action === 'edi_acknowledged')?.created_at,
              fulfilled: activity.find(a => a.action === 'fulfilled')?.created_at
            };
            const isCancelled = po.status === 'cancelled';
            const currentIdx = isCancelled
              ? (stepTimestamps.acknowledged ? 2 : stepTimestamps.sent ? 1 : 0)
              : steps.indexOf(po.status);
            const getStepState = (idx) => {
              if (isCancelled) return idx <= currentIdx ? 'cancelled' : 'upcoming';
              if (idx < currentIdx) return 'completed';
              if (idx === currentIdx) return 'current';
              return 'upcoming';
            };

            return (
              <div className="form-card">
                <h3>PO Status</h3>

                {isCancelled && (
                  <div className="stepper-cancelled-banner">Purchase Order Cancelled</div>
                )}

                <div className="order-stepper">
                  {steps.slice(1).map((step, idx) => {
                    const prevState = getStepState(idx);
                    const curState = getStepState(idx + 1);
                    const connClass = (prevState === 'completed' && (curState === 'completed' || curState === 'current'))
                      ? 'completed'
                      : (prevState === 'cancelled' ? 'completed' : 'upcoming');
                    const pct = 100 / (steps.length - 1);
                    const leftPct = idx * pct;
                    return (
                      <div key={'conn-' + idx} className={'stepper-connector ' + connClass}
                        style={{ left: 'calc(' + (leftPct + pct * 0.15) + '% + 18px)', width: 'calc(' + (pct * 0.7) + '% - 36px)' }} />
                    );
                  })}
                  {steps.map((step, idx) => {
                    const state = getStepState(idx);
                    const ts = stepTimestamps[step];
                    return (
                      <div key={step} className={'stepper-step ' + state}>
                        <div className="stepper-circle">
                          {state === 'completed' ? '\u2713' : state === 'cancelled' ? '\u2717' : (idx + 1)}
                        </div>
                        <div className="stepper-label">{stepLabels[step]}</div>
                        {ts && (state === 'completed' || state === 'current' || state === 'cancelled') && (
                          <div className="stepper-timestamp">{new Date(ts).toLocaleDateString()}</div>
                        )}
                      </div>
                    );
                  })}
                </div>

                {canManage && (
                  <div className="stepper-actions">
                    {isDraft && items.length > 0 && (
                      <button className="btn btn-primary" disabled={poUpdating} onClick={sendPOToVendor}>
                        {poUpdating ? 'Sending...' : 'Send to Vendor'}
                      </button>
                    )}
                    {isDraft && items.length > 0 && (
                      <button className="btn btn-secondary" disabled={poUpdating} onClick={() => markPOManual('phone')}>Ordered by phone</button>
                    )}
                    {isDraft && items.length > 0 && (
                      <button className="btn btn-secondary" disabled={poUpdating} onClick={() => markPOManual('online')}>Ordered online</button>
                    )}
                    {po.status === 'sent' && (
                      <button className="btn btn-primary" disabled={poUpdating} onClick={() => updatePOStatus('acknowledged')}>Mark Acknowledged</button>
                    )}
                    {po.status === 'acknowledged' && (
                      <button className="btn btn-primary" disabled={poUpdating} onClick={() => updatePOStatus('fulfilled')}>Mark Fulfilled</button>
                    )}
                    {['sent', 'acknowledged'].includes(po.status) && (
                      <button className="stepper-revert-link" disabled={poUpdating} onClick={() => updatePOStatus('draft')}>Revert to Draft</button>
                    )}
                    {!['cancelled', 'fulfilled'].includes(po.status) && (
                      <button className="stepper-cancel-link" disabled={poUpdating} onClick={() => updatePOStatus('cancelled')}>Cancel PO</button>
                    )}
                  </div>
                )}
              </div>
            );
          })()}

          {/* PO Info Card */}
          <div className="form-card">
            <h3>PO Information</h3>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(200px, 1fr))', gap: '1rem' }}>
              <div>
                <div style={{ fontSize: '0.6875rem', color: 'var(--stone-500)', textTransform: 'uppercase', letterSpacing: '0.05em' }}>Vendor</div>
                <div style={{ fontWeight: 500 }}>{po.vendor_name}</div>
              </div>
              <div>
                <div style={{ fontSize: '0.6875rem', color: 'var(--stone-500)', textTransform: 'uppercase', letterSpacing: '0.05em' }}>PO Number</div>
                <div style={{ fontWeight: 500 }}><code style={{ fontSize: '0.875rem', background: 'var(--stone-50)', padding: '0.1rem 0.35rem', borderRadius: '4px', border: '1px solid var(--stone-200)' }}>{po.po_number}</code></div>
              </div>
              <div>
                <div style={{ fontSize: '0.6875rem', color: 'var(--stone-500)', textTransform: 'uppercase', letterSpacing: '0.05em' }}>Status</div>
                <div>{statusBadge(po.status)}</div>
              </div>
              <div>
                <div style={{ fontSize: '0.6875rem', color: 'var(--stone-500)', textTransform: 'uppercase', letterSpacing: '0.05em' }}>Order</div>
                <div>{po.order_number
                  ? <span style={{ color: 'var(--gold)', cursor: 'pointer', fontWeight: 500 }} onClick={() => navigate('order-detail', po.order_id)}>{po.order_number}</span>
                  : <span style={{ color: 'var(--stone-400)', fontStyle: 'italic' }}>Standalone</span>}
                </div>
              </div>
              <div>
                <div style={{ fontSize: '0.6875rem', color: 'var(--stone-500)', textTransform: 'uppercase', letterSpacing: '0.05em' }}>Created</div>
                <div style={{ fontSize: '0.875rem' }}>{new Date(po.created_at).toLocaleString()}</div>
              </div>
              {po.approved_by_name && (
                <div>
                  <div style={{ fontSize: '0.6875rem', color: 'var(--stone-500)', textTransform: 'uppercase', letterSpacing: '0.05em' }}>Approved By</div>
                  <div style={{ fontSize: '0.875rem' }}>{po.approved_by_name}{po.approved_at ? ' on ' + new Date(po.approved_at).toLocaleDateString() : ''}</div>
                </div>
              )}
            </div>
          </div>

          {/* Line Items Card */}
          <div className="form-card">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem' }}>
              <h3 style={{ margin: 0, paddingBottom: 0, borderBottom: 'none' }}>Line Items</h3>
              {isDraft && canManage && !addingItem && (
                <button className="btn btn-sm btn-secondary" onClick={() => { setAddingItem(true); setAddItemMode('sku'); }}>+ Add Item</button>
              )}
            </div>

            {/* SKU search / custom add */}
            {isDraft && canManage && addingItem && (
              <div style={{ marginBottom: '1rem', padding: '1rem', background: 'var(--stone-50)', border: '1px solid var(--stone-200)' }}>
                {/* Mode toggle */}
                <div style={{ display: 'flex', gap: '0.5rem', marginBottom: '0.75rem' }}>
                  <button className={addItemMode === 'sku' ? 'btn btn-sm btn-primary' : 'btn btn-sm btn-secondary'} onClick={() => setAddItemMode('sku')}>Search SKU</button>
                  <button className={addItemMode === 'custom' ? 'btn btn-sm btn-primary' : 'btn btn-sm btn-secondary'} onClick={() => setAddItemMode('custom')}>Custom Item</button>
                  <div style={{ flex: 1 }}></div>
                  <button className="btn btn-sm btn-secondary" onClick={() => { setAddingItem(false); setSkuSearchResults([]); setAddItemSku(''); }}>Cancel</button>
                </div>

                {addItemMode === 'sku' ? (
                  <div style={{ position: 'relative' }}>
                    <input type="text" value={addItemSku} placeholder="Type SKU or product name..."
                      onBlur={() => setTimeout(() => { setSkuSearchResults([]); setSkuSearching(false); setSkuSearchError(null); }, 200)}
                      onChange={e => handleSkuSearch(e.target.value)}
                      style={{ width: '100%', padding: '0.5rem', border: '1px solid var(--stone-200)' }} />
                    {skuSearching && skuSearchResults.length === 0 && addItemSku.length >= 2 && (
                      <div className="search-results"><div className="search-loading-indicator">Searching...</div></div>
                    )}
                    {!skuSearching && skuSearchError && addItemSku.length >= 2 && (
                      <div className="search-results"><div className="search-no-results" style={{ color: 'var(--red)' }}>Search error — check console</div></div>
                    )}
                    {!skuSearching && !skuSearchError && skuSearchResults.length === 0 && addItemSku.length >= 2 && (
                      <div className="search-results"><div className="search-no-results">No results found</div></div>
                    )}
                    {skuSearchResults.length > 0 && (
                      <div className="search-results">
                        {skuSearchResults.map((r, i) => (
                          <div key={i} className="search-result-item" onClick={() => selectSkuResult(r)}>
                            {r.primary_image
                              ? <img className="sku-thumb" src={optimizeImg(r.primary_image, 96)} alt="" loading="lazy" />
                              : <div className="sku-thumb-placeholder"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>
                            }
                            <div className="sku-info">
                              {formatLineItem(r).brand && <div className="product-meta">{formatLineItem(r).brand}</div>}
                              <div className="sku-name">{formatLineItem(r).name}</div>
                              <div className="product-meta">
                                {formatLineItem(r).sku}
                                {r.cost ? (formatLineItem(r).sku ? '  ·  ' : '') + 'Cost $' + parseFloat(r.cost).toFixed(2) + skuPriceSuffix(r) : ''}
                                {r.retail_price ? '  ·  Retail $' + parseFloat(r.retail_price).toFixed(2) : ''}
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                ) : addItemMode === 'custom' ? (
                  /* Custom item mode */
                  <div style={{ display: 'flex', gap: '0.75rem', alignItems: 'flex-end', flexWrap: 'wrap' }}>
                    <div style={{ minWidth: '160px', flex: 2 }}>
                      <label style={{ display: 'block', fontSize: '0.75rem', fontWeight: 500, marginBottom: '0.25rem' }}>Product Name *</label>
                      <input type="text" value={newPOItem.product_name} onChange={e => setNewPOItem({...newPOItem, product_name: e.target.value})}
                        style={{ width: '100%', padding: '0.5rem', border: '1px solid var(--stone-200)' }} />
                    </div>
                    <div style={{ minWidth: '100px', flex: 1 }}>
                      <label style={{ display: 'block', fontSize: '0.75rem', fontWeight: 500, marginBottom: '0.25rem' }}>Vendor SKU</label>
                      <input type="text" value={newPOItem.vendor_sku} onChange={e => setNewPOItem({...newPOItem, vendor_sku: e.target.value})}
                        style={{ width: '100%', padding: '0.5rem', border: '1px solid var(--stone-200)' }} />
                    </div>
                    <div style={{ width: '90px' }}>
                      <label style={{ display: 'block', fontSize: '0.75rem', fontWeight: 500, marginBottom: '0.25rem' }}>Cost *</label>
                      <input type="number" step="0.01" min="0" value={newPOItem.cost} onChange={e => setNewPOItem({...newPOItem, cost: e.target.value})}
                        placeholder="0.00"
                        style={{ width: '100%', padding: '0.5rem', border: '1px solid var(--stone-200)' }} />
                    </div>
                    <div style={{ width: '90px' }}>
                      <label style={{ display: 'block', fontSize: '0.75rem', fontWeight: 500, marginBottom: '0.25rem' }}>Sell By</label>
                      <select value={newPOItem.sell_by} onChange={e => setNewPOItem({...newPOItem, sell_by: e.target.value})}
                        style={{ width: '100%', padding: '0.5rem', border: '1px solid var(--stone-200)' }}>
                        <option value="box">Box</option>
                        <option value="unit">Per Unit</option>
                      </select>
                    </div>
                    <div style={{ width: '70px' }}>
                      <label style={{ display: 'block', fontSize: '0.75rem', fontWeight: 500, marginBottom: '0.25rem' }}>{newPOItem.sell_by === 'unit' ? 'Qty *' : 'Boxes *'}</label>
                      <input type="number" min="1" value={newPOItem.qty} onChange={e => setNewPOItem({...newPOItem, qty: parseInt(e.target.value) || 1})}
                        style={{ width: '100%', padding: '0.5rem', border: '1px solid var(--stone-200)' }} />
                    </div>
                    <button className="btn btn-sm btn-primary" disabled={!newPOItem.product_name || !newPOItem.cost}
                      onClick={() => { addPOItem(newPOItem); setNewPOItem({ product_name: '', vendor_sku: '', qty: 1, cost: '', sell_by: 'box' }); setAddingItem(false); }}>
                      Add
                    </button>
                  </div>
                ) : null}
              </div>
            )}

            <div className="table-scroll-wrapper">
            <table className="admin-table">
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Vendor SKU</th>
                  <th>Qty</th>
                  <th>Retail Price</th>
                  <th>Cost</th>
                  <th>Margin</th>
                  {isSentOrLater && <th>Status</th>}
                  <th style={{ textAlign: 'right' }}>Subtotal</th>
                  {isDraft && canManage && <th></th>}
                </tr>
              </thead>
              <tbody>
                {items.map(item => {
                  const costVal = parseFloat(item.cost || 0);
                  const retailVal = parseFloat(item.retail_price || 0);
                  const margin = retailVal > 0 ? ((retailVal - costVal) / retailVal * 100) : 0;
                  return (
                  <tr key={item.id}>
                    <td data-label="Product">
                      {formatLineItem(item).brand && <div style={{ fontSize: '0.6875rem', color: '#a4a09a' }}>{formatLineItem(item).brand}</div>}
                      <div style={{ fontWeight: 500 }}>{formatLineItem(item).name}</div>
                      {item.description && <div style={{ fontSize: '0.6875rem', color: '#a4a09a' }}>{item.description}</div>}
                    </td>
                    <td data-label="Vendor SKU" style={{ fontSize: '0.8125rem' }}>{item.vendor_sku || '—'}</td>
                    <td data-label="Qty">
                      {isDraft && canManage ? (
                        <input type="number" min="0" step="any" defaultValue={item.qty}
                          onBlur={e => { const v = parseFloat(e.target.value); if (v > 0 && v !== parseFloat(item.qty)) updatePOItem(item.id, { qty: v }); }}
                          style={{ width: '60px', padding: '0.2rem 0.35rem', fontSize: '0.8125rem', border: '1px solid var(--stone-300)', borderRadius: '4px' }} />
                      ) : item.qty}
                    </td>
                    <td data-label="Retail Price">{item.retail_price ? '$' + retailVal.toFixed(2) : '—'}</td>
                    <td data-label="Cost">
                      {isDraft && canManage ? (
                        <input type="number" step="0.01" min="0" defaultValue={costVal.toFixed(2)}
                          onBlur={e => { const v = parseFloat(e.target.value); if (!isNaN(v) && v !== costVal) updatePOItem(item.id, { cost: v }); }}
                          style={{ width: '80px', padding: '0.2rem 0.35rem', fontSize: '0.8125rem', border: '1px solid var(--stone-300)', borderRadius: '4px' }} />
                      ) : '$' + costVal.toFixed(2)}
                    </td>
                    <td data-label="Margin" style={{ color: margin <= 0 ? 'var(--red)' : 'inherit', fontWeight: margin <= 0 ? 600 : 400 }}>
                      {retailVal > 0 ? margin.toFixed(1) + '%' : '—'}
                    </td>
                    {isSentOrLater && (
                      <td data-label="Status">
                        <select value={item.status || 'pending'} onChange={e => updatePOItemStatus(item.id, e.target.value)}
                          style={{ fontSize: '0.75rem', padding: '0.2rem 0.35rem', border: '1px solid var(--stone-300)', borderRadius: '4px', background: 'var(--panel)' }}>
                          {['pending', 'ordered', 'shipped', 'received', 'cancelled'].map(s => (
                            <option key={s} value={s}>{s.charAt(0).toUpperCase() + s.slice(1)}</option>
                          ))}
                        </select>
                      </td>
                    )}
                    <td data-label="Subtotal" style={{ textAlign: 'right', fontWeight: 500 }}>${parseFloat(item.subtotal || 0).toFixed(2)}</td>
                    {isDraft && canManage && (
                      <td className="actions">
                        <button className="btn btn-danger btn-sm" onClick={() => deletePOItem(item.id)}>Remove</button>
                      </td>
                    )}
                  </tr>
                  );
                })}
                {items.length === 0 && <tr><td colSpan={isSentOrLater ? 8 : (isDraft && canManage ? 8 : 7)} style={{ textAlign: 'center', padding: '1.5rem', color: 'var(--stone-400)' }}>No items yet</td></tr>}
              </tbody>
            </table>
            </div>
            <div style={{ textAlign: 'right', marginTop: '0.75rem', fontWeight: 600, fontSize: '0.9rem' }}>
              PO Total: ${parseFloat(po.subtotal || 0).toFixed(2)}
            </div>

            {/* Bulk status update for sent POs */}
            {isSentOrLater && canManage && (
              <div style={{ marginTop: '0.75rem', display: 'flex', gap: '0.5rem', justifyContent: 'flex-end' }}>
                <button className="btn btn-sm btn-secondary" onClick={() => bulkUpdatePOItemStatus('received')}>Mark All Received</button>
              </div>
            )}
          </div>

          {/* Notes Card */}
          <div className="form-card">
            <h3>Notes</h3>
            {isDraft && canManage ? (
              <textarea defaultValue={po.notes || ''} placeholder="Add notes for this PO..."
                onBlur={e => { if (e.target.value !== (po.notes || '')) updatePONotes(e.target.value); }}
                style={{ width: '100%', minHeight: '80px', padding: '0.5rem', fontSize: '0.8125rem', border: '1px solid var(--stone-300)', borderRadius: '6px', fontFamily: 'Inter, sans-serif', resize: 'vertical' }} />
            ) : (
              <div style={{ fontSize: '0.8125rem', color: po.notes ? 'inherit' : 'var(--stone-400)' }}>
                {po.notes || 'No notes'}
              </div>
            )}
          </div>

          {/* Activity Log Card */}
          <div className="form-card">
            <h3>Activity Log</h3>
            {activity.length > 0 ? (
              <div style={{ fontSize: '0.8125rem' }}>
                {activity.map((a, i) => (
                  <div key={i} style={{ padding: '0.75rem 0 0.75rem 1.25rem', borderBottom: i < activity.length - 1 ? '1px solid var(--stone-100)' : 'none', display: 'flex', justifyContent: 'space-between', alignItems: 'center', position: 'relative', borderLeft: '2px solid var(--gold-light)' }}>
                    <div style={{ position: 'absolute', left: '-5px', top: '50%', transform: 'translateY(-50%)', width: '8px', height: '8px', borderRadius: '50%', background: 'var(--gold)', border: '2px solid white' }}></div>
                    <div>
                      <span style={{ fontWeight: 500 }}>{actionLabel(a.action)}</span>
                      {a.performer_name && <span style={{ color: 'var(--stone-500)' }}> by {a.performer_name}</span>}
                      {a.recipient_email && <span style={{ color: 'var(--stone-500)' }}> to {a.recipient_email}</span>}
                      {a.revision > 0 && <span style={{ color: 'var(--stone-400)', fontSize: '0.75rem' }}> (Rev. {a.revision})</span>}
                    </div>
                    <div style={{ color: 'var(--stone-400)', fontSize: '0.75rem', whiteSpace: 'nowrap', marginLeft: '1rem' }}>
                      {new Date(a.created_at).toLocaleString()}
                    </div>
                  </div>
                ))}
              </div>
            ) : (
              <div style={{ color: 'var(--stone-400)', fontSize: '0.8125rem' }}>No activity yet</div>
            )}
          </div>

          {/* PDF Download */}
          <div style={{ display: 'flex', gap: '0.5rem', flexWrap: 'wrap' }}>
            <button className="btn btn-secondary" onClick={() => staffOpenDoc('/api/staff/purchase-orders/' + editId + '/pdf', true).catch(() => alert('Failed to load PDF'))}>Download PDF</button>
          </div>
        </div>
      );
    }


    ReactDOM.render(<AdminApp />, document.getElementById('root'));
  </script>
</body>
</html>
