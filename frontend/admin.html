    // ========== ReturnModal ==========
    // Admin return / credit-memo modal. Single scrollable form (internal ops, not a wizard).
    function ReturnModal({ editId, onClose, onSuccess }) {
      const [ctx, setCtx] = useState(null);
      const [loading, setLoading] = useState(true);
      const [loadError, setLoadError] = useState(null);
      const [lines, setLines] = useState({});       // order_item_id -> { return_qty, condition, restock_pct, vendor_action, reason }
      const [tenderSplits, setTenderSplits] = useState({}); // payment_id -> amount string
      const [storeCredit, setStoreCredit] = useState('');
      const [customerNote, setCustomerNote] = useState('');
      const [reasonSummary, setReasonSummary] = useState('');
      const [submitting, setSubmitting] = useState(false);
      const [submitError, setSubmitError] = useState(null);

      useEffect(() => {
        adminFetch('/api/staff/orders/' + editId + '/return-context')
          .then(data => {
            setCtx(data);
            const init = {};
            (data.items || []).forEach(it => {
              const remaining = (it.num_boxes || 0) - (it.already_returned || 0);
              if (remaining <= 0) return; // skip fully-returned lines
              init[it.id] = { return_qty: 0, condition: 'saleable', restock_pct: 0, vendor_action: 'restock_local', reason: '' };
            });
            setLines(init);
            setLoading(false);
          })
          .catch(err => { setLoadError(err.message || 'Failed to load return context'); setLoading(false); });
      }, [editId]);

      const taxRate = ctx ? parseFloat(ctx.tax_rate || 0) : 0;
      const items = ctx ? (ctx.items || []) : [];
      const tenders = ctx ? (ctx.tenders || []) : [];

      // Per-line and total computations.
      const compute = () => {
        let subtotal = 0, restock = 0;
        const perLine = {};
        items.forEach(it => {
          const st = lines[it.id];
          if (!st) return;
          const qty = parseInt(st.return_qty, 10) || 0;
          const price = parseFloat(it.unit_price || 0);
          const gross = qty * price;
          const restockFee = st.condition === 'saleable' ? gross * ((parseFloat(st.restock_pct) || 0) / 100) : 0;
          const refundLine = gross - restockFee;
          perLine[it.id] = { gross, restockFee, refundLine, qty };
          subtotal += gross;
          restock += restockFee;
        });
        const merchRefund = subtotal - restock;
        const taxRefund = merchRefund * taxRate;
        const refundTotal = merchRefund + taxRefund;
        return { subtotal, restock, merchRefund, taxRefund, refundTotal, perLine };
      };
      const totals = compute();

      const allocated = (() => {
        let sum = 0;
        tenders.forEach(t => { sum += parseFloat(tenderSplits[t.id]) || 0; });
        sum += parseFloat(storeCredit) || 0;
        return sum;
      })();
      const remainingToAllocate = totals.refundTotal - allocated;
      const anyQty = Object.values(totals.perLine).some(l => l.qty > 0);
      const allocationOk = Math.abs(remainingToAllocate) <= 0.01;
      const canSubmit = anyQty && totals.refundTotal > 0.009 && allocationOk && !submitting;

      const money = (n) => '$' + (Number(n) || 0).toFixed(2);

      const submit = async () => {
        setSubmitError(null);
        const payloadLines = [];
        items.forEach(it => {
          const st = lines[it.id];
          if (!st) return;
          const qty = parseInt(st.return_qty, 10) || 0;
          if (qty <= 0) return;
          payloadLines.push({
            order_item_id: it.id,
            return_qty: qty,
            reason: st.reason || undefined,
            condition: st.condition,
            restock_pct: st.condition === 'saleable' ? (parseFloat(st.restock_pct) || 0) : 0,
            vendor_action: st.vendor_action,
            vendor_id: it.line_vendor_id || undefined,
            replacement_requested: false
          });
        });
        const refundSplits = [];
        tenders.forEach(t => {
          const amt = parseFloat(tenderSplits[t.id]) || 0;
          if (amt > 0) refundSplits.push({ payment_id: t.id, amount: amt });
        });
        const scAmount = parseFloat(storeCredit) || 0;
        setSubmitting(true);
        try {
          const data = await adminFetch('/api/staff/orders/' + editId + '/returns', {
            method: 'POST',
            body: JSON.stringify({
              lines: payloadLines,
              refund_splits: refundSplits,
              store_credit_amount: scAmount,
              customer_note: customerNote || undefined,
              reason_summary: reasonSummary || undefined
            })
          });
          onSuccess({
            rma_number: data.return && data.return.rma_number,
            credit_memo_number: data.credit_memo && data.credit_memo.credit_memo_number,
            return_id: data.return && data.return.id,
            balance: data.balance,
            is_full: data.is_full
          });
        } catch (err) {
          setSubmitError(err.message || 'Failed to process return');
          setSubmitting(false);
        }
      };

      const inputStyle = { width: '100%', padding: '0.4rem', border: '1px solid var(--stone-200)', fontSize: '0.8125rem' };

      return (
        <div className="modal-overlay" onClick={() => !submitting && onClose()}>
          <div className="modal-box" onClick={e => e.stopPropagation()} style={{ maxWidth: '820px', width: '92vw', maxHeight: '88vh', overflowY: 'auto' }}>
            <h3>Start Return</h3>
            {loading ? (
              <p style={{ fontSize: '0.875rem', color: 'var(--stone-500)' }}>Loading return context...</p>
            ) : loadError ? (
              <p style={{ fontSize: '0.875rem', color: 'var(--red)' }}>{loadError}</p>
            ) : (
              <React.Fragment>
                {/* Line selection */}
                <div className="table-scroll-wrapper" style={{ marginBottom: '1rem' }}>
                <table className="admin-table" style={{ fontSize: '0.8125rem' }}>
                  <thead><tr>
                    <th>Item</th><th>Return Qty</th><th>Condition</th><th>Restock %</th><th>Vendor Action</th><th style={{ textAlign: 'right' }}>Refund</th>
                  </tr></thead>
                  <tbody>
                    {items.map(it => {
                      const remaining = (it.num_boxes || 0) - (it.already_returned || 0);
                      if (remaining <= 0) return null; // fully returned
                      const st = lines[it.id];
                      if (!st) return null;
                      const line = totals.perLine[it.id] || { refundLine: 0 };
                      const restockDisabled = st.condition !== 'saleable';
                      return (
                        <tr key={it.id}>
                          <td>
                            <div style={{ fontWeight: 500 }}>{it.product_name}</div>
                            <div style={{ fontSize: '0.6875rem', color: 'var(--stone-400)' }}>
                              {it.vendor_name || ''}{' · '}{money(it.unit_price)}/ea{' · '}{remaining} available
                            </div>
                          </td>
                          <td style={{ width: '90px' }}>
                            <input type="number" min="0" max={remaining} value={st.return_qty}
                              onChange={e => {
                                let v = parseInt(e.target.value, 10);
                                if (isNaN(v)) v = 0;
                                if (v < 0) v = 0;
                                if (v > remaining) v = remaining;
                                setLines(prev => ({ ...prev, [it.id]: { ...prev[it.id], return_qty: v } }));
                              }}
                              style={inputStyle} />
                          </td>
                          <td style={{ width: '120px' }}>
                            <select value={st.condition}
                              onChange={e => {
                                const c = e.target.value;
                                setLines(prev => ({ ...prev, [it.id]: { ...prev[it.id], condition: c, restock_pct: c === 'saleable' ? prev[it.id].restock_pct : 0 } }));
                              }}
                              style={inputStyle}>
                              <option value="saleable">Saleable</option>
                              <option value="damaged">Damaged</option>
                              <option value="defective">Defective</option>
                            </select>
                          </td>
                          <td style={{ width: '90px' }}>
                            <input type="number" min="0" max="100" value={restockDisabled ? 0 : st.restock_pct} disabled={restockDisabled}
                              onChange={e => {
                                let v = parseFloat(e.target.value);
                                if (isNaN(v)) v = 0;
                                if (v < 0) v = 0;
                                if (v > 100) v = 100;
                                setLines(prev => ({ ...prev, [it.id]: { ...prev[it.id], restock_pct: v } }));
                              }}
                              style={{ ...inputStyle, opacity: restockDisabled ? 0.5 : 1 }} />
                          </td>
                          <td style={{ width: '150px' }}>
                            <select value={st.vendor_action}
                              onChange={e => setLines(prev => ({ ...prev, [it.id]: { ...prev[it.id], vendor_action: e.target.value } }))}
                              style={inputStyle}>
                              <option value="restock_local">Restock Local</option>
                              <option value="return_to_vendor">Return to Vendor</option>
                            </select>
                          </td>
                          <td style={{ textAlign: 'right', fontWeight: 500 }}>{money(line.refundLine)}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
                </div>

                {/* Totals */}
                <div style={{ background: 'var(--stone-50)', border: '1px solid var(--stone-200)', padding: '0.75rem 1rem', marginBottom: '1rem', fontSize: '0.8125rem' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}><span>Subtotal</span><span>{money(totals.subtotal)}</span></div>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}><span>Restock fees</span><span>-{money(totals.restock)}</span></div>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}><span>Merchandise refund</span><span>{money(totals.merchRefund)}</span></div>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}><span>Tax refund ({(taxRate * 100).toFixed(3).replace(/\.?0+$/, '')}%)</span><span>{money(totals.taxRefund)}</span></div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontWeight: 600, borderTop: '1px solid var(--stone-200)', marginTop: '0.35rem', paddingTop: '0.35rem' }}><span>Refund total</span><span>{money(totals.refundTotal)}</span></div>
                </div>

                {/* Settlement */}
                <div style={{ marginBottom: '1rem' }}>
                  <label style={{ display: 'block', fontSize: '0.75rem', fontWeight: 600, marginBottom: '0.5rem' }}>Settlement — allocate refund of {money(totals.refundTotal)}</label>
                  {tenders.map(t => (
                    <div key={t.id} style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', marginBottom: '0.4rem' }}>
                      <div style={{ flex: 1, fontSize: '0.8125rem' }}>
                        {(t.payment_method || 'tender')}{t.check_number ? ' #' + t.check_number : ''}
                        <span style={{ color: 'var(--stone-400)', marginLeft: '0.4rem' }}>(refundable {money(t.refundable)})</span>
                      </div>
                      <input type="number" min="0" step="0.01" max={t.refundable} value={tenderSplits[t.id] || ''}
                        placeholder="0.00"
                        onChange={e => {
                          let v = e.target.value;
                          const num = parseFloat(v);
                          if (!isNaN(num) && num > parseFloat(t.refundable || 0)) v = parseFloat(t.refundable).toFixed(2);
                          setTenderSplits(prev => ({ ...prev, [t.id]: v }));
                        }}
                        style={{ width: '120px', padding: '0.4rem', border: '1px solid var(--stone-200)', fontSize: '0.8125rem' }} />
                    </div>
                  ))}
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', marginBottom: '0.4rem' }}>
                    <div style={{ flex: 1, fontSize: '0.8125rem' }}>Store credit</div>
                    <input type="number" min="0" step="0.01" value={storeCredit} placeholder="0.00"
                      onChange={e => setStoreCredit(e.target.value)}
                      style={{ width: '120px', padding: '0.4rem', border: '1px solid var(--stone-200)', fontSize: '0.8125rem' }} />
                  </div>
                  <div style={{ fontSize: '0.8125rem', fontWeight: 500, color: allocationOk ? 'var(--stone-500)' : 'var(--red)' }}>
                    {allocationOk ? 'Fully allocated' : (remainingToAllocate > 0 ? 'Remaining to allocate: ' + money(remainingToAllocate) : 'Over-allocated by ' + money(-remainingToAllocate))}
                  </div>
                </div>

                {/* Notes */}
                <div style={{ marginBottom: '1rem' }}>
                  <label style={{ display: 'block', fontSize: '0.75rem', fontWeight: 500, marginBottom: '0.25rem' }}>Reason Summary (optional)</label>
                  <input type="text" value={reasonSummary} onChange={e => setReasonSummary(e.target.value)}
                    placeholder="e.g. Customer over-ordered, returning extra boxes"
                    style={inputStyle} />
                </div>
                <div style={{ marginBottom: '1rem' }}>
                  <label style={{ display: 'block', fontSize: '0.75rem', fontWeight: 500, marginBottom: '0.25rem' }}>Customer Note (optional)</label>
                  <textarea value={customerNote} onChange={e => setCustomerNote(e.target.value)} rows={2}
                    placeholder="Note shown to the customer on the credit memo"
                    style={{ ...inputStyle, resize: 'vertical' }} />
                </div>

                {submitError && <p style={{ fontSize: '0.8125rem', color: 'var(--red)', margin: '0 0 0.75rem' }}>{submitError}</p>}

                <div className="modal-actions">
                  <button className="btn btn-secondary" onClick={onClose} disabled={submitting}>Cancel</button>
                  <button className="btn btn-primary" onClick={submit} disabled={!canSubmit}>
                    {submitting ? 'Processing...' : 'Process Return — ' + money(totals.refundTotal)}
                  </button>
                </div>
              </React.Fragment>
            )}
          </div>
        </div>
      );
    }

    // ========== OrderDetailView ==========
    function OrderDetailView({ navigate, editId, staffRole }) {
      const [order, setOrder] = useState(null);
      const [recTab, setRecTab] = useState('record');
      const [items, setItems] = useState([]);
      const [loading, setLoading] = useState(true);
      const [updating, setUpdating] = useState(false);
      const [reps, setReps] = useState([]);
      const [purchaseOrders, setPurchaseOrders] = useState([]);
      const [docPreview, setDocPreview] = useState(null);
      const [posLoading, setPosLoading] = useState(false);
      const [poUpdating, setPoUpdating] = useState(false);
      const [showTrackingForm, setShowTrackingForm] = useState(false);
      const [trackingData, setTrackingData] = useState({ tracking_number: '', carrier: '', shipped_at: new Date().toISOString().slice(0, 10) });
      const [addingItemPOId, setAddingItemPOId] = useState(null);
      const [newPOItem, setNewPOItem] = useState({ product_name: '', vendor_sku: '', qty: 1, cost: '' });
      const [poActivity, setPOActivity] = useState({});
      const [showRefundModal, setShowRefundModal] = useState(false);
      const [refunding, setRefunding] = useState(false);
      const [showDeliveryForm, setShowDeliveryForm] = useState(false);
      const [deliveryAddress, setDeliveryAddress] = useState({ line1: '', line2: '', city: '', state: '', zip: '' });
      const [shippingOptions, setShippingOptions] = useState(null);
      const [deliveryUpdating, setDeliveryUpdating] = useState(false);
      const [payments, setPayments] = useState([]);
      const [paymentRequests, setPaymentRequests] = useState([]);
      const [balanceInfo, setBalanceInfo] = useState(null);
      const [showPartialRefundModal, setShowPartialRefundModal] = useState(false);
      const [partialRefundAmount, setPartialRefundAmount] = useState('');
      const [partialRefundReason, setPartialRefundReason] = useState('');
      const [showPaymentRequestModal, setShowPaymentRequestModal] = useState(false);
      const [paymentRequestMessage, setPaymentRequestMessage] = useState('');
      const [showSendInvoiceModal, setShowSendInvoiceModal] = useState(false);
      const [invoiceMessage, setInvoiceMessage] = useState('');
      const [sendingInvoice, setSendingInvoice] = useState(false);
      const [addingItem, setAddingItem] = useState(false);
      const [addItemSku, setAddItemSku] = useState('');
      const [addItemBoxes, setAddItemBoxes] = useState(1);
      const [addItemSellBy, setAddItemSellBy] = useState('box');
      const [skuSearchResults, setSkuSearchResults] = useState([]);
      const [skuSearching, setSkuSearching] = useState(false);
      const [skuSearchError, setSkuSearchError] = useState(null);
      const skuSearchTimer = useRef(null);
      const skuSearchCounter = useRef(0);
      const [addItemMode, setAddItemMode] = useState('sku');
      const [customItemName, setCustomItemName] = useState('');
      const [customItemPrice, setCustomItemPrice] = useState('');
      const [customItemVendor, setCustomItemVendor] = useState('');
      const [customItemDesc, setCustomItemDesc] = useState('');
      const [customItemBoxes, setCustomItemBoxes] = useState(1);
      const [customItemSellBy, setCustomItemSellBy] = useState('box');
      const [addItemVendors, setAddItemVendors] = useState([]);
      const [orderActivity, setOrderActivity] = useState(null);
      const [trackingData2, setTrackingData2] = useState(null);
      const [trackingLoading, setTrackingLoading] = useState(false);
      const [trackingRefreshing, setTrackingRefreshing] = useState(false);
      // Returns / credit memos
      const [returns, setReturns] = useState([]);
      const [showReturnModal, setShowReturnModal] = useState(false);
      const [returnConfirmation, setReturnConfirmation] = useState(null);
      // Margin/commission + accounting invoices (same objects the rep view uses)
      const [commission, setCommission] = useState(null);
      const [invoices, setInvoices] = useState([]);
      // Material releases (staff twins of the rep release flow)
      const [releases, setReleases] = useState([]);
      const [showReleaseModal, setShowReleaseModal] = useState(false);
      const [relConfirm, setRelConfirm] = useState(null); // { rel, action: 'complete'|'void' }
      const [relBusy, setRelBusy] = useState(false);

      const loadReturns = async () => {
        if (!editId) return;
        try {
          const data = await adminFetch('/api/staff/orders/' + editId + '/returns');
          setReturns(data.returns || []);
        } catch (e) { /* returns are optional; ignore load errors */ }
      };

      // Reload the whole order detail (order + items + payments + balance), used after a return.
      const reloadOrderDetail = async () => {
        try {
          const data = await adminFetch('/api/admin/orders/' + editId);
          setOrder(data.order);
          setItems(data.items || []);
          setPayments(data.payments || []);
          setPaymentRequests(data.payment_requests || []);
          setBalanceInfo(data.balance || null);
          setCommission(data.commission || null);
          setInvoices(data.invoices || []);
          setReleases(data.releases || []);
        } catch (e) { /* ignore */ }
      };

      const openCreditMemo = (returnId) => {
        setDocPreview({ path: '/api/staff/returns/' + returnId + '/credit-memo', title: 'Credit Memo' });
      };

      const loadTracking = async () => {
        if (!editId) return;
        setTrackingLoading(true);
        try {
          const data = await adminFetch('/api/admin/orders/' + editId + '/tracking');
          setTrackingData2(data);
        } catch (e) { setTrackingData2(null); }
        setTrackingLoading(false);
      };

      const refreshTracking = async () => {
        setTrackingRefreshing(true);
        try {
          const data = await adminFetch('/api/admin/orders/' + editId + '/tracking/refresh', { method: 'POST' });
          setTrackingData2(prev => ({ ...prev, ...data }));
        } catch (e) {}
        setTrackingRefreshing(false);
      };

      const orderActionLabel = (action) => {
        const labels = {
          status_changed: 'Status Changed', delivery_method_changed: 'Delivery Changed',
          refund_issued: 'Refund Issued', item_added: 'Item Added', item_removed: 'Item Removed',
          payment_request_sent: 'Payment Request Sent', payment_request_cancelled: 'Payment Request Cancelled',
          rep_assigned: 'Rep Assigned', price_adjusted: 'Price Adjusted',
          order_created: 'Order Created', payment_collected: 'Payment Collected',
          po_approved: 'PO Sent', item_ready: 'Item Ready', item_unready: 'Item Unready',
          invoice_sent: 'Invoice Emailed', return_created: 'Return Created'
        };
        return labels[action] || action.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
      };

      const orderActivityDetail = (entry) => {
        const d = entry.details || {};
        switch (entry.action) {
          case 'status_changed': return (d.from || '?') + ' → ' + (d.to || '?') + (d.tracking_number ? ' (tracking: ' + d.tracking_number + ')' : '');
          case 'delivery_method_changed': return (d.from || '?') + ' → ' + (d.to || '?') + (d.shipping_cost ? ' ($' + d.shipping_cost + ')' : '');
          case 'refund_issued': return '$' + (d.amount || '0') + (d.is_full ? ' (full)' : ' (partial)') + (d.reason ? ' — ' + d.reason : '');
          case 'item_added': return (d.product_name || '?') + (d.is_custom ? ' (custom)' : '') + ' × ' + (d.num_boxes || '?') + ' — $' + (d.subtotal || '0');
          case 'item_removed': return (d.product_name || '?') + ' × ' + (d.num_boxes || '?') + ' — $' + (d.subtotal || '0');
          case 'payment_request_sent': return '$' + (d.amount || '0') + ' to ' + (d.sent_to || '?');
          case 'payment_request_cancelled': return '$' + (d.amount || '0');
          case 'rep_assigned': return d.unassigned ? 'Unassigned' : (d.rep_name || '?');
          case 'price_adjusted': return (d.product_name || '?') + ': $' + (d.previous_price || '?') + ' → $' + (d.new_price || '?') + (d.reason ? ' — ' + d.reason : '');
          case 'item_ready': case 'item_unready': return (d.product_name || '?') + (d.order_status ? ' — order ' + d.order_status.split('_').join(' ') : '');
          case 'order_created': return [d.total ? '$' + d.total : null, d.item_count ? d.item_count + ' item' + (d.item_count === 1 ? '' : 's') : null, d.payment_method ? 'via ' + d.payment_method : null].filter(Boolean).join(' · ');
          case 'payment_collected': return [d.amount ? '$' + d.amount : null, d.payment_method ? 'via ' + d.payment_method : null].filter(Boolean).join(' · ');
          case 'material_released': return (d.release || '') + (d.qty ? ' · ' + d.qty + ' units' : '') + (d.method ? ' · ' + d.method : '');
          default: {
            const parts = ['product_name', 'release', 'amount', 'total', 'to', 'reason'].map(k => d[k]).filter(Boolean);
            return parts.join(' · ');
          }
        }
      };

      const loadOrderActivity = async () => {
        try {
          const data = await adminFetch('/api/admin/orders/' + editId + '/activity');
          setOrderActivity(data.activity || []);
        } catch (err) { console.error('Failed to load order activity:', err); }
      };

      const loadPOs = () => {
        if (!editId) return;
        setPosLoading(true);
        adminFetch('/api/admin/orders/' + editId + '/purchase-orders')
          .then(data => {
            const pos = data.purchase_orders || [];
            setPurchaseOrders(pos);
            setPosLoading(false);
            // Auto-load activity for all POs
            pos.forEach(po => {
              adminFetch('/api/admin/purchase-orders/' + po.id + '/activity')
                .then(actData => setPOActivity(prev => ({ ...prev, [po.id]: actData.activity || [] })))
                .catch(() => {});
            });
          })
          .catch(() => setPosLoading(false));
      };

      useEffect(() => {
        if (!editId) return;
        adminFetch('/api/admin/orders/' + editId)
          .then(data => {
            setOrder(data.order);
            setItems(data.items || []);
            setPayments(data.payments || []);
            setPaymentRequests(data.payment_requests || []);
            setBalanceInfo(data.balance || null);
            setCommission(data.commission || null);
            setInvoices(data.invoices || []);
            setReleases(data.releases || []);
            setLoading(false);
          })
          .catch(() => setLoading(false));
        adminFetch('/api/admin/staff').then(data => setReps((data.staff || []).filter(s => ['sales_rep', 'manager'].includes(s.role) && s.is_active))).catch(() => {});
        loadPOs();
        loadTracking();
        loadReturns();
        loadOrderActivity();
      }, [editId]);

      const updatePOStatus = async (poId, newStatus) => {
        const labels = { sent: 'Mark as Sent', acknowledged: 'Mark as Acknowledged', fulfilled: 'Mark as Fulfilled', cancelled: 'Cancel', draft: 'Revert to Draft' };
        if (!confirm((labels[newStatus] || newStatus) + ' this PO?')) return;
        setPoUpdating(true);
        try {
          await adminFetch('/api/admin/purchase-orders/' + poId + '/status', {
            method: 'PUT', body: JSON.stringify({ status: newStatus })
          });
          loadPOs();
        } catch (err) { alert(err.message); }
        setPoUpdating(false);
      };

      const updatePONotes = async (poId, notes) => {
        try {
          await adminFetch('/api/admin/purchase-orders/' + poId, {
            method: 'PUT', body: JSON.stringify({ notes })
          });
        } catch (err) { alert(err.message); }
      };

      const updatePOItem = async (poId, itemId, updates) => {
        try {
          await adminFetch('/api/admin/purchase-orders/' + poId + '/items/' + itemId, {
            method: 'PUT', body: JSON.stringify(updates)
          });
          loadPOs();
        } catch (err) { alert(err.message); }
      };

      const addPOItem = async (poId, itemData) => {
        try {
          await adminFetch('/api/admin/purchase-orders/' + poId + '/items', {
            method: 'POST', body: JSON.stringify(itemData)
          });
          loadPOs();
        } catch (err) { alert(err.message); }
      };

      const deletePOItem = async (poId, itemId) => {
        if (!confirm('Delete this line item?')) return;
        try {
          await adminFetch('/api/admin/purchase-orders/' + poId + '/items/' + itemId, {
            method: 'DELETE'
          });
          loadPOs();
        } catch (err) { alert(err.message); }
      };

      const loadPOActivity = async (poId) => {
        try {
          const data = await adminFetch('/api/admin/purchase-orders/' + poId + '/activity');
          setPOActivity(prev => ({ ...prev, [poId]: data.activity || [] }));
        } catch (err) { console.error('Failed to load PO activity:', err); }
      };

      const sendPOToVendor = async (poId, ediEnabled) => {
        const method = ediEnabled ? 'EDI' : 'email';
        if (!confirm('Send this PO to the vendor via ' + method + '?')) return;
        setPoUpdating(true);
        try {
          const result = await adminFetch('/api/admin/purchase-orders/' + poId + '/send', { method: 'POST' });
          if (result.sent_via === 'edi') {
            alert('PO sent via EDI successfully (' + (result.edi?.docs_sent || 1) + ' document(s))');
          } else if (result.email_sent === false) {
            alert('PO status updated but email could not be sent. Check server SMTP configuration.');
          }
          loadPOs();
          loadPOActivity(poId);
        } catch (err) { alert(err.message); }
        setPoUpdating(false);
      };

      const actionLabel = (action) => {
        const labels = { sent: 'Sent', resent: 'Resent', revised_and_sent: 'Revised & Sent', acknowledged: 'Acknowledged', fulfilled: 'Fulfilled', cancelled: 'Cancelled', reverted: 'Reverted to Draft', created: 'Created', notes_updated: 'Notes Updated', edi_sent: 'Sent via EDI', edi_acknowledged: 'EDI Acknowledged', edi_shipped: 'EDI Ship Notice', edi_invoiced: 'EDI Invoice Received' };
        return labels[action] || action;
      };

      const updatePOItemStatus = async (poId, itemId, status) => {
        try {
          await adminFetch('/api/admin/purchase-orders/' + poId + '/items/' + itemId + '/status', {
            method: 'PUT', body: JSON.stringify({ status })
          });
          loadPOs();
        } catch (err) { alert(err.message); }
      };

      const bulkUpdatePOItemStatus = async (poId, status) => {
        if (!confirm('Set all non-terminal items to ' + status + '?')) return;
        try {
          await adminFetch('/api/admin/purchase-orders/' + poId + '/items/bulk-status', {
            method: 'PUT', body: JSON.stringify({ status })
          });
          loadPOs();
        } catch (err) { alert(err.message); }
      };

      const updateStatus = (newStatus) => {
        // For shipping orders being marked shipped, show tracking form first
        if (newStatus === 'shipped' && order.delivery_method === 'shipping' && !showTrackingForm) {
          setShowTrackingForm(true);
          return;
        }
        setUpdating(true);
        const body = { status: newStatus };
        if (newStatus === 'shipped' && showTrackingForm) {
          body.tracking_number = trackingData.tracking_number;
          body.carrier = trackingData.carrier;
          body.shipped_at = trackingData.shipped_at;
        }
        adminFetch('/api/admin/orders/' + editId + '/status', {
          method: 'PUT',
          body: JSON.stringify(body)
        })
          .then(data => {
            if (data.order) setOrder(data.order);
            loadPOs();
            setShowTrackingForm(false);
            setTrackingData({ tracking_number: '', carrier: '', shipped_at: new Date().toISOString().slice(0, 10) });
            setUpdating(false);
          })
          .catch(() => setUpdating(false));
      };

      const assignRep = (repId) => {
        adminFetch('/api/admin/orders/' + editId + '/assign', {
          method: 'PUT',
          body: JSON.stringify({ sales_rep_id: repId || null })
        }).then(data => {
          if (data.order) setOrder(data.order);
        }).catch(err => alert(err.message || 'Failed to assign rep'));
      };

      if (loading) return <div className="recd-page"><div className="loading">Loading order...</div></div>;
      if (!order) return <div className="recd-page"><div className="loading">Order not found</div></div>;

      // Pickup orders move Confirmed → Ready for Pickup → Picked Up (the real
      // ready_for_pickup status, which fires the "your order is ready" email);
      // shipping orders keep Confirmed → Shipped → Delivered.
      const isPickupOrder = order.delivery_method === 'pickup';
      const statusFlow = isPickupOrder
        ? { pending: 'confirmed', confirmed: 'ready_for_pickup', ready_for_pickup: 'delivered' }
        : { pending: 'confirmed', confirmed: 'shipped', shipped: 'delivered' };
      const reverseFlow = isPickupOrder
        ? { confirmed: 'pending', ready_for_pickup: 'confirmed', delivered: 'ready_for_pickup', cancelled: 'pending' }
        : { confirmed: 'pending', shipped: 'confirmed', delivered: 'shipped', cancelled: 'pending' };
      const nextStatus = statusFlow[order.status];
      const prevStatus = reverseFlow[order.status];
      const canCancel = order.status !== 'cancelled' && order.status !== 'delivered' && order.status !== 'refunded';
      const recStatusLabels = isPickupOrder
        ? { pending: 'Pending', confirmed: 'Confirmed', ready_for_pickup: 'Ready for pickup', delivered: 'Picked up' }
        : { pending: 'Pending', confirmed: 'Confirmed', shipped: 'Shipped', delivered: 'Delivered' };

      const isLaborItem = (i) => (i.item_type || 'material') === 'labor';
      const productItems = items.filter(i => !i.is_sample && !isLaborItem(i));
      const sampleItems = items.filter(i => i.is_sample);

      // Per-item pickup readiness: check items off as they arrive at the store.
      // Marking the last one auto-advances the order to Ready for Pickup.
      const showReadyCol = isPickupOrder && ['confirmed', 'ready_for_pickup'].includes(order.status) && ['admin', 'manager'].includes(staffRole);
      const readyCount = productItems.filter(i => i.ready_at).length;
      const toggleItemReady = async (item) => {
        try {
          const data = await adminFetch('/api/admin/orders/' + editId + '/items/' + item.id + '/ready', {
            method: 'PUT', body: JSON.stringify({ ready: !item.ready_at })
          });
          if (data.order) setOrder(data.order);
          setItems(prev => prev.map(i => i.id === item.id ? { ...i, ready_at: data.ready_at } : i));
        } catch (err) { alert(err.message || 'Failed to update item'); }
      };

      // ---- Console record header derivation (mirrors the ledger's logic) ----
      const recTotal = parseFloat(order.total || 0);
      const recPaid = parseFloat(order.amount_paid || 0);
      const recBalance = Math.max(0, recTotal - recPaid);
      const recDraftPos = purchaseOrders.filter(p => p.status === 'draft').length;
      const recUnackedPos = purchaseOrders.filter(p => p.status === 'sent' && !p.edi_ack_status).length;
      let recRisk = 'ok', recBlocker = null;
      if (order.status === 'pending') { recRisk = 'today'; recBlocker = 'Awaiting confirmation — nothing is on order with vendors'; }
      else if (recDraftPos > 0) { recRisk = 'today'; recBlocker = `${recDraftPos} PO${recDraftPos === 1 ? '' : 's'} drafted but never sent`; }
      else if (recUnackedPos > 0) { recRisk = 'today'; recBlocker = `Vendor has not confirmed ${recUnackedPos === 1 ? 'a PO' : recUnackedPos + ' POs'}`; }
      else if (order.status === 'confirmed' && purchaseOrders.length === 0) { recRisk = 'today'; recBlocker = 'Confirmed with no purchase orders — source the material'; }
      else if (order.status === 'ready_for_pickup') recBlocker = 'Staged — waiting on customer pickup';
      else if (order.status === 'delivered' && recBalance > 0.005) { recRisk = 'today'; recBlocker = `Delivered — $${recBalance.toLocaleString('en-US', { maximumFractionDigits: 0 })} unpaid`; }
      const recCancelled = order.status === 'cancelled' || order.status === 'refunded';
      const recRiskColor = { breach: 'var(--hot)', today: 'var(--gold)', ok: 'var(--cool)' }[recRisk];
      const recRiskLabel = recCancelled ? order.status.toUpperCase() : recRisk === 'today' ? 'NEEDS ACTION' : recRisk === 'breach' ? 'BLOCKED' : 'ON TRACK';
      let recStage = 0;
      if (order.status !== 'pending') recStage = 1;
      if (purchaseOrders.length > 0 && recDraftPos === 0) recStage = 2;
      if (purchaseOrders.length > 0 && recDraftPos === 0 && recUnackedPos === 0) recStage = 3;
      if (order.status === 'ready_for_pickup' || order.status === 'shipped') recStage = 4;
      if (order.status === 'delivered') recStage = 5;
      if (order.status === 'delivered' && recBalance <= 0.005) recStage = 6;
      const recDd = ts => ts ? new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }).toUpperCase() : '';
      const recIsPickup = order.delivery_method === 'pickup';
      const recRail = [
        ['Placed', recDd(order.created_at)],
        ['Confirmed', recDd(order.confirmed_at)],
        ['POs issued', purchaseOrders.length ? `${purchaseOrders.length - recDraftPos}/${purchaseOrders.length} SENT` : ''],
        ['Vendor OK', recUnackedPos ? `${recUnackedPos} PENDING` : recStage >= 3 && purchaseOrders.length ? 'ACKED' : ''],
        [recIsPickup ? 'Ready' : 'Shipped', recDd(order.shipped_at)],
        [recIsPickup ? 'Picked up' : 'Delivered', recDd(order.delivered_at)],
        ['Paid', recPaid > 0 ? '$' + recPaid.toLocaleString('en-US', { maximumFractionDigits: 0 }) : ''],
      ];
      // Per-line vendor PO mapping + tender labels (mirrors the rep order view)
      const poForItem = (itemId) => purchaseOrders.find(po => (po.items || []).some(pi => pi.order_item_id === itemId));
      const tenderLabel = (p) => {
        const m = { card: 'Card', cash: 'Cash', check: 'Check', ach: 'ACH' }[p.payment_method] || (p.stripe_payment_intent_id ? 'Card' : 'Payment');
        return p.payment_type === 'refund' ? m + ' refund' : m + ' payment';
      };
      // Margin: prefer the stored commission row (recalculateCommission is the
      // single source); fall back to summing PO cost subtotals when no rep is on
      // the order but material has been sourced.
      const poCostTotal = purchaseOrders.reduce((s, po) => s + (po.items || []).reduce((t, pi) => t + parseFloat(pi.subtotal || 0), 0), 0);
      const mVendorCost = commission ? parseFloat(commission.vendor_cost || 0) : poCostTotal;
      const mBase = commission ? parseFloat(commission.order_total || order.total || 0) : parseFloat(order.subtotal || 0);
      const mMargin = commission ? parseFloat(commission.margin || 0) : mBase - mVendorCost;
      const showMarginCard = ['admin', 'manager'].includes(staffRole) && (commission || poCostTotal > 0);

      return (
        <React.Fragment>
        <div className="recd-page">
          <div className="recd-head">
            <div className="recd-top">
              <div style={{ minWidth: 0 }}>
                <div className="opsq-meta">
                  <button className="recd-crumb" onClick={() => navigate('orders')}>← ORDERS</button>
                  <span style={{ color: 'var(--faint)' }}>/</span>
                  <span style={{ color: 'var(--ink)' }}>{order.order_number}</span>
                  <span style={{ color: recCancelled ? 'var(--faint)' : recRiskColor }}>{recRiskLabel}</span>
                </div>
                <h1 className="recd-title">{order.customer_name}</h1>
                <div className="recd-meta">
                  <span>{order.customer_email}</span>
                  {order.rep_name && <span>{order.rep_name}</span>}
                  <span>{items.length} lines</span>
                  <span>{purchaseOrders.length} POs</span>
                </div>
              </div>
              <div style={{ marginLeft: 'auto', textAlign: 'right', flexShrink: 0 }}>
                <div className="opsq-block-label" style={{ marginBottom: 0 }}>ORDER VALUE</div>
                <div className="recd-value">${recTotal.toLocaleString('en-US', { minimumFractionDigits: 2 })}</div>
              </div>
              <div style={{ display: 'flex', gap: 8, alignSelf: 'center', flexShrink: 0, flexWrap: 'wrap' }}>
                {/* No manual "ready for pickup" advance — the order flips automatically
                    once every line is marked ready at the store (syncPickupReady). */}
                {nextStatus && nextStatus !== 'ready_for_pickup' && !recCancelled && !showTrackingForm && (
                  <button className="recd-exc-primary" disabled={updating} onClick={() => updateStatus(nextStatus)}>
                    {updating ? 'Updating…' : order.status === 'pending' ? 'Confirm order' : 'Mark as ' + (recStatusLabels[nextStatus] || nextStatus).toLowerCase()}
                  </button>
                )}
                <button className="opsq-alt" onClick={() => { setInvoiceMessage(''); setShowSendInvoiceModal(true); }}>Email invoice</button>
                <button className="opsq-alt" onClick={() => { setReturnConfirmation(null); setShowReturnModal(true); }}>Change order</button>
                {['confirmed', 'shipped', 'ready_for_pickup', 'delivered'].includes(order.status) && ['admin', 'manager', 'warehouse'].includes(staffRole) && productItems.length > 0 && (
                  <button className="opsq-alt" onClick={() => setShowReleaseModal(true)}>Release materials</button>
                )}
                {canCancel && (
                  <button className="opsq-alt" style={{ color: 'var(--hot)' }} disabled={updating}
                    onClick={() => { if (confirm('Cancel this order?')) updateStatus('cancelled'); }}>Cancel order</button>
                )}
              </div>
            </div>
            <div className="recd-rail">
              {recRail.map(([s, when], n) => (
                <div key={s} className="recd-stage">
                  <div style={{ height: 3, background: recCancelled ? 'var(--line)' : n < recStage ? 'var(--dim)' : n === recStage ? 'var(--gold)' : 'var(--line)' }} />
                  <div className="recd-stage-name" style={{ color: n === recStage ? 'var(--ink)' : n < recStage ? 'var(--dim)' : 'var(--faint)' }}>{s}</div>
                  <div className="recd-stage-when">{n <= recStage ? when : ''}</div>
                </div>
              ))}
            </div>
            <div className="recd-tabs">
              {['record', 'vendors', 'money', 'activity'].map(t => (
                <button key={t} className={'recd-tab' + (recTab === t ? ' active' : '')} onClick={() => setRecTab(t)}>{t}</button>
              ))}
            </div>
          </div>

          <div className="recd-scroll">
          <div className="rec-body">
          <div className="rec-left">
          {recBlocker && !recCancelled && recRisk !== 'ok' && recTab === 'record' && (() => {
            const singleDraft = recDraftPos === 1 ? purchaseOrders.find(p => p.status === 'draft') : null;
            const singleUnacked = recUnackedPos === 1 ? purchaseOrders.find(p => p.status === 'sent' && !p.edi_ack_status) : null;
            const excKind = order.status === 'pending' ? 'Awaiting confirmation'
              : recDraftPos > 0 ? (recDraftPos === 1 ? 'Unsent purchase order' : 'Unsent purchase orders')
              : recUnackedPos > 0 ? 'Vendor unconfirmed'
              : order.status === 'confirmed' && purchaseOrders.length === 0 ? 'No purchase orders'
              : 'Balance outstanding';
            const excActs = [];
            if (order.status === 'pending') {
              excActs.push({ label: updating ? 'Confirming…' : 'Confirm order', primary: true, busy: updating, run: () => updateStatus('confirmed') });
            } else if (recDraftPos > 0) {
              if (singleDraft) {
                excActs.push({ label: 'Send ' + (singleDraft.po_number || 'PO') + ' to ' + (singleDraft.vendor_name || 'vendor'), primary: true, busy: poUpdating, run: () => sendPOToVendor(singleDraft.id, singleDraft.edi_config?.enabled) });
              } else {
                excActs.push({ label: 'Review purchase orders', primary: true, run: () => setRecTab('vendors') });
              }
            } else if (recUnackedPos > 0) {
              if (singleUnacked) excActs.push({ label: 'Mark ' + (singleUnacked.po_number || 'PO') + ' acknowledged', primary: true, busy: poUpdating, run: () => updatePOStatus(singleUnacked.id, 'acknowledged') });
              excActs.push({ label: 'Review purchase orders', primary: !singleUnacked, run: () => setRecTab('vendors') });
            } else if (order.status === 'delivered' && recBalance > 0.005) {
              excActs.push({ label: 'Email invoice + payment link', primary: true, run: () => { setInvoiceMessage(''); setShowSendInvoiceModal(true); } });
              if (balanceInfo && balanceInfo.balance_status === 'balance_due') {
                excActs.push({ label: 'Send payment request', run: () => { setPaymentRequestMessage(''); setShowPaymentRequestModal(true); } });
              }
            }
            return (
              <div className="recd-exception" style={{ borderLeftColor: recRiskColor }}>
                <div className="recd-exc-head">
                  <span style={{ color: recRiskColor }}>{recRiskLabel} · {excKind.toUpperCase()}</span>
                  <span style={{ marginLeft: 'auto', color: 'var(--faint)' }}>{order.order_number}</span>
                </div>
                <div className="recd-exc-title">{recBlocker}</div>
                {excActs.length > 0 && (
                  <div className="recd-exc-actions">
                    {excActs.map(a => (
                      <button key={a.label} className={a.primary ? 'recd-exc-primary' : 'opsq-alt'} disabled={a.busy} onClick={a.run}>{a.label}</button>
                    ))}
                  </div>
                )}
              </div>
            );
          })()}
          {/* Shipment details — appears when advancing a shipping order to Shipped */}
          {recTab === 'record' && showTrackingForm && (
            <div className="recd-exception" style={{ borderLeftColor: 'var(--gold)' }}>
              <div className="recd-exc-head"><span style={{ color: 'var(--gold)' }}>SHIPMENT DETAILS</span></div>
              <div style={{ marginTop: 13, display: 'flex', gap: 10, flexWrap: 'wrap' }}>
                <select value={trackingData.carrier} onChange={e => setTrackingData({ ...trackingData, carrier: e.target.value })}
                  style={{ padding: '9px 10px', font: '400 12px/1.4 var(--sans)' }}>
                  <option value="">Carrier…</option>
                  <option>UPS</option>
                  <option>FedEx</option>
                  <option>USPS</option>
                  <option>FedEx Freight</option>
                  <option>XPO Logistics</option>
                  <option>R+L Carriers</option>
                  <option>SAIA</option>
                  <option>Old Dominion</option>
                  <option>Other</option>
                </select>
                <input type="text" placeholder="Tracking number" value={trackingData.tracking_number}
                  onChange={e => setTrackingData({ ...trackingData, tracking_number: e.target.value })}
                  style={{ flex: '1 1 180px', minWidth: 140, padding: '9px 10px', font: '400 12px/1.4 var(--mono)' }} />
                <input type="date" value={trackingData.shipped_at}
                  onChange={e => setTrackingData({ ...trackingData, shipped_at: e.target.value })}
                  style={{ padding: '9px 10px', font: '400 12px/1.4 var(--mono)' }} />
              </div>
              <div className="recd-exc-actions">
                <button className="recd-exc-primary" disabled={updating || !trackingData.carrier || !trackingData.tracking_number}
                  onClick={() => updateStatus('shipped')}>{updating ? 'Submitting…' : 'Confirm shipment'}</button>
                <button className="opsq-alt" onClick={() => setShowTrackingForm(false)}>Cancel</button>
              </div>
            </div>
          )}

          {/* Tracking — shipped orders */}
          {recTab === 'record' && order.tracking_number && !showTrackingForm && (
            <div className="form-card">
              <div className="rb-head">
                <h3>Tracking</h3>
                {trackingData2 && trackingData2.tracking_url && (
                  <a className="rb-action" style={{ marginLeft: 'auto' }} href={trackingData2.tracking_url} target="_blank" rel="noopener noreferrer">Carrier site {'↗'}</a>
                )}
                <button className="rb-action" style={{ marginLeft: trackingData2 && trackingData2.tracking_url ? 0 : 'auto' }}
                  onClick={refreshTracking} disabled={trackingRefreshing}>{trackingRefreshing ? 'Checking…' : 'Refresh'}</button>
              </div>
              <div className="rb-facts" style={{ gridTemplateColumns: '1fr 1fr' }}>
                <div className="rb-fact"><span className="rb-fact-k">Tracking</span><span className="rb-fact-v">{order.tracking_number}</span></div>
                <div className="rb-fact"><span className="rb-fact-k">Carrier</span><span className="rb-fact-v">{order.shipping_carrier || '—'}</span></div>
                <div className="rb-fact"><span className="rb-fact-k">Shipped</span><span className="rb-fact-v">{order.shipped_at ? new Date(order.shipped_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '—'}</span></div>
                <div className="rb-fact"><span className="rb-fact-k">Status</span><span className="rb-fact-v" style={{ textTransform: 'capitalize' }}>{(trackingData2 && trackingData2.tracking_status) || '—'}</span></div>
              </div>
              {trackingData2 && (trackingData2.events || []).length > 0 && (
                <div className="rb-trail" style={{ marginTop: 14, gap: 12 }}>
                  {trackingData2.events.map((evt, idx) => (
                    <div key={evt.id || idx} className="rb-trail-row" style={{ gridTemplateColumns: '76px 1fr' }}>
                      <span className="rb-trail-when">{evt.event_time ? new Date(evt.event_time).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' + new Date(evt.event_time).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false }) : ''}</span>
                      <span>
                        <span style={{ display: 'block', font: '400 12px/1.4 var(--sans)', textTransform: 'capitalize', color: idx === 0 ? 'var(--ink)' : 'var(--dim)' }}>{evt.status}{evt.location ? ' · ' + evt.location : ''}</span>
                        {evt.description && <span style={{ display: 'block', marginTop: 2, font: '400 10px/1.4 var(--mono)', color: 'var(--faint)' }}>{evt.description}</span>}
                      </span>
                    </div>
                  ))}
                </div>
              )}
              {trackingData2 && (trackingData2.last_checked || (trackingData2.events || []).length === 0) && (
                <div className="rb-note" style={{ color: 'var(--faint)' }}>
                  {(trackingData2.events || []).length === 0 ? 'NO CARRIER EVENTS YET' : 'LAST CHECKED ' + new Date(trackingData2.last_checked).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }).toUpperCase()}
                </div>
              )}
            </div>
          )}

          {/* Unsent PO warning \u2014 on non-record tabs the exception band isn't shown, keep the reminder visible */}
          {recTab !== 'record' && (() => {
            const unsentPOs = purchaseOrders.filter(po => po.status === 'draft');
            if (unsentPOs.length === 0) return null;
            return (
              <div className="recd-exception" style={{ marginBottom: 0 }}>
                <div className="recd-exc-head">
                  <span style={{ color: 'var(--gold)' }}>NEEDS ACTION {'\u00B7'} {unsentPOs.length} PO{unsentPOs.length > 1 ? 'S' : ''} NOT SENT TO VENDOR{unsentPOs.length > 1 ? 'S' : ''}</span>
                </div>
              </div>
            );
          })()}







          {recTab === 'record' && <div className="form-card">
            <h3>Lines · {items.length}
              {showReadyCol && (
                <span style={{ color: readyCount === productItems.length ? 'var(--green)' : 'var(--faint)', marginLeft: '0.5rem' }}>
                  · {readyCount}/{productItems.length} ready for pickup
                </span>
              )}
            </h3>
            <div className="table-scroll-wrapper">
            <table className="admin-table">
              <thead>
                <tr>
                  <th>Product</th>
                  <th style={{ width: 130 }}>Vendor {'·'} PO</th>
                  <th style={{ width: 100 }}>SqFt</th>
                  <th style={{ width: 90 }}>Qty</th>
                  <th style={{ width: 130 }}>Unit Price</th>
                  <th style={{ width: 100, textAlign: 'right' }}>Subtotal</th>
                  {showReadyCol && <th style={{ width: 120 }}>Store Pickup</th>}
                  {['pending', 'confirmed'].includes(order.status) && ['admin', 'manager'].includes(staffRole) && <th style={{ width: 80 }}>Actions</th>}
                </tr>
              </thead>
              <tbody>
                {items.map(item => {
                  const qtyLabel = item.sell_by === 'unit' ? 'units' : item.sell_by === 'piece' ? 'pcs' : item.sell_by === 'roll' ? 'sqft' : 'boxes';
                  const isLabor = isLaborItem(item);
                  if (isLabor) {
                    const rateInfo = item.rate_type === 'per_sqft'
                      ? '$' + parseFloat(item.rate_sqft || 0).toFixed(2) + '/sqft × ' + parseFloat(item.labor_sqft || 0).toFixed(0) + ' sqft'
                      : (parseFloat(item.quantity || 1) > 1 ? '$' + parseFloat(item.unit_price || 0).toFixed(2) + ' × ' + parseFloat(item.quantity).toFixed(0) : 'Flat rate');
                    return (
                    <tr key={item.id}>
                      <td data-label="Product">
                        <div style={{ fontWeight: 500 }}>
                          {item.product_name || 'Labor'}
                          <span className="badge" style={{ fontSize: '0.6rem', marginLeft: '0.5rem', background: 'var(--stone-200)', color: 'var(--stone-700)' }}>Labor</span>
                        </div>
                        <div style={{ fontSize: '0.6875rem', color: '#a4a09a' }}>
                          {item.source_estimate_area ? item.source_estimate_area + ' · ' : ''}{(item.description || '').split('\n').join(' · ')}
                        </div>
                      </td>
                      <td data-label="Vendor · PO"><span style={{ font: '400 10px/1.4 var(--mono)', color: 'var(--faint)' }}>Labor {'·'} no PO</span></td>
                      <td data-label="SqFt"><span style={{ color: 'var(--stone-400)' }}>—</span></td>
                      <td data-label="Qty"><span style={{ fontSize: '0.7rem', color: 'var(--stone-400)' }}>{rateInfo}</span></td>
                      <td data-label="Unit Price"><span style={{ color: 'var(--stone-400)' }}>—</span></td>
                      <td data-label="Subtotal" style={{ textAlign: 'right', fontWeight: 500 }}>{item.subtotal ? '$' + parseFloat(item.subtotal).toFixed(2) : '—'}</td>
                      {showReadyCol && <td data-label="Store Pickup"><span style={{ color: 'var(--stone-400)' }}>—</span></td>}
                      {['pending', 'confirmed'].includes(order.status) && ['admin', 'manager'].includes(staffRole) && (
                        <td data-label="" className="actions">
                          <button className="btn btn-danger btn-sm"
                              onClick={async () => {
                                if (!confirm('Remove this labor line from the order?')) return;
                                try {
                                  const data = await adminFetch('/api/admin/orders/' + editId + '/items/' + item.id, { method: 'DELETE' });
                                  if (data.order) setOrder(data.order);
                                  if (data.items) setItems(data.items);
                                  if (data.balance) setBalanceInfo(data.balance);
                                  loadPOs();
                                } catch (err) { alert(err.message); }
                              }}>Remove</button>
                        </td>
                      )}
                    </tr>

                  return (
                  <tr key={item.id}>
                    <td data-label="Product">
                      <div style={{ fontWeight: 500 }}>
                        {item.collection || item.current_collection || item.product_name || '—'}

                      </div>
                      <div style={{ fontSize: '0.6875rem', color: '#a4a09a' }}>
                        {item.vendor_name || ''}{item.vendor_sku ? ' · ' + item.vendor_sku : ''}

                      </div>

                    <td data-label="Vendor · PO">
                      {(() => {

                          <span style={{ font: '400 11px/1.4 var(--mono)' }}>
                            <span style={{ display: 'block', color: 'var(--ink)' }}>{po.vendor_name}</span>
                            <a style={{ display: 'block', color: 'var(--gold)', cursor: 'pointer', fontSize: 10 }}
                              onClick={() => setRecTab('vendors')}>{po.po_number} {'·'} {po.status}</a>
                          </span>
                        );
                        if (item.is_sample) return <span style={{ color: 'var(--stone-400)' }}>—</span>;
                        return <span style={{ font: '400 10px/1.4 var(--mono)', color: 'var(--faint)' }}>{item.vendor_name || '—'}<span style={{ display: 'block', marginTop: 3 }}>no PO</span></span>;
                      })()}
                    </td>
                    <td data-label="SqFt">{item.sell_by === 'unit' || item.sell_by === 'piece' ? <span style={{ color: 'var(--stone-400)' }}>—</span> : item.sqft_needed ? parseFloat(item.sqft_needed).toFixed(1) : '—'}</td>
                    <td data-label="Qty">{item.sell_by === 'roll' ? (item.sqft_needed || 0) : item.num_boxes} <span style={{ fontSize: '0.7rem', color: 'var(--stone-400)' }}>{qtyLabel}</span></td>

                              if (!confirm('Remove this item from the order?')) return;
                              try {
                                const data = await adminFetch('/api/admin/orders/' + editId + '/items/' + item.id, { method: 'DELETE' });
                                if (data.order) setOrder(data.order);
                                if (data.items) setItems(data.items);
                                if (data.balance) setBalanceInfo(data.balance);
                                loadPOs();
                              } catch (err) { alert(err.message); }

                      </td>

            </table>
            </div>
            {['pending', 'confirmed'].includes(order.status) && ['admin', 'manager'].includes(staffRole) && (

                      <button className={addItemMode === 'custom' ? 'btn btn-sm btn-primary' : 'btn btn-sm btn-secondary'}

                              const q = e.target.value; setAddItemSku(q);
                              setSkuSearchError(null);
                              if (skuSearchTimer.current) clearTimeout(skuSearchTimer.current);
                              if (q.length >= 2) {
                                setSkuSearching(true);
                                const thisSearch = ++skuSearchCounter.current;
                                skuSearchTimer.current = setTimeout(async () => {
                                  try {
                                    const data = await adminFetch('/api/admin/skus/search?q=' + encodeURIComponent(q));
                                    if (thisSearch !== skuSearchCounter.current) return;
                                    setSkuSearchResults((data.results || []).map(r => ({
                                      sku_id: r.sku_id,
                                      collection: r.collection || '',
                                      product_name: r.product_name || '',
                                      variant_name: r.variant_name || '',
                                      color: r.color || '',
                                      internal_sku: r.internal_sku || '',
                                      vendor_sku: r.vendor_sku || '',
                                      price: r.retail_price || 0,
                                      vendor_name: r.vendor_name || '',
                                      sell_by: r.sell_by || 'box',
                                      price_basis: r.price_basis || 'per_sqft',
                                      cut_price: r.cut_price,
                                      roll_price: r.roll_price,
                                      roll_width_ft: r.roll_width_ft,
                                      primary_image: r.primary_image || null
                                    })));
                                  } catch (err) {
                                    if (thisSearch !== skuSearchCounter.current) return;
                                    console.error('[SKU Search] Error:', err.message || err);
                                    setSkuSearchError(err.message || 'Search failed');
                                  }
                                  if (thisSearch === skuSearchCounter.current) setSkuSearching(false);
                                }, 250);
                              } else { setSkuSearchResults([]); setSkuSearching(false); setSkuSearchError(null); }

                          {skuSearching && skuSearchResults.length === 0 && addItemSku.length >= 2 && (

                                      if (data.items) setItems(data.items);
                                      if (data.balance) setBalanceInfo(data.balance);

                                    </div>
                                    <div className="product-meta">
                                      {r.vendor_name}{r.vendor_sku ? ' · ' + r.vendor_sku : r.internal_sku ? ' · ' + r.internal_sku : ''}

                                  </div>
                                </div>
                              ))}
                            </div>

                          <input type="number" min="1" value={addItemBoxes} onChange={e => setAddItemBoxes(parseInt(e.target.value) || 1)}
                            style={{ width: '100%', padding: '0.5rem', border: '1px solid var(--stone-200)' }} />
                        </div>
                      </div>
                    ) : addItemMode === 'custom' ? (
                      /* Custom item mode */
                      <div style={{ display: 'flex', gap: '0.75rem', alignItems: 'flex-end', flexWrap: 'wrap' }}>
                        <div style={{ minWidth: '160px', flex: 1 }}>
                          <label style={{ display: 'block', fontSize: '0.75rem', fontWeight: 500, marginBottom: '0.25rem' }}>Vendor *</label>
                          <select value={customItemVendor} onChange={e => setCustomItemVendor(e.target.value)}

                          <label style={{ display: 'block', fontSize: '0.75rem', fontWeight: 500, marginBottom: '0.25rem' }}>Product Name *</label>
                          <input type="text" value={customItemName} onChange={e => setCustomItemName(e.target.value)}
                            placeholder="e.g. Custom transition strip"
                            style={{ width: '100%', padding: '0.5rem', border: '1px solid var(--stone-200)' }} />
                        </div>
                        <div style={{ width: '100px' }}>
                          <label style={{ display: 'block', fontSize: '0.75rem', fontWeight: 500, marginBottom: '0.25rem' }}>Unit Price *</label>
                          <input type="number" min="0" step="0.01" value={customItemPrice} onChange={e => setCustomItemPrice(e.target.value)}
                            placeholder="0.00"
                            style={{ width: '100%', padding: '0.5rem', border: '1px solid var(--stone-200)' }} />
                        </div>
                        <div style={{ width: '90px' }}>
                          <label style={{ display: 'block', fontSize: '0.75rem', fontWeight: 500, marginBottom: '0.25rem' }}>Sold By *</label>
                          <select value={customItemSellBy} onChange={e => setCustomItemSellBy(e.target.value)}
                            style={{ width: '100%', padding: '0.5rem', border: '1px solid var(--stone-200)' }}>
                            <option value="box">Box</option>
                            <option value="unit">Per Unit (slabs/prefab)</option>
                            <option value="piece">Per Piece (mosaics)</option>
                            <option value="roll">Roll</option>
                          </select>
                        </div>
                        <div style={{ width: '70px' }}>
                          <label style={{ display: 'block', fontSize: '0.75rem', fontWeight: 500, marginBottom: '0.25rem' }}>{customItemSellBy === 'unit' ? 'Qty *' : customItemSellBy === 'piece' ? 'Qty *' : customItemSellBy === 'roll' ? 'SqFt *' : 'Boxes *'}</label>
                          <input type="number" min="1" value={customItemBoxes} onChange={e => setCustomItemBoxes(parseInt(e.target.value) || 1)}
                            style={{ width: '100%', padding: '0.5rem', border: '1px solid var(--stone-200)' }} />
                        </div>
                        <div style={{ minWidth: '140px', flex: 1 }}>
                          <label style={{ display: 'block', fontSize: '0.75rem', fontWeight: 500, marginBottom: '0.25rem' }}>Description</label>
                          <input type="text" value={customItemDesc} onChange={e => setCustomItemDesc(e.target.value)}
                            placeholder="Optional notes"
                            style={{ width: '100%', padding: '0.5rem', border: '1px solid var(--stone-200)' }} />
                        </div>
                        <button className="btn btn-sm btn-primary" disabled={!customItemVendor || !customItemName.trim() || !customItemPrice}
                          onClick={async () => {
                            try {
                              const data = await adminFetch('/api/admin/orders/' + editId + '/add-item', {
                                method: 'POST', body: JSON.stringify({
                                  product_name: customItemName.trim(),
                                  unit_price: parseFloat(customItemPrice),
                                  vendor_id: customItemVendor,
                                  num_boxes: customItemBoxes,
                                  sell_by: customItemSellBy,
                                  description: customItemDesc || undefined
                                })
                              });
                              if (data.order) setOrder(data.order);
                              if (data.items) setItems(data.items);
                              if (data.balance) setBalanceInfo(data.balance);
                              loadPOs();
                              setAddingItem(false);
                            } catch (err) { alert(err.message); }
                          }}>
                          Add
                        </button>
                      </div>

                  </div>
                )}
              </div>
            )}
          </div>}

          {/* Purchase Orders */}

            <div className="form-card">
              <h3>Purchase orders</h3>
              <p style={{ font: '400 12px/1.8 var(--mono)', color: 'var(--faint)', margin: 0 }}>none issued yet — confirming the order generates vendor POs automatically</p>
            </div>
          )}
          {(recTab === 'vendors' || recTab === 'record') && purchaseOrders.length > 0 && (
            <div className="form-card">
              <h3>Purchase orders · {purchaseOrders.length}</h3>
              {posLoading ? <p>Loading...</p> : purchaseOrders.map(po => {
                const isDraft = po.status === 'draft';
                const isSentOrLater = ['sent', 'acknowledged', 'fulfilled'].includes(po.status);
                const statusActions = {
                  sent: [{ label: 'Mark Acknowledged', status: 'acknowledged' }],
                  acknowledged: [{ label: 'Mark Fulfilled', status: 'fulfilled' }],
                };
                const revertTargets = { sent: 'draft', acknowledged: 'sent', fulfilled: 'acknowledged' };
                const revertTarget = revertTargets[po.status];
                const actions = statusActions[po.status] || [];
                return (
                  <div key={po.id} style={{ marginBottom: '14px', border: '1px solid var(--line)', background: 'var(--panel)', padding: '13px 16px 15px' }}>

                          <span className="badge" style={{ background: 'rgba(217,164,65,0.15)', color: '#d9a441' }}>REVISED</span>

                          <span className="badge" style={{
                            background: po.edi_ack_status === 'accepted' ? 'rgba(96,160,120,0.16)' : po.edi_ack_status === 'rejected' ? 'rgba(197,71,49,0.12)' : 'rgba(217,164,65,0.15)',
                            color: po.edi_ack_status === 'accepted' ? '#7cc294' : po.edi_ack_status === 'rejected' ? '#e07a63' : '#854d0e'
                          }}>EDI: {po.edi_ack_status === 'accepted' ? 'Accepted' : po.edi_ack_status === 'rejected' ? 'Rejected' : 'Partial'}</span>
                        )}
                        {po.edi_interchange_id && !po.edi_ack_status && (
                          <span className="badge" style={{ background: 'rgba(126,160,205,0.16)', color: '#8fb3dd' }}>EDI Sent</span>
                        )}

                        {revertTarget && (
                          <button className="stepper-revert-link" style={{ fontSize: '0.75rem' }}
                            onClick={() => updatePOStatus(po.id, revertTarget)} disabled={poUpdating}>
                            {'\u21A9'} Revert to {revertTarget.charAt(0).toUpperCase() + revertTarget.slice(1)}
                          </button>

                        {(po.status === 'draft' || po.status === 'sent') && (
                          <button className="btn btn-primary" style={{ fontSize: '0.75rem', padding: '0.3rem 0.75rem' }}
                            onClick={() => sendPOToVendor(po.id, po.edi_config?.enabled)} disabled={poUpdating}>
                            {po.edi_config?.enabled
                              ? (po.status === 'sent' ? 'Resend via EDI' : 'Send via EDI')
                              : (po.status === 'sent' ? 'Resend to Vendor' : 'Send to Vendor')}
                          </button>
                        )}
                        {actions.map(a => (
                          <button key={a.status} className="btn btn-primary" style={{ fontSize: '0.75rem', padding: '0.3rem 0.75rem' }}
                            onClick={() => updatePOStatus(po.id, a.status)} disabled={poUpdating}>
                            {a.label}
                          </button>
                        ))}
                        <button className="btn btn-secondary" style={{ fontSize: '0.75rem', padding: '0.3rem 0.75rem' }}

                          }}>
                          Download PO
                        </button>
                        {['fulfilled', 'acknowledged', 'sent'].includes(po.status) && ['admin', 'manager'].includes(staffRole) && (
                          <button className="btn btn-secondary" style={{ fontSize: '0.75rem', padding: '0.3rem 0.75rem' }}
                            onClick={async () => {
                              try {
                                const data = await adminFetch('/api/admin/accounting/bills/from-po/' + po.id, { method: 'POST' });
                                alert('Bill ' + data.bill.internal_bill_number + ' created');
                              } catch (err) { alert(err.message); }
                            }}>
                            Create Bill
                          </button>

                      </div>
                    </div>

                    {/* Bulk item status (for sent or later) */}

                        {['ordered', 'shipped', 'received', 'cancelled'].map(s => (
                          <button key={s} className="btn btn-secondary" style={{ fontSize: '0.6875rem', padding: '0.2rem 0.5rem', textTransform: 'capitalize' }}

                          </button>
                        ))}
                      </div>
                    )}

                    {po.approved_by_name && (
                      <p style={{ fontSize: '0.75rem', color: 'var(--stone-500)', marginBottom: '0.75rem' }}>

                    <div className="table-scroll-wrapper">
                    <table className="admin-table" style={{ fontSize: '0.8125rem' }}>

                        <tr>

                          <th>Vendor SKU</th>
                          <th>Qty</th>
                          <th>Retail Price</th>
                          <th>Cost</th>
                          <th>Margin</th>
                          {isSentOrLater && <th>Status</th>}

                          {isSentOrLater && <th>Dye Lot</th>}
                          {isSentOrLater && <th>Qty Shipped</th>}

                          const cost = parseFloat(item.cost || 0);
                          const retail = parseFloat(item.retail_price || 0);

                          return (
                            <tr key={item.id}>
                              <td data-label="Product">
                                <div style={{ fontWeight: 500 }}>{item.product_name || '—'}</div>
                              </td>
                              <td data-label="Vendor SKU">{item.vendor_sku || '—'}</td>
                              <td data-label="Qty">
                                {isDraft ? (
                                  <input type="number" min="1" defaultValue={item.qty} style={{ width: '60px', padding: '0.2rem 0.4rem', fontSize: '0.8125rem', border: '1px solid var(--stone-300)' }}
                                    onBlur={e => { const v = parseInt(e.target.value); if (v && v !== item.qty) updatePOItem(po.id, item.id, { qty: v }); }} />
                                ) : item.qty}

                              <td data-label="Retail Price">{item.retail_price ? '$' + retail.toFixed(2) : '—'}</td>

                                {isDraft ? (

                              </td>
                              <td data-label="Margin" style={{ color: margin <= 0 ? 'var(--red)' : 'inherit', fontWeight: margin <= 0 ? 600 : 400 }}>

                                <td data-label="Status">

                                      <option key={s} value={s}>{s.charAt(0).toUpperCase() + s.slice(1)}</option>

                                  </select>
                                </td>
                              )}
                              {isSentOrLater && (
                                <td data-label="EDI Status">
                                  {item.edi_line_status === 'accepted' && (
