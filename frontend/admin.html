            <span className="ops-brand-sub">OPERATIONS</span>
          </div>
          <button className="ops-jump" onClick={onPalette}>
            <span>/</span>
            <span style={{ flex: 1 }}>jump to work item or ledger…</span>
            <kbd>⌘K</kbd>
          </button>
          <div className="ops-bar-right">
            <span className="ops-sla-pill" style={{ color: breaches ? 'var(--hot)' : 'var(--dim)' }}>
              <span className="ops-dot" style={{ background: breaches ? 'var(--hot)' : 'var(--cool)' }} />
              {breaches} PAST SLA
            </span>
            <span className="ops-clock" style={{ color: 'var(--faint)' }}>
              ANAHEIM · {clock.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: false })}
            </span>
            <span className="ops-staff">
              <span className="ops-avatar">{initials}</span>
              {staffData ? `${(staffData.first_name || '').toUpperCase()} ${(staffData.last_name || ' ')[0] || ''}.` : 'STAFF'} · {roleLabel}
            </span>
            <button className="ops-logout" onClick={onLogout}>EXIT</button>
          </div>
        </header>
      );
    }

    function OpsRail({ open, onClose, items, wlAllowed, stream, setStream, view, activeBase, ledgers, navigate }) {
      const count = (id) => items.filter(i => id === 'all' || i.stream === id).length;
      const late = (id) => items.filter(i => (id === 'all' || i.stream === id) && i.sla === 'breach').length;
      const onQueue = view === 'dashboard';
      const streamRow = (id, label, hint) => {
        const on = onQueue && stream === id;
        const lateN = late(id);
        return (
          <button key={id} className={'ops-stream' + (on ? ' active' : '')}
            onClick={() => { setStream(id); navigate('dashboard'); onClose(); }}>
            <div className="ops-stream-row">
              <span className="ops-stream-name">{label}</span>
              <span className="ops-stream-count">{count(id)}</span>
            </div>
            <div className="ops-stream-hint">
              {lateN > 0 && <span className="late">{lateN} late</span>}
              {lateN > 0 && <span>·</span>}
              <span>{hint}</span>
            </div>
          </button>
        );
      };
      return (
        <nav className={'ops-rail' + (open ? ' open' : '')}>
          {wlAllowed && <div className="ops-rail-label">WORK</div>}
          {wlAllowed && streamRow('all', 'Everything open', 'all streams')}
          {wlAllowed && OPS_STREAMS.map(s => streamRow(s.id, s.label, s.hint))}
          <div className="ops-rail-label" style={{ paddingTop: wlAllowed ? 22 : 16 }}>LEDGERS</div>
          {ledgers.map(item => (
            <button key={item.key}
              className={'ops-ledger' + (!onQueue && activeBase === item.key ? ' active' : '')}
              onClick={() => { navigate(item.key); onClose(); }}>
              {item.label}
            </button>
          ))}
          <div className="ops-rail-foot">
            <div>J / K &nbsp;move</div>
            <div>E &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;run primary</div>
            <div>⌘K&nbsp;&nbsp;&nbsp;&nbsp;jump</div>
          </div>
        </nav>
      );
    }

    function OpsStatusBar({ items, loaded, syncedAt }) {
      const breaches = items.filter(i => i.sla === 'breach').length;
      const due = items.filter(i => i.sla === 'today').length;
      return (
        <div className="ops-status">
          <span>{items.length} OPEN</span>
          <span style={{ color: breaches ? 'var(--hot)' : undefined }}>{breaches} PAST SLA</span>
          <span>{due} DUE TODAY</span>
          <span style={{ marginLeft: 'auto' }}>
            {loaded ? `SYNC OK · ${syncedAt ? syncedAt.toLocaleTimeString('en-US', { hour12: false }) : ''}` : 'SYNCING…'}
          </span>
        </div>
      );
    }

    function OpsToast({ toast }) {
      if (!toast) return null;
      return (
        <div className={'opsq-toast' + (toast.err ? ' err' : '')}>
          <span style={{ font: '400 11px/1 var(--mono)', letterSpacing: '0.1em', color: toast.err ? 'var(--hot)' : 'var(--gold)' }}>
            {toast.err ? 'FAILED' : 'DONE'}
          </span>
          <span style={{ font: '400 12px/1.4 var(--sans)' }}>{toast.msg}</span>
          {toast.sub && <span style={{ font: '400 11px/1 var(--mono)', color: 'var(--faint)' }}>{toast.sub}</span>}
        </div>
      );
    }

    function OpsPalette({ items, ledgers, onPickItem, onPickLedger, onClose }) {
      const [q, setQ] = useState('');
      const inputRef = useRef(null);
      useEffect(() => { if (inputRef.current) inputRef.current.focus(); }, []);
      const ql = q.toLowerCase();
      const itemHits = items.filter(i => (i.title + i.entity + i.who + i.kind).toLowerCase().includes(ql)).slice(0, 7);
      const ledgerHits = q ? ledgers.filter(l => l.label.toLowerCase().includes(ql)).slice(0, 4) : [];
      return (
        <div className="ops-palette-overlay" onClick={onClose}>
          <div className="ops-palette" onClick={e => e.stopPropagation()}>
            <input ref={inputRef} value={q} onChange={e => setQ(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter' && itemHits.length) onPickItem(itemHits[0].id); }}
              placeholder="work item, order, vendor, customer, ledger…" />
            {ledgerHits.map(l => (
              <button key={l.key} className="ops-palette-hit" onClick={() => onPickLedger(l.key)}>
                <span style={{ width: 92, flexShrink: 0, font: '400 10px/1 var(--mono)', color: 'var(--faint)' }}>LEDGER</span>
                <span style={{ flex: 1, font: '400 13px/1.3 var(--sans)' }}>{l.label}</span>
              </button>
            ))}
            {itemHits.map(i => (
              <button key={i.id} className="ops-palette-hit" onClick={() => onPickItem(i.id)}>
                <span style={{ width: 92, flexShrink: 0, font: '400 10px/1 var(--mono)', color: 'var(--faint)', overflow: 'hidden', textOverflow: 'ellipsis' }}>{i.entity}</span>
                <span style={{ flex: 1, font: '400 13px/1.3 var(--sans)' }}>{i.title}</span>
                <span style={{ font: '400 10px/1 var(--mono)', color: SLA_TONE[i.sla].color, flexShrink: 0 }}>{i.age}</span>
              </button>
            ))}
            {q && !itemHits.length && !ledgerHits.length && (
              <div className="ops-palette-foot">NO MATCHES IN THE OPEN QUEUE</div>
            )}
            <div className="ops-palette-foot">↵ OPEN · ESC CLOSE</div>
          </div>
        </div>
      );
    }

    function OpsBlock({ label, children }) {
      return (
        <div className="opsq-block">
          <div className="opsq-block-label">{label}</div>
          {children}
        </div>
      );
    }

    function OpsQueueView({ items, loaded, stream, sel, setSel, onResolve, paletteOpen }) {
      const [q, setQ] = useState('');
      const [note, setNote] = useState('');
      const [paneOpen, setPaneOpen] = useState(false);
      const [busy, setBusy] = useState(false);

      const visible = items.filter(i =>
        (stream === 'all' || i.stream === stream) &&
        (!q || (i.title + i.who + i.entity + i.kind).toLowerCase().includes(q.toLowerCase()))
      );
      const active = items.find(i => i.id === sel && visible.some(v => v.id === i.id)) || visible[0] || null;

      useEffect(() => { setNote(''); setBusy(false); }, [active && active.id]);

      const run = (item, action) => {
        if (busy) return;
        setBusy(true);
        Promise.resolve(onResolve(item, action, note)).finally(() => setBusy(false));
      };

      useEffect(() => {
        const onKey = (e) => {
          if (paletteOpen || e.metaKey || e.ctrlKey || e.altKey) return;
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
          const idx = visible.findIndex(i => active && i.id === active.id);
          if (e.key === 'j' && idx < visible.length - 1) setSel(visible[idx + 1].id);
          if (e.key === 'k' && idx > 0) setSel(visible[idx - 1].id);
          if (e.key === 'e' && active) {
            const primary = active.actions.find(a => a.type === 'primary');
            if (primary) run(active, primary);
          }
          if (e.key === 'Escape') setPaneOpen(false);
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      });

      const title = stream === 'all' ? 'Everything open' : (OPS_STREAMS.find(s => s.id === stream) || {}).label;
      const tone = active ? SLA_TONE[active.sla] : null;
      const primary = active ? active.actions.find(a => a.type === 'primary') : null;
      const alts = active ? active.actions.filter(a => a.type !== 'primary') : [];
      const fmtAmt = (n) => '$' + parseFloat(n || 0).toLocaleString('en-US', { maximumFractionDigits: 0 });

      return (
        <div className="opsq">
          <section className="opsq-list">
            <div className="opsq-list-head">
              <span className="opsq-list-title">{title}</span>
              <span className="opsq-list-count">{visible.length} items</span>
              <input className="opsq-filter" value={q} onChange={e => setQ(e.target.value)} placeholder="filter…" />
              <span className="opsq-sort">OLDEST FIRST</span>
            </div>
            <div className="opsq-items">
              {!loaded && <div className="opsq-empty">loading the queue…</div>}
              {loaded && visible.length === 0 && (
                <div className="opsq-empty">queue clear<br />nothing in this stream needs you</div>
              )}
              {visible.map(i => {
                const s = SLA_TONE[i.sla];
                const p = i.actions.find(a => a.type === 'primary');
                return (
                  <button key={i.id} className={'opsq-item' + (active && i.id === active.id ? ' active' : '')}
                    onClick={() => { setSel(i.id); setPaneOpen(true); }}>
                    <div className="opsq-meta">
                      <span style={{ color: s.color }}>{s.label}</span>
                      <span style={{ color: 'var(--faint)' }}>{i.age}</span>
                      <span style={{ color: 'var(--faint)' }}>·</span>
                      <span style={{ color: 'var(--dim)' }}>{i.kind.toUpperCase()}</span>
                      <span style={{ marginLeft: 'auto', color: 'var(--faint)', overflow: 'hidden', textOverflow: 'ellipsis' }}>{i.entity}</span>
                    </div>
                    <div className="opsq-title">{i.title}</div>
                    <div className="opsq-line">{i.line}</div>
                    <div className="opsq-foot">
                      <span>{i.who}</span>
                      {i.amount > 0 && <React.Fragment><span style={{ color: 'var(--faint)' }}>·</span><span>{fmtAmt(i.amount)}</span></React.Fragment>}
                      {p && <span style={{ marginLeft: 'auto', color: 'var(--faint)' }}>{p.label} ↵</span>}
                    </div>
                  </button>
                );
              })}
            </div>
          </section>

          <aside className={'opsq-pane' + (paneOpen ? ' open' : '')}>
            {!active ? (
              <div style={{ flex: 1, display: 'grid', placeItems: 'center', padding: 40, textAlign: 'center' }}>
                <div style={{ font: '400 12px/1.9 var(--mono)', color: 'var(--faint)' }}>NO ITEM SELECTED<br />pick something from the queue</div>
              </div>
            ) : (
              <React.Fragment>
                <div className="opsq-pane-head">
                  <div className="opsq-meta">
                    <span style={{ color: tone.color }}>{tone.label}</span>
                    <span style={{ color: 'var(--faint)' }}>{active.kind.toUpperCase()}</span>
                    <span style={{ marginLeft: 'auto', color: 'var(--dim)' }}>{active.entity}</span>
                    <button className="opsq-pane-close" onClick={() => setPaneOpen(false)}>CLOSE</button>
                  </div>
                  <h1 className="opsq-pane-title">{active.title}</h1>
                  <div className="opsq-pane-meta">
                    <span>{active.who}</span>
                    {active.amount > 0 && <span style={{ color: 'var(--ink)' }}>{fmtAmt(active.amount)}</span>}
                    <span style={{ color: 'var(--faint)' }}>open {active.age}</span>
                  </div>
                </div>
                <div className="opsq-pane-body">
                  <OpsBlock label="Why this is here">
                    <p className="opsq-reason">{active.reason}</p>
                  </OpsBlock>
                  <OpsBlock label="Facts">
                    <div className="opsq-facts">
                      {active.facts.map(([k, v]) => (
                        <div key={k} className="opsq-fact">
                          <div className="opsq-fact-k">{k}</div>
                          <div className="opsq-fact-v">{v}</div>
                        </div>
                      ))}
                    </div>
                  </OpsBlock>
                  <OpsBlock label="Trail">
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                      {active.log.map((l, n) => (
                        <div key={n} className="opsq-trail-row">
                          <div style={{ font: '400 10px/1.5 var(--mono)', color: 'var(--faint)' }}>{l[0]}</div>
                          <div>
                            <div style={{ font: '400 11px/1 var(--mono)', color: 'var(--dim)' }}>{l[1]}</div>
                            <div style={{ marginTop: 4, font: '400 12px/1.55 var(--sans)' }}>{l[2]}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </OpsBlock>
                  <OpsBlock label="Note on the record">
                    <textarea className="opsq-note" rows={2} value={note} onChange={e => setNote(e.target.value)}
                      placeholder="attached to the action where it applies…" />
                  </OpsBlock>
                </div>
                <div className="opsq-decide">
                  <div className="opsq-block-label" style={{ marginBottom: 0 }}>DECISION</div>
                  {primary && (
                    <button className="opsq-primary" disabled={busy} onClick={() => run(active, primary)}>
                      <span>{primary.label}</span>
                      <span style={{ font: '400 10px/1 var(--mono)', opacity: 0.7 }}>E</span>
                    </button>
                  )}
                  {alts.length > 0 && (
                    <div className="opsq-alts">
                      {alts.map(a => (
                        <button key={a.label} className="opsq-alt" disabled={busy} onClick={() => run(active, a)}>{a.label}</button>
                      ))}
                    </div>
                  )}
                </div>
              </React.Fragment>
            )}
          </aside>
        </div>
      );
    }

    // ========== AdminLayout ==========
    function AdminLayout({ onLogout, staffData }) {
      const initialRoute = parseHash();
      const [view, setView] = useState(initialRoute.view);
      const [editId, setEditId] = useState(initialRoute.id);
      const scrollPositions = React.useRef({});
      const pendingScroll = React.useRef(null);
      const staffRole = staffData ? staffData.role : 'warehouse';
      const [sidebarOpen, setSidebarOpen] = useState(false);

      useEffect(() => {
        const mq = window.matchMedia('(min-width: 769px)');
        const handler = (e) => { if (e.matches) setSidebarOpen(false); };
        mq.addEventListener('change', handler);
        history.replaceState({ view: initialRoute.view, id: initialRoute.id }, '');
        return () => mq.removeEventListener('change', handler);
      }, []);

      // Browser back/forward support
      useEffect(() => {
        const onPopState = () => {
          const route = parseHash();
          setView(route.view);
          setEditId(route.id);
          window.scrollTo(0, 0);
          setSidebarOpen(false);
        };
        window.addEventListener('popstate', onPopState);
        return () => window.removeEventListener('popstate', onPopState);
      }, []);

      const navigate = (v, id) => {
        scrollPositions.current[view] = window.scrollY;
        setSidebarOpen(false);
        setView(v);
        setEditId(id || null);
        const hash = buildHash(v, id);
        if (window.location.hash !== (hash || '#')) {
          history.pushState({ view: v, id: id || null }, '', hash || window.location.pathname);
        }
        if (scrollPositions.current[v] != null) {
          pendingScroll.current = scrollPositions.current[v];
        } else {
          window.scrollTo(0, 0);
        }
      };

      const consumePendingScroll = () => {
        if (pendingScroll.current != null) {
          const y = pendingScroll.current;
          pendingScroll.current = null;
          requestAnimationFrame(() => window.scrollTo(0, y));
        }
      };

      // ---- Ops worklist (queue home) ----
      const wlAllowed = ['admin', 'manager', 'sales_rep'].includes(staffRole);
      const [wl, setWl] = useState([]);
      const [wlLoaded, setWlLoaded] = useState(false);
      const [wlSync, setWlSync] = useState(null);
      const [wlStream, setWlStream] = useState('all');
      const [wlSel, setWlSel] = useState(null);
      const [wlToast, setWlToast] = useState(null);
      const [palette, setPalette] = useState(false);
      const toastTimer = React.useRef(null);

      const showToast = (t) => {
        setWlToast(t);
        if (toastTimer.current) clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(() => setWlToast(null), 4200);
      };

      const loadWorklist = useCallback(() => {
        if (!wlAllowed) { setWlLoaded(true); return; }
        adminFetch('/api/admin/worklist')
          .then(d => { setWl(d.items || []); setWlSync(new Date()); setWlLoaded(true); })
          .catch(() => setWlLoaded(true));
      }, [wlAllowed]);

      useEffect(() => {
        loadWorklist();
        const t = setInterval(loadWorklist, 90000);
        return () => clearInterval(t);
      }, [loadWorklist]);

      useEffect(() => {
        const onKey = (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setPalette(p => !p); }
          if (e.key === 'Escape') setPalette(false);
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const resolveWorkItem = (item, action, note) => {
        if (action.nav) { navigate(action.nav.view, action.nav.id); return; }
        if (action.requiresNote && !(note || '').trim()) {
          showToast({ err: true, msg: `"${action.label}" needs a note — it goes on the record.` });
          return;
        }
        const body = { ...(action.body || {}) };
        if (action.noteField && (note || '').trim()) body[action.noteField] = note.trim();
        return adminFetch(action.path, { method: action.method, body: JSON.stringify(body) })
          .then(() => {
            setWl(prev => prev.filter(i => i.id !== item.id));
            showToast({ msg: `${action.label} — ${item.entity}`, sub: 'item closed' });
          })
          .catch(err => showToast({ err: true, msg: err.message }));
      };

      const breaches = wl.filter(i => i.sla === 'breach').length;

      const allNavItems = [
        { key: 'dashboard', label: 'Dashboard', icon: 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0h4', roles: ['admin', 'manager', 'sales_rep', 'warehouse'] },
        { key: 'orders', label: 'Orders', icon: 'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01', roles: ['admin', 'manager', 'sales_rep', 'warehouse'] },
        { key: 'quotes', label: 'Quotes', icon: 'M8 7h8m-8 4h6m-6 4h4m-7 6l3-3h9a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v16z', roles: ['admin', 'manager', 'sales_rep'] },
        { key: 'purchase-orders', label: 'Purchase Orders', icon: 'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z', roles: ['admin', 'manager', 'warehouse'] },
        { key: 'customers', label: 'Customers', icon: 'M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z', roles: ['admin', 'manager', 'sales_rep'] },
        { key: 'products', label: 'Products', icon: 'M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4', roles: ['admin', 'manager'] },
        { key: 'vendors', label: 'Vendors', icon: 'M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4', roles: ['admin', 'manager'] },
        { key: 'trade', label: 'Trade', icon: 'M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z', roles: ['admin', 'manager', 'sales_rep'] },
        { key: 'promos', label: 'Promo Codes', icon: 'M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A2 2 0 013 12V7a4 4 0 014-4zM17 3h2a2 2 0 012 2v2', roles: ['admin', 'manager'] },
        { key: 'staff', label: 'Staff', icon: 'M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z', roles: ['admin', 'manager'] },
        { key: 'audit', label: 'Audit Log', icon: 'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4', roles: ['admin', 'manager'] },
      ];

      const navItems = allNavItems.filter(item => item.roles.includes(staffRole));

      // Ledger list for the ops rail: everything except the queue itself,
      // plus the old chart dashboard kept reachable as "Overview".
      const ledgers = [
        { key: 'overview', label: 'Overview', roles: ['admin', 'manager'] },
        ...allNavItems.filter(i => i.key !== 'dashboard'),
      ].filter(i => i.roles.includes(staffRole));

      const activeBase = view === 'overview' ? 'overview' :
                          view === 'purchase-orders' || view === 'purchase-order-detail' ? 'purchase-orders' :
                          view.split('-')[0] === 'product' ? 'products' :
                          view.split('-')[0] === 'vendor' ? 'vendors' :
                          view.split('-')[0] === 'customer' ? 'customers' :
                          view.split('-')[0] === 'order' ? 'orders' :
                          view.split('-')[0] === 'quote' ? 'quotes' :
                          view.split('-')[0] === 'promo' || view === 'promos' ? 'promos' :
                          view.split('-')[0] === 'trade' ? 'trade' :
                          view.split('-')[0] === 'staff' ? 'staff' :
                          view === 'audit' ? 'audit' : view;

      return (
        <div className="ops-shell">
          <OpsBar staffData={staffData} breaches={breaches} onLogout={onLogout}
            onPalette={() => setPalette(true)} onHamburger={() => setSidebarOpen(true)} />
          <div className="ops-main">
            <div className={'sidebar-backdrop' + (sidebarOpen ? ' visible' : '')} onClick={() => setSidebarOpen(false)}></div>
            <OpsRail open={sidebarOpen} onClose={() => setSidebarOpen(false)}
              items={wl} wlAllowed={wlAllowed} stream={wlStream} setStream={setWlStream}
              view={view} activeBase={activeBase} ledgers={ledgers} navigate={navigate} />
            {view === 'dashboard' ? (
              <OpsQueueView items={wl} loaded={wlLoaded} stream={wlStream}
                sel={wlSel} setSel={setWlSel} onResolve={resolveWorkItem} paletteOpen={palette} />
            ) : view === 'orders' ? (
              <OrdersListView navigate={navigate} />
            ) : view === 'order-detail' ? (
              <OrderDetailView navigate={navigate} editId={editId} staffRole={staffRole} />
            ) : view === 'quotes' ? (
              <QuotesListView navigate={navigate} />
            ) : view === 'quote-detail' ? (
              <QuoteDetailView navigate={navigate} editId={editId} staffRole={staffRole} />
            ) : (
          <div className="admin-content">
            {view === 'overview' && <DashboardView navigate={navigate} />}
            {view === 'customers' && <CustomersListView navigate={navigate} />}
            {view === 'customer-detail' && <CustomerDetailView navigate={navigate} editId={editId} staffRole={staffRole} />}
            {view === 'products' && <ProductsListView navigate={navigate} onReady={consumePendingScroll} />}
            {view === 'product-create' && <ProductFormView navigate={navigate} />}

            {view === 'vendors' && <VendorsListView navigate={navigate} />}

            {view === 'vendor-edit' && <VendorFormView navigate={navigate} editId={editId} />}

            {view === 'staff' && <StaffListView navigate={navigate} />}
            {view === 'staff-create' && <StaffFormView navigate={navigate} />}
            {view === 'staff-edit' && <StaffFormView navigate={navigate} editId={editId} />}
            {view === 'promos' && <PromoCodesListView navigate={navigate} />}
            {view === 'promo-create' && <PromoCodeFormView navigate={navigate} />}
            {view === 'promo-edit' && <PromoCodeFormView navigate={navigate} editId={editId} />}
            {view === 'audit' && <AuditLogView navigate={navigate} />}

            {view === 'purchase-order-detail' && <PurchaseOrderDetailView navigate={navigate} editId={editId} staffRole={staffRole} />}

          </div>
          <OpsStatusBar items={wl} loaded={wlLoaded} syncedAt={wlSync} />
          <OpsToast toast={wlToast} />
          {palette && <OpsPalette items={wl} ledgers={ledgers}
            onPickItem={(id) => { setWlSel(id); setWlStream('all'); setPalette(false); navigate('dashboard'); }}
            onPickLedger={(key) => { setPalette(false); navigate(key); }}
            onClose={() => setPalette(false)} />}
        </div>
      );

    // ========== DashboardView ==========
    function DashboardView({ navigate }) {
      const [stats, setStats] = useState(null);
      const [period, setPeriod] = useState('30d');
      const [analytics, setAnalytics] = useState(null);
      const [analyticsLoading, setAnalyticsLoading] = useState(true);
      const revenueChartRef = React.useRef(null);
      const revenueChartInstance = React.useRef(null);
      const statusChartRef = React.useRef(null);
      const statusChartInstance = React.useRef(null);

      useEffect(() => {
        adminFetch('/api/admin/stats').then(setStats).catch(() => {});
      }, []);

      useEffect(() => {
        setAnalyticsLoading(true);
        adminFetch(`/api/admin/analytics?period=${period}`)
          .then(data => { setAnalytics(data); setAnalyticsLoading(false); })
          .catch(() => setAnalyticsLoading(false));
      }, [period]);

      // Revenue line chart — use setTimeout to ensure canvas is mounted after React render
      useEffect(() => {
        if (!analytics) return;
        const data = analytics.revenue_over_time || [];
        if (data.length === 0) {
          if (revenueChartInstance.current) { revenueChartInstance.current.destroy(); revenueChartInstance.current = null; }
          return;
        }
        const timer = setTimeout(() => {
          if (!revenueChartRef.current) return;
          if (revenueChartInstance.current) revenueChartInstance.current.destroy();
          const ctx = revenueChartRef.current.getContext('2d');
          revenueChartInstance.current = new Chart(ctx, {
            type: 'line',
            data: {
              labels: data.map(d => d.date),
              datasets: [{
                label: 'Revenue',
                data: data.map(d => d.revenue),
                borderColor: '#d1a35c',
                backgroundColor: 'rgba(209,163,92,0.10)',
                fill: true,
                tension: 0.3,
                pointRadius: data.length > 60 ? 0 : 3,
                pointBackgroundColor: '#d1a35c'
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { display: false },
                tooltip: {
                  callbacks: {
                    label: function(ctx) {
                      const idx = ctx.dataIndex;
                      const rev = '$' + ctx.parsed.y.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                      const orders = data[idx] ? data[idx].order_count : 0;
                      return [rev, orders + ' order' + (orders !== 1 ? 's' : '')];
                    }
                  }
                }
              },
              scales: {
                y: {
                  beginAtZero: true,
                  ticks: { callback: v => '$' + v.toLocaleString() }
                }
              }
            }
          });
        }, 50);
        return () => { clearTimeout(timer); if (revenueChartInstance.current) revenueChartInstance.current.destroy(); };
      }, [analytics]);

      // Order status donut chart
      useEffect(() => {
        if (!analytics) return;
        const data = analytics.order_status || [];
        if (data.length === 0) {
          if (statusChartInstance.current) { statusChartInstance.current.destroy(); statusChartInstance.current = null; }
          return;
        }
        const timer = setTimeout(() => {
          if (!statusChartRef.current) return;
          if (statusChartInstance.current) statusChartInstance.current.destroy();
          const ctx = statusChartRef.current.getContext('2d');
          const colorMap = {
            pending: '#726f6a', confirmed: '#d1a35c', shipped: '#7cc294',
            delivered: '#7cc294', cancelled: '#e07a63', draft: 'rgba(236,233,227,0.20)'
          };
          statusChartInstance.current = new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels: data.map(d => d.status),
              datasets: [{
                data: data.map(d => d.count),
                backgroundColor: data.map(d => colorMap[d.status] || '#a4a09a'),
                borderWidth: 2,
                borderColor: '#191a1d'
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { position: 'bottom', labels: { boxWidth: 12, padding: 16, font: { size: 11 } } }
              }
            }
          });
        }, 50);
        return () => { clearTimeout(timer); if (statusChartInstance.current) statusChartInstance.current.destroy(); };
      }, [analytics]);

      if (!stats) return <div className="loading">Loading dashboard...</div>;

      const fmtMoney = v => '$' + Number(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

      const periods = [
        { key: '30d', label: '30 Days' },
        { key: '90d', label: '90 Days' },
        { key: '12m', label: '12 Months' },
        { key: 'all', label: 'All Time' }
      ];

      return (
        <div>
          <div className="content-header">
            <h1>Dashboard</h1>
          </div>

          {/* Period selector */}
          <div className="analytics-period-bar">
            {periods.map(p => (
              <button key={p.key} className={'period-btn' + (period === p.key ? ' active' : '')} onClick={() => setPeriod(p.key)}>{p.label}</button>
            ))}
          </div>

          {/* Analytics summary cards */}
          {analyticsLoading ? (
            <div className="stat-grid"><div className="stat-card"><div className="stat-card-label">Loading analytics...</div></div></div>
          ) : analytics ? (
            <React.Fragment>
              <div className="analytics-grid">
                <div className="stat-card">
                  <div className="stat-card-label">Revenue</div>
                  <div className="stat-card-value">{fmtMoney(analytics.summary.revenue)}</div>
                </div>
                <div className="stat-card">
                  <div className="stat-card-label">Orders</div>
                  <div className="stat-card-value">{analytics.summary.orders}</div>
                </div>
                <div className="stat-card">
                  <div className="stat-card-label">Avg Order Value</div>
                  <div className="stat-card-value">{fmtMoney(analytics.summary.avg_order_value)}</div>
                </div>
                <div className="stat-card">
                  <div className="stat-card-label">Margin</div>
                  <div className="stat-card-value">{analytics.summary.margin_pct}%</div>
                </div>
                {analytics.outstanding_ar && (
                  <div className="stat-card">
                    <div className="stat-card-label">Outstanding AR
                      {analytics.outstanding_ar.overdue_count > 0 && (
                        <span style={{ marginLeft: '0.5rem', background: '#e07a63', color: '#fff', fontSize: '0.625rem', padding: '0.1rem 0.4rem', borderRadius: '9px', fontWeight: 600 }}>
                          {analytics.outstanding_ar.overdue_count} overdue
                        </span>
                      )}
                    </div>
                    <div className="stat-card-value">{fmtMoney(analytics.outstanding_ar.balance)}</div>
                  </div>
                )}
                {analytics.pending_commissions && (
                  <div className="stat-card">
                    <div className="stat-card-label">Pending Commissions</div>
                    <div className="stat-card-value">{fmtMoney(analytics.pending_commissions.total)}</div>
                    <div style={{ fontSize: '0.7rem', color: 'var(--stone-400)', marginTop: '0.25rem' }}>{analytics.pending_commissions.count} unpaid</div>
                  </div>
                )}
              </div>

              {/* Revenue over time chart */}
              <div className="chart-container">
                <h3>Revenue Over Time</h3>
                {(analytics.revenue_over_time || []).length === 0 && (
                  <div style={{ textAlign: 'center', color: 'var(--stone-400)', padding: '3rem' }}>No data for this period</div>
                )}
                <div style={{ height: '300px', display: (analytics.revenue_over_time || []).length > 0 ? 'block' : 'none' }}>
                  <canvas ref={revenueChartRef}></canvas>
                </div>
              </div>

              {/* Two column: Top Products + Order Status */}
              <div className="analytics-two-col">
                <div className="chart-container" style={{ marginBottom: 0 }}>
                  <h3>Top Products</h3>
                  {(analytics.top_products || []).length === 0 ? (
                    <div style={{ textAlign: 'center', color: 'var(--stone-400)', padding: '2rem' }}>No data for this period</div>
                  ) : (
                    <div className="table-scroll-wrapper">
                    <table className="admin-table">
                      <thead>
                        <tr>
                          <th>#</th>
                          <th>Product</th>
                          <th>Revenue</th>
                          <th>Units</th>
                        </tr>
                      </thead>
                      <tbody>
                        {analytics.top_products.map((p, i) => (
                          <tr key={p.product_id || i}>
                            <td>{i + 1}</td>
                            <td>{p.name || 'Unknown'}</td>
                            <td>{fmtMoney(p.revenue)}</td>
                            <td>{p.units_sold}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                    </div>
                  )}
                </div>
                <div className="chart-container" style={{ marginBottom: 0 }}>
                  <h3>Order Status</h3>
                  {(analytics.order_status || []).length === 0 && (
                    <div style={{ textAlign: 'center', color: 'var(--stone-400)', padding: '2rem' }}>No data for this period</div>
                  )}
                  <div style={{ height: '280px', display: (analytics.order_status || []).length > 0 ? 'block' : 'none' }}>
                    <canvas ref={statusChartRef}></canvas>
                  </div>
                </div>
              </div>

              {/* Vendor performance table */}
              {(analytics.vendor_performance || []).length > 0 && (
                <div className="chart-container">
                  <h3>Vendor Performance</h3>
                  <div className="table-scroll-wrapper">
                  <table className="admin-table">
                    <thead>
                      <tr>
                        <th>Vendor</th>
                        <th>Revenue</th>
                        <th>Cost</th>
                        <th>Margin %</th>
                        <th>Margin</th>
                      </tr>
                    </thead>
                    <tbody>
                      {analytics.vendor_performance.map(v => (
                        <tr key={v.vendor_id}>
                          <td>{v.name}</td>
                          <td>{fmtMoney(v.revenue)}</td>
                          <td>{fmtMoney(v.cost)}</td>
                          <td>{v.margin_pct}%</td>
                          <td>
                            <span className="vendor-margin-bar">
                              <span className="vendor-margin-bar-fill" style={{ width: Math.min(v.margin_pct, 100) + '%' }}></span>
                            </span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                  </div>
                </div>
              )}
            </React.Fragment>
          ) : (
            <div style={{ textAlign: 'center', color: 'var(--stone-400)', padding: '3rem' }}>Failed to load analytics</div>
          )}

          {/* Existing inventory count cards */}
          <div className="stat-grid" style={{ marginTop: '1rem' }}>
            {[
              { label: 'Orders', value: stats.counts.orders },
              { label: 'Products', value: stats.counts.products },
              { label: 'Vendors', value: stats.counts.vendors },
              { label: 'Categories', value: stats.counts.categories },
              { label: 'SKUs', value: stats.counts.skus },
            ].map(c => (
              <div key={c.label} className="stat-card">
                <div className="stat-card-label">{c.label}</div>
                <div className="stat-card-value">{c.value}</div>
              </div>
            ))}
          </div>

          {/* Recent Orders */}
          <div className="form-card">
            <h3>Recent Orders</h3>
            <div className="table-scroll-wrapper">
            <table className="admin-table">
              <thead>
                <tr>
                  <th>Order #</th>
                  <th>Customer</th>
                  <th>Total</th>
                  <th>Status</th>
                  <th>Date</th>
                </tr>
              </thead>
              <tbody>
                {(stats.recent_orders || []).map(o => (
                  <tr key={o.id}>
                    <td><a style={{ cursor: 'pointer', color: 'var(--stone-800)', textDecoration: 'underline' }} onClick={() => navigate('order-detail', o.id)}>{o.order_number}</a></td>
                    <td>{o.customer_name}</td>
                    <td>${parseFloat(o.total || 0).toFixed(2)}</td>
                    <td><span className={'badge badge-' + o.status}>{o.status}</span></td>
                    <td style={{ fontSize: '0.8125rem', color: 'var(--stone-500)' }}>{new Date(o.created_at).toLocaleDateString()}</td>
                  </tr>
                ))}
                {(stats.recent_orders || []).length === 0 && (
                  <tr><td colSpan="5" style={{ textAlign: 'center', color: 'var(--stone-400)', padding: '2rem' }}>No orders yet</td></tr>
                )}
              </tbody>
            </table>
            </div>
          </div>

          {/* Recent Products */}
          <div className="form-card">
            <h3>Recent Products</h3>
            <div className="table-scroll-wrapper">
            <table className="admin-table">
              <thead>
                <tr>
                  <th>Vendor</th>
                  <th>Name</th>
                  <th>Status</th>
                  <th>Created</th>
                </tr>
              </thead>
              <tbody>
                {(stats.recent_products || []).map(p => (
                  <tr key={p.id}>
                    <td>{p.vendor_name || '—'}</td>
                    <td><a style={{ cursor: 'pointer', color: 'var(--stone-800)', textDecoration: 'underline' }} onClick={() => navigate('product-edit', p.id)}>{p.name}</a></td>
                    <td><span className={'badge badge-' + (p.status || 'draft')}>{p.status || 'draft'}</span></td>
                    <td style={{ fontSize: '0.8125rem', color: 'var(--stone-500)' }}>{new Date(p.created_at).toLocaleDateString()}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            </div>
          </div>
        </div>
      );
    }

    // ========== ProductsListView ==========
    const PAGE_SIZE = 50;

    function ProductsListView({ navigate, onReady }) {
      const [products, setProducts] = useState([]);
      const [total, setTotal] = useState(0);
      const [loading, setLoading] = useState(true);
      const [loadingMore, setLoadingMore] = useState(false);
      const [deleteTarget, setDeleteTarget] = useState(null);
      const [selected, setSelected] = useState(new Set());
      const [categories, setCategories] = useState([]);
      const [bulkCategory, setBulkCategory] = useState('');
      const [searchTerm, setSearchTerm] = useState('');
      const [filterVendor, setFilterVendor] = useState('');
      const [filterCategory, setFilterCategory] = useState('');
      const [filterStatus, setFilterStatus] = useState('');
      const [filterQuality, setFilterQuality] = useState('');
      const [filterMissing, setFilterMissing] = useState('');
      const [vendors, setVendors] = useState([]);
      const [sortCol, setSortCol] = useState('vendor');
      const [sortDir, setSortDir] = useState('asc');

      const clearSelection = () => { setSelected(new Set()); setBulkCategory(''); };

      // Open a showroom-label PDF (one 2"x4" Avery 5163 label per color) in a new tab.
      const printLabels = (productIds) => {
        const ids = (Array.isArray(productIds) ? productIds : [productIds]).filter(Boolean);
        if (!ids.length) return;
        staffOpenDoc('/api/admin/labels?productIds=' + ids.join(','), true)
          .catch(err => alert(err.message || 'Failed to generate labels'));
      };

      const searchTimerRef = useRef(null);

      const buildQuery = (offset = 0) => {
        const params = new URLSearchParams();
        params.set('limit', PAGE_SIZE);
        params.set('offset', offset);
        if (searchTerm) params.set('search', searchTerm);
        if (filterVendor) params.set('vendor_id', filterVendor);
        if (filterCategory) params.set('category_id', filterCategory);
        if (filterStatus) params.set('status', filterStatus);
        if (filterQuality) params.set('quality', filterQuality);
        if (filterMissing) params.set('missing', filterMissing);
        params.set('sort', sortCol);
        params.set('sort_dir', sortDir);
        return params.toString();
      };

      const loadFresh = () => {
        setLoading(true);
        clearSelection();
        adminFetch(`/api/admin/products?${buildQuery(0)}`)
          .then(data => {
            setProducts(data.products || []);
            setTotal(data.total || 0);
            setLoading(false);
            if (onReady) requestAnimationFrame(onReady);
          })
          .catch(() => setLoading(false));
      };

      const loadMore = () => {
        setLoadingMore(true);
        adminFetch(`/api/admin/products?${buildQuery(products.length)}`)
          .then(data => {
            setProducts(prev => [...prev, ...(data.products || [])]);
            setTotal(data.total || 0);
            setLoadingMore(false);
          })
          .catch(() => setLoadingMore(false));
      };

      useEffect(() => {
        loadFresh();
        adminFetch('/api/admin/categories').then(d => setCategories(d.flat || [])).catch(() => {});
        adminFetch('/api/admin/vendors').then(d => setVendors(d.vendors || [])).catch(() => {});
      }, []);

      // Reload when filters or sort change
      useEffect(() => {
        if (loading) return; // skip initial mount
        loadFresh();
      }, [filterVendor, filterCategory, filterStatus, filterQuality, filterMissing, sortCol, sortDir]);

      // Debounced search
      useEffect(() => {
        if (loading) return;
        if (searchTimerRef.current) clearTimeout(searchTimerRef.current);
        searchTimerRef.current = setTimeout(() => loadFresh(), 300);
        return () => clearTimeout(searchTimerRef.current);
      }, [searchTerm]);

      const handleDelete = () => {
        if (!deleteTarget) return;
        adminFetch('/api/admin/products/' + deleteTarget.id, { method: 'DELETE' })
          .then(() => { setDeleteTarget(null); loadFresh(); })
          .catch(() => {});
      };

      const toggleSelect = (id) => {
        setSelected(prev => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id); else next.add(id);
          return next;
        });
      };

      const toggleSort = (col) => {
        if (sortCol === col) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
        else { setSortCol(col); setSortDir('asc'); }
      };

      const SortHeader = ({ col, children }) => (
        <th className={'sortable' + (sortCol === col ? ' sorted' : '')} onClick={() => toggleSort(col)}>
          {children}<span className="sort-arrow">{sortCol === col ? (sortDir === 'asc' ? ' \u25B2' : ' \u25BC') : ' \u25B2'}</span>
        </th>
      );

      const allSelected = selected.size === products.length && products.length > 0;
      const toggleAll = () => {
        if (allSelected) setSelected(new Set());
        else setSelected(new Set(products.map(p => p.id)));
      };

      const bulkSetStatus = (status) => {
        const ids = Array.from(selected);
        adminFetch('/api/admin/products/bulk/status', {
          method: 'PATCH',
          body: JSON.stringify({ ids, status })
        }).then(() => loadFresh()).catch(() => {});
      };

      const bulkSetCategory = () => {
        const ids = Array.from(selected);
        adminFetch('/api/admin/products/bulk/category', {
          method: 'PATCH',
          body: JSON.stringify({ ids, category_id: bulkCategory || null })
        }).then(() => loadFresh()).catch(() => {});
      };

      const bulkDelete = () => {
        const ids = Array.from(selected);
        if (!window.confirm(`Delete ${ids.length} product(s)? This will also delete all associated SKUs, packaging, and pricing data.`)) return;
        adminFetch('/api/admin/products/bulk', {
          method: 'DELETE',
          body: JSON.stringify({ ids })
        }).then(() => loadFresh()).catch(() => {});
      };

      // Bulk tag management
      const [bulkTagModalOpen, setBulkTagModalOpen] = useState(false);
      const [bulkAllTags, setBulkAllTags] = useState([]);
      const [bulkTagGrouped, setBulkTagGrouped] = useState({});
      const [bulkAddTagIds, setBulkAddTagIds] = useState([]);
      const [bulkRemoveTagIds, setBulkRemoveTagIds] = useState([]);
      const [bulkTagSaving, setBulkTagSaving] = useState(false);

      const openBulkTagModal = () => {
        setBulkAddTagIds([]);
        setBulkRemoveTagIds([]);
        if (bulkAllTags.length === 0) {
          adminFetch('/api/admin/tags').then(d => { setBulkAllTags(d.tags || []); setBulkTagGrouped(d.grouped || {}); }).catch(() => {});
        }
        setBulkTagModalOpen(true);
      };

      const toggleBulkAddTag = (tagId) => {
        setBulkRemoveTagIds(prev => prev.filter(id => id !== tagId));
        setBulkAddTagIds(prev => prev.includes(tagId) ? prev.filter(id => id !== tagId) : [...prev, tagId]);
      };

      const toggleBulkRemoveTag = (tagId) => {
        setBulkAddTagIds(prev => prev.filter(id => id !== tagId));
        setBulkRemoveTagIds(prev => prev.includes(tagId) ? prev.filter(id => id !== tagId) : [...prev, tagId]);
      };

      const applyBulkTags = () => {
        if (bulkAddTagIds.length === 0 && bulkRemoveTagIds.length === 0) return;
        setBulkTagSaving(true);
        adminFetch('/api/admin/products/bulk/tags', {
          method: 'PATCH',
          body: JSON.stringify({ product_ids: Array.from(selected), add_tag_ids: bulkAddTagIds, remove_tag_ids: bulkRemoveTagIds })
        }).then(() => { setBulkTagModalOpen(false); setBulkTagSaving(false); })
          .catch(() => setBulkTagSaving(false));
      };

      const hasMore = products.length < total;

      if (loading) return <div className="loading">Loading products...</div>;

      return (
        <div>
          <div className="content-header">
            <h1>Products</h1>
            <div style={{ display: 'flex', gap: '0.5rem' }}>
              <button className="btn btn-secondary" onClick={() => navigate('bulk-import')}>Import</button>
              <button className="btn btn-primary" onClick={() => navigate('product-create')}>+ Add Product</button>
            </div>
          </div>

          <div className="filter-bar">
            <input type="text" placeholder="Search products..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
            <select value={filterVendor} onChange={e => setFilterVendor(e.target.value)}>
              <option value="">All Vendors</option>
              {vendors.filter(v => v.active_product_count > 0).map(v => <option key={v.id} value={v.id}>{v.name}</option>)}
            </select>
            <select value={filterCategory} onChange={e => setFilterCategory(e.target.value)}>
              <option value="">All Categories</option>
              {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
            <select value={filterStatus} onChange={e => setFilterStatus(e.target.value)}>
              <option value="">All Statuses</option>
              <option value="active">Active</option>
              <option value="draft">Draft</option>
              <option value="discontinued">Discontinued</option>
            </select>
            <select value={filterQuality} onChange={e => setFilterQuality(e.target.value)}>
              <option value="">All Quality</option>
              <option value="good">Good (80+)</option>
              <option value="fair">Fair (50-79)</option>
              <option value="poor">Poor (&lt;50)</option>
            </select>
            <select value={filterMissing} onChange={e => setFilterMissing(e.target.value)}>
              <option value="">All Data</option>
              <option value="no_image">Missing Image</option>
              <option value="no_price">Missing Price</option>
              <option value="no_color">Missing Color</option>
              <option value="no_category">Missing Category</option>
              <option value="no_description">Missing Description</option>
            </select>
            <span className="filter-count">Showing {products.length} of {total} products</span>
          </div>

          {selected.size > 0 && (
            <div className="bulk-toolbar">
              <span className="bulk-count">{selected.size} selected</span>
              <button className="btn btn-secondary btn-sm" onClick={() => bulkSetStatus('active')}>Set Active</button>
              <button className="btn btn-secondary btn-sm" onClick={() => bulkSetStatus('draft')}>Set Draft</button>
              <button className="btn btn-secondary btn-sm" style={{ color: 'var(--red)' }} onClick={() => bulkSetStatus('discontinued')}>Set Discontinued</button>
              <select value={bulkCategory} onChange={e => setBulkCategory(e.target.value)}>
                <option value="">— Choose Category —</option>
                {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
              <button className="btn btn-secondary btn-sm" onClick={bulkSetCategory}>Apply</button>
              <button className="btn btn-secondary btn-sm" onClick={openBulkTagModal}>Tags</button>
              <button className="btn btn-secondary btn-sm" onClick={() => printLabels(Array.from(selected))}>Print Labels</button>
              <button className="btn btn-danger btn-sm" onClick={bulkDelete}>Delete</button>
            </div>
          )}

          {/* Bulk Tag Modal */}
          {bulkTagModalOpen && (
            <div className="modal-overlay" onClick={() => setBulkTagModalOpen(false)}>
              <div className="modal" style={{ maxWidth: '540px' }} onClick={e => e.stopPropagation()}>
                <div className="modal-header">
                  <h2>Manage Tags ({selected.size} products)</h2>
                  <button className="modal-close" onClick={() => setBulkTagModalOpen(false)}>&times;</button>
                </div>
                <div className="modal-body" style={{ maxHeight: '60vh', overflowY: 'auto' }}>
                  <p style={{ fontSize: '0.8125rem', color: 'var(--stone-500)', marginBottom: '1rem' }}>
                    Click once to <strong>add</strong> (green). Click again to <strong>remove</strong> (red). Click again to reset.
                  </p>
                  {Object.entries(bulkTagGrouped).map(([cat, tags]) => (
                    <div key={cat} style={{ marginBottom: '1rem' }}>
                      <div style={{ fontSize: '0.75rem', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.05em', color: 'var(--stone-500)', marginBottom: '0.5rem' }}>
                        {cat.charAt(0).toUpperCase() + cat.slice(1)}
                      </div>
                      <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.375rem' }}>
                        {tags.map(tag => {
                          const isAdd = bulkAddTagIds.includes(tag.id);
                          const isRemove = bulkRemoveTagIds.includes(tag.id);
                          return (
                            <button key={tag.id}
                              onClick={() => {
                                if (isAdd) { setBulkAddTagIds(p => p.filter(i => i !== tag.id)); setBulkRemoveTagIds(p => [...p, tag.id]); }
                                else if (isRemove) { setBulkRemoveTagIds(p => p.filter(i => i !== tag.id)); }
                                else { toggleBulkAddTag(tag.id); }
                              }}
                              style={{
                                padding: '0.375rem 0.75rem',
                                border: '1px solid ' + (isAdd ? '#7cc294' : isRemove ? '#e07a63' : 'var(--stone-200)'),
                                background: isAdd ? 'rgba(96,160,120,0.16)' : isRemove ? 'rgba(197,71,49,0.12)' : 'white',
                                color: isAdd ? '#7cc294' : isRemove ? '#e07a63' : 'var(--stone-600)',
                                fontSize: '0.75rem', cursor: 'pointer', borderRadius: '100px', fontFamily: 'var(--font-body)', transition: 'all 0.15s'
                              }}>
                              {isAdd ? '+ ' : isRemove ? '- ' : ''}{tag.name}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>
                <div className="modal-footer" style={{ display: 'flex', justifyContent: 'flex-end', gap: '0.75rem', padding: '1rem 1.5rem', borderTop: '1px solid var(--stone-200)' }}>
                  <button className="btn btn-secondary" onClick={() => setBulkTagModalOpen(false)}>Cancel</button>
                  <button className="btn btn-primary" onClick={applyBulkTags} disabled={bulkTagSaving || (bulkAddTagIds.length === 0 && bulkRemoveTagIds.length === 0)}>
                    {bulkTagSaving ? 'Applying...' : `Apply (${bulkAddTagIds.length} add, ${bulkRemoveTagIds.length} remove)`}
                  </button>
                </div>
              </div>
            </div>
          )}

          <div className="table-scroll-wrapper">
          <table className="admin-table">
            <thead>
              <tr>
                <th style={{ width: '40px' }}><input type="checkbox" checked={allSelected} onChange={toggleAll} /></th>
                <SortHeader col="vendor">Vendor</SortHeader>
                <th>Brand</th>
                <SortHeader col="name">Name</SortHeader>
                <SortHeader col="category">Category</SortHeader>
                <SortHeader col="price">Price</SortHeader>
                <SortHeader col="skus">SKUs</SortHeader>
                <SortHeader col="quality">Quality</SortHeader>
                <SortHeader col="status">Status</SortHeader>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              {products.map(p => {
                const qs = p.quality_score;
                const qClass = qs >= 80 ? 'quality-good' : qs >= 50 ? 'quality-fair' : qs != null ? 'quality-poor' : 'quality-na';
                const flags = p.quality_flags || {};
                const missingItems = [];
                if (flags.has_image === 0) missingItems.push('No image');
                if (flags.has_retail === 0) missingItems.push('No price');
                if (flags.has_cost === 0) missingItems.push('No cost');
                if (flags.has_color === 0) missingItems.push('No color');
                if (flags.has_description === 0) missingItems.push('No desc');
                if (!p.category_name) missingItems.push('No category');
                return (
                <tr key={p.id}>
                  <td><input type="checkbox" checked={selected.has(p.id)} onChange={() => toggleSelect(p.id)} /></td>
                  <td>{p.vendor_name || '—'}</td>
                  <td style={{ fontSize: '0.8125rem' }}>{p.brand_name || '—'}</td>
                  <td style={{ fontWeight: 500, display: 'flex', alignItems: 'center', gap: '0.625rem' }}>
                    {p.primary_image ? (
                      <img src={optimizeImg(p.primary_image, 100)} alt="" style={{ width: '36px', height: '36px', objectFit: 'cover', borderRadius: '4px', flexShrink: 0 }} loading="lazy" />
                    ) : (
                      <span style={{ width: '36px', height: '36px', borderRadius: '4px', background: 'var(--stone-100)', display: 'inline-block', flexShrink: 0 }} />
                    )}
                    {p.name}
                  </td>
                  <td>{p.category_name || '—'}</td>
                  <td>{p.price ? '$' + parseFloat(p.price).toFixed(2) : '—'}</td>
                  <td>{p.sku_count}</td>
                  <td>
                    <span className={'quality-badge ' + qClass}>{qs != null ? qs : '—'}</span>
                    {missingItems.length > 0 && (
                      <div className="missing-flags">
                        {missingItems.map(m => <span key={m} className="missing-flag">{m}</span>)}
                      </div>
                    )}
                  </td>
                  <td><span className={'badge badge-' + (p.status || 'draft')}>{p.status || 'draft'}</span></td>
                  <td className="actions">
                    <button className="btn btn-secondary btn-sm" onClick={() => navigate('product-edit', p.id)}>Edit</button>
                    <button className="btn btn-secondary btn-sm" onClick={() => printLabels(p.id)} title="Print showroom sample labels (one per color)">Labels</button>
                    <button className="btn btn-danger btn-sm" onClick={() => setDeleteTarget(p)}>Delete</button>
                  </td>
                </tr>
                );
              })}
              {products.length === 0 && (
                <tr><td colSpan="10" style={{ textAlign: 'center', color: 'var(--stone-400)', padding: '2rem' }}>No products found</td></tr>
              )}
            </tbody>
          </table>
          </div>

          {hasMore && (
            <div style={{ textAlign: 'center', padding: '1.5rem 0' }}>
              <button
                className="btn btn-secondary"
                onClick={loadMore}
                disabled={loadingMore}
                style={{ minWidth: '200px' }}
              >
                {loadingMore ? 'Loading...' : `Load More (${total - products.length} remaining)`}
              </button>
            </div>
          )}

          {deleteTarget && (
            <DeleteConfirmModal
              title="Delete Product"
              message={`Are you sure you want to delete "${deleteTarget.name}"? This will also delete all associated SKUs, packaging, and pricing data.`}
              onConfirm={handleDelete}
              onCancel={() => setDeleteTarget(null)}
            />
          )}
        </div>
      );
    }

    // ========== CollapsibleSection ==========
    function CollapsibleSection({ title, defaultOpen = true, headerRight, children }) {
      const [open, setOpen] = useState(defaultOpen);
      return (
        <div className={'form-card' + (open ? '' : ' collapsed')}>
          <div className="form-card-header" onClick={() => setOpen(o => !o)}>
            <h3>{title}</h3>
            <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
              {headerRight}
              <span className={'toggle-icon' + (open ? '' : ' collapsed')}>&#9660;</span>
            </div>
          </div>
          {open && <div className="form-card-body">{children}</div>}
        </div>
      );
    }

    // ========== ProductFormView ==========
    function ProductFormView({ navigate, editId }) {
      const [form, setForm] = useState({ name: '', collection: '', vendor_id: '', brand_id: '', category_id: '', status: 'draft', description_short: '', description_long: '', prop65_warning: false, prop65_chemicals: '' });
      const [skus, setSkus] = useState([]);
      const [media, setMedia] = useState([]);
      const [vendors, setVendors] = useState([]);
      const [brands, setBrands] = useState([]);
      const [categories, setCategories] = useState([]);
      const [loading, setLoading] = useState(!!editId);
      const [saving, setSaving] = useState(false);
      const [allTags, setAllTags] = useState([]);
      const [tagGrouped, setTagGrouped] = useState({});
      const [productTagIds, setProductTagIds] = useState([]);
      const [tagSaving, setTagSaving] = useState(false);

      useEffect(() => {
        adminFetch('/api/admin/vendors').then(d => setVendors(d.vendors || [])).catch(() => {});
        adminFetch('/api/admin/brands').then(d => setBrands(d.brands || [])).catch(() => {});
        adminFetch('/api/admin/categories').then(d => setCategories(d.flat || [])).catch(() => {});
        adminFetch('/api/admin/tags').then(d => { setAllTags(d.tags || []); setTagGrouped(d.grouped || {}); }).catch(() => {});

        if (editId) {
          adminFetch('/api/admin/products/' + editId)
            .then(data => {
              const p = data.product;
              setForm({
                name: p.name || '',
                collection: p.collection || '',
                vendor_id: p.vendor_id || '',
                brand_id: p.brand_id || '',
                category_id: p.category_id || '',
                status: p.status || 'draft',
                description_short: p.description_short || '',
                description_long: p.description_long || '',
                prop65_warning: !!p.prop65_warning,
                prop65_chemicals: p.prop65_chemicals || ''
              });
              setSkus((data.skus || []).map(s => ({ ...s, _existing: true })));
              setMedia(data.media || []);
              setLoading(false);
            })
            .catch(() => setLoading(false));
          adminFetch('/api/admin/products/' + editId + '/tags')
            .then(d => setProductTagIds(d.tag_ids || []))
            .catch(() => {});
        }
      }, [editId]);

      const toggleTag = (tagId) => {
        setProductTagIds(prev => prev.includes(tagId) ? prev.filter(id => id !== tagId) : [...prev, tagId]);
      };

      const saveTags = async () => {
        if (!editId) return;
        setTagSaving(true);
        try {
          await adminFetch('/api/admin/products/' + editId + '/tags', {
            method: 'PUT',
            body: JSON.stringify({ tag_ids: productTagIds })
          });
        } catch (e) { alert('Failed to save tags'); }
        setTagSaving(false);
      };

      const updateForm = (field, value) => setForm(prev => ({ ...prev, [field]: value }));

      const addSku = () => {
        setSkus(prev => [...prev, {
          _new: true, _key: Date.now(),
          vendor_sku: '', internal_sku: '', variant_name: '', sell_by: 'box',
          sqft_per_box: '', pieces_per_box: '', weight_per_box_lbs: '', freight_class: '70',
          boxes_per_pallet: '', sqft_per_pallet: '', weight_per_pallet_lbs: '',
          cost: '', retail_price: '', price_basis: 'per_sqft',
          cut_price: '', roll_price: '', cut_cost: '', roll_cost: '', roll_min_sqft: '', roll_width_ft: ''
        }]);
      };

      const updateSku = (index, field, value) => {
        setSkus(prev => prev.map((s, i) => i === index ? { ...s, [field]: value } : s));
      };

      const removeSku = (index) => {
        const sku = skus[index];
        if (sku._existing && sku.id) {
          adminFetch('/api/admin/skus/' + sku.id, { method: 'DELETE' }).catch(() => {});
        }
        setSkus(prev => prev.filter((_, i) => i !== index));
      };

      const handleSave = async () => {
        if (!form.name.trim()) { alert('Product name is required'); return; }
        setSaving(true);

        try {
          let productId = editId;

          if (editId) {
            const data = await adminFetch('/api/admin/products/' + editId, {
              method: 'PUT',
              body: JSON.stringify(form)
            });
            productId = data.product.id;
          } else {
            const data = await adminFetch('/api/admin/products', {
              method: 'POST',
              body: JSON.stringify(form)
            });
            productId = data.product.id;
          }

          // Save SKUs
          for (const sku of skus) {
            const skuData = {
              vendor_sku: sku.vendor_sku,
              internal_sku: sku.internal_sku,
              variant_name: sku.variant_name,
              sell_by: sku.sell_by || 'box',
              sqft_per_box: sku.sqft_per_box ? parseFloat(sku.sqft_per_box) : null,
              pieces_per_box: sku.pieces_per_box ? parseInt(sku.pieces_per_box) : null,
              weight_per_box_lbs: sku.weight_per_box_lbs ? parseFloat(sku.weight_per_box_lbs) : null,
              freight_class: sku.freight_class ? parseInt(sku.freight_class) : 70,
              boxes_per_pallet: sku.boxes_per_pallet ? parseInt(sku.boxes_per_pallet) : null,
              sqft_per_pallet: sku.sqft_per_pallet ? parseFloat(sku.sqft_per_pallet) : null,
              weight_per_pallet_lbs: sku.weight_per_pallet_lbs ? parseFloat(sku.weight_per_pallet_lbs) : null,
              cost: sku.cost ? parseFloat(sku.cost) : null,
              retail_price: sku.retail_price ? parseFloat(sku.retail_price) : null,
              price_basis: sku.price_basis || 'per_sqft',
              cut_price: sku.cut_price ? parseFloat(sku.cut_price) : null,
              roll_price: sku.roll_price ? parseFloat(sku.roll_price) : null,
              cut_cost: sku.cut_cost ? parseFloat(sku.cut_cost) : null,
              roll_cost: sku.roll_cost ? parseFloat(sku.roll_cost) : null,
              roll_min_sqft: sku.roll_min_sqft ? parseFloat(sku.roll_min_sqft) : null,
              roll_width_ft: sku.roll_width_ft ? parseFloat(sku.roll_width_ft) : null,
              roll_length_ft: sku.roll_length_ft ? parseFloat(sku.roll_length_ft) : null
            };

            if (sku._existing && sku.id) {
              await adminFetch('/api/admin/skus/' + sku.id, {
                method: 'PUT',
                body: JSON.stringify(skuData)
              });
            } else if (sku._new && sku.vendor_sku && sku.internal_sku) {
              await adminFetch('/api/admin/products/' + productId + '/skus', {
                method: 'POST',
                body: JSON.stringify(skuData)
              });
            }
          }

          navigate('products');
        } catch (err) {
          alert('Save failed: ' + err.message);
        } finally {
          setSaving(false);
        }
      };

      if (loading) return <div className="loading">Loading product...</div>;

      return (
        <div>
          <div className="content-header">
            <h1>{editId ? 'Edit Product' : 'New Product'}</h1>
            <div style={{ display: 'flex', gap: '0.75rem' }}>
              <button className="btn btn-secondary" onClick={() => navigate('products')}>Cancel</button>
              <button className="btn btn-primary" onClick={handleSave} disabled={saving}>
                {saving ? 'Saving...' : 'Save Product'}
              </button>
            </div>
          </div>

          <CollapsibleSection title="Product Details" defaultOpen={true}>
            <div className="form-grid">
              <div className="form-group">
                <label>Product Name *</label>
                <input value={form.name} onChange={e => updateForm('name', e.target.value)} placeholder="e.g. Calacatta Gold Marble" />
              </div>
              <div className="form-group">
                <label>Collection</label>
                <input value={form.collection} onChange={e => updateForm('collection', e.target.value)} placeholder="e.g. Natural Stone Collection" />
              </div>
              <div className="form-group">
                <label>Vendor</label>
                <select value={form.vendor_id} onChange={e => updateForm('vendor_id', e.target.value)}>
                  <option value="">Select vendor...</option>
                  {vendors.map(v => <option key={v.id} value={v.id}>{v.name}</option>)}
                </select>
              </div>
              <div className="form-group">
                <label>Brand</label>
                <select value={form.brand_id} onChange={e => updateForm('brand_id', e.target.value)}>
                  <option value="">Select brand...</option>
                  {brands.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
                </select>
              </div>
              <div className="form-group">
                <label>Category</label>
                <select value={form.category_id} onChange={e => updateForm('category_id', e.target.value)}>
                  <option value="">Select category...</option>
                  {categories.map(c => (
                    <option key={c.id} value={c.id}>{c.parent_id ? '  -- ' : ''}{c.name}</option>
                  ))}
                </select>
              </div>
              <div className="form-group">
                <label>Status</label>
                <select value={form.status} onChange={e => updateForm('status', e.target.value)}>
                  <option value="draft">Draft</option>
                  <option value="active">Active</option>
                  <option value="discontinued">Discontinued</option>
                </select>
              </div>
              <div className="form-group full">
                <label>Short Description</label>
                <input value={form.description_short} onChange={e => updateForm('description_short', e.target.value)} placeholder="Brief product description" />
              </div>
              <div className="form-group full">
                <label>Long Description</label>
                <textarea value={form.description_long} onChange={e => updateForm('description_long', e.target.value)} placeholder="Detailed product description" />
              </div>
              <div className="form-group">
                <label style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', cursor: 'pointer' }}>
                  <input type="checkbox" checked={form.prop65_warning} onChange={e => updateForm('prop65_warning', e.target.checked)} style={{ width: 'auto' }} />
                  Prop 65 Warning
                </label>
              </div>
              {form.prop65_warning && (
                <div className="form-group">
                  <label>Prop 65 Chemicals</label>
                  <input value={form.prop65_chemicals} onChange={e => updateForm('prop65_chemicals', e.target.value)} placeholder="e.g. crystalline silica (blank = generic warning)" />
                </div>
              )}
            </div>
          </CollapsibleSection>

          {editId && (
            <CollapsibleSection title={`Media (${media.length})`} defaultOpen={true}>
              <ProductMediaManager productId={editId} media={media} setMedia={setMedia} />
            </CollapsibleSection>
          )}

          {editId && allTags.length > 0 && (
            <CollapsibleSection title={`Tags (${productTagIds.length})`} defaultOpen={false}
              headerRight={<button className="btn btn-primary btn-sm" onClick={e => { e.stopPropagation(); saveTags(); }} disabled={tagSaving}>{tagSaving ? 'Saving...' : 'Save Tags'}</button>}>
              {Object.entries(tagGrouped).map(([cat, tags]) => (
                <div key={cat} style={{ marginBottom: '1rem' }}>
                  <div style={{ fontSize: '0.75rem', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.05em', color: 'var(--stone-500)', marginBottom: '0.5rem' }}>
                    {cat.charAt(0).toUpperCase() + cat.slice(1)}
                  </div>
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.375rem' }}>
                    {tags.map(tag => {
                      const active = productTagIds.includes(tag.id);
                      return (
                        <button key={tag.id} onClick={() => toggleTag(tag.id)}
                          style={{
                            padding: '0.375rem 0.75rem', border: '1px solid ' + (active ? 'var(--stone-800)' : 'var(--stone-200)'),
                            background: active ? 'var(--stone-800)' : 'white', color: active ? 'white' : 'var(--stone-600)',
                            fontSize: '0.75rem', cursor: 'pointer', borderRadius: '100px', fontFamily: 'var(--font-body)', transition: 'all 0.15s'
                          }}>
                          {tag.name}
                        </button>
                      );
                    })}
                  </div>
                </div>
              ))}
            </CollapsibleSection>
          )}

          <CollapsibleSection title="SKUs" defaultOpen={true} headerRight={<button className="btn btn-secondary btn-sm" onClick={e => { e.stopPropagation(); addSku(); }}>+ Add SKU</button>}>
            {skus.length === 0 && (
              <div style={{ textAlign: 'center', padding: '2rem', color: 'var(--stone-400)', fontSize: '0.875rem' }}>
                No SKUs yet. Click "Add SKU" to create one.
              </div>
            )}
            {skus.map((sku, i) => (
              <SkuCard key={sku.id || sku._key} sku={sku} index={i} updateSku={updateSku} removeSku={removeSku} />
            ))}
          </CollapsibleSection>
        </div>
      );
    }

    // ========== SkuCard ==========
    function SkuCard({ sku, index, updateSku, removeSku }) {
      const { useState } = React;
      const u = (field, value) => updateSku(index, field, value);
      const [attrsOpen, setAttrsOpen] = useState(false);
      const [attrEdits, setAttrEdits] = useState(null);
      const [attrSaving, setAttrSaving] = useState(false);

      const attrs = sku.attributes || [];

      const startEditAttrs = () => {
        const edits = {};
        for (const a of attrs) edits[a.slug] = a.value;
        setAttrEdits(edits);
        setAttrsOpen(true);
      };

      const saveAttrs = async () => {
        if (!sku.id || !attrEdits) return;
        setAttrSaving(true);
        try {
          const payload = Object.entries(attrEdits).map(([slug, value]) => ({ slug, value }));
          const data = await adminFetch('/api/admin/skus/' + sku.id + '/attributes', {
            method: 'PUT',
            body: JSON.stringify({ attributes: payload })
          });
          if (data.attributes) {
            updateSku(index, 'attributes', data.attributes);
          }
          setAttrEdits(null);
        } catch (err) {
          alert('Failed to save attributes: ' + err.message);
        } finally {
          setAttrSaving(false);
        }
      };

      return (
        <div className="sku-card">
          <div className="sku-card-header">
            <h4>SKU #{index + 1}{sku.variant_name ? ': ' + sku.variant_name : ''}</h4>
            <button className="btn btn-danger btn-sm" onClick={() => removeSku(index)}>Remove</button>
          </div>
          <div className="form-grid">
            <div className="form-group">
              <label>Vendor SKU *</label>
              <input value={sku.vendor_sku} onChange={e => u('vendor_sku', e.target.value)} placeholder="MSI-CALG-1212-POL" />
            </div>
            <div className="form-group">
              <label>Internal SKU *</label>
              <input value={sku.internal_sku} onChange={e => u('internal_sku', e.target.value)} placeholder="CAL-GOLD-12X12-P" />
            </div>
            <div className="form-group">
              <label>Variant Name</label>
              <input value={sku.variant_name || ''} onChange={e => u('variant_name', e.target.value)} placeholder="12x12 Polished" />
            </div>
            <div className="form-group">
              <label>Sell By</label>
              <select value={sku.sell_by || 'box'} onChange={e => u('sell_by', e.target.value)}>
                <option value="box">Box</option>
                <option value="roll">Roll</option>
                <option value="unit">Per Unit</option>
              </select>
            </div>
            <div className="form-group">
              <label>SqFt Per Box</label>
              <input type="number" step="0.01" value={sku.sqft_per_box || ''} onChange={e => u('sqft_per_box', e.target.value)} />
            </div>
            <div className="form-group">
              <label>Pieces Per Box</label>
