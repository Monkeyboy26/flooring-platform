    // ========== PromoCodeFormView ==========
    function PromoCodeFormView({ navigate, editId }) {
      const [loading, setLoading] = useState(!!editId);
      const [saving, setSaving] = useState(false);
      const [error, setError] = useState('');
      const [categories, setCategories] = useState([]);
      const [products, setProducts] = useState([]);
      const [productSearch, setProductSearch] = useState('');
      const [searchResults, setSearchResults] = useState([]);
      const searchTimeout = useRef(null);
      const [form, setForm] = useState({
        code: '',
        description: '',
        discount_type: 'percent',
        discount_value: '',
        min_order_amount: '',
        max_uses: '',
        max_uses_per_customer: '',
        restricted_category_ids: [],
        restricted_product_ids: [],
        is_active: true,
        expires_at: ''
      });
      const [usages, setUsages] = useState([]);

      useEffect(() => {
        // Load categories for restriction checkboxes
        adminFetch('/api/admin/categories')
          .then(data => setCategories(data.categories || []))
          .catch(() => {});
      }, []);

      useEffect(() => {
        if (!editId) return;
        adminFetch('/api/admin/promo-codes/' + editId + '/usages')
          .then(data => setUsages(data.usages || []))
          .catch(() => {});
      }, [editId]);

      useEffect(() => {
        if (!editId) return;
        // Load existing code data — fetch from list and find, or fetch individually
        adminFetch('/api/admin/promo-codes')
          .then(data => {
            const code = (data.promo_codes || []).find(c => c.id === editId);
            if (code) {
              setForm({
                code: code.code || '',
                description: code.description || '',
                discount_type: code.discount_type || 'percent',
                discount_value: code.discount_value ? parseFloat(code.discount_value).toString() : '',
                min_order_amount: parseFloat(code.min_order_amount || 0) > 0 ? parseFloat(code.min_order_amount).toString() : '',
                max_uses: code.max_uses || '',
                max_uses_per_customer: code.max_uses_per_customer || '',
                restricted_category_ids: code.restricted_category_ids || [],
                restricted_product_ids: code.restricted_product_ids || [],
                is_active: code.is_active,
                expires_at: code.expires_at ? new Date(code.expires_at).toISOString().slice(0, 16) : ''
              });
              // Load restricted product names
              if (code.restricted_product_ids && code.restricted_product_ids.length > 0) {
                Promise.all(code.restricted_product_ids.map(pid =>
                  fetch(API + '/api/products/' + pid).then(r => { if (!r.ok) throw new Error(); return r.json(); }).then(d => ({ id: pid, name: d.name || pid })).catch(() => ({ id: pid, name: pid }))
                )).then(setProducts);
              }
            }
            setLoading(false);
          })
          .catch(() => setLoading(false));
      }, [editId]);

      const handleProductSearch = (term) => {
        setProductSearch(term);
        if (searchTimeout.current) clearTimeout(searchTimeout.current);
        if (term.length < 2) { setSearchResults([]); return; }
        searchTimeout.current = setTimeout(() => {
          fetch(API + '/api/products?search=' + encodeURIComponent(term))
            .then(r => { if (!r.ok) throw new Error(); return r.json(); })
            .then(data => setSearchResults(data.products || []))
            .catch(() => {});
        }, 300);
      };

      const addProductRestriction = (product) => {
        if (form.restricted_product_ids.includes(product.id)) return;
        setForm(f => ({ ...f, restricted_product_ids: [...f.restricted_product_ids, product.id] }));
        setProducts(prev => [...prev, { id: product.id, name: product.name }]);
        setProductSearch('');
        setSearchResults([]);
      };

      const removeProductRestriction = (productId) => {
        setForm(f => ({ ...f, restricted_product_ids: f.restricted_product_ids.filter(id => id !== productId) }));
        setProducts(prev => prev.filter(p => p.id !== productId));
      };

      const toggleCategoryRestriction = (catId) => {
        setForm(f => {
          const ids = f.restricted_category_ids.includes(catId)
            ? f.restricted_category_ids.filter(id => id !== catId)
            : [...f.restricted_category_ids, catId];
          return { ...f, restricted_category_ids: ids };
        });
      };

      const handleSave = async () => {
        setError('');
        setSaving(true);
        try {
          const payload = {
            code: form.code,
            description: form.description || null,
            discount_type: form.discount_type,
            discount_value: parseFloat(form.discount_value),
            min_order_amount: form.min_order_amount ? parseFloat(form.min_order_amount) : 0,
            max_uses: form.max_uses ? parseInt(form.max_uses) : null,
            max_uses_per_customer: form.max_uses_per_customer ? parseInt(form.max_uses_per_customer) : null,
            restricted_category_ids: form.restricted_category_ids,
            restricted_product_ids: form.restricted_product_ids,
            is_active: form.is_active,
            expires_at: form.expires_at || null
          };

          if (editId) {
            await adminFetch('/api/admin/promo-codes/' + editId, {
              method: 'PUT',
              body: JSON.stringify(payload)
            });
          } else {
            await adminFetch('/api/admin/promo-codes', {
              method: 'POST',
              body: JSON.stringify(payload)
            });
          }
          navigate('promos');
        } catch (err) {
          setError(err.message || 'Failed to save');
        }
        setSaving(false);
      };

      if (loading) return <div className="loading">Loading...</div>;

      return (
        <div>
          <div className="content-header">
            <h1>{editId ? 'Edit Promo Code' : 'Create Promo Code'}</h1>
            <button className="btn btn-secondary" onClick={() => navigate('promos')}>Back to Promo Codes</button>
          </div>

          {error && <div style={{ background: 'rgba(197,71,49,0.12)', border: '1px solid #fca5a5', color: '#e07a63', padding: '0.75rem 1rem', marginBottom: '1rem', fontSize: '0.875rem' }}>{error}</div>}

          <div className="form-card">
            <h3>Code Details</h3>
            <div className="form-grid">
              <div className="form-group">
                <label>Code *</label>
                <input type="text" value={form.code} onChange={e => setForm(f => ({ ...f, code: e.target.value.toUpperCase() }))} placeholder="e.g., SAVE10" style={{ textTransform: 'uppercase', fontWeight: 600 }} />
              </div>
              <div className="form-group">
                <label>Description (shown to customers)</label>
                <input type="text" value={form.description} onChange={e => setForm(f => ({ ...f, description: e.target.value }))} placeholder="e.g., 10% off your order" />
              </div>
            </div>
            <div className="form-grid">
              <div className="form-group">
                <label>Discount Type *</label>
                <select value={form.discount_type} onChange={e => setForm(f => ({ ...f, discount_type: e.target.value }))}>
                  <option value="percent">Percentage (%)</option>
                  <option value="fixed">Fixed Amount ($)</option>
                </select>
              </div>
              <div className="form-group">
                <label>{form.discount_type === 'percent' ? 'Discount Percentage *' : 'Discount Amount ($) *'}</label>
                <input type="number" value={form.discount_value} onChange={e => setForm(f => ({ ...f, discount_value: e.target.value }))}
                  min="0" max={form.discount_type === 'percent' ? '100' : undefined} step="0.01"
                  placeholder={form.discount_type === 'percent' ? 'e.g., 10' : 'e.g., 25.00'} />
              </div>
            </div>
          </div>

          <div className="form-card">
            <h3>Constraints</h3>
            <div className="form-grid">
              <div className="form-group">
                <label>Minimum Order Amount ($)</label>
                <input type="number" value={form.min_order_amount} onChange={e => setForm(f => ({ ...f, min_order_amount: e.target.value }))}
                  min="0" step="0.01" placeholder="No minimum" />
              </div>
              <div className="form-group">
                <label>Max Total Uses</label>
                <input type="number" value={form.max_uses} onChange={e => setForm(f => ({ ...f, max_uses: e.target.value }))}
                  min="1" placeholder="Unlimited" />
              </div>
            </div>
            <div className="form-grid">
              <div className="form-group">
                <label>Max Uses Per Customer</label>
                <input type="number" value={form.max_uses_per_customer} onChange={e => setForm(f => ({ ...f, max_uses_per_customer: e.target.value }))}
                  min="1" placeholder="Unlimited" />
              </div>
              <div className="form-group">
                <label>Expiration Date</label>
                <input type="datetime-local" value={form.expires_at} onChange={e => setForm(f => ({ ...f, expires_at: e.target.value }))} />
              </div>
            </div>
            <div className="form-group" style={{ marginTop: '0.5rem' }}>
              <label style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', cursor: 'pointer' }}>
                <div className={'toggle' + (form.is_active ? ' on' : '')} onClick={() => setForm(f => ({ ...f, is_active: !f.is_active }))} />
                Active
              </label>
            </div>
          </div>

          <div className="form-card">
            <h3>Category Restrictions</h3>
            <p style={{ fontSize: '0.8125rem', color: 'var(--stone-500)', marginBottom: '0.75rem' }}>
              Leave unchecked for all categories. Check specific categories to limit the discount.
            </p>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.5rem' }}>
              {categories.map(cat => (
                <label key={cat.id} style={{ display: 'flex', alignItems: 'center', gap: '0.35rem', fontSize: '0.8125rem', cursor: 'pointer', padding: '0.3rem 0.6rem', border: '1px solid var(--stone-200)', borderRadius: '4px', background: form.restricted_category_ids.includes(cat.id) ? 'rgba(96,160,120,0.16)' : 'white' }}>
                  <input type="checkbox" checked={form.restricted_category_ids.includes(cat.id)}
                    onChange={() => toggleCategoryRestriction(cat.id)} />
                  {cat.name}
                </label>
              ))}
              {categories.length === 0 && <span style={{ color: 'var(--stone-400)', fontSize: '0.8125rem' }}>No categories loaded</span>}
            </div>
          </div>

          <div className="form-card">
            <h3>Product Restrictions</h3>
            <p style={{ fontSize: '0.8125rem', color: 'var(--stone-500)', marginBottom: '0.75rem' }}>

            <div style={{ position: 'relative', maxWidth: '400px' }}>

              {searchResults.length > 0 && (
                <div style={{ position: 'absolute', top: '100%', left: 0, right: 0, background: 'var(--panel)', border: '1px solid var(--stone-200)', borderRadius: '0 0 6px 6px', maxHeight: '200px', overflowY: 'auto', zIndex: 10 }}>
                  {searchResults.map(p => (
                    <div key={p.id} onClick={() => addProductRestriction(p)}
                      style={{ padding: '0.5rem 0.75rem', cursor: 'pointer', fontSize: '0.8125rem', borderBottom: '1px solid var(--stone-100)' }}
                      onMouseEnter={e => e.target.style.background = 'var(--stone-50)'}
                      onMouseLeave={e => e.target.style.background = 'white'}>
                      {p.name} {p.collection && <span style={{ color: 'var(--stone-500)' }}>({p.collection})</span>}

    // ========== CustomerDuplicatesView (find & merge dup accounts) ==========
    function CustomerDuplicatesView({ navigate }) {
      const [groups, setGroups] = useState(null);
      const [loading, setLoading] = useState(true);
      const [keepers, setKeepers] = useState({});
      const [merging, setMerging] = useState(null);
      const fmtDate = d => d ? new Date(d).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '—';

      const load = () => {
        setLoading(true);
        adminFetch('/api/admin/customers/duplicates')
          .then(d => {
            const gs = d.groups || [];
            const k = {};
            gs.forEach(g => {
              // Default keeper = most orders, tie-break to the oldest / claimed account
              const best = [...g].sort((a, b) =>
                (b.order_count - a.order_count) ||
                (b.password_set - a.password_set) ||
                (new Date(a.created_at) - new Date(b.created_at)))[0];
              k[g[0].pk] = best.id;
            });
            setKeepers(k); setGroups(gs); setLoading(false);
          })
          .catch(() => setLoading(false));
      };
      useEffect(load, []);

      const mergeGroup = async (g) => {
        const survivorId = keepers[g[0].pk];
        const survivor = g.find(m => m.id === survivorId);
        const losers = g.filter(m => m.id !== survivorId);
        if (!confirm('Merge ' + losers.length + ' account' + (losers.length !== 1 ? 's' : '') + ' into ' + (survivor.name || survivor.email) + '?\n\nAll their orders, quotes, estimates and samples move to the kept account and the duplicate record' + (losers.length !== 1 ? 's are' : ' is') + ' deleted. This cannot be undone.')) return;
        setMerging(g[0].pk);
        try {
          for (const l of losers) {
            await adminFetch('/api/admin/customers/merge', { method: 'POST', body: JSON.stringify({ survivor_id: survivorId, loser_id: l.id }) });
          }
          load();
        } catch (err) { alert('Merge failed: ' + err.message); setMerging(null); }
      };

      if (loading) return <div className="loading">Loading duplicates…</div>;

      return (
        <div>
          <button className="recd-crumb" onClick={() => navigate('customers')}>← CUSTOMERS</button>
          <div className="content-header" style={{ marginTop: '0.5rem' }}>
            <h1>Duplicate accounts</h1>
            <span style={{ fontSize: '0.8125rem', color: 'var(--stone-500)' }}>{groups.length} group{groups.length !== 1 ? 's' : ''} sharing a phone number</span>
          </div>
          {groups.length === 0 ? (
            <div className="form-card"><div style={{ color: 'var(--stone-400)', padding: '1.5rem', textAlign: 'center' }}>No duplicate accounts found.</div></div>
          ) : groups.map(g => (
            <div className="form-card" key={g[0].pk} style={{ marginBottom: '1rem' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.75rem', flexWrap: 'wrap', gap: '0.5rem' }}>
                <h3 style={{ margin: 0 }}>Phone {g[0].phone} · {g.length} accounts</h3>
                <button className="btn btn-primary btn-sm" disabled={merging === g[0].pk} onClick={() => mergeGroup(g)}>
                  {merging === g[0].pk ? 'Merging…' : 'Merge into selected'}
                </button>
              </div>
              <div className="table-scroll-wrapper">
              <table className="admin-table" style={{ fontSize: '0.8125rem' }}>
                <thead><tr><th>Keep</th><th>Name</th><th>Email</th><th>Orders</th><th>Quotes</th><th>Est.</th><th>Samples</th><th>Created</th><th>Status</th></tr></thead>
                <tbody>
                  {g.map(m => (
                    <tr key={m.id} style={{ background: keepers[g[0].pk] === m.id ? 'var(--stone-50)' : undefined }}>
                      <td><input type="radio" name={'keep-' + g[0].pk} checked={keepers[g[0].pk] === m.id} onChange={() => setKeepers(k => ({ ...k, [g[0].pk]: m.id }))} /></td>
                      <td style={{ fontWeight: 500 }}>{m.name}{m.company_name ? <span style={{ color: 'var(--stone-400)', fontWeight: 400 }}> · {m.company_name}</span> : ''}</td>
                      <td style={{ color: 'var(--stone-500)' }}>{m.email}</td>
                      <td>{m.order_count}</td>
                      <td>{m.quote_count}</td>
                      <td>{m.estimate_count}</td>
                      <td>{m.sample_count}</td>
                      <td style={{ color: 'var(--stone-500)' }}>{fmtDate(m.created_at)}</td>
                      <td><span className={'status-badge status-' + (m.password_set ? 'active' : 'draft')}>{m.password_set ? 'Claimed' : 'Unclaimed'}</span></td>
                    </tr>
                  ))}
                </tbody>
              </table>
              </div>
            </div>
          ))}
        </div>
      );
    }

    function CustomersListView({ navigate }) {
      const [customers, setCustomers] = useState([]);
      const [loading, setLoading] = useState(true);
      const [view, setView] = useState('all');
      const [q, setQ] = useState('');
      const [repFilter, setRepFilter] = useState('');
      const [sortRecent, setSortRecent] = useState(false);
      const [sel, setSel] = useState(null);
      const [pane, setPane] = useState(null);
      const [paneLoading, setPaneLoading] = useState(false);

      useEffect(() => {
        adminFetch('/api/admin/customers/ledger')
          .then(d => { setCustomers(d.customers || []); setLoading(false); })
          .catch(() => setLoading(false));
      }, []);

      const inView = (c, v) => v === 'all' ? true : v === 'watch' ? c.health !== 'good' : c.customer_type === v;
      const reps = [...new Set(customers.map(c => c.rep_name).filter(Boolean))].sort();
      const rows = customers
        .filter(c => inView(c, view))
        .filter(c => !repFilter || c.rep_name === repFilter)
        .filter(c => !q || ((c.name || '') + ' ' + (c.email || '') + ' ' + (c.company_name || '') + ' ' + (c.phone || '')).toLowerCase().includes(q.toLowerCase()))
        .sort((a, b) => sortRecent
          ? new Date(b.last_order_date || b.created_at) - new Date(a.last_order_date || a.created_at)
          : (b.ytd - a.ytd) || (b.lifetime - a.lifetime));

      const activeId = rows.some(r => r.id === sel) ? sel : (rows[0] ? rows[0].id : null);
      const activeRow = customers.find(c => c.id === activeId) || null;
      const ytdSum = rows.reduce((s, c) => s + (c.ytd || 0), 0);
      const arSum = rows.reduce((s, c) => s + (c.ar || 0), 0);
      const fmt = n => '$' + parseFloat(n || 0).toLocaleString('en-US', { maximumFractionDigits: 0 });
      const kfmt = n => { n = parseFloat(n || 0); return n >= 10000 ? '$' + Math.round(n / 1000) + 'k' : fmt(n); };
      const dfmt = ts => ts ? new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';

      // Record pane rides on the existing detail endpoint — orders, notes,
      // stats, address all come back in one call.
      useEffect(() => {
        if (!activeId) { setPane(null); return; }
        let dead = false;
        setPaneLoading(true);
        const { type, ref } = custParseId(activeId);
        adminFetch('/api/admin/customers/' + encodeURIComponent(ref) + '?type=' + type)
          .then(d => { if (!dead) { setPane(d); setPaneLoading(false); } })
          .catch(() => { if (!dead) { setPane(null); setPaneLoading(false); } });
        return () => { dead = true; };
      }, [activeId]);

      const COLS = 'minmax(150px, 1.4fr) minmax(96px, 120px) minmax(70px, 90px) minmax(70px, 90px) minmax(70px, 90px) minmax(86px, 104px)';

      return (
        <div className="ordl">
          <section className="ordl-main">
            <div className="ordl-tabs">
              {CUST_VIEWS.map(v => {
                const on = v.id === view;
                const n = customers.filter(c => inView(c, v.id)).length;
                return (
                  <button key={v.id} className={'ordl-tab' + (on ? ' active' : '')} onClick={() => setView(v.id)}>
                    <span className="ordl-tab-row">
                      <span className="ordl-tab-label">{v.label}</span>
                      <span className="ordl-tab-n">{n}</span>
                    </span>
                    <span className="ordl-tab-hint">{v.hint.toUpperCase()}</span>
                  </button>
                );
              })}
            </div>

            <div className="ordl-filters">
              <select value={repFilter} onChange={e => setRepFilter(e.target.value)} className="ordl-chip">
                <option value="">Any rep</option>
                {reps.map(r => <option key={r} value={r}>{r}</option>)}
              </select>
              <button className={'ordl-chip' + (sortRecent ? ' on' : '')} onClick={() => setSortRecent(s => !s)}>
                {sortRecent ? 'RECENT' : 'YTD ↓'}
              </button>
              <input className="ordl-search" value={q} onChange={e => setQ(e.target.value)} placeholder="filter accounts…" />
              <button className="ordl-chip" onClick={() => navigate('customer-duplicates')} title="Find & merge duplicate accounts">DUPLICATES</button>
            </div>

            <div className="ordl-scroll">
              <div style={{ minWidth: 640 }}>
                <div className="ordl-head" style={{ gridTemplateColumns: COLS }}>
                  <span>ACCOUNT</span><span>TIER</span>
                  <span style={{ textAlign: 'right' }}>YTD</span>
                  <span style={{ textAlign: 'right' }}>OPEN</span>
                  <span style={{ textAlign: 'right' }}>A/R</span>
                  <span>HEALTH</span>
                </div>
                {loading && <div className="opsq-empty">loading accounts…</div>}
                {!loading && rows.length === 0 && <div className="opsq-empty">no accounts in this view</div>}
                {rows.map(c => {
                  const on = c.id === activeId; const h = CUST_HEALTH[c.health] || CUST_HEALTH.good;
                  return (
                    <div key={c.id} className={'ordl-row' + (on ? ' active' : '')}
                      onClick={() => { if (window.innerWidth < 1100) navigate('customer-detail', c.id); else setSel(c.id); }}>
                      <div className="ordl-grid" style={{ gridTemplateColumns: COLS }}>
                        <span style={{ minWidth: 0 }}>
                          <span className="ordl-cust">{c.customer_type === 'trade' ? (c.company_name || c.name || c.email) : (c.name || c.email)}</span>
                          <span className="ordl-co">{(c.customer_type === 'trade' ? (c.name || c.email || '') : (c.email || '')) + ' · since ' + new Date(c.created_at).getFullYear()}</span>
                        </span>
                        <span style={{ font: '400 10px/1.3 var(--mono)', color: 'var(--dim)' }}>{custTierLabel(c)}</span>
                        <span className="ordl-val">{c.ytd > 0.01 ? kfmt(c.ytd) : '—'}</span>
                        <span className="ordl-val" style={{ color: 'var(--dim)' }}>{c.open_value > 0.01 ? kfmt(c.open_value) : '—'}</span>
                        <span className="ordl-val" style={{ color: c.past_due > 0.01 ? 'var(--hot)' : 'var(--dim)' }}>{c.ar > 0.01 ? kfmt(c.ar) : '—'}</span>
                        <span style={{ display: 'flex', alignItems: 'center', gap: 7, font: '400 10px/1 var(--mono)', letterSpacing: '0.06em', color: h.c }}>
                          <span className="ops-dot" style={{ width: 5, height: 5, background: h.c, flexShrink: 0 }} />{h.t}
                        </span>
                      </div>
                      <div className="ordl-sub">
                        <span className="ordl-blocker">{custLastLine(c, dfmt)}</span>
                        <span className="ordl-rep">{c.order_count} order{c.order_count === 1 ? '' : 's'} · {c.rep_name || 'house'}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="ordl-foot">
              <span style={{ letterSpacing: '0.08em' }}>{rows.length} ACCOUNTS</span>
              <span style={{ color: 'var(--dim)' }}>{fmt(ytdSum)} YTD</span>
              <span style={{ color: arSum > 0.01 ? 'var(--gold)' : 'var(--dim)' }}>{fmt(arSum)} A/R</span>
            </div>
          </section>

          <aside className="ordl-pane">
            {!activeRow ? (
              <div style={{ flex: 1, display: 'grid', placeItems: 'center', font: '400 12px/1 var(--mono)', color: 'var(--faint)' }}>NO ACCOUNT SELECTED</div>
            ) : (() => {
              const h = CUST_HEALTH[activeRow.health] || CUST_HEALTH.good;
              const readNote = pane && pane.notes && pane.notes.length ? pane.notes[0] : null;
              return (
                <React.Fragment>
                  <div className="ordl-pane-head">
                    <div className="opsq-meta">
                      <span style={{ color: 'var(--ink)' }}>{activeRow.customer_type.toUpperCase()}</span>
                      <span style={{ color: h.c }}>{h.t}</span>
                      <span style={{ marginLeft: 'auto', color: 'var(--faint)' }}>{activeRow.rep_name || ''}</span>
                    </div>
                    <h1 className="ordl-pane-title">{activeRow.customer_type === 'trade' ? (activeRow.company_name || activeRow.name || activeRow.email) : (activeRow.name || activeRow.email)}</h1>
                    <div className="ordl-pane-meta">
                      <span style={{ minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{activeRow.customer_type === 'trade' ? (activeRow.name || activeRow.email) : activeRow.email}</span>
                      <span style={{ flexShrink: 0 }}>{custTierLabel(activeRow)}</span>
                    </div>
                    <div className="ordl-next" style={{ borderLeftColor: h.c }}>
                      <div className="opsq-block-label" style={{ marginBottom: 0 }}>{readNote ? ('LATEST NOTE · ' + (readNote.staff_name || 'STAFF').toUpperCase()) : 'LAST ACTIVITY'}</div>
                      <div style={{ marginTop: 6, font: '400 12px/1.5 var(--sans)', textWrap: 'pretty' }}>
                        {readNote ? readNote.note : custLastLine(activeRow, dfmt)}
                      </div>
                    </div>
                  </div>
                  <div className="opsq-pane-body">
                    {paneLoading && <div className="opsq-empty">loading account…</div>}
                    {!paneLoading && pane && (
                      <React.Fragment>
                        <OpsBlock label="Exposure">
                          <div className="opsq-facts">
                            {[
                              ['YTD revenue', fmt(activeRow.ytd)],
                              ['Lifetime', fmt(activeRow.lifetime)],
                              ['Open orders', fmt(activeRow.open_value)],
                              ['A/R balance', fmt(activeRow.ar)],
                              ['Store credit', fmt(pane.stats && pane.stats.store_credit_balance)],
                              ['Open quotes', ((pane.stats && pane.stats.open_quotes_count) || 0) + ' · ' + fmt(pane.stats && pane.stats.open_quotes_value)],
                            ].map(m => (
                              <div key={m[0]} className="opsq-fact">
                                <div className="opsq-fact-k">{m[0]}</div>
                                <div className="opsq-fact-v">{m[1]}</div>
                              </div>
                            ))}
                          </div>
                        </OpsBlock>
                        <OpsBlock label={'Orders · ' + pane.orders.length}>
                          {pane.orders.length === 0 ? (
                            <div style={{ font: '400 11px/1.5 var(--mono)', color: 'var(--faint)' }}>no orders yet</div>
                          ) : (
                            <div style={{ display: 'flex', flexDirection: 'column', gap: 9 }}>
                              {pane.orders.slice(0, 5).map(o => (
                                <div key={o.id} onClick={() => navigate('order-detail', o.id)} style={{ display: 'grid', gridTemplateColumns: '1fr 74px', gap: 10, alignItems: 'baseline', cursor: 'pointer' }}>
                                  <span style={{ minWidth: 0 }}>
                                    <span style={{ display: 'block', font: '400 12px/1.35 var(--sans)' }}>{o.order_number} · {o.item_count || 0} line{o.item_count === 1 ? '' : 's'}</span>
                                    <span style={{ display: 'block', marginTop: 3, font: '400 9px/1.4 var(--mono)', color: 'var(--dim)' }}>{(o.status || '').replace(/_/g, ' ')} · {dfmt(o.created_at)}</span>
                                  </span>
                                  <span style={{ font: '400 11px/1 var(--mono)', textAlign: 'right' }}>{fmt(o.total)}</span>
                                </div>
                              ))}
                            </div>
                          )}
                        </OpsBlock>
                        <OpsBlock label="Contact">
                          <div className="rb-addr">
                            <div>{pane.customer.name || '—'}</div>
                            {pane.customer.email && <div>{pane.customer.email}</div>}
                            {pane.customer.phone && <div>{pane.customer.phone}</div>}
                            {pane.customer.address_line1 && <div>{pane.customer.address_line1}</div>}
                            {pane.customer.address_line2 && <div>{pane.customer.address_line2}</div>}
                            {(pane.customer.city || pane.customer.zip) && <div>{[pane.customer.city, pane.customer.state, pane.customer.zip].filter(Boolean).join(', ')}</div>}
                          </div>
                        </OpsBlock>
                      </React.Fragment>
                    )}
                  </div>
                  <div className="ordl-pane-foot">
                    <button className="opsq-primary" style={{ marginTop: 0, flex: 1, width: 'auto' }} onClick={() => navigate('customer-detail', activeRow.id)}>
                      <span>Open full record</span>
                    </button>
                  </div>
                </React.Fragment>
              );
            })()}
          </aside>
        </div>
      );
    }

    // ========== CustomerDetailView ==========
    // Full customer record in the console grammar: relationship read first,
    // then the order ledger, money, and the note trail. Real mutations only —
    // store credit grant, notes, and the trade application decision.
    function CustomerDetailView({ navigate, editId, staffRole }) {
      const [customer, setCustomer] = useState(null);
      const [orders, setOrders] = useState([]);
      const [notes, setNotes] = useState([]);
      const [stats, setStats] = useState(null);
      const [quotes, setQuotes] = useState([]);
      const [paymentRequests, setPaymentRequests] = useState([]);
      const [loading, setLoading] = useState(true);
      const [tab, setTab] = useState('record');
      const [newNote, setNewNote] = useState('');
      const [addingNote, setAddingNote] = useState(false);
      const [creditEntries, setCreditEntries] = useState(null);
      const [creditBalance, setCreditBalance] = useState(null);
      const [grantOpen, setGrantOpen] = useState(false);
      const [grantAmount, setGrantAmount] = useState('');
      const [grantReason, setGrantReason] = useState('');
      const [granting, setGranting] = useState(false);
      const [grantError, setGrantError] = useState('');
      const [deciding, setDeciding] = useState(false);
      const [denyOpen, setDenyOpen] = useState(false);
      const [denyReason, setDenyReason] = useState('');
      const canGrant = ['admin', 'manager'].includes(staffRole);
      const canDecide = ['admin', 'manager'].includes(staffRole);

      const { type, ref } = custParseId(editId);

      const loadStoreCredit = () => {
        if (!type || !ref) return;
        adminFetch('/api/staff/store-credit?type=' + type + '&id=' + encodeURIComponent(ref))
          .then(data => {
            setCreditEntries(data.entries || []);
            setCreditBalance(typeof data.balance === 'number' ? data.balance : parseFloat(data.balance) || 0);
          })
          .catch(() => setCreditEntries([]));
      };

      const load = () => {
        if (!type || !ref) return;
        adminFetch('/api/admin/customers/' + encodeURIComponent(ref) + '?type=' + type)
          .then(data => {
            setCustomer(data.customer);
            setOrders(data.orders || []);
            setNotes(data.notes || []);
            setQuotes(data.quotes || []);
            setPaymentRequests(data.payment_requests || []);
            setStats(data.stats || {});
            setLoading(false);
          })
          .catch(() => setLoading(false));
      };

      useEffect(() => { setLoading(true); setTab('record'); load(); loadStoreCredit(); }, [editId]);

      const submitGrant = () => {
        const amt = parseFloat(grantAmount);
        if (!amt || amt <= 0) { setGrantError('Enter an amount greater than 0'); return; }
        if (!grantReason.trim()) { setGrantError('Enter a reason'); return; }
        setGranting(true);
        setGrantError('');
        adminFetch('/api/staff/store-credit/grant', {
          method: 'POST',
          body: JSON.stringify({ type: type, id: ref, amount: amt, reason: grantReason.trim() })
        })
          .then(data => {
            setGranting(false); setGrantOpen(false); setGrantAmount(''); setGrantReason('');
            if (typeof data.balance !== 'undefined') {
              setCreditBalance(typeof data.balance === 'number' ? data.balance : parseFloat(data.balance) || 0);
            }
            loadStoreCredit();
          })
          .catch(err => { setGranting(false); setGrantError(err.message || 'Failed to grant credit'); });
      };

      const addNote = () => {
        if (!newNote.trim()) return;
        setAddingNote(true);
        adminFetch('/api/admin/customers/' + encodeURIComponent(ref) + '/notes', {
          method: 'POST',
          body: JSON.stringify({ customer_type: type, customer_ref: ref, note: newNote.trim() })
        })
          .then(data => { setNotes(prev => [data.note, ...prev]); setNewNote(''); setAddingNote(false); })
          .catch(() => setAddingNote(false));
      };

      const approveTrade = () => {
        if (!confirm('Approve ' + (customer.company_name || customer.name) + ' for trade pricing at the entry tier?')) return;
        setDeciding(true);
        adminFetch('/api/admin/trade-customers/' + ref + '/approve', { method: 'POST', body: JSON.stringify({}) })
          .then(() => { setDeciding(false); load(); })
          .catch(err => { setDeciding(false); alert(err.message); });
      };
      const denyTrade = () => {
        if (!denyReason.trim()) return;
        setDeciding(true);
        adminFetch('/api/admin/trade-customers/' + ref + '/deny', { method: 'POST', body: JSON.stringify({ denial_reason: denyReason.trim() }) })
          .then(() => { setDeciding(false); setDenyOpen(false); setDenyReason(''); load(); })
          .catch(err => { setDeciding(false); alert(err.message); });
      };

      if (loading) return <div className="recd-page"><div className="opsq-empty">loading customer record…</div></div>;
      if (!customer) return <div className="recd-page"><div className="opsq-empty">customer not found</div></div>;

      const fmt = n => '$' + parseFloat(n || 0).toLocaleString('en-US', { maximumFractionDigits: 0 });
      const cents = n => '$' + parseFloat(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const dfmt = ts => ts ? new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
      const dtfmt = ts => ts ? (new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' + new Date(ts).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })) : '';

      const isTrade = customer.customer_type === 'trade';
      const accountName = isTrade ? (customer.company_name || customer.name) : (customer.name || customer.email);
      const pendingPaymentOrderIds = new Set(paymentRequests.map(pr => pr.order_id));

      // Same money read the ledger computes server-side, from this record's orders
      const liveOrders = orders.filter(o => !['cancelled', 'refunded'].includes(o.status));
      const yearStart = new Date(new Date().getFullYear(), 0, 1);
      const ytd = liveOrders.filter(o => new Date(o.created_at) >= yearStart).reduce((s, o) => s + (parseFloat(o.total) || 0), 0);
      const openValue = liveOrders.filter(o => o.status !== 'delivered').reduce((s, o) => s + (parseFloat(o.total) || 0), 0);
      const orderBal = o => Math.max(0, (parseFloat(o.total) || 0) - (parseFloat(o.amount_paid) || 0));
      const ar = liveOrders.reduce((s, o) => s + orderBal(o), 0);
      const pastDue = liveOrders.filter(o => o.status === 'delivered').reduce((s, o) => s + orderBal(o), 0);
      const health = pastDue > 0.01 ? 'bad' : ((isTrade && customer.status === 'pending') || ar > 0.01) ? 'watch' : 'good';
      const h = CUST_HEALTH[health];
      const storeCredit = creditBalance !== null ? creditBalance : (parseFloat(stats && stats.store_credit_balance) || 0);

      const show = k => tab === 'record' ? k !== 'activity' : tab === k;

      return (
        <div className="recd-page">
          <div className="recd-head">
            <div className="recd-top">
              <div style={{ minWidth: 0 }}>
                <div className="opsq-meta">
                  <button className="recd-crumb" onClick={() => navigate('customers')}>← CUSTOMERS</button>
                  <span style={{ color: 'var(--faint)' }}>/</span>
                  <span style={{ color: 'var(--ink)' }}>{customer.customer_type.toUpperCase()}</span>
                  <span style={{ color: h.c }}>{h.t}</span>
                </div>
                <h1 className="recd-title">{accountName}</h1>
                <div className="recd-meta">
                  {isTrade && customer.name && <span>{customer.name}</span>}
                  {customer.email && <span>{customer.email}</span>}
                  {customer.phone && <span>{customer.phone}</span>}
                  {isTrade && <span>{(customer.tier_name || 'no tier') + (customer.status && customer.status !== 'approved' ? ' · ' + customer.status : '')}</span>}
                  <span>since {customer.created_at ? new Date(customer.created_at).getFullYear() : '—'}</span>
                  {customer.rep_name && <span>{customer.rep_name}</span>}
                </div>
              </div>
              <div style={{ marginLeft: 'auto', display: 'flex', gap: 28, flexShrink: 0 }}>
                {[['YTD REVENUE', fmt(ytd)], ['OPEN', openValue > 0.01 ? fmt(openValue) : '—'], ['A/R', fmt(ar)]].map(m => (
                  <div key={m[0]} style={{ textAlign: 'right' }}>
                    <div className="opsq-block-label" style={{ marginBottom: 0 }}>{m[0]}</div>
                    <div className="recd-value" style={{ fontSize: 20, color: m[0] === 'A/R' && pastDue > 0.01 ? 'var(--hot)' : undefined }}>{m[1]}</div>
                  </div>
                ))}
              </div>
              <div style={{ display: 'flex', gap: 8, alignSelf: 'center', flexShrink: 0, flexWrap: 'wrap' }}>
                {canGrant && (
                  <button className="opsq-alt" onClick={() => { setGrantError(''); setGrantAmount(''); setGrantReason(''); setGrantOpen(true); }}>Grant credit</button>
                )}
              </div>
            </div>
            <div className="recd-tabs">
              {['record', 'orders', 'money', 'activity'].map(t => (
                <button key={t} className={'recd-tab' + (tab === t ? ' active' : '')} onClick={() => setTab(t)}>{t}</button>
              ))}
            </div>
          </div>

          <div className="recd-scroll">
          <div className="rec-body">
          <div className="rec-left">

          {tab === 'record' && isTrade && customer.status === 'pending' && (
            <div className="recd-exception">
              <div className="recd-exc-head">
                <span style={{ color: 'var(--gold)' }}>NEEDS A DECISION · TRADE APPLICATION</span>
                <span style={{ marginLeft: 'auto', color: 'var(--faint)' }}>APPLIED {dfmt(customer.created_at).toUpperCase()}</span>
              </div>
              <div className="recd-exc-title">{accountName} applied for a trade account</div>
              {canDecide && !denyOpen && (
                <div className="recd-exc-actions">
                  <button className="recd-exc-primary" disabled={deciding} onClick={approveTrade}>{deciding ? 'Working…' : 'Approve at entry tier'}</button>
                  <button className="opsq-alt" disabled={deciding} onClick={() => setDenyOpen(true)}>Deny</button>
                </div>
              )}
              {canDecide && denyOpen && (
                <div style={{ marginTop: 12 }}>
                  <textarea rows={2} value={denyReason} onChange={e => setDenyReason(e.target.value)}
                    placeholder="denial reason — this is sent to the applicant…"
                    style={{ width: '100%', boxSizing: 'border-box', resize: 'none', padding: '9px 10px', background: 'var(--bg)', border: '1px solid var(--line2)', color: 'var(--ink)', font: '400 12px/1.5 var(--sans)', outline: 'none' }} />
                  <div className="recd-exc-actions">
                    <button className="recd-exc-primary" style={{ background: 'var(--hot)', color: '#fff' }} disabled={deciding || !denyReason.trim()} onClick={denyTrade}>{deciding ? 'Working…' : 'Deny application'}</button>
                    <button className="opsq-alt" disabled={deciding} onClick={() => { setDenyOpen(false); setDenyReason(''); }}>Keep pending</button>
                  </div>

                      <span style={{ minWidth: 0, font: '400 12px/1.4 var(--sans)' }}>
                        {e.reason || '—'}{e.order_number ? <span style={{ color: 'var(--faint)', fontFamily: 'var(--mono)', fontSize: 10 }}> · {e.order_number}</span> : null}

                    <span style={{ display: 'block', font: '400 12px/1.35 var(--sans)' }}>{pr.order_number}</span>

          {tab === 'activity' && <div className="form-card">
            <h3>Notes on the record · {notes.length}</h3>
            <div style={{ display: 'flex', gap: 8, marginBottom: 18 }}>
              <textarea rows={2} value={newNote} onChange={e => setNewNote(e.target.value)}
                placeholder="note on the record — visible to all staff…"
                style={{ flex: 1, boxSizing: 'border-box', resize: 'none', padding: '9px 10px', background: 'var(--bg)', border: '1px solid var(--line2)', color: 'var(--ink)', font: '400 12px/1.5 var(--sans)', outline: 'none' }} />
              <button className="recd-exc-primary" style={{ alignSelf: 'flex-end' }} disabled={addingNote || !newNote.trim()} onClick={addNote}>
                {addingNote ? 'Adding…' : 'Add note'}
              </button>
            </div>
            {notes.length === 0 ? (
              <div style={{ font: '400 11px/1.5 var(--mono)', color: 'var(--faint)' }}>nothing on the record yet</div>
            ) : (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 13 }}>
                {notes.map(n => (
                  <div key={n.id} style={{ display: 'grid', gridTemplateColumns: '92px 1fr', gap: 12 }}>
                    <span style={{ font: '400 10px/1.5 var(--mono)', color: 'var(--faint)' }}>{dtfmt(n.created_at)}</span>
                    <span>
                      <span style={{ display: 'block', font: '400 10px/1 var(--mono)', color: 'var(--dim)' }}>{n.staff_name || 'Staff'}</span>
                      <span style={{ display: 'block', marginTop: 4, font: '400 12px/1.55 var(--sans)', textWrap: 'pretty', whiteSpace: 'pre-wrap' }}>{n.note}</span>
                    </span>
                  </div>
                ))}
              </div>
            )}
          </div>}

          </div>

          <div className="rec-right">

            <h3>Money</h3>
            <div className="rb-facts">
              {[
                ['Lifetime', fmt(stats && stats.total_spent)],
                ['YTD revenue', fmt(ytd)],
                ['Open orders', fmt(openValue)],
                ['A/R balance', fmt(ar)],
              ].concat(pastDue > 0.01 ? [['Past due', fmt(pastDue)]] : [])
               .concat([['Store credit', cents(storeCredit)]])
               .concat((parseFloat(stats && stats.available_credit) || 0) > 0.01 ? [['Overpayment credit', cents(stats.available_credit)]] : [])
               .concat([
                ['Open quotes', ((stats && stats.open_quotes_count) || 0) + ' · ' + fmt(stats && stats.open_quotes_value)],
                ['Pending pmt requests', ((stats && stats.pending_payments_count) || 0) + ' · ' + fmt(stats && stats.pending_payments_total)],
              ]).map(([k, v]) => (
                <div key={k} className="rb-fact">
                  <span className="rb-fact-k">{k}</span>
                  <span className={'rb-fact-v big'} style={(k === 'A/R balance' && pastDue > 0.01) || k === 'Past due' ? { color: 'var(--hot)' } : undefined}>{v}</span>
                </div>
              ))}
            </div>
          </div>

          {tab !== 'activity' && (
            <div className="form-card">
              <div className="rb-head">
                <h3>Recent activity</h3>
                <button className="rb-action" onClick={() => setTab('activity')}>Add note</button>
              </div>
              {notes.length === 0 ? (
                <div style={{ font: '400 11px/1.5 var(--mono)', color: 'var(--faint)' }}>nothing on the record yet</div>
              ) : (
                <div className="rb-trail">
                  {notes.slice(0, 4).map(n => (
                    <div key={n.id} className="rb-trail-row">
                      <span className="rb-trail-when">{dfmt(n.created_at)}</span>
                      <span className="rb-trail-what" style={{ textWrap: 'pretty' }}>{n.note}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          <div className="form-card">
            <h3>Contact</h3>
            <div className="rb-addr">
              <div>{customer.name || '—'}</div>
              {customer.email && <div>{customer.email}</div>}
              {customer.phone && <div>{customer.phone}</div>}
              {customer.address_line1 && <div style={{ marginTop: 8 }}>{customer.address_line1}</div>}
              {customer.address_line2 && <div>{customer.address_line2}</div>}
              {(customer.city || customer.zip) && <div>{[customer.city, customer.state, customer.zip].filter(Boolean).join(', ')}</div>}
            </div>
          </div>

          <div className="form-card">
            <h3>Owner</h3>
            <div className="rb-facts">
              {[
                ['Rep', customer.rep_name || 'house'],
                ['Segment', customer.customer_type],
                ['Since', customer.created_at ? new Date(customer.created_at).toLocaleDateString('en-US', { month: 'short', year: 'numeric' }) : '—'],
                ['Orders', String(orders.length)],
              ].map(([k, v]) => (
                <div key={k} className="rb-fact"><span className="rb-fact-k">{k}</span><span className="rb-fact-v">{v}</span></div>
              ))}

          </div>
          </div>

          {grantOpen && (
            <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget && !granting) setGrantOpen(false); }}>
              <div className="modal-box">
                <h3>Grant store credit</h3>
                {grantError && <div style={{ border: '1px solid var(--hot)', color: 'var(--hot)', padding: '0.625rem 0.75rem', fontSize: '0.8125rem', marginBottom: '1rem' }}>{grantError}</div>}
                <div style={{ marginBottom: '1rem' }}>
                  <label style={{ display: 'block', font: '400 9px/1 var(--mono)', letterSpacing: '0.12em', color: 'var(--faint)', textTransform: 'uppercase', marginBottom: '0.375rem' }}>Amount ($)</label>
                  <input type="number" min="0.01" step="0.01" value={grantAmount} onChange={e => setGrantAmount(e.target.value)}
                    style={{ width: '100%', boxSizing: 'border-box', padding: '0.625rem', background: 'var(--bg)', border: '1px solid var(--line2)', color: 'var(--ink)', fontSize: '0.875rem' }} />
                </div>
                <div style={{ marginBottom: '1.5rem' }}>
                  <label style={{ display: 'block', font: '400 9px/1 var(--mono)', letterSpacing: '0.12em', color: 'var(--faint)', textTransform: 'uppercase', marginBottom: '0.375rem' }}>Reason</label>
                  <input type="text" value={grantReason} onChange={e => setGrantReason(e.target.value)} placeholder="e.g. Goodwill adjustment"
                    style={{ width: '100%', boxSizing: 'border-box', padding: '0.625rem', background: 'var(--bg)', border: '1px solid var(--line2)', color: 'var(--ink)', fontSize: '0.875rem' }} />

                  <button className="btn btn-primary" disabled={granting} onClick={submitGrant}>{granting ? 'Granting…' : 'Grant credit'}</button>
                </div>

        </div>
      );
    }

    // ========== VisitsListView ==========
    // Showroom visits — a visit records exactly two things: who came in and
    // what they looked at. Capture quality (an email to follow up with) and
    // the items viewed (the only demand signal before a quote) are the read.
    const VISIT_VIEWS = [
      { id: 'today', label: 'Today', hint: 'logged today' },
      { id: 'week', label: 'This week', hint: 'last 7 days' },
      { id: 'all', label: 'All', hint: 'full log' },
      { id: 'incomplete', label: 'Incomplete', hint: 'cannot follow up' },
      { id: 'nofollow', label: 'No follow-up', hint: 'recap never sent' },
      { id: 'engaged', label: 'Engaged', hint: 'opened · carted · quote' },
    ];
    const VISIT_STATE = {
      quote: { c: 'var(--green)', t: 'QUOTE ASKED' },
      carted: { c: 'var(--cool)', t: 'CARTED' },
      opened: { c: 'var(--cool)', t: 'OPENED' },
      sent: { c: 'var(--gold)', t: 'SENT' },
      draft: { c: 'var(--gold)', t: 'NOT SENT' },
      incomplete: { c: 'var(--hot)', t: 'INCOMPLETE' },
    };
    const visitState = v =>
      !v.customer_email ? 'incomplete'
      : v.quote_requested_at ? 'quote'
      : v.status === 'carted' ? 'carted'
      : v.status === 'opened' ? 'opened'
      : v.status === 'sent' ? 'sent'
      : 'draft';
    const visitEngaged = v => !!(v.quote_requested_at || v.opened_at || v.items_carted_at);
    const visitMissing = v => (v.customer_email ? 0 : 1) + (v.customer_phone ? 0 : 1);
    const visitFollowLine = (v, dfmt) => {
      if (!v.customer_email) return 'No email captured — the recap cannot send';
      if (v.quote_requested_at) return 'Asked for a quote ' + dfmt(v.quote_requested_at);
      if (v.items_carted_at) return 'Carted items ' + dfmt(v.items_carted_at);
      if (v.opened_at) return 'Opened the recap ' + dfmt(v.opened_at);
      if (v.sent_at) return 'Recap sent ' + dfmt(v.sent_at) + ' — not opened yet';
      return 'Recap not sent yet';
    };
    const visitRecapUrl = v => window.location.origin + '/visit/' + v.token;

    function VisitsListView({ navigate }) {
      const [visits, setVisits] = useState([]);
      const [loading, setLoading] = useState(true);
      const [view, setView] = useState('week');
      const [q, setQ] = useState('');
      const [repFilter, setRepFilter] = useState('');
      const [sel, setSel] = useState(null);
      const [copied, setCopied] = useState(false);

      useEffect(() => {
        adminFetch('/api/admin/visits')
          .then(d => { setVisits(d.visits || []); setLoading(false); })
          .catch(() => setLoading(false));
      }, []);

      const dayStart = new Date(); dayStart.setHours(0, 0, 0, 0);
      const weekStart = new Date(Date.now() - 7 * 24 * 3600 * 1000);
      const inView = (v, id) =>
        id === 'today' ? new Date(v.created_at) >= dayStart
        : id === 'week' ? new Date(v.created_at) >= weekStart
        : id === 'all' ? true
        : id === 'incomplete' ? !v.customer_email
        : id === 'nofollow' ? !!v.customer_email && v.status === 'draft'
        : id === 'engaged' ? visitEngaged(v) : true;

      const reps = [...new Set(visits.map(v => v.rep_name).filter(Boolean))].sort();
      const rows = visits
        .filter(v => inView(v, view))
        .filter(v => !repFilter || v.rep_name === repFilter)
        .filter(v => !q || ((v.customer_name || '') + ' ' + (v.customer_email || '') + ' ' + (v.rep_name || '') + ' ' + (v.item_names || []).join(' ')).toLowerCase().includes(q.toLowerCase()));

      const activeId = rows.some(r => r.id === sel) ? sel : (rows[0] ? rows[0].id : null);
      const activeRow = visits.find(v => v.id === activeId) || null;
      const unreachable = rows.filter(v => !v.customer_email).length;
      const engaged = rows.filter(visitEngaged).length;
      const dfmt = ts => ts ? new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
      const tfmt = ts => ts ? new Date(ts).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : '';

      const copyLink = v => {
        navigator.clipboard.writeText(visitRecapUrl(v)).then(() => {
          setCopied(true); setTimeout(() => setCopied(false), 1800);
        });
      };

      const COLS = 'minmax(140px, 1.2fr) minmax(88px, 108px) minmax(150px, 1.6fr) minmax(78px, 100px) minmax(94px, 112px)';

      return (
        <div className="ordl">
          <section className="ordl-main">
            <div style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '10px 16px', background: 'var(--panel2)', borderBottom: '1px solid var(--line)', flexShrink: 0, flexWrap: 'wrap' }}>
              <span style={{ font: '400 9px/1 var(--mono)', letterSpacing: '0.16em', color: 'var(--gold)', whiteSpace: 'nowrap' }}>SHOWROOM VISITS</span>
              <span style={{ font: '400 11px/1.4 var(--sans)', color: 'var(--dim)', textWrap: 'pretty' }}>A visit captures the customer and the items they looked at. Without an email there is no follow-up, and the items are the only demand signal before a quote.</span>
            </div>

            <div className="ordl-tabs">
              {VISIT_VIEWS.map(v => {
                const on = v.id === view;
                const n = visits.filter(x => inView(x, v.id)).length;
                return (
                  <button key={v.id} className={'ordl-tab' + (on ? ' active' : '')} onClick={() => setView(v.id)}>
                    <span className="ordl-tab-row">
                      <span className="ordl-tab-label">{v.label}</span>
                      <span className="ordl-tab-n">{n}</span>
                    </span>
                    <span className="ordl-tab-hint">{v.hint.toUpperCase()}</span>
                  </button>
                );
              })}
            </div>

            <div className="ordl-filters">
              <select value={repFilter} onChange={e => setRepFilter(e.target.value)} className="ordl-chip">
                <option value="">Any rep</option>
                {reps.map(r => <option key={r} value={r}>{r}</option>)}
              </select>
              <input className="ordl-search" value={q} onChange={e => setQ(e.target.value)} placeholder="filter visits…" />
            </div>

            <div className="ordl-scroll">
              <div style={{ minWidth: 680 }}>
                <div className="ordl-head" style={{ gridTemplateColumns: COLS }}>
                  <span>CUSTOMER</span><span>WHEN</span><span>ITEMS VIEWED</span><span>REP</span><span>STATE</span>
                </div>
                {loading && <div className="opsq-empty">loading visits…</div>}
                {!loading && rows.length === 0 && <div className="opsq-empty">no visits in this view</div>}
                {rows.map(v => {
                  const on = v.id === activeId;
                  const st = VISIT_STATE[visitState(v)];
                  const reachable = !!v.customer_email;
                  return (
                    <div key={v.id} className={'ordl-row' + (on ? ' active' : '')}
                      onClick={() => { if (window.innerWidth < 1100) navigate('visit-detail', v.id); else setSel(v.id); }}>
                      <div className="ordl-grid" style={{ gridTemplateColumns: COLS }}>
                        <span style={{ minWidth: 0 }}>
                          <span className="ordl-cust" style={{ color: reachable ? undefined : 'var(--gold)' }}>{v.customer_name || 'walk-in'}</span>
                          <span className="ordl-co">{v.customer_email || v.customer_phone || 'no contact captured'}</span>
                        </span>
                        <span style={{ font: '400 10px/1.4 var(--mono)', color: 'var(--dim)' }}>
                          {dfmt(v.created_at)}
                          <span style={{ display: 'block', color: 'var(--faint)' }}>{tfmt(v.created_at)}</span>
                        </span>
                        <span style={{ minWidth: 0 }}>
                          <span style={{ display: 'block', font: '400 12px/1.35 var(--sans)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{(v.item_names || []).join(', ') || '—'}</span>
                          <span style={{ display: 'block', marginTop: 3, font: '400 10px/1 var(--mono)', color: 'var(--faint)' }}>{v.item_count} item{v.item_count === 1 ? '' : 's'}</span>
                        </span>
                        <span style={{ font: '400 10px/1.3 var(--mono)', color: 'var(--dim)' }}>{v.rep_name || '—'}</span>
                        <span style={{ display: 'flex', alignItems: 'center', gap: 7, font: '400 10px/1 var(--mono)', letterSpacing: '0.06em', color: st.c }}>
                          <span className="ops-dot" style={{ width: 5, height: 5, background: st.c, flexShrink: 0 }} />{st.t}
                        </span>
                      </div>
                      <div className="ordl-sub">
                        {!reachable && (
                          <span style={{ font: '400 10px/1 var(--mono)', letterSpacing: '0.06em', color: 'var(--hot)', flexShrink: 0, whiteSpace: 'nowrap' }}>
                            NO EMAIL · {visitMissing(v)} FIELD{visitMissing(v) === 1 ? '' : 'S'} MISSING
                          </span>
                        )}
                        <span className="ordl-blocker">{visitFollowLine(v, dfmt)}</span>
                        <span className="ordl-rep">{v.sent_at && v.expires_at ? 'recap exp ' + dfmt(v.expires_at) : ''}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="ordl-foot">
              <span style={{ letterSpacing: '0.08em' }}>{rows.length} VISITS</span>
              <span style={{ color: unreachable ? 'var(--hot)' : 'var(--dim)' }}>{unreachable} unreachable</span>
              <span style={{ color: 'var(--dim)' }}>{rows.length ? Math.round(engaged / rows.length * 100) : 0}% engaged</span>
            </div>
          </section>

          <aside className="ordl-pane">
            {!activeRow ? (
              <div style={{ flex: 1, display: 'grid', placeItems: 'center', font: '400 12px/1 var(--mono)', color: 'var(--faint)' }}>NO VISIT SELECTED</div>
            ) : (() => {
              const st = VISIT_STATE[visitState(activeRow)];
              const reachable = !!activeRow.customer_email;
              return (
                <React.Fragment>
                  <div className="ordl-pane-head">
                    <div className="opsq-meta">
                      <span style={{ color: st.c }}>{st.t}</span>
                      {!reachable && <span style={{ color: 'var(--hot)' }}>UNREACHABLE</span>}
                      <span style={{ marginLeft: 'auto', color: 'var(--faint)' }}>{activeRow.rep_name || ''}</span>
                    </div>
                    <h1 className="ordl-pane-title" style={{ color: reachable ? undefined : 'var(--gold)' }}>{activeRow.customer_name || 'walk-in'}</h1>
                    <div className="ordl-pane-meta">
                      <span>{dfmt(activeRow.created_at)} · {tfmt(activeRow.created_at)}</span>
                      <span>{activeRow.item_count} item{activeRow.item_count === 1 ? '' : 's'}</span>
                    </div>
                    <div className="ordl-next" style={{ borderLeftColor: reachable ? st.c : 'var(--hot)' }}>
                      <div className="opsq-block-label" style={{ marginBottom: 0 }}>{reachable ? 'FOLLOW-UP' : 'CANNOT FOLLOW UP'}</div>
                      <div style={{ marginTop: 6, font: '400 12px/1.5 var(--sans)', textWrap: 'pretty' }}>
                        {reachable ? visitFollowLine(activeRow, dfmt)
                          : 'No email was captured, so the recap cannot send. ' + activeRow.item_count + ' item' + (activeRow.item_count === 1 ? '' : 's') + ' viewed with no way to reach the customer.'}
                      </div>
                    </div>
                  </div>
                  <div className="opsq-pane-body">
                    <OpsBlock label="Customer info · everything collected">
                      <div className="opsq-facts">
                        {[
                          ['Name', activeRow.customer_name || '—'],
                          ['Email', activeRow.customer_email || '—'],
                          ['Phone', activeRow.customer_phone || '—'],
                          ['Account', activeRow.customer_id ? 'linked' : 'none'],
                        ].map(m => (
                          <div key={m[0]} className="opsq-fact">
                            <div className="opsq-fact-k">{m[0]}</div>
                            <div className="opsq-fact-v" style={m[1] === '—' || m[1] === 'none' ? { color: 'var(--hot)' } : undefined}>{m[1]}</div>
                          </div>
                        ))}
                      </div>
                    </OpsBlock>
                    <OpsBlock label={'Item info · ' + activeRow.item_count + ' viewed'}>
                      {(activeRow.item_names || []).length === 0 ? (
                        <div style={{ font: '400 11px/1.5 var(--mono)', color: 'var(--faint)' }}>no items logged</div>
                      ) : (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                          {activeRow.item_names.map((n, i) => (
                            <div key={i} style={{ font: '400 12px/1.35 var(--sans)' }}>{n}</div>
                          ))}
                        </div>
                      )}
                    </OpsBlock>
                    {activeRow.customer_id && (
                      <OpsBlock label="Account">
                        <button className="rb-action" style={{ marginLeft: 0 }} onClick={() => navigate('customer-detail', 'retail_' + activeRow.customer_id)}>
                          Open customer record
                        </button>
                      </OpsBlock>
                    )}
                  </div>
                  <div className="ordl-pane-foot">
                    <button className="opsq-primary" style={{ marginTop: 0, flex: 1, width: 'auto' }} onClick={() => navigate('visit-detail', activeRow.id)}>
                      <span>Open visit</span>
                    </button>
                    <button className="opsq-alt" onClick={() => copyLink(activeRow)}>{copied ? 'Copied' : 'Copy link'}</button>
                  </div>
                </React.Fragment>
              );
            })()}
          </aside>
        </div>
      );
    }

    // ========== VisitDetailView ==========
    // Two kinds of data, two panels: customer info (editable — the admin fixes
    // what the rep failed to capture) and item info (the demand signal).
    function VisitFieldInput({ label, value, placeholder, onChange, bad }) {
      return (
        <div>
          <div style={{ font: '400 9px/1 var(--mono)', letterSpacing: '0.14em', color: bad ? 'var(--hot)' : 'var(--faint)' }}>{label}{bad ? ' · MISSING' : ''}</div>
          <input value={value} placeholder={placeholder} onChange={e => onChange(e.target.value)}
            style={{ marginTop: 8, width: '100%', boxSizing: 'border-box', padding: '10px 11px', background: 'var(--bg)', border: '1px solid ' + (bad ? 'var(--hot)' : 'var(--line2)'), color: 'var(--ink)', font: '400 13px/1 var(--mono)', outline: 'none' }} />
        </div>
      );
    }
    function VisitDetailView({ navigate, editId, staffRole }) {
      const [visit, setVisit] = useState(null);
      const [items, setItems] = useState([]);
      const [loading, setLoading] = useState(true);
      const [tab, setTab] = useState('record');
      const [eName, setEName] = useState(null);
      const [eEmail, setEEmail] = useState(null);
      const [ePhone, setEPhone] = useState(null);
      const [eCompany, setECompany] = useState(null);
      const [saving, setSaving] = useState(false);
      const [sending, setSending] = useState(false);
      const [copied, setCopied] = useState(false);

      const load = () => {
        adminFetch('/api/admin/visits/' + editId)
          .then(d => { setVisit(d.visit); setItems(d.items || []); setLoading(false); })
          .catch(() => setLoading(false));
      };
      useEffect(() => {
        setLoading(true); setTab('record');
        setEName(null); setEEmail(null); setEPhone(null); setECompany(null);
        load();
      }, [editId]);

      if (loading) return <div className="recd-page"><div className="opsq-empty">loading visit record…</div></div>;
      if (!visit) return <div className="recd-page"><div className="opsq-empty">visit not found</div></div>;

      const dfmt = ts => ts ? new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
      const dtfmt = ts => ts ? (new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' · ' + new Date(ts).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })) : '';
      const money = n => n == null ? '—' : '$' + parseFloat(n).toFixed(2);

      const N = eName === null ? (visit.customer_name || '') : eName;
      const E = eEmail === null ? (visit.customer_email || '') : eEmail;
      const P = ePhone === null ? (visit.customer_phone || '') : ePhone;
      const C = eCompany !== null ? eCompany : (visit.company_name || '');
      const dirty = N !== (visit.customer_name || '') || E !== (visit.customer_email || '') || P !== (visit.customer_phone || '') || C !== (visit.company_name || '');
      const emailOk = E.includes('@');
      const gaps = (emailOk ? 0 : 1) + (P ? 0 : 1);
      const st = VISIT_STATE[visitState(visit)];
      const outcome = visit.quote_requested_at ? 'quote asked' : visit.items_carted_at ? 'carted' : 'none';
      const show = k => tab === 'record' ? true : (k === 'customer' ? tab === 'customer info' : tab === 'item info');

      const saveContact = (thenSend) => {
        setSaving(true);
        adminFetch('/api/admin/visits/' + editId + '/contact', {
          method: 'PUT',
          body: JSON.stringify({ customer_name: N.trim(), customer_email: E.trim(), customer_phone: P.trim(), company_name: (eCompany !== null ? eCompany : (visit.company_name || null)) })
        })
          .then(() => {
            setSaving(false); setEName(null); setEEmail(null); setEPhone(null); setECompany(null);
            if (thenSend) return sendRecap(true);
            load();
          })
          .catch(err => { setSaving(false); alert(err.message); });
      };

      const sendRecap = (skipConfirm) => {
        if (!skipConfirm && !confirm('Send the recap email to ' + (E || visit.customer_email) + '?')) return;
        setSending(true);
        adminFetch('/api/admin/visits/' + editId + '/send', { method: 'POST', body: JSON.stringify({}) })
          .then(() => { setSending(false); load(); })
          .catch(err => { setSending(false); alert(err.message); load(); });
      };

      const copyLink = () => {
        navigator.clipboard.writeText(visitRecapUrl(visit)).then(() => {
          setCopied(true); setTimeout(() => setCopied(false), 1800);
        });
      };

      const followLine = visitFollowLine(visit, dfmt);
      const bandColor = visit.customer_email ? st.c : 'var(--hot)';

      return (
        <div className="recd-page">
          <div className="recd-head">
            <div className="recd-top">
              <div style={{ minWidth: 0 }}>
                <div className="opsq-meta">
                  <button className="recd-crumb" onClick={() => navigate('visits')}>← VISITS</button>
                  <span style={{ color: 'var(--faint)' }}>/</span>
                  <span style={{ color: st.c }}>{st.t}</span>
                  {!visit.customer_email && <span style={{ color: 'var(--hot)' }}>UNREACHABLE</span>}
                </div>
                <h1 className="recd-title">{visit.customer_name || 'walk-in'}</h1>
                <div className="recd-meta">
                  <span>{dtfmt(visit.created_at)}</span>
                  {visit.rep_name && <span>{visit.rep_name}</span>}
                  {visit.customer_email && <span>{visit.customer_email}</span>}
                  {visit.customer_phone && <span>{visit.customer_phone}</span>}
                </div>
              </div>
              <div style={{ marginLeft: 'auto', display: 'flex', gap: 26, flexShrink: 0 }}>
                {[['ITEMS VIEWED', String(items.length), false],
                  ['FIELDS MISSING', String(gaps), gaps > 0],
                  ['OUTCOME', outcome, outcome === 'none']].map(k => (
                  <div key={k[0]} style={{ textAlign: 'right' }}>
                    <div className="opsq-block-label" style={{ marginBottom: 0 }}>{k[0]}</div>
                    <div className="recd-value" style={{ fontSize: 20, color: k[2] ? 'var(--hot)' : undefined }}>{k[1]}</div>
                  </div>
                ))}
              </div>
              <div style={{ display: 'flex', gap: 8, alignSelf: 'center', flexShrink: 0, flexWrap: 'wrap' }}>
                {visit.customer_email && (
                  <button className="opsq-alt" disabled={sending} onClick={() => sendRecap(false)}>
                    {sending ? 'Sending…' : (visit.sent_at ? 'Resend recap' : 'Send recap')}
                  </button>
                )}
                <button className="opsq-alt" onClick={copyLink}>{copied ? 'Copied' : 'Copy recap link'}</button>
              </div>
            </div>
            <div className="recd-tabs">
              {['record', 'customer info', 'item info'].map(t => (
                <button key={t} className={'recd-tab' + (tab === t ? ' active' : '')} onClick={() => setTab(t)}>{t}</button>
              ))}
            </div>
          </div>

          <div className="recd-scroll">
          <div className="rec-body">
          <div className="rec-left">

          {show('customer') && (
            <div className="recd-exception" style={{ borderLeftColor: bandColor }}>
              <div className="recd-exc-head">
                <span style={{ color: bandColor }}>{visit.customer_email ? 'FOLLOW-UP' : 'CANNOT FOLLOW UP'}</span>
                <span style={{ marginLeft: 'auto', color: dirty ? 'var(--gold)' : 'var(--faint)' }}>
                  {dirty ? (emailOk ? 'SAVE TO MAKE REACHABLE' : 'STILL NO VALID EMAIL') : followLine.toUpperCase()}
                </span>
              </div>
              <div style={{ marginTop: 11, maxWidth: '62ch', font: '400 14px/1.55 var(--sans)', textWrap: 'pretty' }}>
                {dirty
                  ? (emailOk
                    ? 'Preview — on save this visit becomes reachable and the recap can send with all ' + items.length + ' item' + (items.length === 1 ? '' : 's') + '.'
                    : 'Preview — the email is still not valid, so nothing can send.')
                  : visit.customer_email
                  ? items.length + ' item' + (items.length === 1 ? ' is' : 's are') + ' recorded against a reachable customer. ' + (outcome === 'none' ? 'Nothing has come of this visit yet.' : followLine + '.')
                  : 'The rep logged ' + items.length + ' item' + (items.length === 1 ? '' : 's') + ' but no email. The recap cannot send and the items never reach a quote.'}
              </div>
            </div>
          )}

          {show('customer') && <div className="form-card">
            <h3>Customer info · the only customer data a visit collects</h3>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 18 }}>
              <VisitFieldInput label="NAME" value={N} placeholder="none captured" onChange={setEName} bad={!N.trim()} />
              <VisitFieldInput label="EMAIL" value={E} placeholder="none captured" onChange={setEEmail} bad={!emailOk} />
              <VisitFieldInput label="PHONE" value={P} placeholder="none captured" onChange={v => setEPhone(formatPhone(v))} bad={!P} />
              <VisitFieldInput label="COMPANY (OPTIONAL)" value={C} placeholder="none captured" onChange={setECompany} />
            </div>
            {visit.message && (
              <div style={{ marginTop: 18 }}>
                <div style={{ font: '400 9px/1 var(--mono)', letterSpacing: '0.14em', color: 'var(--faint)' }}>PERSONAL MESSAGE ON THE RECAP</div>
                <div style={{ marginTop: 8, font: '400 12px/1.55 var(--sans)', color: 'var(--dim)', whiteSpace: 'pre-wrap' }}>{visit.message}</div>
              </div>
            )}
          </div>}

          {show('customer') && <div className="form-card">
            <h3>Account</h3>
            {visit.customer_id ? (
              <p style={{ margin: 0, maxWidth: '60ch', font: '400 13px/1.6 var(--sans)', textWrap: 'pretty' }}>
                Attached to a customer account — the visit shows on that record.{' '}
                <button className="rb-action" style={{ marginLeft: 0 }} onClick={() => navigate('customer-detail', 'retail_' + visit.customer_id)}>Open customer record</button>
              </p>
            ) : (
              <p style={{ margin: 0, maxWidth: '60ch', font: '400 13px/1.6 var(--sans)', color: 'var(--dim)', textWrap: 'pretty' }}>
                No account is linked. Visits logged with an email auto-create one; this visit sits outside the customer book.
              </p>
            )}
          </div>}

          {show('items') && <div className="form-card">
            <h3>Item info · {items.length} viewed</h3>
            {items.length === 0 ? (
              <div style={{ font: '400 11px/1.5 var(--mono)', color: 'var(--faint)' }}>no items logged on this visit</div>
            ) : (
              <div style={{ display: 'flex', flexDirection: 'column' }}>
                <div style={{ display: 'grid', gridTemplateColumns: 'minmax(160px, 1.4fr) minmax(80px, 110px) minmax(140px, 1.3fr)', gap: 14, padding: '0 0 8px', font: '400 9px/1 var(--mono)', letterSpacing: '0.1em', color: 'var(--faint)', borderBottom: '1px solid var(--line2)' }}>
                  <span>ITEM</span><span style={{ textAlign: 'right' }}>PRICE</span><span>REP NOTE</span>
                </div>
                {items.map(i => (
                  <div key={i.id} style={{ padding: '11px 0', display: 'grid', gridTemplateColumns: 'minmax(160px, 1.4fr) minmax(80px, 110px) minmax(140px, 1.3fr)', gap: 14, alignItems: 'center', borderBottom: '1px solid var(--line)' }}>
                    <span style={{ minWidth: 0, display: 'flex', alignItems: 'center', gap: 10 }}>
                      {i.primary_image && <img src={i.primary_image} alt="" style={{ width: 36, height: 36, objectFit: 'cover', flexShrink: 0 }} onError={e => { e.target.style.display = 'none'; }} />}
                      <span style={{ minWidth: 0 }}>
                        {formatLineItem(i).brand && <span style={{ display: 'block', marginBottom: 3, font: '400 10px/1 var(--mono)', color: 'var(--faint)' }}>{formatLineItem(i).brand}</span>}
                        <span style={{ display: 'block', font: '400 13px/1.35 var(--sans)' }}>{formatLineItem(i).name}</span>
                        <span style={{ display: 'block', marginTop: 3, font: '400 10px/1 var(--mono)', color: 'var(--faint)' }}>{formatLineItem(i).sku || '—'}</span>
                      </span>
                    </span>
                    <span style={{ font: '400 11px/1.3 var(--mono)', textAlign: 'right', color: i.retail_price == null ? 'var(--faint)' : undefined }}>
                      {money(i.retail_price)}{i.retail_price != null && i.price_basis === 'per_sqft' ? '/sf' : ''}
                    </span>
                    <span style={{ font: '400 12px/1.5 var(--sans)', color: 'var(--dim)', textWrap: 'pretty' }}>{i.rep_note || '—'}</span>
                  </div>
                ))}
              </div>
            )}
          </div>}

          </div>

          <div className="rec-right">

          <div className="form-card">
            <h3>Visit</h3>
            <div className="rb-facts">
              {[
                ['Logged', dtfmt(visit.created_at)],
                ['Rep', visit.rep_name || '—'],
                ['Items', String(items.length)],
                ['Recap', visit.sent_at ? 'sent ' + dfmt(visit.sent_at) : 'not sent'],
              ].concat(visit.opened_at ? [['Opened', dfmt(visit.opened_at)]] : [])
               .concat(visit.items_carted_at ? [['Carted', dfmt(visit.items_carted_at)]] : [])
               .concat(visit.quote_requested_at ? [['Quote asked', dfmt(visit.quote_requested_at)]] : [])
               .concat(visit.sent_at && visit.expires_at ? [['Link expires', dfmt(visit.expires_at)]] : [])
               .map(([k, v]) => (
                <div key={k} className="rb-fact"><span className="rb-fact-k">{k}</span><span className="rb-fact-v">{v}</span></div>
              ))}
            </div>
          </div>

          {visit.quote_requested_at && (
            <div className="form-card">
              <h3>Quote request</h3>
              <div style={{ font: '400 12px/1.55 var(--sans)', textWrap: 'pretty' }}>
                Asked for a quote from the recap on {dfmt(visit.quote_requested_at)}.
                {visit.quote_request_message ? ' Their note:' : ''}
              </div>
              {visit.quote_request_message && (
                <div style={{ marginTop: 8, padding: '9px 11px', background: 'var(--bg)', borderLeft: '2px solid var(--green)', font: '400 12px/1.55 var(--sans)', whiteSpace: 'pre-wrap' }}>{visit.quote_request_message}</div>
              )}
            </div>
          )}

          <div className="form-card">
            <h3>Captured</h3>
            <div className="rb-facts">
              {[
                ['Name', visit.customer_name || '—'],
                ['Email', visit.customer_email || '—'],
                ['Phone', visit.customer_phone || '—'],
