    // ========== VendorDetailView ==========
    function VendorDetailView({ navigate, editId }) {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      const fmtMoney = v => '$' + Number(v || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const fmtDate = v => v ? new Date(v).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : '—';

      const load = () => {
        setLoading(true);
        adminFetch('/api/admin/vendors/' + editId)
          .then(d => { setData(d); setLoading(false); })
          .catch(err => { setError(err.message); setLoading(false); });
      };
      useEffect(load, [editId]);

      const toggleActive = () => {
        adminFetch('/api/admin/vendors/' + editId + '/toggle', { method: 'PATCH' })
          .then(d => { if (d.vendor) setData(prev => ({ ...prev, vendor: { ...prev.vendor, is_active: d.vendor.is_active } })); })
          .catch(() => {});
      };

      const togglePublicName = () => {
        adminFetch('/api/admin/vendors/' + editId + '/toggle-public-name', { method: 'PATCH' })
          .then(d => { if (d.vendor) setData(prev => ({ ...prev, vendor: { ...prev.vendor, hide_public_name: d.vendor.hide_public_name } })); })
          .catch(() => {});
      };

      // Brand public-name state (hide_public_name) comes from /api/admin/brands, not the
      // vendor-detail payload — fetch it so we can surface a per-brand toggle here.
      const [brandFlags, setBrandFlags] = useState({});
      useEffect(() => {
        adminFetch('/api/admin/brands')
          .then(d => {
            const map = {};
            (d.brands || []).forEach(b => { map[b.id] = !!b.hide_public_name; });
            setBrandFlags(map);
          })
          .catch(() => {});
      }, [editId]);

      const toggleBrandPublicName = (e, brandId) => {
        e.stopPropagation();
        adminFetch('/api/admin/brands/' + brandId + '/toggle-public-name', { method: 'PATCH' })
          .then(d => { if (d.brand) setBrandFlags(prev => ({ ...prev, [brandId]: !!d.brand.hide_public_name })); })
          .catch(() => {});
      };

      const [editingContact, setEditingContact] = useState(null); // null=none, 'new', or contact id
      const [contactForm, setContactForm] = useState({ name: '', role: '', email: '', phone: '', is_primary: false, notes: '' });
      const [savingContact, setSavingContact] = useState(false);

      const startNewContact = () => { setContactForm({ name: '', role: '', email: '', phone: '', is_primary: false, notes: '' }); setEditingContact('new'); };
      const startEditContact = (c) => { setContactForm({ name: c.name || '', role: c.role || '', email: c.email || '', phone: formatPhone(c.phone || ''), is_primary: !!c.is_primary, notes: c.notes || '' }); setEditingContact(c.id); };
      const cancelContact = () => setEditingContact(null);

      const saveContact = async () => {
        if (!contactForm.name.trim()) { alert('Contact name is required'); return; }
        setSavingContact(true);
        try {
          const isNew = editingContact === 'new';
          const url = '/api/admin/vendors/' + editId + '/contacts' + (isNew ? '' : '/' + editingContact);
          await adminFetch(url, { method: isNew ? 'POST' : 'PUT', body: JSON.stringify(contactForm) });
          setEditingContact(null);
          load();
        } catch (err) { alert('Save failed: ' + err.message); }
        finally { setSavingContact(false); }
      };

      const deleteContact = async (c) => {
        if (!confirm('Delete contact ' + c.name + '?')) return;
        try { await adminFetch('/api/admin/vendors/' + editId + '/contacts/' + c.id, { method: 'DELETE' }); load(); }
        catch (err) { alert('Delete failed: ' + err.message); }

      if (loading) return <div className="loading">Loading vendor...</div>;
      if (error || !data) return (

          <button className="recd-crumb" onClick={() => navigate('vendors')}>← VENDORS</button>

          <span style={{ color: 'var(--stone-500)', fontSize: '0.8125rem', whiteSpace: 'nowrap' }}>{label}</span>
          <span style={{ textAlign: 'right', fontSize: '0.875rem', fontWeight: 500 }}>
            {value
              ? (isLink ? <a href={/^https?:/.test(value) ? value : 'https://' + value} target="_blank" rel="noopener noreferrer" style={{ color: 'var(--gold, #b8863b)' }}>{value}</a> : value)
              : <span style={{ color: 'var(--stone-300)', fontWeight: 400 }}>—</span>}
          </span>
        </div>
      );

      return (
        <div>
          <button className="recd-crumb" onClick={() => navigate('vendors')}>← VENDORS</button>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(320px, 1fr))', gap: '1.25rem', alignItems: 'start' }}>

              {infoRow('Phone', v.phone)}
              {infoRow('Website', v.website, true)}
              {infoRow('Address', v.address)}
              {infoRow('Account #', v.account_number)}
            </div>

            <div className="form-card">
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <h3 style={{ margin: 0 }}>Contacts {data.contacts && data.contacts.length ? '(' + data.contacts.length + ')' : ''}</h3>
                {editingContact === null && <button className="btn btn-secondary btn-sm" onClick={startNewContact}>+ Add Contact</button>}

              <div style={{ marginTop: '0.75rem' }}>
                {(data.contacts || []).map(c => (

                      <div style={{ minWidth: 0 }}>

                      </div>
                      <div style={{ display: 'flex', gap: '0.35rem', flexShrink: 0 }}>
                        <button className="btn btn-secondary btn-sm" onClick={() => startEditContact(c)}>Edit</button>
                        <button className="btn btn-secondary btn-sm" onClick={() => deleteContact(c)} style={{ color: 'var(--red, #b4453a)' }}>✕</button>

                  )
                ))}
                {editingContact === 'new' && <ContactEditor form={contactForm} setForm={setContactForm} onSave={saveContact} onCancel={cancelContact} saving={savingContact} />}

    // ========== VendorFormView ==========
    function VendorFormView({ navigate, editId }) {
      const emptyForm = { name: '', code: '', website: '', email: '', phone: '', address: '', account_number: '', notes: '' };
      const [form, setForm] = useState(emptyForm);
      const [loading, setLoading] = useState(!!editId);
      const [saving, setSaving] = useState(false);

      useEffect(() => {
        if (editId) {
          adminFetch('/api/admin/vendors/' + editId)
            .then(data => {
              const v = data.vendor;
              if (v) setForm({
                name: v.name || '', code: v.code || '', website: v.website || '', email: v.email || '',
                phone: formatPhone(v.phone || ''), address: v.address || '',
                account_number: v.account_number || '', notes: v.notes || ''
              });
              setLoading(false);
            })
            .catch(() => setLoading(false));
        }
      }, [editId]);

      const set = (key) => (e) => setForm(prev => ({ ...prev, [key]: e.target.value }));

      const handleSave = async () => {
        if (!form.name.trim() || !form.code.trim()) { alert('Name and code are required'); return; }
        setSaving(true);
        try {
          if (editId) {
            await adminFetch('/api/admin/vendors/' + editId, { method: 'PUT', body: JSON.stringify(form) });
            navigate('vendor-detail', editId);
          } else {
            const res = await adminFetch('/api/admin/vendors', { method: 'POST', body: JSON.stringify(form) });
            navigate('vendor-detail', res.vendor.id);
          }
        } catch (err) {
          alert('Save failed: ' + err.message);
        } finally {
          setSaving(false);
        }
      };

      if (loading) return <div className="loading">Loading vendor...</div>;

      return (
        <div>
          <div className="content-header">
            <h1>{editId ? 'Edit Vendor' : 'New Vendor'}</h1>
            <div style={{ display: 'flex', gap: '0.75rem' }}>
              <button className="btn btn-secondary" onClick={() => navigate(editId ? 'vendor-detail' : 'vendors', editId)}>Cancel</button>
              <button className="btn btn-primary" onClick={handleSave} disabled={saving}>
                {saving ? 'Saving...' : 'Save Vendor'}
              </button>
            </div>
          </div>
          <div className="form-card">
            <h3>Identity</h3>
            <div className="form-grid">
              <div className="form-group">
                <label>Vendor Name *</label>
                <input value={form.name} onChange={set('name')} placeholder="e.g. MSI Surfaces" />
              </div>
              <div className="form-group">
                <label>Code *</label>
                <input value={form.code} maxLength={6}
                  onChange={e => setForm(f => ({ ...f, code: e.target.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase().slice(0, 6) }))}
                  placeholder="e.g. DAL" />
                <span style={{ fontSize: '0.75rem', color: 'var(--stone-500)' }}>Internal mnemonic — 2–6 letters/digits. Customers see an auto-assigned 3-digit code.</span>
              </div>
              <div className="form-group full">
                <label>Website</label>
                <input value={form.website} onChange={set('website')} placeholder="https://..." />
              </div>
            </div>
          </div>
          <div className="form-card">
            <h3>Account &amp; Company</h3>
            {editId && <p style={{ margin: '0 0 0.75rem', fontSize: '0.8125rem', color: 'var(--stone-500)' }}>Contacts (reps) are managed on the vendor detail page.</p>}
            <div className="form-grid">
              <div className="form-group">
                <label>Order / AR Email</label>
                <input type="email" value={form.email} onChange={set('email')} placeholder="orders@vendor.com" />
              </div>
              <div className="form-group">
                <label>Phone</label>
                <input value={form.phone} onChange={e => setForm(prev => ({ ...prev, phone: formatPhone(e.target.value) }))} placeholder="(714) 555-0100" />
              </div>
              <div className="form-group">
                <label>Account Number</label>
                <input value={form.account_number} onChange={set('account_number')} placeholder="Our account # with this vendor" />
              </div>
              <div className="form-group full">
                <label>Address</label>
                <input value={form.address} onChange={set('address')} placeholder="Street, City, State ZIP" />
              </div>
            </div>
          </div>
          <div className="form-card">
            <h3>Notes</h3>
            <div className="form-group full">
              <textarea value={form.notes} onChange={set('notes')} rows="4" placeholder="Internal notes about this vendor..."
                style={{ width: '100%', padding: '0.6rem 0.75rem', border: '1px solid var(--stone-200)', borderRadius: '6px', fontFamily: 'inherit', fontSize: '0.875rem', resize: 'vertical' }} />
            </div>
          </div>
        </div>
      );
    }

    // ========== OrdersListView ==========
    // Saved views + stage ladder derived from real order/PO/payment state
    const ORDER_STAGES = ['Placed', 'Confirmed', 'POs issued', 'Vendor OK', 'Fulfillment', 'Delivered', 'Paid'];
    const ORDER_VIEWS = [
      { id: 'active', label: 'Active', hint: 'in flight' },
      { id: 'risk', label: 'At risk', hint: 'late or blocked' },
      { id: 'vendor', label: 'Awaiting vendor', hint: 'POs unconfirmed' },
      { id: 'pickup', label: 'Awaiting pickup', hint: 'staged at store' },
      { id: 'unpaid', label: 'Unpaid', hint: 'delivered, balance open' },
      { id: 'closed', label: 'Closed', hint: 'done or cancelled' },
    ];
    const ORDL_RISK = { breach: 'var(--hot)', today: 'var(--gold)', ok: 'var(--cool)' };
    const ORDL_RISK_LABEL = { breach: 'BLOCKED', today: 'NEEDS ACTION', ok: 'ON TRACK' };

    function OrdlStageBar({ i, status }) {
      if (status === 'cancelled' || status === 'refunded') {
        return <span style={{ font: '400 10px/1 var(--mono)', letterSpacing: '0.08em', color: 'var(--faint)' }}>{status.toUpperCase()}</span>;
      }
      return (
        <span style={{ display: 'block' }}>
          <span style={{ display: 'flex', gap: 2 }}>
            {ORDER_STAGES.map((s, n) => (
              <span key={s} style={{ flex: 1, height: 4, background: n < i ? 'var(--dim)' : n === i ? 'var(--gold)' : 'var(--line)' }} />
            ))}
          </span>
          <span style={{ display: 'block', marginTop: 6, font: '400 10px/1 var(--mono)', color: 'var(--dim)' }}>{ORDER_STAGES[i]}</span>
        </span>
      );
    }
    function OrdersListView({ navigate }) {
      const [orders, setOrders] = useState([]);
      const [loading, setLoading] = useState(true);
      const [view, setView] = useState('active');
      const [q, setQ] = useState('');
      const [repFilter, setRepFilter] = useState('');
      const [sortByValue, setSortByValue] = useState(false);
      const [sel, setSel] = useState(null);
      const [pane, setPane] = useState(null);
      const [paneLoading, setPaneLoading] = useState(false);

      useEffect(() => {
        adminFetch('/api/admin/orders/ledger')
          .then(d => { setOrders(d.orders || []); setLoading(false); })
          .catch(() => setLoading(false));
      }, []);

      const reps = [...new Set(orders.map(o => o.rep_name).filter(Boolean))].sort();
      const rows = orders
        .filter(o => o.views.includes(view))
        .filter(o => !repFilter || o.rep_name === repFilter)
        .filter(o => !q || (o.order_number + ' ' + o.customer_name + ' ' + (o.customer_email || '') + ' ' + (o.trade_company || '') + ' ' + o.blocker).toLowerCase().includes(q.toLowerCase()))
        .sort((a, b) => sortByValue ? parseFloat(b.total) - parseFloat(a.total) : new Date(b.created_at) - new Date(a.created_at));

      const activeId = rows.some(r => r.id === sel) ? sel : (rows[0] ? rows[0].id : null);
      const activeRow = orders.find(o => o.id === activeId) || null;
      const openValue = rows.reduce((s, o) => s + parseFloat(o.total || 0), 0);
      const fmt = n => '$' + parseFloat(n || 0).toLocaleString('en-US', { maximumFractionDigits: 0 });
      const dfmt = ts => ts ? new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';

      useEffect(() => {
        if (!activeId) { setPane(null); return; }
        let dead = false;
        setPaneLoading(true);
        Promise.all([
          adminFetch(`/api/admin/orders/${activeId}`),
          adminFetch(`/api/admin/orders/${activeId}/purchase-orders`),
          adminFetch(`/api/admin/orders/${activeId}/activity`),
        ]).then(([detail, pos, act]) => {
          if (dead) return;
          setPane({ detail, pos: pos.purchase_orders || [], activity: act.activity || [] });
          setPaneLoading(false);
        }).catch(() => { if (!dead) { setPane(null); setPaneLoading(false); } });
        return () => { dead = true; };
      }, [activeId]);

      const keyDate = o =>
        o.status === 'shipped' ? 'Shipped ' + dfmt(o.shipped_at || o.created_at) :
        o.status === 'ready_for_pickup' ? 'Ready · staged' :
        'Placed ' + dfmt(o.created_at);

      const COLS = 'minmax(84px, 110px) minmax(120px, 1fr) minmax(70px, 90px) minmax(110px, 140px) minmax(90px, 110px)';

      return (
        <div className="ordl">
          <section className="ordl-main">
            <div className="ordl-tabs">
              {ORDER_VIEWS.map(v => {
                const on = v.id === view;
                const n = orders.filter(o => o.views.includes(v.id)).length;
                return (
                  <button key={v.id} className={'ordl-tab' + (on ? ' active' : '')} onClick={() => setView(v.id)}>
                    <span className="ordl-tab-row">
                      <span className="ordl-tab-label">{v.label}</span>
                      <span className="ordl-tab-n">{n}</span>
                    </span>
                    <span className="ordl-tab-hint">{v.hint.toUpperCase()}</span>
                  </button>
                );
              })}
            </div>

            <div className="ordl-filters">
              <select value={repFilter} onChange={e => setRepFilter(e.target.value)} className="ordl-chip">
                <option value="">Any rep</option>
                {reps.map(r => <option key={r} value={r}>{r}</option>)}
              </select>
              <button className={'ordl-chip' + (sortByValue ? ' on' : '')} onClick={() => setSortByValue(s => !s)}>
                {sortByValue ? 'VALUE ↓' : 'NEWEST'}
              </button>
              <input className="ordl-search" value={q} onChange={e => setQ(e.target.value)} placeholder="filter orders…" />
            </div>

            <div className="ordl-scroll">
              <div style={{ minWidth: 640 }}>
                <div className="ordl-head" style={{ gridTemplateColumns: COLS }}>
                  <span>ORDER</span><span>CUSTOMER</span>
                  <span style={{ textAlign: 'right' }}>VALUE</span>
                  <span>STAGE</span><span>KEY DATE</span>
                </div>
                {loading && <div className="opsq-empty">loading orders…</div>}
                {!loading && rows.length === 0 && <div className="opsq-empty">no orders in this view</div>}
                {rows.map(o => {
                  const on = o.id === activeId;
                  return (
                    <div key={o.id} className={'ordl-row' + (on ? ' active' : '')}
                      onClick={() => { if (window.innerWidth < 1100) navigate('order-detail', o.id); else setSel(o.id); }}>
                      <div className="ordl-grid" style={{ gridTemplateColumns: COLS }}>
                        <span className="ordl-num">
                          <span className="ops-dot" style={{ width: 5, height: 5, background: ORDL_RISK[o.risk] }} />
                          {(o.order_number || '')}
                        </span>
                        <span style={{ minWidth: 0 }}>
                          <span className="ordl-cust">{o.customer_name}</span>
                          <span className="ordl-co">{o.trade_company || o.customer_email || 'Direct retail'}</span>
                        </span>
                        <span className="ordl-val">{fmt(o.total)}</span>
                        <OrdlStageBar i={o.stage} status={o.status} />
                        <span className="ordl-date">{keyDate(o)}</span>
                      </div>
                      <div className="ordl-sub">
                        {o.status !== 'cancelled' && o.status !== 'refunded' && (
                          <span style={{ color: ORDL_RISK[o.risk], font: '400 10px/1 var(--mono)', letterSpacing: '0.06em', flexShrink: 0 }}>
                            {ORDL_RISK_LABEL[o.risk]}
                          </span>
                        )}
                        <span className="ordl-blocker">{o.blocker}</span>
                        <span className="ordl-rep">{o.rep_name || 'house'}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="ordl-foot">
              <span style={{ letterSpacing: '0.08em' }}>{rows.length} ORDERS</span>
              <span style={{ color: 'var(--dim)' }}>{fmt(openValue)} {view === 'closed' ? 'closed' : 'open'} value</span>
            </div>
          </section>

          <aside className="ordl-pane">
            {!activeRow ? (
              <div style={{ flex: 1, display: 'grid', placeItems: 'center', font: '400 12px/1 var(--mono)', color: 'var(--faint)' }}>NO ORDER SELECTED</div>
            ) : (
              <React.Fragment>
                <div className="ordl-pane-head">
                  <div className="opsq-meta">
                    <span style={{ color: 'var(--ink)' }}>{activeRow.order_number}</span>
                    <span style={{ color: ORDL_RISK[activeRow.risk] }}>{ORDL_RISK_LABEL[activeRow.risk]}</span>
                    <span style={{ marginLeft: 'auto', color: 'var(--faint)' }}>{activeRow.rep_name || ''}</span>
                  </div>
                  <h1 className="ordl-pane-title">{activeRow.customer_name}</h1>
                  <div className="ordl-pane-meta">
                    <span>{activeRow.trade_company || activeRow.customer_email || 'Direct retail'}</span>
                    <span style={{ color: 'var(--ink)' }}>{fmt(activeRow.total)}</span>
                  </div>
                  <div className="ordl-next" style={{ borderLeftColor: ORDL_RISK[activeRow.risk] }}>
                    <div className="opsq-block-label" style={{ marginBottom: 0 }}>NEXT</div>
                    <div style={{ marginTop: 6, font: '400 12px/1.5 var(--sans)', textWrap: 'pretty' }}>{activeRow.blocker}</div>
                  </div>
                </div>
                <div className="opsq-pane-body">
                  {paneLoading && <div className="opsq-empty">loading record…</div>}
                  {!paneLoading && pane && (
                    <React.Fragment>
                      <OpsBlock label={`Lines · ${pane.detail.items.length}`}>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: 9 }}>
                          {pane.detail.items.map(l => (
                            <div key={l.id} style={{ display: 'grid', gridTemplateColumns: '1fr 66px 72px', gap: 10, alignItems: 'baseline' }}>
                              <span style={{ minWidth: 0 }}>
                                {formatLineItem(l).brand && <span style={{ display: 'block', marginBottom: 3, font: '400 9px/1 var(--mono)', color: 'var(--faint)' }}>{formatLineItem(l).brand}</span>}
                                <span style={{ display: 'block', font: '400 12px/1.35 var(--sans)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{formatLineItem(l).name}</span>
                                <span style={{ display: 'block', marginTop: 3, font: '400 9px/1 var(--mono)', color: 'var(--faint)' }}>{formatLineItem(l).sku || l.item_type || ''}</span>
                              </span>
                              <span style={{ font: '400 11px/1 var(--mono)', color: 'var(--dim)', textAlign: 'right' }}>
                                {l.item_type === 'labor' ? '—' : l.sqft_needed ? parseFloat(l.sqft_needed) + ' sf' : (l.num_boxes || 0) + (l.sell_by === 'unit' ? ' ea' : ' bx')}
                              </span>
                              <span style={{ font: '400 11px/1 var(--mono)', textAlign: 'right' }}>{fmt(l.subtotal)}</span>
                            </div>
                          ))}
                        </div>
                      </OpsBlock>
                      <OpsBlock label="Purchase orders">
                        {pane.pos.length === 0 ? (
                          <div style={{ font: '400 11px/1.5 var(--mono)', color: 'var(--faint)' }}>none issued</div>
                        ) : (
                          <div style={{ display: 'flex', flexDirection: 'column', gap: 9 }}>
                            {pane.pos.map(p => (
                              <div key={p.id} onClick={() => navigate('purchase-order-detail', p.id)} style={{ display: 'grid', gridTemplateColumns: '1fr 74px', gap: 10, alignItems: 'baseline', cursor: 'pointer' }}>
                                <span style={{ minWidth: 0 }}>
                                  <span style={{ display: 'block', font: '400 12px/1.35 var(--sans)' }}>{p.vendor_name}</span>
                                  <span style={{ display: 'block', marginTop: 3, font: '400 9px/1.4 var(--mono)', color: 'var(--dim)' }}>
                                    {p.po_number} · {p.status}{p.edi_ack_status ? ' · ack ' + p.edi_ack_status : ''}
                                  </span>
                                </span>
                                <span style={{ font: '400 11px/1 var(--mono)', textAlign: 'right' }}>{fmt(p.subtotal)}</span>
                              </div>
                            ))}
                          </div>
                        )}
                      </OpsBlock>
                      <OpsBlock label="Money">
                        <div className="opsq-facts">
                          {[
                            ['Total', fmt(activeRow.total)],
                            ['Paid', fmt(activeRow.amount_paid)],
                            ['Balance', fmt(activeRow.balance)],
                            ['Method', (activeRow.payment_method || '—') + ' · ' + (activeRow.delivery_method || 'shipping')],
                          ].map(m => (
                            <div key={m[0]} className="opsq-fact">
                              <div className="opsq-fact-k">{m[0]}</div>
                              <div className="opsq-fact-v">{m[1]}</div>
                            </div>
                          ))}
                        </div>
                      </OpsBlock>
                      <OpsBlock label="Trail">
                        {pane.activity.length === 0 ? (
                          <div style={{ font: '400 11px/1.5 var(--mono)', color: 'var(--faint)' }}>no activity recorded</div>
                        ) : (
                          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                            {pane.activity.slice(0, 6).map(t => (
                              <div key={t.id} style={{ display: 'grid', gridTemplateColumns: '54px 1fr', gap: 12 }}>
                                <span style={{ font: '400 10px/1.5 var(--mono)', color: 'var(--faint)' }}>{dfmt(t.created_at)}</span>
                                <span style={{ font: '400 12px/1.5 var(--sans)' }}>
                                  {(t.action || '').replace(/_/g, ' ')}{t.performer_name ? ' · ' + t.performer_name : ''}
                                </span>
                              </div>
                            ))}
                          </div>
                        )}
                      </OpsBlock>
                    </React.Fragment>
                  )}
                </div>
                <div className="ordl-pane-foot">
                  <button className="opsq-primary" style={{ marginTop: 0, flex: 1, width: 'auto' }} onClick={() => navigate('order-detail', activeRow.id)}>
                    <span>Open full record</span>
                  </button>
                </div>
              </React.Fragment>
            )}
          </aside>
        </div>
      );
    }

    // ========== QuotesListView ==========
    // Staff ledger over every rep's quote pipeline — same console grammar as orders
    const QUOTE_STAGES = ['Drafted', 'Sent', 'Viewed', 'Replied', 'Accepted', 'Converted'];
    const QUOTE_VIEWS = [
      { id: 'open', label: 'Open', hint: 'in market' },
      { id: 'hot', label: 'Hot', hint: 'opened 3+ times' },
      { id: 'expiring', label: 'Expiring', hint: 'closes within 7 days' },
      { id: 'accepted', label: 'Accepted', hint: 'awaiting conversion' },
      { id: 'converted', label: 'Won', hint: 'became orders' },
      { id: 'closed', label: 'Closed', hint: 'lost or expired' },
    ];
    const QTL_RISK_LABEL = { breach: 'GONE COLD', today: 'NEEDS ACTION', ok: 'ON TRACK' };
    const QUOTE_EVENT_LABELS = {
      sent: 'Quote sent', viewed: 'Opened by customer', reply: 'Customer reply', note: 'Internal note',
      accepted: 'Marked accepted', marked_lost: 'Marked lost', converted: 'Converted to order',
    };

    function QtlStageBar({ i, status, expired }) {
      if (status === 'declined' || expired) {
        return <span style={{ font: '400 10px/1 var(--mono)', letterSpacing: '0.08em', color: 'var(--faint)' }}>{status === 'declined' ? 'LOST' : 'EXPIRED'}</span>;
      }
      return (
        <span style={{ display: 'block' }}>
          <span style={{ display: 'flex', gap: 2 }}>
            {QUOTE_STAGES.map((s, n) => (
              <span key={s} style={{ flex: 1, height: 4, background: n < i ? 'var(--dim)' : n === i ? 'var(--gold)' : 'var(--line)' }} />
            ))}
          </span>
          <span style={{ display: 'block', marginTop: 6, font: '400 10px/1 var(--mono)', color: 'var(--dim)' }}>{QUOTE_STAGES[i]}</span>
        </span>
      );
    }

    function QuotesListView({ navigate }) {
      const [quotes, setQuotes] = useState([]);
      const [loading, setLoading] = useState(true);
      const [view, setView] = useState('open');
      const [q, setQ] = useState('');
      const [repFilter, setRepFilter] = useState('');
      const [sortByValue, setSortByValue] = useState(false);
      const [sel, setSel] = useState(null);
      const [pane, setPane] = useState(null);
      const [paneLoading, setPaneLoading] = useState(false);

      useEffect(() => {
        adminFetch('/api/admin/quotes/ledger')
          .then(d => { setQuotes(d.quotes || []); setLoading(false); })
          .catch(() => setLoading(false));
      }, []);

      const reps = [...new Set(quotes.map(o => o.rep_name).filter(Boolean))].sort();
      const rows = quotes
        .filter(o => o.views.includes(view))
        .filter(o => !repFilter || o.rep_name === repFilter)
        .filter(o => !q || (o.quote_number + ' ' + o.customer_name + ' ' + (o.customer_email || '') + ' ' + (o.trade_company || '') + ' ' + o.blocker).toLowerCase().includes(q.toLowerCase()))
        .sort((a, b) => sortByValue ? parseFloat(b.total) - parseFloat(a.total) : new Date(b.created_at) - new Date(a.created_at));

      const activeId = rows.some(r => r.id === sel) ? sel : (rows[0] ? rows[0].id : null);
      const activeRow = quotes.find(o => o.id === activeId) || null;
      const openValue = rows.reduce((s, o) => s + parseFloat(o.total || 0), 0);
      const fmt = n => '$' + parseFloat(n || 0).toLocaleString('en-US', { maximumFractionDigits: 0 });
      const dfmt = ts => ts ? new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';

      useEffect(() => {
        if (!activeId) { setPane(null); return; }
        let dead = false;
        setPaneLoading(true);
        adminFetch(`/api/admin/quotes/${activeId}`).then(detail => {
          if (dead) return;
          setPane(detail);
          setPaneLoading(false);
        }).catch(() => { if (!dead) { setPane(null); setPaneLoading(false); } });
        return () => { dead = true; };
      }, [activeId]);

      const keyDate = o =>
        o.status === 'converted' ? 'Won ' + dfmt(o.updated_at) :
        o.status === 'declined' ? 'Lost ' + dfmt(o.updated_at) :
        o.expired ? 'Expired ' + dfmt(o.expires_at) :
        o.status === 'sent' && o.expires_at ? 'Expires ' + dfmt(o.expires_at) :
        o.status === 'accepted' ? 'Accepted ' + dfmt(o.updated_at) :
        'Drafted ' + dfmt(o.created_at);

      const COLS = 'minmax(84px, 110px) minmax(120px, 1fr) minmax(70px, 90px) minmax(110px, 140px) minmax(90px, 110px)';

      return (
        <div className="ordl">
          <section className="ordl-main">
            <div className="ordl-tabs">
              {QUOTE_VIEWS.map(v => {
                const on = v.id === view;
                const n = quotes.filter(o => o.views.includes(v.id)).length;
                return (
                  <button key={v.id} className={'ordl-tab' + (on ? ' active' : '')} onClick={() => setView(v.id)}>
                    <span className="ordl-tab-row">
                      <span className="ordl-tab-label">{v.label}</span>
                      <span className="ordl-tab-n">{n}</span>
                    </span>
                    <span className="ordl-tab-hint">{v.hint.toUpperCase()}</span>
                  </button>
                );
              })}
            </div>

            <div className="ordl-filters">
              <select value={repFilter} onChange={e => setRepFilter(e.target.value)} className="ordl-chip">
                <option value="">Any rep</option>
                {reps.map(r => <option key={r} value={r}>{r}</option>)}
              </select>
              <button className={'ordl-chip' + (sortByValue ? ' on' : '')} onClick={() => setSortByValue(s => !s)}>
                {sortByValue ? 'VALUE ↓' : 'NEWEST'}
              </button>
              <input className="ordl-search" value={q} onChange={e => setQ(e.target.value)} placeholder="filter quotes…" />
            </div>

            <div className="ordl-scroll">
              <div style={{ minWidth: 640 }}>
                <div className="ordl-head" style={{ gridTemplateColumns: COLS }}>
                  <span>QUOTE</span><span>CUSTOMER</span>
                  <span style={{ textAlign: 'right' }}>VALUE</span>
                  <span>STAGE</span><span>KEY DATE</span>
                </div>
                {loading && <div className="opsq-empty">loading quotes…</div>}
                {!loading && rows.length === 0 && <div className="opsq-empty">no quotes in this view</div>}
                {rows.map(o => {
                  const on = o.id === activeId;
                  const settled = o.status === 'converted' || o.status === 'declined' || o.expired;
                  return (
                    <div key={o.id} className={'ordl-row' + (on ? ' active' : '')}
                      onClick={() => { if (window.innerWidth < 1100) navigate('quote-detail', o.id); else setSel(o.id); }}>
                      <div className="ordl-grid" style={{ gridTemplateColumns: COLS }}>
                        <span className="ordl-num">
                          <span className="ops-dot" style={{ width: 5, height: 5, background: o.status === 'converted' ? 'var(--green)' : settled ? 'var(--faint)' : ORDL_RISK[o.risk] }} />
                          {(o.quote_number || '')}
                        </span>
                        <span style={{ minWidth: 0 }}>
                          <span className="ordl-cust">{o.customer_name}</span>
                          <span className="ordl-co">{o.trade_company || o.customer_email || 'Direct retail'}</span>
                        </span>
                        <span className="ordl-val">{fmt(o.total)}</span>
                        <QtlStageBar i={o.stage} status={o.status} expired={o.expired} />
                        <span className="ordl-date">{keyDate(o)}</span>
                      </div>
                      <div className="ordl-sub">
                        {!settled && (
                          <span style={{ color: ORDL_RISK[o.risk], font: '400 10px/1 var(--mono)', letterSpacing: '0.06em', flexShrink: 0 }}>
                            {QTL_RISK_LABEL[o.risk]}
                          </span>
                        )}
                        {o.status === 'converted' && (
                          <span style={{ color: 'var(--green)', font: '400 10px/1 var(--mono)', letterSpacing: '0.06em', flexShrink: 0 }}>WON</span>
                        )}
                        <span className="ordl-blocker">{o.blocker}</span>
                        <span className="ordl-rep">{o.rep_name || 'house'}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="ordl-foot">
              <span style={{ letterSpacing: '0.08em' }}>{rows.length} QUOTES</span>
              <span style={{ color: 'var(--dim)' }}>{fmt(openValue)} {view === 'converted' ? 'won' : view === 'closed' ? 'closed' : 'quoted'} value</span>
            </div>
          </section>

          <aside className="ordl-pane">
            {!activeRow ? (
              <div style={{ flex: 1, display: 'grid', placeItems: 'center', font: '400 12px/1 var(--mono)', color: 'var(--faint)' }}>NO QUOTE SELECTED</div>
            ) : (
              <React.Fragment>
                <div className="ordl-pane-head">
                  <div className="opsq-meta">
                    <span style={{ color: 'var(--ink)' }}>{activeRow.quote_number}</span>
                    <span style={{ color: activeRow.status === 'converted' ? 'var(--green)' : activeRow.status === 'declined' || activeRow.expired ? 'var(--faint)' : ORDL_RISK[activeRow.risk] }}>
                      {activeRow.status === 'converted' ? 'WON' : activeRow.status === 'declined' ? 'LOST' : activeRow.expired ? 'EXPIRED' : QTL_RISK_LABEL[activeRow.risk]}
                    </span>
                    <span style={{ marginLeft: 'auto', color: 'var(--faint)' }}>{activeRow.rep_name || ''}</span>
                  </div>
                  <h1 className="ordl-pane-title">{activeRow.customer_name}</h1>
                  <div className="ordl-pane-meta">
                    <span>{activeRow.trade_company || activeRow.customer_email || 'Direct retail'}</span>
                    <span style={{ color: 'var(--ink)' }}>{fmt(activeRow.total)}</span>
                  </div>
                  <div className="ordl-next" style={{ borderLeftColor: activeRow.status === 'converted' ? 'var(--green)' : activeRow.status === 'declined' || activeRow.expired ? 'var(--line2)' : ORDL_RISK[activeRow.risk] }}>
                    <div className="opsq-block-label" style={{ marginBottom: 0 }}>NEXT</div>
                    <div style={{ marginTop: 6, font: '400 12px/1.5 var(--sans)', textWrap: 'pretty' }}>{activeRow.blocker}</div>
                  </div>
                </div>
                <div className="opsq-pane-body">
                  {paneLoading && <div className="opsq-empty">loading record…</div>}
                  {!paneLoading && pane && (
                    <React.Fragment>
                      <OpsBlock label={`Lines · ${pane.items.length}`}>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: 9 }}>
                          {pane.items.map(l => (
                            <div key={l.id} style={{ display: 'grid', gridTemplateColumns: '1fr 66px 72px', gap: 10, alignItems: 'baseline' }}>
                              <span style={{ minWidth: 0 }}>
                                {formatLineItem(l).brand && <span style={{ display: 'block', marginBottom: 3, font: '400 9px/1 var(--mono)', color: 'var(--faint)' }}>{formatLineItem(l).brand}</span>}
                                <span style={{ display: 'block', font: '400 12px/1.35 var(--sans)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{formatLineItem(l).name}</span>
                                <span style={{ display: 'block', marginTop: 3, font: '400 9px/1 var(--mono)', color: 'var(--faint)' }}>{formatLineItem(l).sku}</span>
                              </span>
                              <span style={{ font: '400 11px/1 var(--mono)', color: 'var(--dim)', textAlign: 'right' }}>
                                {l.sqft_needed ? parseFloat(l.sqft_needed) + ' sf' : (l.num_boxes || 0) + (l.sell_by === 'unit' ? ' ea' : ' bx')}
                              </span>
                              <span style={{ font: '400 11px/1 var(--mono)', textAlign: 'right' }}>{fmt(l.subtotal)}</span>
                            </div>
                          ))}
                        </div>
                      </OpsBlock>
                      <OpsBlock label="Engagement">
                        <div className="opsq-facts">
                          {[
                            ['Opens', pane.engagement.opens],
                            ['Viewers', pane.engagement.viewers],
                            ['Replies', pane.engagement.replies],
                            ['Last opened', pane.engagement.last_viewed_at ? dfmt(pane.engagement.last_viewed_at) : '—'],
                          ].map(m => (
                            <div key={m[0]} className="opsq-fact">
                              <div className="opsq-fact-k">{m[0]}</div>
                              <div className="opsq-fact-v">{m[1]}</div>
                            </div>
                          ))}
                        </div>
                      </OpsBlock>
                      <OpsBlock label="Money">
                        <div className="opsq-facts">
                          {[
                            ['Total', fmt(activeRow.total)],
                            ['Discount', parseFloat(pane.quote.discount_amount || 0) > 0 ? '-' + fmt(pane.quote.discount_amount) : '—'],
                            ['Delivery', activeRow.delivery_method || 'shipping'],
                            ['Expires', activeRow.expires_at ? dfmt(activeRow.expires_at) : 'on send'],
                          ].map(m => (
                            <div key={m[0]} className="opsq-fact">
                              <div className="opsq-fact-k">{m[0]}</div>
                              <div className="opsq-fact-v">{m[1]}</div>
                            </div>
                          ))}
                        </div>
                      </OpsBlock>
                      <OpsBlock label="Trail">
                        {pane.events.length === 0 ? (
                          <div style={{ font: '400 11px/1.5 var(--mono)', color: 'var(--faint)' }}>no activity recorded</div>
                        ) : (
                          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                            {[...pane.events].reverse().slice(0, 6).map(t => (
                              <div key={t.id} style={{ display: 'grid', gridTemplateColumns: '54px 1fr', gap: 12 }}>
                                <span style={{ font: '400 10px/1.5 var(--mono)', color: 'var(--faint)' }}>{dfmt(t.created_at)}</span>
                                <span style={{ font: '400 12px/1.5 var(--sans)' }}>
                                  {QUOTE_EVENT_LABELS[t.event_type] || t.event_type}{t.actor_name ? ' · ' + t.actor_name : ''}
                                </span>
                              </div>
                            ))}
                          </div>
                        )}
                      </OpsBlock>
                    </React.Fragment>
                  )}
                </div>
                <div className="ordl-pane-foot">
                  <button className="opsq-primary" style={{ marginTop: 0, flex: 1, width: 'auto' }} onClick={() => navigate('quote-detail', activeRow.id)}>
                    <span>Open full record</span>
                  </button>
                </div>
              </React.Fragment>
            )}
          </aside>
        </div>
      );
    }

    // ========== QuoteDetailView ==========
    // Full quote record in the order-record console grammar: pinned header,
    // stage rail, independently scrolling left column + right rail.
    function QuoteDetailView({ navigate, editId, staffRole }) {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [qTab, setQTab] = useState('record');
      const [docPreview, setDocPreview] = useState(null);
      const [updating, setUpdating] = useState(false);
      const [showLostSheet, setShowLostSheet] = useState(false);
      const [lostReason, setLostReason] = useState('');
      const [noteText, setNoteText] = useState('');
      const [postingNote, setPostingNote] = useState(false);

      const load = async () => {
        try {
          const d = await adminFetch('/api/admin/quotes/' + editId);
          setData(d);
        } catch (e) { setData(null); }
        setLoading(false);
      };
      useEffect(() => { setLoading(true); load(); }, [editId]);

      if (loading) return <div className="recd-page"><div className="opsq-empty">loading quote record…</div></div>;
      if (!data || !data.quote) return <div className="recd-page"><div className="opsq-empty">quote not found</div></div>;

      const { quote, items, customer, events, engagement } = data;
      const canManage = ['admin', 'manager'].includes(staffRole);
      const qTotal = parseFloat(quote.total || 0);
      const now = Date.now();
      const qExpired = quote.status === 'sent' && quote.expires_at && new Date(quote.expires_at).getTime() < now;
      const qSettled = quote.status === 'converted' || quote.status === 'declined' || qExpired;
      const daysLeft = quote.expires_at ? (new Date(quote.expires_at).getTime() - now) / 86400000 : null;
      const ageDays = (now - new Date(quote.created_at).getTime()) / 86400000;
      const dshort = ts => ts ? new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
      const qDd = ts => ts ? new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }).toUpperCase() : '';

      // Risk + blocker, mirroring the ledger's read of the pipeline
      let qRisk = 'ok', qBlocker = null;
      if (qExpired) { qRisk = 'breach'; qBlocker = 'Expired ' + dshort(quote.expires_at) + ' — close it out, or have the rep send a revision'; }
      else if (quote.status === 'draft' && ageDays > 3) { qRisk = 'today'; qBlocker = 'Drafted ' + Math.floor(ageDays) + ' days ago and never sent to the customer'; }
      else if (quote.status === 'accepted') { qRisk = 'today'; qBlocker = 'Customer said yes — the rep converts it to an order from the rep workspace'; }
      else if (quote.status === 'sent' && daysLeft !== null && daysLeft <= 3) {
        qRisk = 'today';
        qBlocker = 'Expires ' + dshort(quote.expires_at) + ' — ' + (engagement.opens ? 'the customer has opened it ' + engagement.opens + '×' : 'the customer never opened it');
      }
      else if (quote.status === 'sent' && engagement.opens >= 3) { qRisk = 'today'; qBlocker = 'Hot — the customer opened this quote ' + engagement.opens + ' times'; }

      const qStatusLabel = quote.status === 'converted' ? 'WON'
        : quote.status === 'declined' ? 'LOST'
        : qExpired ? 'EXPIRED'
        : quote.status === 'accepted' ? 'ACCEPTED'
        : quote.status === 'draft' ? 'DRAFT'
        : qRisk === 'today' ? 'NEEDS ACTION' : 'IN MARKET';
      const qStatusColor = quote.status === 'converted' ? 'var(--green)'
        : quote.status === 'declined' ? 'var(--faint)'
        : qExpired ? 'var(--hot)'
        : qRisk === 'today' ? 'var(--gold)'
        : quote.status === 'draft' ? 'var(--dim)' : 'var(--cool)';

      const evFirst = t => { const e = events.find(ev => ev.event_type === t); return e ? e.created_at : null; };
      const lastSentEvent = [...events].reverse().find(e => e.event_type === 'sent');
      const railDead = quote.status === 'declined' || qExpired;
      // 6-step lifecycle, same ladder the rep workspace walks:
      // Drafted → Sent → Viewed → Replied → Accepted → Converted
      let qStage = 0;
      if (quote.status === 'converted') qStage = 5;
      else if (quote.status === 'accepted' || railDead) qStage = 4;
      else if (quote.status === 'sent') qStage = engagement.replies > 0 ? 3 : engagement.opens > 0 ? 2 : 1;
      const qRail = [
        ['Drafted', qDd(quote.created_at)],
        ['Sent', quote.status === 'draft' ? 'NOT YET' : lastSentEvent ? qDd(lastSentEvent.created_at) : ['accepted', 'converted'].includes(quote.status) ? 'DIRECT' : 'EMAILED'],
        ['Viewed', engagement.opens ? engagement.opens + (engagement.opens === 1 ? ' OPEN' : ' OPENS') : 'NO OPENS'],
        ['Replied', engagement.replies ? qDd(engagement.last_reply_at) : 'NONE LOGGED'],
        ['Accepted', railDead ? (quote.status === 'declined' ? 'MARKED LOST' : 'EXPIRED') : ['accepted', 'converted'].includes(quote.status) ? (qDd(evFirst('accepted')) || 'COMMITTED') : quote.expires_at ? 'EXP ' + qDd(quote.expires_at) : ''],
        ['Converted', quote.converted_order_number || (quote.status === 'converted' ? 'ORDER' : '')],
      ];

      // Rep-workspace economics surfaced for staff: a $0 vendor cost means
      // "cost unknown", not 100% margin; samples excluded
      const showMargin = ['admin', 'manager'].includes(staffRole);
      const costedItems = items.filter(i => parseFloat(i.vendor_cost) > 0 && parseFloat(i.unit_price) > 0 && !i.is_sample);
      const costedSell = costedItems.reduce((s, i) => s + parseFloat(i.subtotal || 0), 0);
      const grossProfit = costedItems.reduce((s, i) => s + (1 - parseFloat(i.vendor_cost) / parseFloat(i.unit_price)) * parseFloat(i.subtotal || 0), 0);
      const blendedMargin = costedSell > 0 ? grossProfit / costedSell * 100 : null;
      const lineMargin = (item) => {
        const p = parseFloat(item.unit_price || 0);
        if (!(parseFloat(item.vendor_cost) > 0) || p <= 0 || item.is_sample) return null;
        return (1 - parseFloat(item.vendor_cost) / p) * 100;
      };

      // Thread: collapse consecutive opens so a curious customer doesn't flood it
      const threadEntries = [];
      events.forEach(e => {
        const prev = threadEntries[threadEntries.length - 1];
        if (e.event_type === 'viewed' && prev && prev.event_type === 'viewed') { prev._count += 1; prev.created_at = e.created_at; }
        else threadEntries.push({ ...e, _count: 1 });
      });
      const threadHot = !!(engagement.last_reply_at && lastSentEvent &&
        new Date(engagement.last_reply_at) > new Date(lastSentEvent.created_at) &&
        new Date(engagement.last_reply_at) - new Date(lastSentEvent.created_at) < 86400000);
      const fmtDT = ts => new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' +
        new Date(ts).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

      const markAccepted = async () => {
        if (!confirm('Mark ' + quote.quote_number + ' accepted — the customer confirmed?')) return;
        setUpdating(true);
        try {
          await adminFetch('/api/admin/quotes/' + editId + '/status', { method: 'POST', body: JSON.stringify({ status: 'accepted' }) });
          await load();
        } catch (err) { alert(err.message); }
        setUpdating(false);
      };
      const markLost = async () => {
        setUpdating(true);
        try {
          await adminFetch('/api/admin/quotes/' + editId + '/status', { method: 'POST', body: JSON.stringify({ status: 'declined', reason: lostReason.trim() || undefined }) });
          setShowLostSheet(false); setLostReason('');
          await load();
        } catch (err) { alert(err.message); }
        setUpdating(false);
      };
      const postThread = async (kind) => {
        if (!noteText.trim()) return;
        setPostingNote(true);
        try {
          await adminFetch('/api/admin/quotes/' + editId + '/events', { method: 'POST', body: JSON.stringify({ event_type: kind, body: noteText.trim() }) });
          setNoteText('');
          await load();
        } catch (err) { alert(err.message); }
        setPostingNote(false);
      };

      const customerNavId = quote.trade_customer_id ? 'trade_' + quote.trade_customer_id
        : quote.customer_id ? 'retail_' + quote.customer_id
        : quote.customer_email ? 'guest_' + quote.customer_email : null;

      return (
        <React.Fragment>
        <div className="recd-page">
          <div className="recd-head">
            <div className="recd-top">
              <div style={{ minWidth: 0 }}>
                <div className="opsq-meta">
                  <button className="recd-crumb" onClick={() => navigate('quotes')}>← QUOTES</button>
                  <span style={{ color: 'var(--faint)' }}>/</span>
                  <span style={{ color: 'var(--ink)' }}>{quote.quote_number}</span>
                  <span style={{ color: qStatusColor }}>{qStatusLabel}</span>
                </div>
                <h1 className="recd-title">{quote.customer_name}</h1>
                <div className="recd-meta">
                  <span>{quote.customer_email}</span>
                  {quote.rep_name && <span>{quote.rep_name}</span>}
                  <span>{items.length} lines</span>
                  <span>{engagement.opens} open{engagement.opens === 1 ? '' : 's'}</span>
                  {quote.expires_at && !qSettled && <span style={{ color: qExpired || (daysLeft !== null && daysLeft <= 3) ? 'var(--gold)' : undefined }}>expires {dshort(quote.expires_at)}</span>}
                </div>
              </div>
              <div style={{ marginLeft: 'auto', textAlign: 'right', flexShrink: 0 }}>
                <div className="opsq-block-label" style={{ marginBottom: 0 }}>QUOTE VALUE</div>
                <div className="recd-value">${qTotal.toLocaleString('en-US', { minimumFractionDigits: 2 })}</div>
              </div>
              <div style={{ display: 'flex', gap: 8, alignSelf: 'center', flexShrink: 0, flexWrap: 'wrap' }}>
                {quote.status === 'converted' && (
                  <button className="recd-exc-primary" onClick={() => navigate('order-detail', quote.converted_order_id)}>
                    Open {quote.converted_order_number || 'order'}
                  </button>
                )}
                {canManage && ['draft', 'sent'].includes(quote.status) && (
                  <button className="recd-exc-primary" disabled={updating} onClick={markAccepted}>
                    {updating ? 'Updating…' : 'Mark accepted'}
                  </button>
                )}
                <button className="opsq-alt" onClick={() => setDocPreview({ path: '/api/staff/quotes/' + editId + '/pdf', title: 'Quote ' + quote.quote_number })}>Quote PDF</button>
                {canManage && !['converted', 'declined'].includes(quote.status) && (
                  <button className="opsq-alt" style={{ color: 'var(--hot)' }} disabled={updating} onClick={() => setShowLostSheet(true)}>Mark lost</button>
                )}
              </div>
            </div>
            <div className="recd-rail">
              {qRail.map(([s, when], n) => (
                <div key={s} className="recd-stage">
                  <div style={{ height: 3, background: railDead ? (n === 4 ? 'var(--hot)' : 'var(--line)') : n < qStage ? 'var(--dim)' : n === qStage ? 'var(--gold)' : 'var(--line)' }} />
                  <div className="recd-stage-name" style={{ color: railDead ? (n === 4 ? 'var(--hot)' : 'var(--faint)') : n === qStage ? 'var(--ink)' : n < qStage ? 'var(--dim)' : 'var(--faint)' }}>{s}</div>
                  <div className="recd-stage-when" style={railDead && n === 4 ? { color: 'var(--hot)' } : undefined}>{when}</div>
                </div>
              ))}
            </div>
            <div className="recd-tabs">
              {['record', 'activity'].map(t => (
                <button key={t} className={'recd-tab' + (qTab === t ? ' active' : '')} onClick={() => setQTab(t)}>{t}</button>
              ))}
            </div>
          </div>

          <div className="recd-scroll">
          <div className="rec-body">
          <div className="rec-left">
          {qBlocker && qTab === 'record' && (
            <div className="recd-exception" style={{ borderLeftColor: qExpired ? 'var(--hot)' : 'var(--gold)' }}>
              <div className="recd-exc-head">
                <span style={{ color: qExpired ? 'var(--hot)' : 'var(--gold)' }}>
                  {QTL_RISK_LABEL[qRisk]} · {qExpired ? 'EXPIRED' : quote.status === 'accepted' ? 'AWAITING CONVERSION' : quote.status === 'draft' ? 'STALE DRAFT' : engagement.opens >= 3 ? 'HOT QUOTE' : 'EXPIRING'}
                </span>
                <span style={{ marginLeft: 'auto', color: 'var(--faint)' }}>{quote.quote_number}</span>
              </div>
              <div className="recd-exc-title">{qBlocker}</div>
              {qExpired && canManage && (
                <div className="recd-exc-actions">
                  <button className="recd-exc-primary" disabled={updating} onClick={() => setShowLostSheet(true)}>Close out as lost</button>
                </div>
              )}
            </div>
          )}

          {qTab === 'record' && <div className="form-card">
            <h3>Lines · {items.length}</h3>
            {items.length === 0 ? (
              <div style={{ font: '400 11px/1.5 var(--mono)', color: 'var(--faint)' }}>no lines on this quote yet</div>
            ) : (
            <div className="table-scroll-wrapper">
            <table className="admin-table">
              <thead>
                <tr>
                  <th>Product</th>
                  <th style={{ width: 140 }}>Vendor</th>
                  <th style={{ width: 110 }}>Qty</th>
                  <th style={{ width: 110 }}>Unit Price</th>
                  {showMargin && <th style={{ width: 80, textAlign: 'right' }}>Margin</th>}
                  <th style={{ width: 100, textAlign: 'right' }}>Subtotal</th>
                </tr>
              </thead>
              <tbody>
                {items.map(item => (
                  <tr key={item.id}>
                    <td data-label="Product">
                      {formatLineItem(item).brand && <div style={{ fontSize: '0.6875rem', color: '#a4a09a' }}>{formatLineItem(item).brand}</div>}
                      <div style={{ fontWeight: 500 }}>
                        {formatLineItem(item).name}
                        {item.is_sample && <span className="badge" style={{ fontSize: '0.6rem', marginLeft: '0.5rem', background: 'var(--stone-200)', color: 'var(--stone-700)' }}>Sample</span>}
                      </div>
                      {formatLineItem(item).sku && <div style={{ fontSize: '0.6875rem', color: '#a4a09a' }}>{formatLineItem(item).sku}</div>}
                    </td>
                    <td data-label="Vendor"><span style={{ font: '400 11px/1.4 var(--sans)', color: 'var(--dim)' }}>{item.vendor_name || '—'}</span></td>
                    <td data-label="Qty">
                      <span style={{ font: '400 12px/1 var(--mono)' }}>
                        {item.sqft_needed ? parseFloat(item.sqft_needed) + ' sqft · ' + (item.num_boxes || 0) + ' bx' : (item.num_boxes || 0) + (item.sell_by === 'unit' ? ' ea' : ' bx')}
                      </span>
                    </td>
                    <td data-label="Unit Price"><span style={{ font: '400 12px/1 var(--mono)' }}>${parseFloat(item.unit_price || 0).toFixed(2)}</span></td>
                    {showMargin && <td data-label="Margin" style={{ textAlign: 'right' }}>
                      {lineMargin(item) === null
                        ? <span style={{ color: 'var(--faint)' }}>—</span>
                        : <span style={{ font: '400 11px/1 var(--mono)', color: 'var(--gold)' }}>{lineMargin(item).toFixed(1)}%</span>}
                    </td>}
                    <td data-label="Subtotal" style={{ textAlign: 'right', fontWeight: 500 }}>${parseFloat(item.subtotal || 0).toFixed(2)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            </div>
            )}
          </div>}

          {qTab === 'record' && quote.notes && <div className="form-card">
            <h3>Quote notes</h3>
            <div style={{ font: '400 13px/1.7 var(--sans)', whiteSpace: 'pre-wrap' }}>{quote.notes}</div>
          </div>}

          {qTab === 'record' && <div className="form-card">
            <h3>Acceptance terms</h3>
            <div className="rb-facts">
              {[
                ['Validity', quote.expires_at ? 'Expires ' + new Date(quote.expires_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'No expiry set — 10 days from send'],
                ['Deposit', '100% to release for fulfillment'],
                ['Lead times', 'Per line · vendor-confirmed at order'],
                ['Returns', '20% restock saleable · no return on cut material'],
                ['Tax', 'Calculated at order placement'],
              ].map(([k, v]) => (
                <div key={k} className="rb-fact"><span className="rb-fact-k">{k}</span><span className="rb-fact-v" style={{ fontFamily: 'var(--sans)', fontSize: 11 }}>{v}</span></div>
              ))}
            </div>
          </div>}

          {qTab === 'activity' && <div className="form-card">
            <div className="rb-head">
              <h3>Thread · {events.length}</h3>
              {threadHot && (
                <span style={{ marginLeft: 'auto', font: '400 10px/1 var(--mono)', letterSpacing: '0.08em', color: 'var(--green)' }}>
                  {'●'} HOT — REPLIED WITHIN 24 HRS
                </span>
              )}
            </div>
            {threadEntries.length === 0 ? (
              <div style={{ font: '400 11px/1.5 var(--mono)', color: 'var(--faint)' }}>no activity yet — the thread starts when the rep sends the quote</div>
            ) : (
              <div style={{ display: 'grid', gap: 14 }}>
                {threadEntries.map(e => {
                  const isSys = ['sent', 'viewed', 'accepted', 'marked_lost', 'converted'].includes(e.event_type);
                  const isCustomer = e.actor === 'customer';
                  const name = e.actor_name || (isCustomer ? quote.customer_name : 'System');
                  const initials2 = (name || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase() || '?';
                  const bodyText = e._count > 1
                    ? ((e.body || QUOTE_EVENT_LABELS[e.event_type] || 'Opened') + ' ×' + e._count)

    // ========== ReturnModal ==========
    // Admin return / credit-memo modal. Single scrollable form (internal ops, not a wizard).
    function ReturnModal({ editId, onClose, onSuccess }) {
      const [ctx, setCtx] = useState(null);
      const [loading, setLoading] = useState(true);
      const [loadError, setLoadError] = useState(null);
      const [lines, setLines] = useState({});       // order_item_id -> { return_qty, condition, restock_pct, vendor_action, reason }
      const [tenderSplits, setTenderSplits] = useState({}); // payment_id -> amount string
      const [storeCredit, setStoreCredit] = useState('');
      const [customerNote, setCustomerNote] = useState('');
      const [reasonSummary, setReasonSummary] = useState('');
      const [submitting, setSubmitting] = useState(false);
      const [submitError, setSubmitError] = useState(null);

      useEffect(() => {
        adminFetch('/api/staff/orders/' + editId + '/return-context')
          .then(data => {
            setCtx(data);
            const init = {};
            (data.items || []).forEach(it => {
              const remaining = (it.num_boxes || 0) - (it.already_returned || 0);
              if (remaining <= 0) return; // skip fully-returned lines
              init[it.id] = { return_qty: 0, condition: 'saleable', restock_pct: 0, vendor_action: 'restock_local', reason: '' };
            });
            setLines(init);
            setLoading(false);
          })
          .catch(err => { setLoadError(err.message || 'Failed to load return context'); setLoading(false); });
      }, [editId]);

      const taxRate = ctx ? parseFloat(ctx.tax_rate || 0) : 0;
      const items = ctx ? (ctx.items || []) : [];
      const tenders = ctx ? (ctx.tenders || []) : [];

      // Per-line and total computations.
      const compute = () => {
        let subtotal = 0, restock = 0;
        const perLine = {};
        items.forEach(it => {
          const st = lines[it.id];
          if (!st) return;
          const qty = parseInt(st.return_qty, 10) || 0;
          const price = parseFloat(it.unit_price || 0);
          const gross = qty * price;
          const restockFee = st.condition === 'saleable' ? gross * ((parseFloat(st.restock_pct) || 0) / 100) : 0;
          const refundLine = gross - restockFee;
          perLine[it.id] = { gross, restockFee, refundLine, qty };
          subtotal += gross;
          restock += restockFee;
        });
        const merchRefund = subtotal - restock;
        const taxRefund = merchRefund * taxRate;
        const refundTotal = merchRefund + taxRefund;
        return { subtotal, restock, merchRefund, taxRefund, refundTotal, perLine };
      };
      const totals = compute();

      const allocated = (() => {
        let sum = 0;
        tenders.forEach(t => { sum += parseFloat(tenderSplits[t.id]) || 0; });
        sum += parseFloat(storeCredit) || 0;
        return sum;
      })();
      const remainingToAllocate = totals.refundTotal - allocated;
      const anyQty = Object.values(totals.perLine).some(l => l.qty > 0);
      const allocationOk = Math.abs(remainingToAllocate) <= 0.01;
      const canSubmit = anyQty && totals.refundTotal > 0.009 && allocationOk && !submitting;

      const money = (n) => '$' + (Number(n) || 0).toFixed(2);

      const submit = async () => {
        setSubmitError(null);
        const payloadLines = [];
        items.forEach(it => {
          const st = lines[it.id];
          if (!st) return;
          const qty = parseInt(st.return_qty, 10) || 0;
          if (qty <= 0) return;
          payloadLines.push({
            order_item_id: it.id,
            return_qty: qty,
            reason: st.reason || undefined,
            condition: st.condition,
            restock_pct: st.condition === 'saleable' ? (parseFloat(st.restock_pct) || 0) : 0,
            vendor_action: st.vendor_action,
            vendor_id: it.line_vendor_id || undefined,
            replacement_requested: false
          });
        });
        const refundSplits = [];
        tenders.forEach(t => {
          const amt = parseFloat(tenderSplits[t.id]) || 0;
          if (amt > 0) refundSplits.push({ payment_id: t.id, amount: amt });
        });
        const scAmount = parseFloat(storeCredit) || 0;
        setSubmitting(true);
        try {
          const data = await adminFetch('/api/staff/orders/' + editId + '/returns', {
            method: 'POST',
            body: JSON.stringify({
              lines: payloadLines,
              refund_splits: refundSplits,
              store_credit_amount: scAmount,
              customer_note: customerNote || undefined,
              reason_summary: reasonSummary || undefined
            })
          });
          onSuccess({
            rma_number: data.return && data.return.rma_number,
            credit_memo_number: data.credit_memo && data.credit_memo.credit_memo_number,
            return_id: data.return && data.return.id,
            balance: data.balance,
            is_full: data.is_full
          });
        } catch (err) {
          setSubmitError(err.message || 'Failed to process return');
          setSubmitting(false);
        }
      };

      const inputStyle = { width: '100%', padding: '0.4rem', border: '1px solid var(--stone-200)', fontSize: '0.8125rem' };

      return (
        <div className="modal-overlay" onClick={() => !submitting && onClose()}>
          <div className="modal-box" onClick={e => e.stopPropagation()} style={{ maxWidth: '820px', width: '92vw', maxHeight: '88vh', overflowY: 'auto' }}>
            <h3>Start Return</h3>
            {loading ? (
              <p style={{ fontSize: '0.875rem', color: 'var(--stone-500)' }}>Loading return context...</p>
            ) : loadError ? (
              <p style={{ fontSize: '0.875rem', color: 'var(--red)' }}>{loadError}</p>
            ) : (
              <React.Fragment>
                {/* Line selection */}
                <div className="table-scroll-wrapper" style={{ marginBottom: '1rem' }}>
                <table className="admin-table" style={{ fontSize: '0.8125rem' }}>
                  <thead><tr>
                    <th>Item</th><th>Return Qty</th><th>Condition</th><th>Restock %</th><th>Vendor Action</th><th style={{ textAlign: 'right' }}>Refund</th>
                  </tr></thead>
                  <tbody>
                    {items.map(it => {
                      const remaining = (it.num_boxes || 0) - (it.already_returned || 0);
                      if (remaining <= 0) return null; // fully returned
                      const st = lines[it.id];
                      if (!st) return null;
                      const line = totals.perLine[it.id] || { refundLine: 0 };
                      const restockDisabled = st.condition !== 'saleable';
                      return (
                        <tr key={it.id}>
                          <td>
                            {formatLineItem(it).brand && <div style={{ fontSize: '0.6875rem', color: 'var(--stone-400)' }}>{formatLineItem(it).brand}</div>}
                            <div style={{ fontWeight: 500 }}>{formatLineItem(it).name}</div>
                            <div style={{ fontSize: '0.6875rem', color: 'var(--stone-400)' }}>
                              {(formatLineItem(it).sku || it.vendor_name || '')}{' · '}{money(it.unit_price)}/ea{' · '}{remaining} available
                            </div>
                          </td>
                          <td style={{ width: '90px' }}>
                            <input type="number" min="0" max={remaining} value={st.return_qty}
                              onChange={e => {
                                let v = parseInt(e.target.value, 10);
                                if (isNaN(v)) v = 0;
                                if (v < 0) v = 0;
                                if (v > remaining) v = remaining;
                                setLines(prev => ({ ...prev, [it.id]: { ...prev[it.id], return_qty: v } }));
                              }}
                              style={inputStyle} />
                          </td>
                          <td style={{ width: '120px' }}>
                            <select value={st.condition}
                              onChange={e => {
                                const c = e.target.value;
                                setLines(prev => ({ ...prev, [it.id]: { ...prev[it.id], condition: c, restock_pct: c === 'saleable' ? prev[it.id].restock_pct : 0 } }));
                              }}
                              style={inputStyle}>
                              <option value="saleable">Saleable</option>
                              <option value="damaged">Damaged</option>
                              <option value="defective">Defective</option>
                            </select>
                          </td>
                          <td style={{ width: '90px' }}>
                            <input type="number" min="0" max="100" value={restockDisabled ? 0 : st.restock_pct} disabled={restockDisabled}
                              onChange={e => {
                                let v = parseFloat(e.target.value);
                                if (isNaN(v)) v = 0;
                                if (v < 0) v = 0;
                                if (v > 100) v = 100;
                                setLines(prev => ({ ...prev, [it.id]: { ...prev[it.id], restock_pct: v } }));
                              }}
                              style={{ ...inputStyle, opacity: restockDisabled ? 0.5 : 1 }} />
                          </td>
                          <td style={{ width: '150px' }}>
                            <select value={st.vendor_action}
                              onChange={e => setLines(prev => ({ ...prev, [it.id]: { ...prev[it.id], vendor_action: e.target.value } }))}
                              style={inputStyle}>
                              <option value="restock_local">Restock Local</option>
                              <option value="return_to_vendor">Return to Vendor</option>
                            </select>
                          </td>
                          <td style={{ textAlign: 'right', fontWeight: 500 }}>{money(line.refundLine)}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
                </div>

                {/* Totals */}
                <div style={{ background: 'var(--stone-50)', border: '1px solid var(--stone-200)', padding: '0.75rem 1rem', marginBottom: '1rem', fontSize: '0.8125rem' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}><span>Subtotal</span><span>{money(totals.subtotal)}</span></div>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}><span>Restock fees</span><span>-{money(totals.restock)}</span></div>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}><span>Merchandise refund</span><span>{money(totals.merchRefund)}</span></div>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}><span>Tax refund ({(taxRate * 100).toFixed(3).replace(/\.?0+$/, '')}%)</span><span>{money(totals.taxRefund)}</span></div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontWeight: 600, borderTop: '1px solid var(--stone-200)', marginTop: '0.35rem', paddingTop: '0.35rem' }}><span>Refund total</span><span>{money(totals.refundTotal)}</span></div>
                </div>

                {/* Settlement */}
                <div style={{ marginBottom: '1rem' }}>
                  <label style={{ display: 'block', fontSize: '0.75rem', fontWeight: 600, marginBottom: '0.5rem' }}>Settlement — allocate refund of {money(totals.refundTotal)}</label>
                  {tenders.map(t => (
                    <div key={t.id} style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', marginBottom: '0.4rem' }}>
                      <div style={{ flex: 1, fontSize: '0.8125rem' }}>
                        {(t.payment_method || 'tender')}{t.check_number ? ' #' + t.check_number : ''}
                        <span style={{ color: 'var(--stone-400)', marginLeft: '0.4rem' }}>(refundable {money(t.refundable)})</span>
                      </div>
                      <input type="number" min="0" step="0.01" max={t.refundable} value={tenderSplits[t.id] || ''}
                        placeholder="0.00"
                        onChange={e => {
                          let v = e.target.value;
                          const num = parseFloat(v);
                          if (!isNaN(num) && num > parseFloat(t.refundable || 0)) v = parseFloat(t.refundable).toFixed(2);
                          setTenderSplits(prev => ({ ...prev, [t.id]: v }));
                        }}
                        style={{ width: '120px', padding: '0.4rem', border: '1px solid var(--stone-200)', fontSize: '0.8125rem' }} />
                    </div>
                  ))}
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', marginBottom: '0.4rem' }}>
                    <div style={{ flex: 1, fontSize: '0.8125rem' }}>Store credit</div>
                    <input type="number" min="0" step="0.01" value={storeCredit} placeholder="0.00"
                      onChange={e => setStoreCredit(e.target.value)}
                      style={{ width: '120px', padding: '0.4rem', border: '1px solid var(--stone-200)', fontSize: '0.8125rem' }} />
                  </div>
                  <div style={{ fontSize: '0.8125rem', fontWeight: 500, color: allocationOk ? 'var(--stone-500)' : 'var(--red)' }}>
                    {allocationOk ? 'Fully allocated' : (remainingToAllocate > 0 ? 'Remaining to allocate: ' + money(remainingToAllocate) : 'Over-allocated by ' + money(-remainingToAllocate))}
                  </div>
                </div>

                {/* Notes */}
                <div style={{ marginBottom: '1rem' }}>
                  <label style={{ display: 'block', fontSize: '0.75rem', fontWeight: 500, marginBottom: '0.25rem' }}>Reason Summary (optional)</label>
                  <input type="text" value={reasonSummary} onChange={e => setReasonSummary(e.target.value)}
                    placeholder="e.g. Customer over-ordered, returning extra boxes"
                    style={inputStyle} />
                </div>
                <div style={{ marginBottom: '1rem' }}>
                  <label style={{ display: 'block', fontSize: '0.75rem', fontWeight: 500, marginBottom: '0.25rem' }}>Customer Note (optional)</label>
                  <textarea value={customerNote} onChange={e => setCustomerNote(e.target.value)} rows={2}
                    placeholder="Note shown to the customer on the credit memo"
                    style={{ ...inputStyle, resize: 'vertical' }} />
                </div>

                {submitError && <p style={{ fontSize: '0.8125rem', color: 'var(--red)', margin: '0 0 0.75rem' }}>{submitError}</p>}

                <div className="modal-actions">
                  <button className="btn btn-secondary" onClick={onClose} disabled={submitting}>Cancel</button>
                  <button className="btn btn-primary" onClick={submit} disabled={!canSubmit}>
                    {submitting ? 'Processing...' : 'Process Return — ' + money(totals.refundTotal)}
                  </button>
                </div>
              </React.Fragment>
            )}
          </div>
        </div>
      );
    }

    // --- SidemarkSelect — job-reference dropdown with "+ Add new" ---
    // Mirrors the rep-side control: reads a customer's prior sidemarks/job names
    // (across quotes, orders, samples, visits) so staff pick instead of retype;
    // "+ Add new…" swaps to free-text, and any current value stays selectable.
    function SidemarkSelect({ value, onChange, customerId, email, disabled, style }) {
      const [suggestions, setSuggestions] = useState([]);
      const [manual, setManual] = useState(false);
      useEffect(() => {
        let alive = true;
        const t = setTimeout(() => {
          const params = [];
          if (customerId) params.push('customer_id=' + encodeURIComponent(customerId));
          if (email) params.push('email=' + encodeURIComponent(email));
          adminFetch('/api/staff/sidemarks' + (params.length ? '?' + params.join('&') : ''))
            .then(d => { if (alive) setSuggestions(Array.isArray(d && d.sidemarks) ? d.sidemarks : []); })
            .catch(() => { if (alive) setSuggestions([]); });
        }, 300);
        return () => { alive = false; clearTimeout(t); };
      }, [customerId, email]);

      const useInput = manual || suggestions.length === 0;
      if (useInput) {
        return (
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}>
            <input value={value || ''} maxLength={200} disabled={disabled} placeholder="Job / sidemark"
              onChange={e => onChange(e.target.value)}
              style={style || { font: '400 12px/1.4 var(--sans)', padding: '2px 6px', width: 160 }} />
            {suggestions.length > 0 && !disabled && (
              <button type="button" className="rb-doc-link" onClick={() => setManual(false)}>list</button>
            )}
          </span>
        );
      }
      const known = value && suggestions.includes(value);
      return (
        <select value={value || ''} disabled={disabled}
          style={style || { font: '400 12px/1.4 var(--sans)', padding: '2px 6px', maxWidth: 200 }}
          onChange={e => {
            if (e.target.value === '__add__') { setManual(true); onChange(''); }
            else onChange(e.target.value);
          }}>
          <option value="">— None —</option>
          {value && !known && <option value={value}>{value}</option>}
          {suggestions.map(s => <option key={s} value={s}>{s}</option>)}
          <option value="__add__">+ Add new…</option>
        </select>
      );
    }
