    function MarginTiersTab() {
      const [tiers, setTiers] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showForm, setShowForm] = useState(false);
      const [editTier, setEditTier] = useState(null);
      const [name, setName] = useState('');
      const [discountPercent, setDiscountPercent] = useState('');
      const [spendThreshold, setSpendThreshold] = useState('');
      const [saving, setSaving] = useState(false);

      const fetchTiers = () => {
        adminFetch('/api/admin/margin-tiers')
          .then(data => { setTiers(data.tiers || []); setLoading(false); })
          .catch(() => setLoading(false));
      };

      useEffect(() => { fetchTiers(); }, []);

      const openCreate = () => {
        setEditTier(null);
        setName('');
        setDiscountPercent('');
        setSpendThreshold('');
        setShowForm(true);
      };

      const openEdit = (tier) => {
        setEditTier(tier);
        setName(tier.name);
        setDiscountPercent(tier.discount_percent);
        setSpendThreshold(tier.spend_threshold != null ? tier.spend_threshold : '');
        setShowForm(true);
      };

      const handleSave = async () => {
        setSaving(true);
        try {
          const payload = { name, discount_percent: parseFloat(discountPercent), spend_threshold: parseFloat(spendThreshold) || 0 };
          if (editTier) {
            await adminFetch('/api/admin/margin-tiers/' + editTier.id, {
              method: 'PUT',
              body: JSON.stringify(payload)
            });
          } else {
            await adminFetch('/api/admin/margin-tiers', {
              method: 'POST',
              body: JSON.stringify(payload)
            });
          }
          setShowForm(false);
          fetchTiers();
        } catch (err) {
          alert(err.message || 'Error saving tier');
        }
        setSaving(false);
      };

      const handleDelete = async (tier) => {
        if (!confirm(`Delete tier "${tier.name}"?`)) return;
        try {
          await adminFetch('/api/admin/margin-tiers/' + tier.id, { method: 'DELETE' });
          fetchTiers();
        } catch (err) {
          alert(err.message || 'Cannot delete tier');
        }
      };

      if (loading) return <div className="loading">Loading tiers...</div>;

      return (
        <div>
          <div style={{ marginBottom: '1rem' }}>
            <button className="btn btn-primary" onClick={openCreate}>+ Add Tier</button>
          </div>

          {showForm && (
            <div className="form-card" style={{ marginBottom: '1.5rem' }}>
              <h3>{editTier ? 'Edit Tier' : 'New Margin Tier'}</h3>
              <div style={{ display: 'flex', gap: '1rem', alignItems: 'flex-end' }}>
                <div className="form-group" style={{ flex: 1 }}>
                  <label>Tier Name</label>
                  <input type="text" value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Silver" />
                </div>
                <div className="form-group" style={{ flex: 1 }}>
                  <label>Discount %</label>
                  <input type="number" step="0.01" min="0" max="100" value={discountPercent} onChange={e => setDiscountPercent(e.target.value)} placeholder="e.g. 10" />
                </div>
                <div className="form-group" style={{ flex: 1 }}>
                  <label>Spend Threshold ($, trailing 12 mo)</label>
                  <input type="number" step="1" min="0" value={spendThreshold} onChange={e => setSpendThreshold(e.target.value)} placeholder="e.g. 10000" />
                </div>
                <div style={{ display: 'flex', gap: '0.5rem' }}>
                  <button className="btn btn-primary" onClick={handleSave} disabled={saving || !name || !discountPercent}>
                    {saving ? 'Saving...' : 'Save'}
                  </button>
                  <button className="btn btn-secondary" onClick={() => setShowForm(false)}>Cancel</button>
                </div>
              </div>
            </div>
          )}

          <div className="table-scroll-wrapper">
          <table className="data-table">
            <thead>
              <tr>
                <th>Tier Name</th>
                <th>Discount</th>
                <th>Spend Threshold</th>
                <th>Customers</th>
                <th>Example ($10.00 retail)</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              {tiers.length === 0 ? (
                <tr><td colSpan="6" style={{ textAlign: 'center', color: 'var(--stone-400)' }}>No margin tiers yet</td></tr>
              ) : tiers.map(t => (
                <tr key={t.id}>
                  <td><strong>{t.name}</strong></td>
                  <td>{parseFloat(t.discount_percent || 0)}%</td>
                  <td>${parseFloat(t.spend_threshold || 0).toLocaleString()}+</td>
                  <td>{t.customer_count}</td>
                  <td>${(10 * (1 - parseFloat(t.discount_percent || 0) / 100)).toFixed(2)}</td>
                  <td>
                    <button className="btn-link" onClick={() => openEdit(t)}>Edit</button>
                    <button className="btn-link btn-link-danger" onClick={() => handleDelete(t)} style={{ marginLeft: '0.5rem' }}>Delete</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          </div>
        </div>
      );
    }

    function TradeCustomersTab() {
      const [customers, setCustomers] = useState([]);
      const [tiers, setTiers] = useState([]);
      const [loading, setLoading] = useState(true);
      const [statusFilter, setStatusFilter] = useState('');
      const [expandedId, setExpandedId] = useState(null);
      const [docs, setDocs] = useState([]);
      const [docsLoading, setDocsLoading] = useState(false);
      const [denialReason, setDenialReason] = useState('');
      const [actionLoading, setActionLoading] = useState(false);
      const [reps, setReps] = useState([]);

      const fetchCustomers = () => {
        let url = '/api/admin/trade-customers';
        if (statusFilter) url += '?status=' + statusFilter;
        adminFetch(url)
          .then(data => { setCustomers(data.customers || []); setLoading(false); })
          .catch(() => setLoading(false));
      };

      const fetchTiers = () => {
        adminFetch('/api/admin/margin-tiers')
          .then(data => setTiers(data.tiers || []))
          .catch(() => {});
      };

      const fetchReps = () => {
        adminFetch('/api/admin/staff')
          .then(data => setReps((data.staff || []).filter(s => ['sales_rep', 'manager'].includes(s.role) && s.is_active)))
          .catch(() => {});
      };

      useEffect(() => { fetchTiers(); fetchReps(); }, []);
      useEffect(() => { fetchCustomers(); }, [statusFilter]);

      const loadDocs = (customerId) => {
        setDocsLoading(true);
        adminFetch('/api/admin/trade-customers/' + customerId + '/documents')
          .then(data => { setDocs(data.documents || []); setDocsLoading(false); })
          .catch(() => { setDocs([]); setDocsLoading(false); });
      };

      const toggleExpand = (id) => {
        if (expandedId === id) { setExpandedId(null); return; }
        setExpandedId(id);
        setDenialReason('');
        loadDocs(id);
      };

      const approveCustomer = async (id, taxExempt) => {
        const taxNote = taxExempt
          ? '\n\nThis customer will be TAX EXEMPT (no sales tax on materials). Only do this if you have verified the resale certificate.'
          : '\n\nThis customer will be charged sales tax. Tick "Tax exempt (resale)" first if you have verified their resale certificate.';
        if (!confirm('Approve this trade customer? They will start at the Silver tier with spend-based pricing.' + taxNote)) return;
        setActionLoading(true);
        try {
          await adminFetch('/api/admin/trade-customers/' + id + '/approve', {
            method: 'POST',
            body: JSON.stringify({ tax_exempt: !!taxExempt })
          });
          fetchCustomers();
          setExpandedId(null);
        } catch (err) {
          alert(err.message || 'Error approving customer');
        }
        setActionLoading(false);
      };

      const denyCustomer = async (id) => {
        if (!confirm('Deny this trade application?')) return;
        setActionLoading(true);
        try {
          await adminFetch('/api/admin/trade-customers/' + id + '/deny', {
            method: 'POST',
            body: JSON.stringify({ reason: denialReason })
          });
          fetchCustomers();
          setExpandedId(null);
        } catch (err) {
          alert(err.message || 'Error denying customer');
        }
        setActionLoading(false);
      };

      const updateCustomer = async (id, updates) => {
        try {
          await adminFetch('/api/admin/trade-customers/' + id, {
            method: 'PUT',
            body: JSON.stringify(updates)
          });
          fetchCustomers();
        } catch (err) {
          alert(err.message || 'Error updating customer');
        }
      };

      const deleteCustomer = async (id, name) => {
        if (!confirm(`Delete trade customer "${name}"? This cannot be undone.`)) return;
        try {
          await adminFetch('/api/admin/trade-customers/' + id, { method: 'DELETE' });
          fetchCustomers();
        } catch (err) {
          alert(err.message || 'Error deleting customer');
        }
      };

      const assignRep = async (customerId, repId) => {
        try {
          await adminFetch('/api/admin/trade-customers/' + customerId + '/assign-rep', {
            method: 'PUT',
            body: JSON.stringify({ rep_id: repId || null, reason: 'Manual assignment from admin' })
          });
          fetchCustomers();
        } catch (err) {
          alert(err.message || 'Error assigning rep');
        }
      };

      const statusBadge = (status) => {
        const cls = status === 'approved' ? 'badge-active' : status === 'pending' ? 'badge-pending' : 'badge-inactive';
        return <span className={'badge ' + cls}>{status}</span>;
      };

      const docTypeLabel = (t) => ({ ein: 'EIN Certificate', resale_cert: 'Resale Certificate', contractor_license: 'Contractor License', business_card: 'Business Card', sellers_permit: "Seller's Permit" }[t] || t);

      if (loading) return <div className="loading">Loading trade customers...</div>;

      return (
        <div>
          <div style={{ marginBottom: '1rem', display: 'flex', alignItems: 'center', gap: '1rem' }}>
            <label style={{ fontSize: '0.8125rem', color: 'var(--stone-500)' }}>Filter by status:</label>
            <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)}
              style={{ padding: '0.4rem 0.6rem', border: '1px solid var(--stone-300)', fontSize: '0.875rem' }}>
              <option value="">All</option>
              <option value="pending">Pending</option>
              <option value="approved">Approved</option>
              <option value="rejected">Rejected</option>
            </select>
          </div>

          <div className="table-scroll-wrapper">
          <table className="data-table">
            <thead>
              <tr>
                <th>Company</th>
                <th>Contact</th>
                <th>Email</th>
                <th>Type</th>
                <th>Status</th>
                <th>Tier</th>
                <th>Applied</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              {customers.length === 0 ? (
                <tr><td colSpan="8" style={{ textAlign: 'center', color: 'var(--stone-400)' }}>No trade customers found</td></tr>
              ) : customers.map(c => (
                <React.Fragment key={c.id}>
                  <tr style={{ cursor: 'pointer' }} onClick={() => toggleExpand(c.id)}>
                    <td>
                      <strong>{c.company_name}</strong>
                      {c.from_retail_upgrade && (
                        <span title="Upgraded from an existing retail account" style={{ marginLeft: '0.4rem', padding: '0.1rem 0.35rem', borderRadius: '3px', background: 'var(--stone-100)', border: '1px solid var(--stone-300)', fontSize: '0.625rem', fontWeight: 600, letterSpacing: '0.04em', textTransform: 'uppercase', color: 'var(--stone-600)', whiteSpace: 'nowrap' }}>Existing customer</span>
                      )}
                    </td>
                    <td>{c.contact_name}</td>
                    <td>{c.email}</td>
                    <td style={{ fontSize: '0.8125rem', color: 'var(--stone-500)', textTransform: 'capitalize' }}>{(c.business_type || '').replace('_', ' ') || '\u2014'}</td>
                    <td>{statusBadge(c.status)}</td>
                    <td>
                      <select value={c.margin_tier_id || ''} onClick={e => e.stopPropagation()} onChange={e => updateCustomer(c.id, { margin_tier_id: e.target.value || null })}
                        style={{ padding: '0.3rem 0.4rem', border: '1px solid var(--stone-300)', fontSize: '0.8125rem' }}>
                        <option value="">No tier</option>
                        {tiers.map(t => <option key={t.id} value={t.id}>{t.name} ({parseFloat(t.discount_percent || 0)}%)</option>)}
                      </select>
                    </td>
                    <td style={{ fontSize: '0.8125rem', color: 'var(--stone-500)' }}>
                      {new Date(c.created_at).toLocaleDateString()}
                    </td>
                    <td onClick={e => e.stopPropagation()}>
                      <div style={{ display: 'flex', gap: '0.35rem', flexWrap: 'wrap' }}>
                        {c.status === 'pending' && (
                          <>
                            <button className="btn-link" onClick={() => approveCustomer(c.id, c.tax_exempt)} disabled={actionLoading}>Approve</button>
                            <button className="btn-link btn-link-danger" onClick={() => { setExpandedId(c.id); loadDocs(c.id); }}>Review</button>
                          </>
                        )}
                        {c.status === 'approved' && (
                          <button className="btn-link btn-link-danger" onClick={() => updateCustomer(c.id, { status: 'rejected' })}>Revoke</button>
                        )}
                        {c.status === 'rejected' && (
                          <button className="btn-link" onClick={() => approveCustomer(c.id, c.tax_exempt)} disabled={actionLoading}>Approve</button>
                        )}
                        <button className="btn-link btn-link-danger" onClick={() => deleteCustomer(c.id, c.company_name)}>Delete</button>
                      </div>
                    </td>
                  </tr>
                  {expandedId === c.id && (
                    <tr><td colSpan="8" style={{ background: 'var(--stone-50)', padding: '1.5rem' }}>
                      <div className="resp-grid-2" style={{ gap: '1.5rem' }}>
                        <div>
                          <h4 style={{ fontSize: '0.875rem', fontWeight: 600, marginBottom: '0.75rem' }}>Applicant details</h4>
                          <div style={{ display: 'grid', gridTemplateColumns: 'max-content 1fr', gap: '0.35rem 1rem', fontSize: '0.8125rem', marginBottom: '1.25rem' }}>
                            {[
                              ['Email', c.email || '—'],
                              ['Phone', c.phone || 'Not provided'],
                              ['Business type', (c.business_type || '').replace(/_/g, ' ') || 'Not stated'],
                              ['EIN', c.ein || 'Not provided'],
                              ['Contractor license', c.contractor_license || 'Not provided'],
                              ['Address', [c.address_line1, [c.city, c.state].filter(Boolean).join(', '), c.zip].filter(Boolean).join(' · ') || 'Not provided'],
                            ].map(([k, v]) => (
                              <React.Fragment key={k}>
                                <span style={{ color: 'var(--stone-500)' }}>{k}</span>
                                <span style={{ textTransform: k === 'Business type' ? 'capitalize' : 'none' }}>{v}</span>
                              </React.Fragment>
                            ))}
                          </div>
                          <h4 style={{ fontSize: '0.875rem', fontWeight: 600, marginBottom: '0.75rem' }}>Documents</h4>
                          {docsLoading ? <div>Loading documents...</div> : docs.length === 0 ? <div style={{ color: 'var(--stone-400)', fontSize: '0.8125rem' }}>No documents uploaded</div> : (
                            <div style={{ display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
                              {docs.map(d => (
                                <div key={d.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '0.5rem 0.75rem', background: 'var(--panel)', border: '1px solid var(--stone-200)', fontSize: '0.8125rem' }}>
                                  <div>
                                    <strong>{docTypeLabel(d.doc_type)}</strong>
                                    <div style={{ color: 'var(--stone-400)', fontSize: '0.75rem' }}>{d.file_name} — {(d.file_size / 1024).toFixed(0)} KB</div>
                                  </div>
                                  {d.url && <a href={d.url} target="_blank" rel="noopener" style={{ color: 'var(--gold)', fontWeight: 500, fontSize: '0.8125rem' }}>View</a>}
                                </div>
                              ))}
                            </div>
                          )}
                          {c.total_spend !== undefined && (
                            <div style={{ marginTop: '1rem', fontSize: '0.8125rem' }}>
                              <strong>Spend (last 12 mo):</strong> ${parseFloat((c.prior_spend != null ? c.prior_spend : c.total_spend) || 0).toLocaleString()}
                              {c.from_retail_upgrade && c.status === 'pending' && parseFloat(c.prior_spend || 0) > 0 && (
                                <span style={{ color: 'var(--stone-500)' }}> · rolls into starting tier on approval</span>
                              )}
                            </div>
                          )}
                          {c.from_retail_upgrade && (
                            <div style={{ marginTop: '1rem', fontSize: '0.8125rem' }}>
                              <strong>Origin:</strong> Upgraded from an existing retail account{c.retail_customer_since ? ' (customer since ' + new Date(c.retail_customer_since).toLocaleDateString() + ')' : ''}
                            </div>
                          )}
                          <div style={{ marginTop: '1rem', fontSize: '0.8125rem' }}>
                            <strong>Assigned Rep:</strong>{' '}
                            <select value={c.assigned_rep_id || ''} onChange={e => assignRep(c.id, e.target.value)}
                              style={{ padding: '0.3rem 0.4rem', border: '1px solid var(--stone-300)', fontSize: '0.8125rem', marginLeft: '0.25rem' }}>
                              <option value="">Unassigned</option>
                              {reps.map(r => <option key={r.id} value={r.id}>{r.first_name} {r.last_name}</option>)}
                            </select>
                          </div>
                          {c.status !== 'pending' && (
                            <div style={{ marginTop: '1rem', fontSize: '0.8125rem' }}>
                              <label style={{ display: 'flex', alignItems: 'flex-start', gap: '0.5rem', cursor: 'pointer' }}>
                                <input type="checkbox" checked={!!c.tax_exempt} onChange={e => updateCustomer(c.id, { tax_exempt: e.target.checked })} style={{ marginTop: '0.15rem' }} />
                                <span>
                                  <strong>Tax exempt (resale)</strong>
                                  <span style={{ display: 'block', color: 'var(--stone-500)', fontSize: '0.75rem' }}>Removes sales tax on materials. Set only after verifying the resale certificate.</span>
                                </span>
                              </label>
                            </div>
                          )}
                        </div>
                        <div>
                          {c.status === 'pending' && (
                            <>
                              <h4 style={{ fontSize: '0.875rem', fontWeight: 600, marginBottom: '0.75rem' }}>Actions</h4>
                              <label style={{ display: 'flex', alignItems: 'flex-start', gap: '0.5rem', cursor: 'pointer', marginBottom: '0.75rem', fontSize: '0.8125rem' }}>
                                <input type="checkbox" checked={!!c.tax_exempt} onChange={e => updateCustomer(c.id, { tax_exempt: e.target.checked })} style={{ marginTop: '0.15rem' }} />
                                <span>
                                  <strong>Tax exempt (resale)</strong>
                                  <span style={{ display: 'block', color: 'var(--stone-500)', fontSize: '0.75rem' }}>Removes sales tax on materials. Tick only after verifying the resale certificate above.</span>
                                </span>
                              </label>
                              <div style={{ marginBottom: '1rem' }}>
                                <button className="btn btn-primary btn-sm" onClick={() => approveCustomer(c.id, c.tax_exempt)} disabled={actionLoading} style={{ marginRight: '0.5rem' }}>
                                  {actionLoading ? 'Processing...' : 'Approve'}
                                </button>
                              </div>
                              <div>
                                <label style={{ display: 'block', fontSize: '0.8125rem', fontWeight: 500, marginBottom: '0.375rem' }}>Denial Reason (optional)</label>
                                <textarea value={denialReason} onChange={e => setDenialReason(e.target.value)}
                                  style={{ width: '100%', padding: '0.5rem', border: '1px solid var(--stone-300)', fontSize: '0.875rem', fontFamily: 'Inter, sans-serif', minHeight: '60px', resize: 'vertical' }}
                                  placeholder="Reason for denial..." />
                                <button className="btn btn-danger btn-sm" onClick={() => denyCustomer(c.id)} disabled={actionLoading} style={{ marginTop: '0.5rem' }}>
                                  Deny Application
                                </button>
                              </div>
                            </>
                          )}
                          {c.denial_reason && (
                            <div style={{ marginTop: '1rem', fontSize: '0.8125rem' }}>
                              <strong>Denial Reason:</strong> {c.denial_reason}
                            </div>
                          )}
                        </div>
                      </div>
                    </td></tr>
                  )}
                </React.Fragment>
              ))}
            </tbody>
          </table>
          </div>
        </div>
      );
    }

    // Shared helpers for the staff-management surface.
    const STAFF_ROLE_LABELS = { admin: 'Admin', manager: 'Manager', sales_rep: 'Sales Rep', warehouse: 'Warehouse' };
    function staffRelTime(ts) {
      if (!ts) return 'never';
      const d = new Date(ts).getTime();
      if (isNaN(d)) return '\u2014';
      const s = Math.floor((Date.now() - d) / 1000);
      if (s < 60) return 'just now';
      const m = Math.floor(s / 60); if (m < 60) return m + 'm ago';
      const h = Math.floor(m / 60); if (h < 24) return h + 'h ago';
      const dd = Math.floor(h / 24); if (dd < 30) return dd + 'd ago';
      const mo = Math.floor(dd / 30); if (mo < 12) return mo + 'mo ago';
      return Math.floor(mo / 12) + 'y ago';
    }
    function staffLoginStale(ts) { return ts && (Date.now() - new Date(ts).getTime()) > 30 * 86400000; }

    // ===== StaffLedger — two-pane OPERATIONS staff console (Admin Staff.html) =====
    const ST_VIEWS = [
      { id: 'all', label: 'All staff', hint: 'active accounts' },
      { id: 'admin', label: 'Admins', hint: 'full access' },
      { id: 'manager', label: 'Managers', hint: 'approvals · pricing' },
      { id: 'sales_rep', label: 'Sales reps', hint: 'orders · customers' },
      { id: 'warehouse', label: 'Warehouse', hint: 'receiving · yard' },
      { id: 'inactive', label: 'Deactivated', hint: 'access removed' },
    ];
    const ST_ROLES = {
      admin: { t: 'ADMIN', c: 'var(--hot)' },
      manager: { t: 'MANAGER', c: 'var(--gold)' },
      sales_rep: { t: 'SALES REP', c: 'var(--cool)' },
      warehouse: { t: 'WAREHOUSE', c: 'var(--dim)' },
    };
    // Capability matrix — reflects the real requireRole gating in server.js.
    const ST_PERMS = {
      admin: ['Everything, including staff accounts, refunds, and vendor payouts'],
      manager: [['Review + approve trade applications', true], ['Edit catalog + pricing', true], ['Refunds, credit memos, releases', true], ['Create / edit admin accounts', false], ['Reset an admin password', false]],
      sales_rep: [['Create quotes, orders + estimates', true], ['Collect payment · request payment', true], ['Own customers, visits + commission', true], ['Manage staff accounts', false], ['Approve trade applications', false]],
      warehouse: [['Receive POs · flag damage', true], ['Material releases + pickups', true], ['Add internal order notes', true], ['Edit orders or pricing', false], ['See customer money', false]],
    };
    const STAFF_COLS = '22px minmax(140px,1.4fr) minmax(78px,100px) minmax(44px,60px) minmax(84px,118px) minmax(74px,96px)';
    const stInitials = s => ((s.first_name || ' ')[0] + (s.last_name || ' ')[0]).trim().toUpperCase() || '—';
    const stSince = ts => ts ? new Date(ts).toLocaleDateString('en-US', { month: 'short', year: 'numeric' }) : '';
    const stSummarize = d => { if (!d) return ''; try { const o = typeof d === 'string' ? JSON.parse(d) : d; return Object.entries(o).map(([k, v]) => k + '=' + (v == null ? '—' : (typeof v === 'object' ? JSON.stringify(v) : v))).join(' · ').slice(0, 110); } catch { return String(d).slice(0, 110); } };

    function StaffLedger({ navigate, staffRole, staffData, initialSel }) {
      const [staff, setStaff] = useState([]);
      const [loading, setLoading] = useState(true);
      const [view, setView] = useState('all');
      const [q, setQ] = useState('');
      const [sel, setSel] = useState(initialSel || null);
      const [sessions, setSessions] = useState([]);
      const [activity, setActivity] = useState([]);
      const [msg, setMsg] = useState(''); const [err, setErr] = useState('');
      const [editing, setEditing] = useState(false);
      const [role, setRole] = useState(''); const [roleReason, setRoleReason] = useState('');
      const [ident, setIdent] = useState({ first_name: '', last_name: '', phone: '' });
      const [saving, setSaving] = useState(false);
      const [pwOpen, setPwOpen] = useState(false); const [newPw, setNewPw] = useState('');
      const [danger, setDanger] = useState(null); const [reason, setReason] = useState('');

      const loadList = () => adminFetch('/api/admin/staff').then(d => { setStaff(d.staff || []); setLoading(false); }).catch(() => setLoading(false));
      useEffect(loadList, []);

      const inView = (s, v) => v === 'all' ? s.is_active : v === 'inactive' ? !s.is_active : s.is_active && s.role === v;
      const rows = staff.filter(s => inView(s, view) && (!q || (s.first_name + ' ' + s.last_name + ' ' + s.email).toLowerCase().includes(q.toLowerCase())));
      const activeId = rows.some(r => r.id === sel) ? sel : (rows[0] ? rows[0].id : null);
      const active = staff.find(s => s.id === activeId) || null;
      const pendingInvites = staff.filter(s => s.is_active && s.invite_pending).length;

      const loadPane = (id) => {
        if (!id) { setSessions([]); setActivity([]); return; }
        adminFetch('/api/admin/staff/' + id + '/sessions').then(d => setSessions(d.sessions || [])).catch(() => setSessions([]));
        adminFetch('/api/admin/audit-log?entity_id=' + id + '&limit=12').then(d => setActivity(d.entries || [])).catch(() => setActivity([]));
      };
      useEffect(() => {
        setEditing(false); setPwOpen(false); setDanger(null); setReason(''); setErr(''); setMsg('');
        if (active) { setRole(active.role); setIdent({ first_name: active.first_name, last_name: active.last_name, phone: active.phone || '' }); setRoleReason(''); }
        loadPane(activeId);
      }, [activeId]);

      const isSelf = staffData && staffData.id === activeId;
      const blocked = staffRole === 'manager' && active && active.role === 'admin';
      const flash = m => { setMsg(m); setErr(''); setTimeout(() => setMsg(''), 3500); };
      const fail = e => { setErr(e); setTimeout(() => setErr(''), 6000); };
      const reloadAll = () => { loadList(); loadPane(activeId); };
      const act = async (path, okMsg, method) => { setErr(''); try { await adminFetch(path, { method: method || 'POST' }); flash(okMsg); reloadAll(); } catch (e) { fail(e.message || 'Action failed'); } };
      const saveChanges = async () => {
        if (role === 'admin' && active.role !== 'admin' && !roleReason.trim()) { fail('A reason is required to grant admin access'); return; }
        setSaving(true); setErr('');
        try {
          await adminFetch('/api/admin/staff/' + activeId, { method: 'PUT', body: JSON.stringify({ ...ident, role, reason: roleReason.trim() || null }) });
          flash('Changes saved'); setEditing(false); reloadAll();
        } catch (e) { fail(e.message || 'Save failed'); }
        setSaving(false);
      };
      const setPasswordDirect = async () => {
        if (!newPw) { fail('Enter a password'); return; }
        try { await adminFetch('/api/admin/staff/' + activeId + '/password', { method: 'PUT', body: JSON.stringify({ password: newPw }) }); setNewPw(''); setPwOpen(false); flash('Password set — sessions signed out'); reloadAll(); }
        catch (e) { fail(e.message || 'Failed'); }
      };
      const confirmDanger = async () => {
        try {
          await adminFetch('/api/admin/staff/' + activeId + '/toggle', { method: 'PATCH', body: JSON.stringify({ reason: reason.trim() || null }) });
          flash('Account deactivated');
          setDanger(null); setReason(''); reloadAll();
        } catch (e) { fail(e.message || 'Action failed'); }
      };

      const btnBrass = { padding: '8px 14px', background: 'var(--gold)', border: 'none', color: 'var(--brass-ink)', font: '500 12px/1 var(--sans)', cursor: 'pointer' };
      const btnGhost = { padding: '8px 12px', background: 'transparent', border: '1px solid var(--line2)', color: 'var(--ink)', font: '400 12px/1 var(--sans)', cursor: 'pointer' };
      const btnDanger = { padding: '8px 12px', background: 'transparent', border: '1px solid rgba(224,122,99,0.42)', color: 'var(--hot)', font: '400 12px/1 var(--sans)', cursor: 'pointer' };
      const H = t => <div className="opsq-block-label" style={{ margin: '20px 0 9px' }}>{t}</div>;
      const editInp = { width: '100%', boxSizing: 'border-box', padding: '7px 9px', background: 'var(--bg)', border: '1px solid var(--line)', color: 'var(--ink)', font: '400 12px/1.3 var(--sans)', outline: 'none', marginBottom: 8 };

      const r = active && (ST_ROLES[active.role] || ST_ROLES.warehouse);

      return (
        <div className="ordl">
          <section className="ordl-main">
            <div className="ordl-tabs">
              {ST_VIEWS.map(v => {
                const on = v.id === view;
                const n = staff.filter(s => inView(s, v.id)).length;
                return (
                  <button key={v.id} className={'ordl-tab' + (on ? ' active' : '')} onClick={() => setView(v.id)}>
                    <span className="ordl-tab-row"><span className="ordl-tab-label">{v.label}</span><span className="ordl-tab-n">{n}</span></span>
                    <span className="ordl-tab-hint">{v.hint.toUpperCase()}</span>
                  </button>
                );
              })}
            </div>
            <div className="ordl-filters">
              <button style={{ ...btnBrass, padding: '6px 11px', font: '500 11px/1 var(--sans)', flexShrink: 0 }} onClick={() => navigate('staff-create')}>+ Invite staff</button>
              {pendingInvites > 0 && <span style={{ font: '400 10px/1 var(--mono)', color: 'var(--gold)', whiteSpace: 'nowrap' }}>{pendingInvites} invite{pendingInvites === 1 ? '' : 's'} pending</span>}
              <button className="ordl-chip" onClick={() => navigate('audit')} title="Full audit log">AUDIT LOG</button>
              <input className="ordl-search" value={q} onChange={e => setQ(e.target.value)} placeholder="filter staff…" />
            </div>
            <PendingInvites
              invites={staff.filter(s => s.is_active && s.invite_pending && !(staffData && s.id === staffData.id))}
              onResend={id => act('/api/admin/staff/' + id + '/send-reset', 'Invite re-sent')}
              onRevoke={id => act('/api/admin/staff/' + id + '/revoke-invite', 'Invite revoked')} />
            <div className="ordl-scroll">
              <div style={{ minWidth: 620 }}>
                <div className="ordl-head" style={{ gridTemplateColumns: STAFF_COLS }}>
                  <span /><span>PERSON</span><span>ROLE</span><span>2FA</span><span>LAST ACTIVE</span><span>STATUS</span>
                </div>
                {loading && <div className="opsq-empty">loading staff…</div>}
                {!loading && rows.length === 0 && <div className="opsq-empty">no staff in this view</div>}
                {rows.map(s => {
                  const on = s.id === activeId; const rr = ST_ROLES[s.role] || ST_ROLES.warehouse; const stale = staffLoginStale(s.last_login);
                  return (
                    <div key={s.id} className={'ordl-row' + (on ? ' active' : '')} onClick={() => { if (window.innerWidth < 1100) navigate('staff-detail', s.id); else setSel(s.id); }}>
                      <div className="ordl-grid" style={{ gridTemplateColumns: STAFF_COLS }}>
                        <span style={{ width: 22, height: 22, borderRadius: '50%', background: 'var(--panel2)', border: '1px solid var(--line2)', display: 'flex', alignItems: 'center', justifyContent: 'center', font: '400 9px/1 var(--mono)', color: 'var(--dim)' }}>{stInitials(s)}</span>
                        <span style={{ minWidth: 0 }}>
                          <span className="ordl-cust" style={{ color: s.is_active ? 'var(--ink)' : 'var(--faint)' }}>{s.first_name} {s.last_name}{s.invite_pending && <span style={{ marginLeft: 6, font: '400 9px/1 var(--mono)', letterSpacing: '0.06em', color: 'var(--gold)' }}>INVITE</span>}</span>
                          <span className="ordl-co">{s.email}</span>
                        </span>
                        <span style={{ font: '400 10px/1 var(--mono)', letterSpacing: '0.06em', color: s.is_active ? rr.c : 'var(--faint)' }}>{rr.t}</span>
                        <span style={{ font: '400 10px/1 var(--mono)', color: s.trusted_devices > 0 ? 'var(--cool)' : 'var(--faint)' }}>{s.trusted_devices > 0 ? s.trusted_devices + ' dev' : '—'}</span>
                        <span style={{ font: '400 10px/1.3 var(--mono)', color: stale ? 'var(--hot)' : 'var(--dim)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{stale && '⚠ '}{s.last_login ? staffRelTime(s.last_login) : 'never'}</span>
                        <span style={{ display: 'flex', alignItems: 'center', gap: 7, font: '400 10px/1 var(--mono)', letterSpacing: '0.06em', color: s.is_active ? 'var(--cool)' : 'var(--hot)' }}>
                          <span style={{ width: 5, height: 5, borderRadius: '50%', background: s.is_active ? 'var(--cool)' : 'var(--hot)', flexShrink: 0 }} />{s.is_active ? 'ACTIVE' : 'REVOKED'}
                        </span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
            <div className="ordl-foot">
              <span style={{ letterSpacing: '0.08em' }}>{rows.length} STAFF</span>
              <span style={{ color: 'var(--dim)' }}>{staff.filter(s => s.is_active).length} active · {staff.filter(s => !s.is_active).length} deactivated</span>
            </div>
          </section>

          <aside className="ordl-pane">
            {!active ? (
              <div style={{ flex: 1, display: 'grid', placeItems: 'center', font: '400 12px/1 var(--mono)', color: 'var(--faint)' }}>NO STAFF SELECTED</div>
            ) : (
              <React.Fragment>
                <div className="ordl-pane-head">
                  <div style={{ display: 'flex', alignItems: 'baseline', gap: 10 }}>
                    <span style={{ font: '500 16px/1.2 var(--sans)' }}>{active.first_name} {active.last_name}</span>
                    <span style={{ font: '400 10px/1 var(--mono)', letterSpacing: '0.08em', color: r.c }}>{r.t}</span>
                    {!active.is_active && <span style={{ font: '400 10px/1 var(--mono)', color: 'var(--hot)' }}>DEACTIVATED</span>}
                  </div>
                  <div style={{ marginTop: 6, font: '400 11px/1.5 var(--mono)', color: 'var(--dim)' }}>{active.email}<br />since {stSince(active.created_at)} · {active.trusted_devices || 0} trusted device{active.trusted_devices === 1 ? '' : 's'}</div>
                  {active.assigned_customers > 0 && <div style={{ marginTop: 10, font: '400 12px/1.5 var(--sans)', color: 'var(--dim)' }}>{active.assigned_customers} trade customer{active.assigned_customers === 1 ? '' : 's'} assigned.</div>}
                  <button className="rb-action" style={{ marginTop: 10 }} onClick={() => navigate('staff-detail', activeId)}>Open full record →</button>
                </div>
                <div className="opsq-pane-body" style={{ padding: '0 20px 24px' }}>
                  {msg && <div style={{ marginTop: 14, padding: '8px 11px', background: 'var(--green-light)', color: 'var(--green)', font: '400 11px/1.4 var(--mono)' }}>{msg}</div>}
                  {err && <div style={{ marginTop: 14, padding: '8px 11px', background: 'var(--red-light)', color: 'var(--hot)', font: '400 11px/1.4 var(--mono)' }}>{err}</div>}
                  {blocked && <div style={{ marginTop: 14, padding: '8px 11px', background: 'var(--panel2)', color: 'var(--dim)', font: '400 11px/1.4 var(--mono)' }}>Managers cannot modify admin accounts.</div>}
                  {active.invite_pending && <div style={{ marginTop: 14, display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 10, padding: '8px 11px', background: 'var(--panel2)', font: '400 11px/1.4 var(--mono)', color: 'var(--dim)' }}>
                    <span>Invite pending — no password set yet.</span>
                    <button style={{ ...btnGhost, padding: '5px 9px', font: '400 10px/1 var(--mono)' }} disabled={blocked} onClick={() => act('/api/admin/staff/' + activeId + '/send-reset', 'Invite re-sent')}>Resend</button>
                  </div>}

                  {editing ? (
                    <React.Fragment>
                      {H('EDIT ROLE + ACCESS')}
                      <div style={{ display: 'flex', gap: 8 }}>
                        <input style={editInp} placeholder="First name" value={ident.first_name} onChange={e => setIdent({ ...ident, first_name: e.target.value })} />
                        <input style={editInp} placeholder="Last name" value={ident.last_name} onChange={e => setIdent({ ...ident, last_name: e.target.value })} />
                      </div>
                      <input style={editInp} placeholder="Phone" value={ident.phone} onChange={e => setIdent({ ...ident, phone: formatPhone(e.target.value) })} />
                      <select style={{ ...editInp, appearance: 'auto' }} value={role} onChange={e => setRole(e.target.value)} disabled={staffRole === 'manager'}>
                        <option value="admin">Admin</option><option value="manager">Manager</option><option value="sales_rep">Sales Rep</option><option value="warehouse">Warehouse</option>
                      </select>
                      {role === 'admin' && active.role !== 'admin' && <input style={editInp} placeholder="Reason for granting admin access (required)" value={roleReason} onChange={e => setRoleReason(e.target.value)} />}
                      <div style={{ display: 'flex', gap: 8, marginTop: 4 }}>
                        <button style={btnBrass} disabled={saving} onClick={saveChanges}>{saving ? 'Saving…' : 'Save changes'}</button>
                        <button style={btnGhost} onClick={() => { setEditing(false); setRole(active.role); setIdent({ first_name: active.first_name, last_name: active.last_name, phone: active.phone || '' }); }}>Cancel</button>
                      </div>
                    </React.Fragment>
                  ) : (
                    <React.Fragment>
                      {H('SECURITY')}
                      <div style={{ display: 'grid', gridTemplateColumns: '1fr auto', gap: '8px 12px', font: '400 11px/1.4 var(--mono)', alignItems: 'center' }}>
                        <span style={{ color: 'var(--dim)' }}>Trusted devices</span>
                        <span style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                          <span style={{ color: active.trusted_devices > 0 ? 'var(--cool)' : 'var(--faint)' }}>{active.trusted_devices || 0}</span>
                          {active.trusted_devices > 0 && !blocked && <button style={{ ...btnGhost, padding: '4px 8px', font: '400 10px/1 var(--mono)' }} onClick={() => act('/api/admin/staff/' + activeId + '/revoke-trusted', 'Trusted devices revoked')}>Revoke</button>}
                        </span>
                        <span style={{ color: 'var(--dim)' }}>Active sessions</span>
                        <span style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                          <span style={{ color: 'var(--ink)' }}>{sessions.filter(x => x.active).length}</span>
                          {sessions.length > 0 && !blocked && <button style={{ ...btnGhost, padding: '4px 8px', font: '400 10px/1 var(--mono)' }} onClick={() => act('/api/admin/staff/' + activeId + '/force-logout', 'Signed out everywhere')}>Sign out all</button>}
                        </span>
                      </div>

                      {sessions.length > 0 && <>{H('SESSIONS')}
                        <div style={{ display: 'grid', gap: 8 }}>
                          {sessions.map(ss => (
                            <div key={ss.id} style={{ display: 'flex', justifyContent: 'space-between', gap: 10, font: '400 11px/1.4 var(--mono)' }}>
                              <span style={{ color: ss.active ? 'var(--ink)' : 'var(--faint)' }}>{ss.device_id || 'device'}{ss.is_trusted ? ' · trusted' : ''}</span>
                              <span style={{ color: 'var(--faint)', textAlign: 'right' }}>{staffRelTime(ss.created_at)}</span>
                            </div>
                          ))}
                        </div>
                      </>}

                      {H(active.role === 'admin' ? 'ACCESS' : 'CAN / CANNOT')}
                      {active.role === 'admin' ? (
                        <div style={{ font: '400 12px/1.5 var(--sans)', color: 'var(--dim)' }}>{ST_PERMS.admin[0]}</div>
                      ) : (
                        <div style={{ display: 'grid', gap: 7 }}>
                          {(ST_PERMS[active.role] || []).map(([p, ok]) => (
                            <div key={p} style={{ display: 'flex', gap: 9, alignItems: 'baseline', font: '400 12px/1.4 var(--sans)', color: ok ? 'var(--ink)' : 'var(--faint)' }}>
                              <span style={{ font: '400 10px/1 var(--mono)', color: ok ? 'var(--cool)' : 'var(--faint)', width: 10, flexShrink: 0 }}>{ok ? '✓' : '—'}</span>{p}
                            </div>
                          ))}
                        </div>
                      )}

                      {H('RECENT ACTIVITY')}
                      {activity.length === 0 ? <div style={{ font: '400 11px/1.5 var(--mono)', color: 'var(--faint)' }}>no recorded activity</div> : (
                        <div style={{ display: 'grid', gap: 10 }}>
                          {activity.map((a, i) => (
                            <div key={a.id || i} style={{ display: 'grid', gridTemplateColumns: '78px 1fr', gap: 10, font: '400 11px/1.45 var(--mono)' }}>
                              <span style={{ color: 'var(--faint)' }}>{staffRelTime(a.created_at)}</span>
                              <span style={{ color: 'var(--dim)' }}><span style={{ color: 'var(--ink)' }}>{a.action}</span>{a.staff_name ? ' · ' + a.staff_name : ''}{a.details && stSummarize(a.details) ? <span style={{ display: 'block', color: 'var(--faint)', marginTop: 3 }}>{stSummarize(a.details)}</span> : null}</span>
                            </div>
                          ))}
                        </div>
                      )}

                      {!blocked && <>{H('PASSWORD')}
                        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                          <button style={btnGhost} onClick={() => act('/api/admin/staff/' + activeId + '/send-reset', 'Reset link emailed')}>Send reset link</button>
                          <button style={btnGhost} onClick={() => setPwOpen(o => !o)}>Set password…</button>
                        </div>
                        {pwOpen && <div style={{ display: 'flex', gap: 8, marginTop: 9, alignItems: 'center' }}>
                          <input type="password" style={{ ...editInp, marginBottom: 0, maxWidth: 220 }} placeholder="New password" value={newPw} onChange={e => setNewPw(e.target.value)} />
                          <button style={btnBrass} onClick={setPasswordDirect}>Save</button>
                        </div>}
                      </>}
                    </React.Fragment>
                  )}
                </div>

                {!editing && (
                  <div className="ordl-pane-foot" style={{ flexWrap: 'wrap' }}>
                    {active.is_active ? (
                      danger ? (
                        <div style={{ width: '100%' }}>
                          <div style={{ font: '400 11px/1.5 var(--mono)', color: 'var(--dim)', marginBottom: 8 }}>Deactivate — they’ll be signed out. Their customers stay assigned as free agents and come back if you reactivate.</div>
                          <input style={editInp} placeholder="Reason (optional)" value={reason} onChange={e => setReason(e.target.value)} autoFocus />
                          <div style={{ display: 'flex', gap: 8 }}>
                            <button style={{ ...btnBrass, background: 'var(--hot)', color: '#fff' }} onClick={confirmDanger}>Confirm {danger}</button>
                            <button style={btnGhost} onClick={() => { setDanger(null); setReason(''); }}>Cancel</button>
                          </div>
                        </div>
                      ) : (
                        <React.Fragment>
                          <button style={btnBrass} disabled={blocked} onClick={() => setEditing(true)}>Edit role + access</button>
                          {!blocked && !isSelf && <button style={btnDanger} onClick={() => { setDanger('deactivate'); setReason(''); }}>Deactivate</button>}
                        </React.Fragment>
                      )
                    ) : (
                      <button style={btnGhost} disabled={blocked} onClick={() => act('/api/admin/staff/' + activeId + '/toggle', 'Account reactivated', 'PATCH')}>Reactivate account</button>
                    )}
                  </div>
                )}
              </React.Fragment>
            )}
          </aside>
        </div>
      );
    }

    // ========== StaffDetail — full-page staff record (admin-staff-detail.jsx) ==========
    function StaffDetail({ editId, navigate, staffRole, staffData }) {
      const [s, setS] = useState(null);
      const [loading, setLoading] = useState(true);
      const [sessions, setSessions] = useState([]);
      const [activity, setActivity] = useState([]);
      const [tab, setTab] = useState('record');
      const [editing, setEditing] = useState(false);
      const [role, setRole] = useState(''); const [roleReason, setRoleReason] = useState('');
      const [ident, setIdent] = useState({ first_name: '', last_name: '', phone: '' });
      const [saving, setSaving] = useState(false);
      const [pwOpen, setPwOpen] = useState(false); const [newPw, setNewPw] = useState('');
      const [menu, setMenu] = useState(false);
      const [danger, setDanger] = useState(null); const [reason, setReason] = useState('');
      const [msg, setMsg] = useState(''); const [err, setErr] = useState('');

      const flash = m => { setMsg(m); setErr(''); setTimeout(() => setMsg(''), 3500); };
      const fail = e => { setErr(e); setTimeout(() => setErr(''), 6000); };

      const loadRow = () => adminFetch('/api/admin/staff').then(d => {
        const row = (d.staff || []).find(x => x.id === editId) || null;
        setS(row); setLoading(false);
        if (row) { setRole(row.role); setIdent({ first_name: row.first_name, last_name: row.last_name, phone: row.phone || '' }); }
      }).catch(() => setLoading(false));
      const loadAux = () => {
        adminFetch('/api/admin/staff/' + editId + '/sessions').then(d => setSessions(d.sessions || [])).catch(() => setSessions([]));
        adminFetch('/api/admin/audit-log?entity_id=' + editId + '&limit=40').then(d => setActivity(d.entries || [])).catch(() => setActivity([]));
      };
      useEffect(() => { setLoading(true); loadRow(); loadAux(); }, [editId]);
      const reloadAll = () => { loadRow(); loadAux(); };

      const sdInp = { width: '100%', boxSizing: 'border-box', padding: '7px 9px', background: 'var(--bg)', border: '1px solid var(--line)', color: 'var(--ink)', font: '400 12px/1.3 var(--sans)', outline: 'none', marginBottom: 8 };
      const menuItem = { display: 'block', width: '100%', textAlign: 'left', padding: '9px 12px', background: 'transparent', border: 'none', borderBottom: '1px solid var(--line)', color: 'var(--ink)', font: '400 12px/1 var(--sans)', cursor: 'pointer' };

      if (loading) return <div className="recd-page"><div style={{ padding: 40, font: '400 12px/1 var(--mono)', color: 'var(--faint)' }}>loading…</div></div>;
      if (!s) return <div className="recd-page"><div style={{ padding: 40, font: '400 13px/1.4 var(--sans)', color: 'var(--dim)' }}>Staff member not found. <button className="rb-action" onClick={() => navigate('staff')}>← Staff</button></div></div>;

      const r = ST_ROLES[s.role] || ST_ROLES.warehouse;
      const perms = ST_PERMS[s.role] || [];
      const isSelf = staffData && staffData.id === s.id;
      const blocked = staffRole === 'manager' && s.role === 'admin';
      const activeSessions = sessions.filter(x => x.active).length;
      const trail = activity;

      const act = async (path, okMsg, method) => { setErr(''); setMenu(false); try { await adminFetch(path, { method: method || 'POST' }); flash(okMsg); reloadAll(); } catch (e) { fail(e.message || 'Action failed'); } };
      const startEdit = () => { setEditing(true); setTab('access'); setMenu(false); setRole(s.role); setIdent({ first_name: s.first_name, last_name: s.last_name, phone: s.phone || '' }); setRoleReason(''); };
      const saveChanges = async () => {
        if (role === 'admin' && s.role !== 'admin' && !roleReason.trim()) { fail('A reason is required to grant admin access'); return; }
        setSaving(true); setErr('');
        try { await adminFetch('/api/admin/staff/' + s.id, { method: 'PUT', body: JSON.stringify({ ...ident, role, reason: roleReason.trim() || null }) }); flash('Changes saved'); setEditing(false); reloadAll(); }
        catch (e) { fail(e.message || 'Save failed'); }
        setSaving(false);
      };
      const setPasswordDirect = async () => {
        if (!newPw) { fail('Enter a password'); return; }
        try { await adminFetch('/api/admin/staff/' + s.id + '/password', { method: 'PUT', body: JSON.stringify({ password: newPw }) }); setNewPw(''); setPwOpen(false); flash('Password set — sessions signed out'); reloadAll(); }
        catch (e) { fail(e.message || 'Failed'); }
      };
      const revokeSession = async (sid) => { try { await adminFetch('/api/admin/staff/' + s.id + '/sessions/' + sid, { method: 'DELETE' }); flash('Session revoked'); loadAux(); loadRow(); } catch (e) { fail(e.message || 'Failed'); } };
      const confirmDanger = async () => {
        try {
          await adminFetch('/api/admin/staff/' + s.id + '/toggle', { method: 'PATCH', body: JSON.stringify({ reason: reason.trim() || null }) });
          flash('Account deactivated');
          setDanger(null); setReason(''); reloadAll();
        } catch (e) { fail(e.message || 'Action failed'); }
      };

      const metrics = [['LAST ACTIVE', staffRelTime(s.last_login)], ['TRUSTED', String(s.trusted_devices || 0)], ['SESSIONS', String(activeSessions)]];

      const PermsBlock = (
        <div className="form-card">
          <div className="rb-head"><h3>Permissions · {r.t.toLowerCase()}</h3>{!blocked && !editing && <button className="rb-action" style={{ marginLeft: 'auto' }} onClick={startEdit}>Change role</button>}</div>
          {s.role === 'admin' ? (
            <div style={{ font: '400 13px/1.6 var(--sans)', color: 'var(--dim)', maxWidth: '62ch' }}>{ST_PERMS.admin[0]}</div>
          ) : (
            <div style={{ display: 'grid', gap: 1, background: 'var(--line)' }}>
              {perms.map(([p, ok]) => (
                <div key={p} style={{ background: 'var(--bg)', padding: '11px 0', display: 'grid', gridTemplateColumns: '28px 1fr 90px', gap: 10, alignItems: 'baseline' }}>
                  <span style={{ font: '400 11px/1 var(--mono)', color: ok ? 'var(--cool)' : 'var(--faint)', textAlign: 'center' }}>{ok ? '✓' : '—'}</span>
                  <span style={{ font: '400 13px/1.4 var(--sans)', color: ok ? 'var(--ink)' : 'var(--faint)' }}>{p}</span>
                  <span style={{ font: '400 10px/1 var(--mono)', letterSpacing: '0.08em', color: ok ? 'var(--cool)' : 'var(--faint)', textAlign: 'right' }}>{ok ? 'ALLOWED' : 'DENIED'}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      );

      const SessionsBlock = (
        <div className="form-card">
          <div className="rb-head"><h3>Sessions &amp; devices · {sessions.length}</h3>{sessions.length > 0 && !blocked && !isSelf && <button className="rb-action" style={{ marginLeft: 'auto' }} onClick={() => act('/api/admin/staff/' + s.id + '/force-logout', 'Signed out everywhere')}>Sign out everywhere</button>}</div>
          {sessions.length === 0 ? (
            <div style={{ font: '400 12px/1.6 var(--mono)', color: 'var(--faint)' }}>no active sessions — access revoked</div>
          ) : (
            <div style={{ display: 'grid', gap: 1, background: 'var(--line)' }}>
              {sessions.map(ss => (
                <div key={ss.id} style={{ background: 'var(--bg)', padding: '11px 0', display: 'grid', gridTemplateColumns: 'minmax(120px,1fr) minmax(90px,150px) 70px', gap: 12, alignItems: 'baseline' }}>
                  <span style={{ font: '400 13px/1.3 var(--sans)', color: ss.active ? 'var(--ink)' : 'var(--faint)' }}>{ss.device_id || 'device'}{ss.is_trusted ? ' · trusted' : ''}</span>
                  <span style={{ font: '400 11px/1.3 var(--mono)', color: 'var(--dim)' }}>{staffRelTime(ss.created_at)}</span>
                  {!blocked && !isSelf ? <button className="rb-action" style={{ textAlign: 'right', color: 'var(--faint)' }} onClick={() => revokeSession(ss.id)}>REVOKE</button> : <span />}
                </div>
              ))}
            </div>
          )}
        </div>
      );

      return (
        <div className="recd-page">
          <div className="recd-head">
            <div className="recd-top">
              <div style={{ minWidth: 0 }}>
                <div className="opsq-meta">
                  <button className="recd-crumb" onClick={() => navigate('staff')}>← STAFF</button>
                  <span style={{ color: 'var(--faint)' }}>/</span>
                  <span style={{ color: r.c }}>{r.t}</span>
                  {!s.is_active && <span style={{ color: 'var(--hot)' }}>DEACTIVATED</span>}
                </div>
                <h1 className="recd-title" style={{ color: s.is_active ? 'var(--ink)' : 'var(--dim)' }}>{s.first_name} {s.last_name}</h1>
                <div className="recd-meta"><span>{s.email}</span><span>since {stSince(s.created_at)}</span><span>{s.trusted_devices || 0} trusted device{s.trusted_devices === 1 ? '' : 's'}</span>{s.assigned_customers > 0 && <span>{s.assigned_customers} trade customer{s.assigned_customers === 1 ? '' : 's'}</span>}</div>
              </div>
              <div style={{ marginLeft: 'auto', display: 'flex', gap: 26, flexShrink: 0 }}>
                {metrics.map(m => (
                  <div key={m[0]} style={{ textAlign: 'right' }}>
                    <div className="opsq-block-label" style={{ marginBottom: 0 }}>{m[0]}</div>
                    <div style={{ marginTop: 7, font: '400 20px/1 var(--mono)', color: 'var(--ink)', whiteSpace: 'nowrap' }}>{m[1]}</div>
                  </div>
                ))}
              </div>
              <div style={{ display: 'flex', gap: 8, alignSelf: 'center', flexShrink: 0, position: 'relative' }}>
                {s.is_active ? (
                  <React.Fragment>
                    {isSelf && <span style={{ alignSelf: 'center', marginRight: 2, font: '400 10px/1 var(--mono)', letterSpacing: '0.1em', color: 'var(--faint)' }}>YOUR ACCOUNT</span>}
                    {!blocked && !isSelf && <button className="recd-exc-primary" onClick={startEdit}>Edit role + access</button>}
                    {!blocked && <button className="opsq-alt" onClick={() => act('/api/admin/staff/' + s.id + '/send-reset', 'Reset link emailed')}>Reset password</button>}
                    {!blocked && <button className="opsq-alt" onClick={() => setMenu(m => !m)}>⋯</button>}
                    {menu && !blocked && (
                      <div style={{ position: 'absolute', top: '100%', right: 0, marginTop: 4, background: 'var(--panel2)', border: '1px solid var(--line2)', zIndex: 20, minWidth: 200 }}>
                        <button style={menuItem} onClick={() => { setMenu(false); setPwOpen(true); setTab('security'); }}>Set password…</button>
                        {s.trusted_devices > 0 && !isSelf && <button style={menuItem} onClick={() => act('/api/admin/staff/' + s.id + '/revoke-trusted', 'Trusted devices revoked')}>Revoke trusted devices</button>}
                      </div>
                    )}
                  </React.Fragment>
                ) : (

                      <input style={sdInp} placeholder="Last name" value={ident.last_name} onChange={e => setIdent({ ...ident, last_name: e.target.value })} />

                      <div className="rb-fact"><span className="rb-fact-k">Trusted devices</span><span className="rb-fact-v">{s.trusted_devices || 0}</span></div>

                    {pwOpen && !blocked && <div style={{ marginTop: 12, display: 'flex', gap: 8, alignItems: 'center' }}>
                      <input type="password" style={{ ...sdInp, marginBottom: 0, maxWidth: 220 }} placeholder="New password" value={newPw} onChange={e => setNewPw(e.target.value)} />

                {tab === 'activity' && (

                      <div style={{ display: 'flex', flexDirection: 'column', gap: 13 }}>

                              <span style={{ display: 'block', font: '400 10px/1 var(--mono)', color: 'var(--dim)' }}><span style={{ color: 'var(--ink)' }}>{a.action}</span>{a.staff_name ? ' · ' + a.staff_name : ''}</span>
                              {a.details && stSummarize(a.details) && <span style={{ display: 'block', marginTop: 4, font: '400 12px/1.55 var(--sans)', color: 'var(--dim)' }}>{stSummarize(a.details)}</span>}
                            </span>
                          </div>

                      </div>

                )}

              <div style={{ minWidth: 0, background: 'var(--panel)' }}>
                <div className="form-card">
                  <div className="rb-head"><h3>Account</h3></div>
                  <div className="rb-facts" style={{ gridTemplateColumns: '1fr' }}>

                    <div className="rb-fact"><span className="rb-fact-k">Status</span><span className="rb-fact-v" style={{ color: s.is_active ? 'var(--cool)' : 'var(--hot)' }}>{s.is_active ? 'Active' : 'Deactivated'}</span></div>
                    <div className="rb-fact"><span className="rb-fact-k">Staff since</span><span className="rb-fact-v">{stSince(s.created_at)}</span></div>

                      <div style={{ display: 'flex', flexDirection: 'column', gap: 11 }}>

                          <div key={a.id || n} style={{ display: 'grid', gridTemplateColumns: '58px 1fr', gap: 10 }}>

                            <span style={{ font: '400 12px/1.5 var(--sans)', color: 'var(--dim)' }}><span style={{ color: 'var(--ink)' }}>{a.action}</span></span>
                          </div>

                    )}

                )}
                {s.is_active && !blocked && !isSelf && (
                  <div className="form-card">
                    <div className="rb-head"><h3>Danger zone</h3></div>
                    {danger ? (
                      <div>
                        <div style={{ font: '400 11px/1.5 var(--mono)', color: 'var(--dim)', marginBottom: 8 }}>Deactivate — they’ll be signed out. Their customers stay assigned as free agents and come back if you reactivate.</div>
                        <input style={sdInp} placeholder="Reason (optional)" value={reason} onChange={e => setReason(e.target.value)} autoFocus />
                        <div style={{ display: 'flex', gap: 8 }}>
                          <button className="recd-exc-primary" style={{ background: 'var(--hot)', color: '#fff' }} onClick={confirmDanger}>Confirm {danger}</button>

                        <button style={{ width: '100%', padding: '11px', background: 'transparent', border: '1px solid rgba(224,122,99,0.42)', color: 'var(--hot)', font: '400 12px/1 var(--sans)', cursor: 'pointer' }} onClick={() => { setDanger('deactivate'); setReason(''); }}>Deactivate account</button>
                        <div style={{ marginTop: 9, font: '400 10px/1.5 var(--mono)', color: 'var(--faint)' }}>Signs them out immediately. Their customers stay assigned as free agents and return on reactivation. History is kept.</div>

          </div>

    // ========== PendingInvites (onboarding tracker) — real invite_pending accounts ==========
    function PendingInvites({ invites, onResend, onRevoke }) {
      const [busy, setBusy] = useState(null);
      if (!invites || invites.length === 0) return null;
      const run = (fn, id) => { setBusy(id); Promise.resolve(fn(id)).finally(() => setBusy(null)); };
      const chip = { padding: '5px 9px', background: 'transparent', border: '1px solid var(--line)', font: '400 10px/1 var(--mono)', cursor: 'pointer', flexShrink: 0 };
      return (
        <div style={{ borderBottom: '1px solid var(--line)', flexShrink: 0, maxHeight: 220, overflowY: 'auto' }}>
          <div className="opsq-block-label" style={{ padding: '11px 14px 3px', margin: 0 }}>ONBOARDING · {invites.length}</div>
          {invites.map(v => {
            const rr = ST_ROLES[v.role] || ST_ROLES.warehouse;
            return (
              <div key={v.id} style={{ padding: '9px 14px 11px', borderTop: '1px solid var(--line)' }}>
                <div style={{ display: 'flex', alignItems: 'baseline', gap: 10 }}>
                  <span style={{ font: '400 13px/1.2 var(--sans)' }}>{v.first_name} {v.last_name}</span>
                  <span style={{ font: '400 10px/1 var(--mono)', letterSpacing: '0.06em', color: rr.c }}>{rr.t}</span>
                  <span style={{ marginLeft: 'auto', minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', font: '400 10px/1 var(--mono)', color: 'var(--faint)' }}>{v.email}</span>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 8 }}>
                  <span style={{ font: '400 11px/1.3 var(--mono)', color: 'var(--gold)' }}>Invite sent — awaiting setup</span>
                  <button style={{ ...chip, marginLeft: 'auto', color: 'var(--dim)' }} disabled={busy === v.id} onClick={() => run(onResend, v.id)}>RESEND LINK</button>
                  <button style={{ ...chip, color: 'var(--faint)' }} disabled={busy === v.id} onClick={() => run(onRevoke, v.id)}>REVOKE</button>
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    // ========== InviteStaff (invite flow) — admin-staff-invite.jsx ==========
    const NS_ROLE_DESCS = [
      { id: 'sales_rep', blurb: 'Writes quotes and orders for their own book. Sees own commissions, never cost columns.' },
      { id: 'warehouse', blurb: 'Receives POs, flags damage, prints labels. No pricing or customer money visible.' },
      { id: 'manager', blurb: 'Everything a rep sees plus approvals: discounts past floor, credit memos, catalog edits.' },
      { id: 'admin', blurb: 'Full access including staff accounts, payouts, and refunds. Use sparingly.' },
    ];
    function InviteStaff({ navigate, staffRole }) {
      const [first, setFirst] = useState(''); const [last, setLast] = useState('');
      const [email, setEmail] = useState(''); const [role, setRole] = useState('sales_rep');
      const [sent, setSent] = useState(false); const [sending, setSending] = useState(false); const [err, setErr] = useState('');
      const descs = NS_ROLE_DESCS.filter(d => !(staffRole === 'manager' && d.id === 'admin'));
      const r = ST_ROLES[role] || ST_ROLES.sales_rep;
      const perms = ST_PERMS[role] || [];
      const valid = first.trim().length > 0 && last.trim().length > 0 && /\S+@\S+\.\S+/.test(email);
      const nsInput = { width: '100%', boxSizing: 'border-box', padding: '10px 11px', background: 'var(--bg)', border: '1px solid var(--line2)', color: 'var(--ink)', font: '400 13px/1 var(--sans)', outline: 'none' };
      const field = (label, node) => <label style={{ display: 'block' }}><span className="opsq-block-label" style={{ display: 'block', margin: '0 0 8px' }}>{label}</span>{node}</label>;
      const send = async () => {
        setSending(true); setErr('');
        try { await adminFetch('/api/admin/staff', { method: 'POST', body: JSON.stringify({ invite: true, first_name: first.trim(), last_name: last.trim(), email: email.trim(), role }) }); setSent(true); }
        catch (e) { setErr(e.message || 'Failed to send invite'); }
        setSending(false);
      };

      if (sent) return (
        <div className="recd-page" style={{ display: 'grid', placeItems: 'center' }}>
          <div style={{ width: 'min(460px, 90vw)', background: 'var(--panel)', border: '1px solid var(--line)', padding: '30px 32px 32px' }}>
            <div style={{ font: '400 10px/1 var(--mono)', letterSpacing: '0.16em', color: 'var(--cool)' }}>INVITE SENT</div>
            <h2 style={{ margin: '14px 0 0', font: '400 20px/1.3 var(--sans)' }}>{first} {last} can now set up their account</h2>
            <p style={{ margin: '12px 0 0', font: '400 13px/1.6 var(--sans)', color: 'var(--dim)' }}>A setup link went to {email}. It expires in 7 days. They'll set a password and land in the console as {r.t.toLowerCase()}.</p>
            <div style={{ display: 'flex', gap: 8, marginTop: 22 }}>
              <button className="recd-exc-primary" onClick={() => navigate('staff')}>Back to staff</button>
              <button className="opsq-alt" onClick={() => { setSent(false); setFirst(''); setLast(''); setEmail(''); }}>Invite another</button>
            </div>
          </div>
        </div>
      );

      return (
        <div className="recd-page">
          <div className="recd-head">
            <div style={{ padding: '14px 22px 16px' }}>
              <div className="opsq-meta">
                <button className="recd-crumb" onClick={() => navigate('staff')}>← STAFF</button>
                <span style={{ color: 'var(--faint)' }}>/</span>
                <span style={{ color: 'var(--ink)' }}>NEW ACCOUNT</span>
              </div>
              <h1 className="recd-title">Invite staff</h1>
            </div>
          </div>
          <div className="recd-scroll">
            {err && <div style={{ padding: '10px 22px 0' }}><div style={{ padding: '8px 11px', background: 'var(--red-light)', color: 'var(--hot)', font: '400 11px/1.4 var(--mono)' }}>{err}</div></div>}
            <div className="rec-body">
              <div className="rec-left">
                <div className="form-card">
                  <div className="rb-head"><h3>1 · Who</h3></div>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 14, maxWidth: 640 }}>
                    {field('FIRST NAME', <input value={first} onChange={e => setFirst(e.target.value)} placeholder="e.g. Lena" style={nsInput} />)}
                    {field('LAST NAME', <input value={last} onChange={e => setLast(e.target.value)} placeholder="e.g. Park" style={nsInput} />)}
                    {field('WORK EMAIL', <input value={email} onChange={e => setEmail(e.target.value)} placeholder="name@romaflooringdesigns.com" style={nsInput} />)}
                  </div>
                </div>
                <div className="form-card">
                  <div className="rb-head"><h3>2 · Role</h3></div>
                  <div style={{ display: 'grid', gap: 8, maxWidth: 640 }}>
                    {descs.map(d => {
                      const rr = ST_ROLES[d.id]; const on = role === d.id;
                      return (
                        <button key={d.id} onClick={() => setRole(d.id)} style={{ textAlign: 'left', cursor: 'pointer', padding: '13px 15px', background: on ? 'var(--panel2)' : 'transparent', border: '1px solid ' + (on ? 'var(--line2)' : 'var(--line)'), borderLeft: '2px solid ' + (on ? rr.c : 'var(--line)') }}>
                          <div style={{ display: 'flex', alignItems: 'baseline', gap: 10 }}>
                            <span style={{ font: '400 10px/1 var(--mono)', letterSpacing: '0.08em', color: rr.c }}>{rr.t}</span>
                            {on && <span style={{ marginLeft: 'auto', font: '400 10px/1 var(--mono)', color: 'var(--gold)' }}>SELECTED</span>}
                          </div>
                          <div style={{ marginTop: 7, font: '400 12px/1.5 var(--sans)', color: on ? 'var(--ink)' : 'var(--dim)' }}>{d.blurb}</div>
                        </button>
                      );
                    })}
                  </div>
                </div>
                <div className="form-card">
                  <div className="rb-head"><h3>3 · Security</h3></div>
                  <div style={{ display: 'flex', alignItems: 'baseline', gap: 11, maxWidth: 560 }}>
                    <span style={{ font: '400 10px/1 var(--mono)', letterSpacing: '0.08em', color: 'var(--cool)', flexShrink: 0 }}>2FA ENFORCED</span>
                    <span style={{ font: '400 13px/1.5 var(--sans)', color: 'var(--ink)' }}>Two-factor is required at first login — enforced on every new device. The staffer enrolls when they first sign in.</span>
                  </div>
                </div>
              </div>
              <div style={{ minWidth: 0, background: 'var(--panel)' }}>
                <div className="form-card">
                  <div className="rb-head"><h3>They will get</h3></div>
                  {role === 'admin' ? (
                    <div style={{ font: '400 12px/1.6 var(--sans)', color: 'var(--dim)' }}>{ST_PERMS.admin[0]}</div>
                  ) : (
                    <div style={{ display: 'grid', gap: 7 }}>
                      {perms.map(([p, ok]) => (
                        <div key={p} style={{ display: 'flex', gap: 9, alignItems: 'baseline', font: '400 12px/1.4 var(--sans)', color: ok ? 'var(--ink)' : 'var(--faint)' }}>
                          <span style={{ font: '400 10px/1 var(--mono)', color: ok ? 'var(--cool)' : 'var(--faint)', width: 10, flexShrink: 0 }}>{ok ? '✓' : '—'}</span>{p}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                <div className="form-card">
                  <div className="rb-head"><h3>Send</h3></div>
                  <button disabled={!valid || sending} onClick={send} style={{ width: '100%', padding: '12px', background: (valid && !sending) ? 'var(--gold)' : 'var(--panel2)', border: 'none', color: (valid && !sending) ? 'var(--brass-ink)' : 'var(--faint)', font: '500 13px/1 var(--sans)', cursor: (valid && !sending) ? 'pointer' : 'default' }}>{sending ? 'Sending…' : 'Send setup link'}</button>
                  <div style={{ marginTop: 9, font: '400 10px/1.5 var(--mono)', color: 'var(--faint)' }}>Link expires in 7 days. No access until they finish setup.</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ========== ProfileView (self-service) ==========
    function ProfileView({ navigate, staffData, onStaffUpdate }) {
      const [form, setForm] = useState({ first_name: staffData.first_name || '', last_name: staffData.last_name || '', phone: staffData.phone || '' });
      const [savingProfile, setSavingProfile] = useState(false);
      const [pw, setPw] = useState({ current_password: '', new_password: '', confirm: '' });
      const [savingPw, setSavingPw] = useState(false);
      const [msg, setMsg] = useState('');
      const [err, setErr] = useState('');

      const flash = (m) => { setMsg(m); setErr(''); setTimeout(() => setMsg(''), 4000); };
      const fail = (e) => { setErr(e); setMsg(''); setTimeout(() => setErr(''), 6000); };

      const saveProfile = async () => {
        setSavingProfile(true); setErr('');
        try {
          const d = await adminFetch('/api/staff/me', { method: 'PUT', body: JSON.stringify(form) });
          if (d.staff && onStaffUpdate) onStaffUpdate(d.staff);
          flash('Profile updated');
        } catch (e) { fail(e.message || 'Save failed'); }
        setSavingProfile(false);
      };
      const savePassword = async () => {
        if (!pw.current_password || !pw.new_password) { fail('Enter current and new password'); return; }
        if (pw.new_password !== pw.confirm) { fail('New passwords do not match'); return; }
        setSavingPw(true); setErr('');
        try {
          await adminFetch('/api/staff/me/password', { method: 'PUT', body: JSON.stringify({ current_password: pw.current_password, new_password: pw.new_password }) });
          setPw({ current_password: '', new_password: '', confirm: '' });
          flash('Password changed — other sessions signed out');
        } catch (e) { fail(e.message || 'Change failed'); }
        setSavingPw(false);
      };

      const card = { background: 'var(--panel)', border: '1px solid var(--stone-200)', padding: '1.5rem', marginBottom: '1.25rem', maxWidth: '560px' };
      const sectionLabel = { fontSize: '0.7rem', letterSpacing: '0.08em', textTransform: 'uppercase', color: 'var(--stone-400)', marginBottom: '0.75rem' };
      const inp = { width: '100%', padding: '0.55rem', border: '1px solid var(--stone-300)', fontSize: '0.875rem', fontFamily: 'Inter, sans-serif', marginBottom: '0.75rem' };

      return (
        <div>
          <div className="content-header">
            <h1>My Profile</h1>
            <button className="btn btn-secondary" onClick={() => navigate('dashboard')}>← Back</button>
          </div>
          {msg && <div style={{ background: '#e6f4ea', color: '#1e7e34', padding: '0.6rem 0.9rem', marginBottom: '1rem', fontSize: '0.85rem', maxWidth: '560px' }}>{msg}</div>}
          {err && <div className="auth-error" style={{ maxWidth: '560px' }}>{err}</div>}
          <div style={card}>
            <div style={sectionLabel}>Identity</div>
            <div style={{ fontSize: '0.8rem', color: 'var(--stone-500)', marginBottom: '0.75rem' }}>{staffData.email} · {STAFF_ROLE_LABELS[staffData.role] || staffData.role}</div>
            <div style={{ display: 'flex', gap: '0.75rem' }}>
              <input style={inp} placeholder="First name" value={form.first_name} onChange={e => setForm({ ...form, first_name: e.target.value })} />
              <input style={inp} placeholder="Last name" value={form.last_name} onChange={e => setForm({ ...form, last_name: e.target.value })} />
            </div>
            <input style={inp} placeholder="Phone" value={form.phone} onChange={e => setForm({ ...form, phone: formatPhone(e.target.value) })} />
            <button className="btn btn-primary" disabled={savingProfile} onClick={saveProfile}>{savingProfile ? 'Saving…' : 'Save profile'}</button>
          </div>
          <div style={card}>
            <div style={sectionLabel}>Change Password</div>
            <input type="password" style={inp} placeholder="Current password" value={pw.current_password} onChange={e => setPw({ ...pw, current_password: e.target.value })} />
            <input type="password" style={inp} placeholder="New password" value={pw.new_password} onChange={e => setPw({ ...pw, new_password: e.target.value })} />
            <input type="password" style={inp} placeholder="Confirm new password" value={pw.confirm} onChange={e => setPw({ ...pw, confirm: e.target.value })} />
            <button className="btn btn-primary" disabled={savingPw} onClick={savePassword}>{savingPw ? 'Saving…' : 'Change password'}</button>
          </div>
        </div>
      );
