              <input type="number" value={sku.pieces_per_box || ''} onChange={e => u('pieces_per_box', e.target.value)} />
            </div>
            <div className="form-group">
              <label>Weight Per Box (lbs)</label>
              <input type="number" step="0.01" value={sku.weight_per_box_lbs || ''} onChange={e => u('weight_per_box_lbs', e.target.value)} />
            </div>
            <div className="form-group">
              <label>Roll Width (ft)</label>
              <input type="number" step="0.01" value={sku.roll_width_ft || ''} onChange={e => u('roll_width_ft', e.target.value)} />
            </div>
            <div className="form-group">
              <label>Roll Length (ft)</label>
              <input type="number" step="0.01" value={sku.roll_length_ft || ''} onChange={e => u('roll_length_ft', e.target.value)} />
            </div>
            <div className="form-group">
              <label>Freight Class</label>
              <select value={sku.freight_class || '70'} onChange={e => u('freight_class', e.target.value)}>
                <option value="50">50</option>
                <option value="55">55 — Broadloom Carpet</option>
                <option value="60">60 — Hardwood</option>
                <option value="65">65 — Carpet Tile</option>
                <option value="70">70 — Tile / Stone</option>
                <option value="77.5">77.5</option>
                <option value="85">85</option>
                <option value="92.5">92.5</option>
                <option value="100">100</option>
              </select>
            </div>
            <div className="form-group">
              <label>Boxes Per Pallet</label>
              <input type="number" value={sku.boxes_per_pallet || ''} onChange={e => u('boxes_per_pallet', e.target.value)} />
            </div>
            <div className="form-group">
              <label>SqFt Per Pallet</label>
              <input type="number" step="0.01" value={sku.sqft_per_pallet || ''} onChange={e => u('sqft_per_pallet', e.target.value)} />
            </div>
            <div className="form-group">
              <label>Weight Per Pallet (lbs)</label>
              <input type="number" step="0.01" value={sku.weight_per_pallet_lbs || ''} onChange={e => u('weight_per_pallet_lbs', e.target.value)} />
            </div>
            <div className="form-group">
              <label>Cost</label>
              <input type="number" step="0.01" value={sku.cost || ''} onChange={e => u('cost', e.target.value)} placeholder="0.00" />
            </div>
            <div className="form-group">
              <label>Retail Price</label>
              <input type="number" step="0.01" value={sku.retail_price || ''} onChange={e => u('retail_price', e.target.value)} placeholder="0.00" />
            </div>
            <div className="form-group">
              <label>Price Basis</label>
              <select value={sku.price_basis || 'per_sqft'} onChange={e => u('price_basis', e.target.value)}>
                <option value="per_sqft">Per SqFt</option>
                <option value="per_sqyd">Per SqYd</option>
                <option value="per_unit">Per Unit</option>
              </select>
            </div>
          </div>

          {/* Carpet Pricing Fields — shown when cut_price has a value or can be toggled */}
          {(sku.cut_price || sku.roll_price) ? (
            <div style={{ borderTop: '1px solid var(--stone-200)', paddingTop: '0.75rem', marginTop: '0.5rem' }}>
              <div style={{ fontSize: '0.8125rem', fontWeight: '600', color: 'var(--stone-600)', marginBottom: '0.5rem' }}>Carpet Pricing (Cut / Roll)</div>
              <div className="form-grid">
                <div className="form-group">
                  <label>Cut Price (retail /sqft)</label>
                  <input type="number" step="0.01" value={sku.cut_price || ''} onChange={e => u('cut_price', e.target.value)} placeholder="0.00" />
                </div>
                <div className="form-group">
                  <label>Roll Price (retail /sqft)</label>
                  <input type="number" step="0.01" value={sku.roll_price || ''} onChange={e => u('roll_price', e.target.value)} placeholder="0.00" />
                </div>
                <div className="form-group">
                  <label>Cut Cost (dealer /sqft)</label>
                  <input type="number" step="0.01" value={sku.cut_cost || ''} onChange={e => u('cut_cost', e.target.value)} placeholder="0.00" />
                </div>
                <div className="form-group">
                  <label>Roll Cost (dealer /sqft)</label>
                  <input type="number" step="0.01" value={sku.roll_cost || ''} onChange={e => u('roll_cost', e.target.value)} placeholder="0.00" />
                </div>
                <div className="form-group">
                  <label>Roll Minimum (sqft)</label>
                  <input type="number" step="1" value={sku.roll_min_sqft || ''} onChange={e => u('roll_min_sqft', e.target.value)} placeholder="e.g. 600" />
                </div>
                <div className="form-group">
                  <label>Roll Width (ft)</label>
                  <input type="number" step="0.5" value={sku.roll_width_ft || ''} onChange={e => u('roll_width_ft', e.target.value)} placeholder="e.g. 12" />
                </div>
              </div>
            </div>
          ) : (
            <div style={{ marginTop: '0.5rem' }}>
              <button className="btn btn-secondary btn-sm" style={{ fontSize: '0.75rem' }}
                onClick={() => { u('cut_price', '0'); u('roll_price', '0'); }}>
                + Add Carpet Pricing
              </button>
            </div>
          )}

          {/* Attributes Section */}
          {sku._existing && attrs.length > 0 && (
            <div style={{ marginTop: '1rem', borderTop: '1px solid var(--stone-200)', paddingTop: '0.75rem' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.5rem', cursor: 'pointer' }}
                onClick={() => attrEdits ? null : setAttrsOpen(!attrsOpen)}>
                <span style={{ fontSize: '0.8125rem', fontWeight: '600', color: 'var(--stone-600)' }}>
                  Attributes ({attrs.length})
                </span>
                {!attrEdits && (
                  <button className="btn btn-secondary btn-sm" onClick={e => { e.stopPropagation(); startEditAttrs(); }} style={{ fontSize: '0.75rem', padding: '2px 8px' }}>Edit</button>
                )}
              </div>
              {(attrsOpen || attrEdits) && (
                <div className="form-grid" style={{ gap: '0.5rem' }}>
                  {attrEdits ? (
                    <>
                      {Object.entries(attrEdits).map(([slug, value]) => {
                        const label = (attrs.find(a => a.slug === slug) || {}).name || slug;
                        return (
                          <div className="form-group" key={slug}>
                            <label style={{ fontSize: '0.75rem' }}>{label}</label>
                            <input value={value} onChange={e => setAttrEdits(prev => ({ ...prev, [slug]: e.target.value }))} style={{ fontSize: '0.8125rem' }} />
                          </div>
                        );
                      })}
                      <div style={{ gridColumn: '1 / -1', display: 'flex', gap: '0.5rem', justifyContent: 'flex-end' }}>
                        <button className="btn btn-secondary btn-sm" onClick={() => setAttrEdits(null)} disabled={attrSaving}>Cancel</button>
                        <button className="btn btn-primary btn-sm" onClick={saveAttrs} disabled={attrSaving}>
                          {attrSaving ? 'Saving...' : 'Save Attributes'}
                        </button>
                      </div>
                    </>
                  ) : (
                    attrs.map(a => (
                      <div className="form-group" key={a.slug}>
                        <label style={{ fontSize: '0.75rem' }}>{a.name}</label>
                        <div style={{ fontSize: '0.8125rem', padding: '0.375rem 0', color: 'var(--stone-700)' }}>{a.value}</div>
                      </div>
                    ))
                  )}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ========== ProductMediaManager ==========
    function ProductMediaManager({ productId, media, setMedia }) {
      const { useState, useRef, useCallback } = React;
      const [uploading, setUploading] = useState(false);
      const [urlInput, setUrlInput] = useState('');
      const [addAssetType, setAddAssetType] = useState('alternate');
      const [dragActive, setDragActive] = useState(false);
      const [draggedId, setDraggedId] = useState(null);
      const [deleteTarget, setDeleteTarget] = useState(null);
      const fileInputRef = useRef(null);

      const assetTypes = ['primary', 'alternate', 'lifestyle', 'detail', 'spec_pdf', 'swatch'];

      const handleFiles = async (files) => {
        setUploading(true);
        for (const file of files) {
          try {
            const fd = new FormData();
            fd.append('file', file);
            fd.append('asset_type', addAssetType);
            const resp = await fetch(API + '/api/admin/products/' + productId + '/media/upload', {
              method: 'POST',
              headers: getAuthHeaders(),
              body: fd
            });
            if (resp.ok) {
              const data = await resp.json();
              if (data.media) setMedia(prev => [...prev, data.media]);
            }
          } catch (_) {}
        }
        setUploading(false);
      };

      const handleUrlSubmit = async () => {
        if (!urlInput.trim()) return;
        try {
          const data = await adminFetch('/api/admin/products/' + productId + '/media/url', {
            method: 'POST',
            body: JSON.stringify({ url: urlInput.trim(), asset_type: addAssetType })
          });
          if (data.media) {
            setMedia(prev => [...prev, data.media]);
            setUrlInput('');
          }
        } catch (_) {}
      };

      const handleDelete = async (mediaId) => {
        try {
          await adminFetch('/api/admin/media/' + mediaId, { method: 'DELETE' });
          setMedia(prev => prev.filter(m => m.id !== mediaId));
          setDeleteTarget(null);
        } catch (_) {}
      };

      const handleTypeChange = async (mediaId, newType) => {
        try {
          const data = await adminFetch('/api/admin/media/' + mediaId, {
            method: 'PUT',
            body: JSON.stringify({ asset_type: newType })
          });
          if (data.media) {
            setMedia(prev => prev.map(m => m.id === mediaId ? data.media : m));
          }
        } catch (_) {}
      };

      const handleDragStart = (e, id) => {
        setDraggedId(id);
        e.dataTransfer.effectAllowed = 'move';
      };

      const handleDragOver = (e, targetId) => {
        e.preventDefault();
        if (!draggedId || draggedId === targetId) return;
        setMedia(prev => {
          const items = [...prev];
          const fromIdx = items.findIndex(m => m.id === draggedId);
          const toIdx = items.findIndex(m => m.id === targetId);
          if (fromIdx < 0 || toIdx < 0) return prev;
          const [moved] = items.splice(fromIdx, 1);
          items.splice(toIdx, 0, moved);
          return items;
        });
      };

      const handleDrop = async (e) => {
        e.preventDefault();
        setDraggedId(null);
        const order = media.map((m, i) => ({ id: m.id, sort_order: i }));
        try {
          const data = await adminFetch('/api/admin/products/' + productId + '/media/reorder', {
            method: 'PATCH',
            body: JSON.stringify({ order })
          });
          if (data.media) setMedia(data.media);
        } catch (_) {}
      };

      const onZoneDragOver = (e) => { e.preventDefault(); setDragActive(true); };
      const onZoneDragLeave = () => setDragActive(false);
      const onZoneDrop = (e) => {
        e.preventDefault();
        setDragActive(false);
        if (e.dataTransfer.files.length) handleFiles(Array.from(e.dataTransfer.files));
      };

      const isPdf = (url) => url && url.toLowerCase().endsWith('.pdf');

      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
          {media.length > 0 ? (
            <div className="media-grid">
              {media.map(m => (
                <div
                  key={m.id}
                  className={'media-card' + (draggedId === m.id ? ' dragging' : '')}
                  draggable
                  onDragStart={e => handleDragStart(e, m.id)}
                  onDragOver={e => handleDragOver(e, m.id)}
                  onDrop={handleDrop}
                  onDragEnd={() => setDraggedId(null)}
                >
                  {isPdf(m.url) ? (
                    <div style={{ width: '100%', height: 160, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'var(--stone-100)', color: 'var(--stone-400)', fontSize: '0.75rem' }}>PDF</div>
                  ) : (
                    <img src={optimizeImg(m.url, 400)} alt={m.asset_type} loading="lazy" />
                  )}
                  <div className="media-card-info">
                    <select
                      value={m.asset_type}
                      onChange={e => handleTypeChange(m.id, e.target.value)}
                      style={{ width: '100%', fontSize: '0.7rem', padding: '0.2rem', marginBottom: '0.375rem', border: '1px solid var(--stone-200)', borderRadius: '4px' }}
                    >
                      {assetTypes.map(t => <option key={t} value={t}>{t}</option>)}
                    </select>
                    <div className="media-card-actions">
                      <button onClick={() => window.open(m.url, '_blank')}>View</button>
                      <button className="delete-btn" onClick={() => setDeleteTarget(m)}>Delete</button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          ) : (
            <div style={{ textAlign: 'center', padding: '1.5rem', color: 'var(--stone-400)', fontSize: '0.875rem' }}>
              No media yet. Upload files or paste URLs below.
            </div>
          )}

          <div style={{ display: 'flex', gap: '0.75rem', alignItems: 'center', flexWrap: 'wrap' }}>
            <label style={{ fontSize: '0.8rem', color: 'var(--stone-600)' }}>Type for new uploads:</label>
            <select
              value={addAssetType}
              onChange={e => setAddAssetType(e.target.value)}
              style={{ fontSize: '0.8rem', padding: '0.3rem 0.5rem', border: '1px solid var(--stone-200)', borderRadius: '6px' }}
            >
              {assetTypes.map(t => <option key={t} value={t}>{t}</option>)}
            </select>
          </div>

          <div
            className={'media-upload-zone' + (dragActive ? ' drag-active' : '')}
            onClick={() => fileInputRef.current && fileInputRef.current.click()}
            onDragOver={onZoneDragOver}
            onDragLeave={onZoneDragLeave}
            onDrop={onZoneDrop}
          >
            {uploading ? 'Uploading...' : 'Drop images here or click to browse'}
            <input
              ref={fileInputRef}
              type="file"
              multiple
              accept=".jpg,.jpeg,.png,.webp,.pdf"
              style={{ display: 'none' }}
              onChange={e => { if (e.target.files.length) handleFiles(Array.from(e.target.files)); e.target.value = ''; }}
            />
          </div>

          <div className="media-url-form">
            <input
              value={urlInput}
              onChange={e => setUrlInput(e.target.value)}
              placeholder="Paste external image URL..."
              onKeyDown={e => { if (e.key === 'Enter') handleUrlSubmit(); }}
            />
            <button className="btn btn-secondary btn-sm" onClick={handleUrlSubmit}>Add URL</button>
          </div>

          {deleteTarget && (
            <DeleteConfirmModal
              title="Delete Media"
              message={`Delete this ${deleteTarget.asset_type} image? This cannot be undone.`}
              onConfirm={() => handleDelete(deleteTarget.id)}
              onCancel={() => setDeleteTarget(null)}
            />
          )}
        </div>
      );
    }

    // ========== BulkImportView ==========
    function BulkImportView({ navigate }) {
      const [step, setStep] = useState(1);
      const [importFields, setImportFields] = useState([]);
      const [vendors, setVendors] = useState([]);
      const [categories, setCategories] = useState([]);
      const [importVendor, setImportVendor] = useState('');
      const [importCategory, setImportCategory] = useState('');
      const [importSession, setImportSession] = useState(null);
      const [mapping, setMapping] = useState({});
      const [importDefaults, setImportDefaults] = useState({ sell_by: 'box', price_basis: 'per_sqft', status: 'draft' });
      const [validationResult, setValidationResult] = useState(null);
      const [importResult, setImportResult] = useState(null);
      const [uploading, setUploading] = useState(false);
      const [validating, setValidating] = useState(false);
      const [executing, setExecuting] = useState(false);
      const [error, setError] = useState('');

      useEffect(() => {
        adminFetch('/api/admin/import/fields').then(d => setImportFields(d.fields || [])).catch(() => {});
        adminFetch('/api/admin/vendors').then(d => setVendors(d.vendors || [])).catch(() => {});
        adminFetch('/api/admin/categories').then(d => setCategories(d.categories || d || [])).catch(() => {});
      }, []);

      // Fuzzy auto-map headers to PIM fields
      const autoMap = (headers) => {
        const m = {};
        const aliases = {
          'sku': 'vendor_sku', 'vendor sku': 'vendor_sku', 'item #': 'vendor_sku', 'item number': 'vendor_sku', 'item no': 'vendor_sku', 'model': 'vendor_sku',
          'name': 'name', 'product name': 'name', 'product': 'name', 'title': 'name', 'description': 'name',
          'collection': 'collection', 'series': 'collection', 'line': 'collection',
          'category': 'category',
          'color': 'color', 'colour': 'color',
          'material': 'material', 'type': 'material',
          'finish': 'finish', 'surface': 'finish',
          'size': 'size', 'dimension': 'size', 'dimensions': 'size',
          'thickness': 'thickness',
          'cost': 'cost', 'dealer cost': 'cost', 'dealer price': 'cost', 'wholesale': 'cost', 'net price': 'cost',
          'price': 'retail_price', 'retail': 'retail_price', 'retail price': 'retail_price', 'msrp': 'retail_price', 'list price': 'retail_price', 'srp': 'retail_price',
          'sqft per box': 'sqft_per_box', 'sf/box': 'sqft_per_box', 'sqft/box': 'sqft_per_box', 'sq ft per box': 'sqft_per_box', 'coverage': 'sqft_per_box', 'sqft/ctn': 'sqft_per_box', 'sf/ctn': 'sqft_per_box',
          'pieces per box': 'pieces_per_box', 'pcs/box': 'pieces_per_box', 'pcs per box': 'pieces_per_box', 'pcs/ctn': 'pieces_per_box',
          'weight': 'weight_per_box_lbs', 'weight per box': 'weight_per_box_lbs', 'lbs/box': 'weight_per_box_lbs', 'lbs/ctn': 'weight_per_box_lbs',
          'variant': 'variant_name', 'variant name': 'variant_name',
          'short description': 'description_short', 'long description': 'description_long',
          'freight class': 'freight_class'
        };
        headers.forEach((h, idx) => {
          const key = String(h).toLowerCase().trim();
          if (aliases[key]) m[idx] = aliases[key];
        });
        return m;
      };

      const handleUpload = async (file) => {
        if (!importVendor) { setError('Please select a vendor'); return; }
        setUploading(true);
        setError('');
        try {
          const fd = new FormData();
          fd.append('file', file);
          const res = await fetch(API + '/api/admin/import/upload', {
            method: 'POST',
            headers: getAuthHeaders(),
            body: fd
          });
          if (!res.ok) { const errData = await res.json().catch(() => ({})); setError(errData.error || 'Upload failed (HTTP ' + res.status + ')'); setUploading(false); return; }
          const d = await res.json();
          if (d.error) { setError(d.error); setUploading(false); return; }
          setImportSession(d);
          const autoMapping = autoMap(d.headers);
          setMapping(autoMapping);
          setStep(2);
        } catch (err) { setError(err.message); }
        setUploading(false);
      };

      const handleValidate = async () => {
        setValidating(true);
        setError('');
        try {
          const d = await adminFetch('/api/admin/import/validate', {
            method: 'POST',
            body: JSON.stringify({
              import_session_id: importSession.import_session_id,
              vendor_id: importVendor,
              category_id: importCategory || null,
              mapping,
              defaults: importDefaults
            })
          });
          if (d.error) { setError(d.error); setValidating(false); return; }
          setValidationResult(d);
          setStep(3);
        } catch (err) { setError(err.message); }
        setValidating(false);
      };

      const handleExecute = async () => {
        setExecuting(true);
        setError('');
        try {
          const d = await adminFetch('/api/admin/import/execute', {
            method: 'POST',
            body: JSON.stringify({
              import_session_id: importSession.import_session_id,
              vendor_id: importVendor,
              category_id: importCategory || null,
              mapping,
              defaults: importDefaults
            })
          });
          if (d.error) { setError(d.error); setExecuting(false); return; }
          setImportResult(d.results);
          setStep(4);
        } catch (err) { setError(err.message); }
        setExecuting(false);
      };

      const stepLabels = ['Upload', 'Map Columns', 'Validate', 'Import'];

      return (
        <div>
          <div className="content-header">
            <h1>Bulk Product Import</h1>
            <button className="btn btn-secondary" onClick={() => navigate('products')}>Back to Products</button>
          </div>

          {/* Stepper */}
          <div style={{ display: 'flex', gap: '0.25rem', marginBottom: '1.5rem' }}>
            {stepLabels.map((label, i) => (
              <div key={i} style={{ flex: 1, textAlign: 'center', padding: '0.625rem 0', fontSize: '0.8125rem', fontWeight: step === i + 1 ? 600 : 400, color: step > i + 1 ? '#7cc294' : step === i + 1 ? 'var(--stone-800)' : 'var(--stone-400)', borderBottom: '2px solid ' + (step > i + 1 ? '#7cc294' : step === i + 1 ? 'var(--stone-800)' : 'var(--stone-200)') }}>
                {i + 1}. {label}
              </div>
            ))}
          </div>

          {error && <div style={{ background: 'rgba(197,71,49,0.12)', color: '#e07a63', padding: '0.75rem 1rem', marginBottom: '1rem', fontSize: '0.875rem', border: '1px solid rgba(197,71,49,0.30)' }}>{error}</div>}

          {/* Step 1: Upload */}
          {step === 1 && (
            <div style={{ background: 'var(--panel)', border: '1px solid var(--stone-200)', padding: '2rem', maxWidth: 600 }}>
              <h3 style={{ marginTop: 0, fontFamily: "var(--sans)", fontWeight: 400 }}>Upload Spreadsheet</h3>
              <div style={{ display: 'grid', gap: '1rem', marginBottom: '1.5rem' }}>
                <div className="form-group" style={{ marginBottom: 0 }}>
                  <label>Vendor *</label>
                  <select value={importVendor} onChange={e => setImportVendor(e.target.value)}>
                    <option value="">Select vendor...</option>
                    {vendors.map(v => <option key={v.id} value={v.id}>{v.name}</option>)}
                  </select>
                </div>
                <div className="form-group" style={{ marginBottom: 0 }}>
                  <label>Default Category</label>
                  <select value={importCategory} onChange={e => setImportCategory(e.target.value)}>
                    <option value="">None (use per-row if mapped)</option>
                    {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                  </select>
                </div>
                <div className="form-group" style={{ marginBottom: 0 }}>
                  <label>File (.xlsx, .xls, .csv) *</label>
                  <input type="file" accept=".xlsx,.xls,.csv" onChange={e => { if (e.target.files[0]) handleUpload(e.target.files[0]); }} disabled={uploading} />
                </div>
              </div>
              {uploading && <div style={{ color: 'var(--stone-500)', fontSize: '0.875rem' }}>Uploading and parsing file...</div>}
            </div>
          )}

          {/* Step 2: Map Columns */}
          {step === 2 && importSession && (
            <div>
              <div style={{ background: 'var(--stone-50)', border: '1px solid var(--stone-200)', padding: '1rem', marginBottom: '1rem', fontSize: '0.8125rem' }}>
                <strong>{importSession.file_name}</strong> — {importSession.total_rows} row(s), {importSession.headers.length} column(s) (Sheet: {importSession.sheet_name})
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '0.75rem', marginBottom: '1.5rem' }}>
                <div className="form-group" style={{ marginBottom: 0 }}>
                  <label>Default Sell By</label>
                  <select value={importDefaults.sell_by} onChange={e => setImportDefaults(d => ({ ...d, sell_by: e.target.value }))}>
                    <option value="box">Box</option>
                    <option value="unit">Per Unit</option>
                  </select>
                </div>
                <div className="form-group" style={{ marginBottom: 0 }}>
                  <label>Default Price Basis</label>
                  <select value={importDefaults.price_basis} onChange={e => setImportDefaults(d => ({ ...d, price_basis: e.target.value }))}>
                    <option value="per_sqft">Per Sq Ft</option>
                    <option value="per_unit">Per Unit</option>
                    <option value="per_box">Per Box</option>
                  </select>
                </div>
                <div className="form-group" style={{ marginBottom: 0 }}>
                  <label>Import Status</label>
                  <select value={importDefaults.status} onChange={e => setImportDefaults(d => ({ ...d, status: e.target.value }))}>
                    <option value="draft">Draft</option>
                    <option value="active">Active</option>
                  </select>
                </div>
              </div>

              <h3 style={{ fontSize: '0.75rem', textTransform: 'uppercase', letterSpacing: '0.08em', color: 'var(--stone-500)', marginBottom: '0.75rem' }}>Column Mapping</h3>
              <div className="table-scroll-wrapper">
                <table className="admin-table" style={{ marginBottom: '1rem' }}>
                  <thead><tr><th style={{ width: '40%' }}>Spreadsheet Column</th><th>Maps To</th><th style={{ width: '30%' }}>Sample Data</th></tr></thead>
                  <tbody>
                    {importSession.headers.map((header, idx) => (
                      <tr key={idx}>
                        <td style={{ fontWeight: 500 }}>{header || <span style={{ color: 'var(--stone-400)' }}>(empty)</span>}</td>
                        <td>
                          <select value={mapping[idx] || ''} onChange={e => setMapping(m => ({ ...m, [idx]: e.target.value }))} style={{ width: '100%', padding: '0.375rem', fontSize: '0.8125rem', border: '1px solid var(--stone-300)' }}>
                            <option value="">-- Skip --</option>
                            {Object.entries(importFields.reduce((groups, f) => { const g = f.group || 'Other'; if (!groups[g]) groups[g] = []; groups[g].push(f); return groups; }, {})).map(([group, fields]) => (
                              group && <optgroup key={group} label={group}>
                                {fields.filter(f => f.value).map(f => <option key={f.value} value={f.value}>{f.label}</option>)}
                              </optgroup>
                            ))}
                          </select>
                        </td>
                        <td style={{ fontSize: '0.75rem', color: 'var(--stone-500)', maxWidth: 200, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                          {importSession.preview_rows[0] ? String(importSession.preview_rows[0][idx] ?? '') : '—'}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              {/* Preview table */}
              <h3 style={{ fontSize: '0.75rem', textTransform: 'uppercase', letterSpacing: '0.08em', color: 'var(--stone-500)', marginBottom: '0.75rem' }}>Preview (first {importSession.preview_rows.length} rows)</h3>
              <div className="table-scroll-wrapper" style={{ marginBottom: '1.5rem' }}>
                <table className="admin-table" style={{ fontSize: '0.75rem' }}>
                  <thead><tr>{importSession.headers.map((h, i) => <th key={i} style={{ whiteSpace: 'nowrap' }}>{h}</th>)}</tr></thead>
                  <tbody>
                    {importSession.preview_rows.map((row, ri) => (
                      <tr key={ri}>{importSession.headers.map((_, ci) => <td key={ci} style={{ maxWidth: 150, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{row[ci] != null ? String(row[ci]) : ''}</td>)}</tr>
                    ))}
                  </tbody>
                </table>
              </div>

              <div style={{ display: 'flex', gap: '0.5rem' }}>
                <button className="btn btn-secondary" onClick={() => { setStep(1); setImportSession(null); setMapping({}); }}>Back</button>
                <button className="btn btn-primary" onClick={handleValidate} disabled={validating || !Object.values(mapping).some(v => v)}>{validating ? 'Validating...' : 'Validate'}</button>
              </div>
            </div>
          )}

          {/* Step 3: Validate */}
          {step === 3 && validationResult && (
            <div>
              <div className="analytics-grid" style={{ marginBottom: '1.5rem' }}>
                <div className="stat-card"><div className="stat-card-label">Total Rows</div><div className="stat-card-value">{validationResult.total_rows}</div></div>
                <div className="stat-card"><div className="stat-card-label">Valid</div><div className="stat-card-value" style={{ color: '#7cc294' }}>{validationResult.valid_count}</div></div>
                <div className="stat-card"><div className="stat-card-label">Errors</div><div className="stat-card-value" style={{ color: validationResult.error_count > 0 ? '#e07a63' : undefined }}>{validationResult.error_count}</div></div>
              </div>

              {validationResult.rows.length > 0 && (
                <div className="table-scroll-wrapper" style={{ maxHeight: 400, overflow: 'auto', marginBottom: '1.5rem' }}>
                  <table className="admin-table" style={{ fontSize: '0.8125rem' }}>
                    <thead><tr><th>Row</th><th>Status</th><th>SKU</th><th>Name</th><th>Errors</th></tr></thead>
                    <tbody>
                      {validationResult.rows.map(r => (
                        <tr key={r.row_number} style={{ background: r.status === 'error' ? 'rgba(197,71,49,0.12)' : undefined }}>
                          <td>{r.row_number}</td>
                          <td><span className={'badge badge-' + (r.status === 'valid' ? 'active' : 'error')} style={r.status === 'error' ? { background: 'rgba(197,71,49,0.30)', color: '#e07a63' } : {}}>{r.status}</span></td>
                          <td style={{ fontSize: '0.75rem' }}>{r.data?._internal_sku || r.data?.vendor_sku || '—'}</td>
                          <td style={{ fontSize: '0.75rem', maxWidth: 200, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{r.data?.name || '—'}</td>
                          <td style={{ fontSize: '0.75rem', color: '#e07a63' }}>{r.errors?.join('; ') || ''}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}

              <div style={{ display: 'flex', gap: '0.5rem' }}>
                <button className="btn btn-secondary" onClick={() => setStep(2)}>Back to Mapping</button>
                <button className="btn btn-primary" onClick={handleExecute} disabled={executing || validationResult.valid_count === 0}>
                  {executing ? 'Importing...' : 'Import ' + validationResult.valid_count + ' Valid Row(s)'}
                </button>
              </div>
              {validationResult.error_count > 0 && validationResult.valid_count > 0 && (
                <p style={{ fontSize: '0.75rem', color: 'var(--stone-500)', marginTop: '0.5rem' }}>{validationResult.error_count} error row(s) will be skipped.</p>
              )}
            </div>
          )}

          {/* Step 4: Results */}
          {step === 4 && importResult && (
            <div>
              <div className="analytics-grid" style={{ marginBottom: '1.5rem' }}>
                <div className="stat-card"><div className="stat-card-label">Imported</div><div className="stat-card-value" style={{ color: '#7cc294' }}>{importResult.imported}</div></div>
                <div className="stat-card"><div className="stat-card-label">Skipped</div><div className="stat-card-value">{importResult.skipped}</div></div>
                <div className="stat-card"><div className="stat-card-label">Errors</div><div className="stat-card-value" style={{ color: importResult.errors?.length > 0 ? '#e07a63' : undefined }}>{importResult.errors?.length || 0}</div></div>
              </div>

              {importResult.errors?.length > 0 && (
                <div style={{ background: 'rgba(197,71,49,0.12)', border: '1px solid rgba(197,71,49,0.30)', padding: '1rem', marginBottom: '1.5rem', maxHeight: 200, overflow: 'auto' }}>
                  <h4 style={{ fontSize: '0.75rem', textTransform: 'uppercase', color: '#e07a63', marginTop: 0, marginBottom: '0.5rem' }}>Error Details</h4>
                  {importResult.errors.map((e, i) => (
                    <div key={i} style={{ fontSize: '0.8125rem', marginBottom: '0.25rem' }}>Row {e.row}: {e.error}</div>
                  ))}
                </div>
              )}

              <button className="btn btn-primary" onClick={() => navigate('products')}>Done — Back to Products</button>
            </div>
          )}
        </div>

    // ========== VendorsListView ==========
    function VendorsListView({ navigate }) {

      const load = () => {
        setLoading(true);
        adminFetch('/api/admin/vendors')

          .catch(() => setLoading(false));
      };

      const toggleActive = (id) => {
        adminFetch('/api/admin/vendors/' + id + '/toggle', { method: 'PATCH' })
          .then(data => {
            if (data.vendor) {
              setVendors(prev => prev.map(v => v.id === id ? { ...v, is_active: data.vendor.is_active } : v));

          })
          .catch(() => {});

    // ========== VendorFormView ==========
    function VendorFormView({ navigate, editId }) {
      const [form, setForm] = useState({ name: '', code: '', website: '', email: '' });
      const [loading, setLoading] = useState(!!editId);
      const [saving, setSaving] = useState(false);

      useEffect(() => {
        if (editId) {
          adminFetch('/api/admin/vendors')
            .then(data => {
              const v = (data.vendors || []).find(v => v.id === editId);
              if (v) setForm({ name: v.name || '', code: v.code || '', website: v.website || '', email: v.email || '' });
              setLoading(false);
            })
            .catch(() => setLoading(false));
        }
      }, [editId]);

      const handleSave = async () => {
        if (!form.name.trim() || !form.code.trim()) { alert('Name and code are required'); return; }
        setSaving(true);
        try {
          if (editId) {
            await adminFetch('/api/admin/vendors/' + editId, { method: 'PUT', body: JSON.stringify(form) });
          } else {
            await adminFetch('/api/admin/vendors', { method: 'POST', body: JSON.stringify(form) });
          }
          navigate('vendors');
        } catch (err) {
          alert('Save failed: ' + err.message);
        } finally {
          setSaving(false);
        }
      };

      if (loading) return <div className="loading">Loading vendor...</div>;

      return (
        <div>
          <div className="content-header">
            <h1>{editId ? 'Edit Vendor' : 'New Vendor'}</h1>
            <div style={{ display: 'flex', gap: '0.75rem' }}>
              <button className="btn btn-secondary" onClick={() => navigate('vendors')}>Cancel</button>
              <button className="btn btn-primary" onClick={handleSave} disabled={saving}>
                {saving ? 'Saving...' : 'Save Vendor'}
              </button>
            </div>
          </div>
          <div className="form-card">
            <h3>Vendor Details</h3>
            <div className="form-grid">
              <div className="form-group">
                <label>Vendor Name *</label>
                <input value={form.name} onChange={e => setForm(prev => ({ ...prev, name: e.target.value }))} placeholder="e.g. MSI Surfaces" />
              </div>
              <div className="form-group">
                <label>Code *</label>
                <input value={form.code} onChange={e => setForm(prev => ({ ...prev, code: e.target.value }))} placeholder="e.g. MSI" />
              </div>
              <div className="form-group full">
                <label>Website</label>
                <input value={form.website} onChange={e => setForm(prev => ({ ...prev, website: e.target.value }))} placeholder="https://..." />
              </div>
              <div className="form-group full">
                <label>Email</label>
                <input type="email" value={form.email} onChange={e => setForm(prev => ({ ...prev, email: e.target.value }))} placeholder="orders@vendor.com" />
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ========== OrdersListView ==========
    // Saved views + stage ladder derived from real order/PO/payment state
    const ORDER_STAGES = ['Placed', 'Confirmed', 'POs issued', 'Vendor OK', 'Fulfillment', 'Delivered', 'Paid'];
    const ORDER_VIEWS = [
      { id: 'active', label: 'Active', hint: 'in flight' },
      { id: 'risk', label: 'At risk', hint: 'late or blocked' },
      { id: 'vendor', label: 'Awaiting vendor', hint: 'POs unconfirmed' },
      { id: 'pickup', label: 'Awaiting pickup', hint: 'staged at store' },
      { id: 'unpaid', label: 'Unpaid', hint: 'delivered, balance open' },
      { id: 'closed', label: 'Closed', hint: 'done or cancelled' },

    const ORDL_RISK = { breach: 'var(--hot)', today: 'var(--gold)', ok: 'var(--cool)' };
    const ORDL_RISK_LABEL = { breach: 'BLOCKED', today: 'NEEDS ACTION', ok: 'ON TRACK' };

    function OrdlStageBar({ i, status }) {
      if (status === 'cancelled' || status === 'refunded') {
        return <span style={{ font: '400 10px/1 var(--mono)', letterSpacing: '0.08em', color: 'var(--faint)' }}>{status.toUpperCase()}</span>;
      }
      return (
        <span style={{ display: 'block' }}>
          <span style={{ display: 'flex', gap: 2 }}>
            {ORDER_STAGES.map((s, n) => (
              <span key={s} style={{ flex: 1, height: 4, background: n < i ? 'var(--dim)' : n === i ? 'var(--gold)' : 'var(--line)' }} />
            ))}
          </span>
          <span style={{ display: 'block', marginTop: 6, font: '400 10px/1 var(--mono)', color: 'var(--dim)' }}>{ORDER_STAGES[i]}</span>
        </span>
      );
    }
    function OrdersListView({ navigate }) {
      const [orders, setOrders] = useState([]);

      useEffect(() => {
        adminFetch('/api/admin/orders/ledger')

        .filter(o => !q || (o.order_number + ' ' + o.customer_name + ' ' + (o.customer_email || '') + ' ' + (o.trade_company || '') + ' ' + o.blocker).toLowerCase().includes(q.toLowerCase()))
        .sort((a, b) => sortByValue ? parseFloat(b.total) - parseFloat(a.total) : new Date(b.created_at) - new Date(a.created_at));

      const activeId = rows.some(r => r.id === sel) ? sel : (rows[0] ? rows[0].id : null);
      const activeRow = orders.find(o => o.id === activeId) || null;

      const fmt = n => '$' + parseFloat(n || 0).toLocaleString('en-US', { maximumFractionDigits: 0 });
      const dfmt = ts => ts ? new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';

      useEffect(() => {
        if (!activeId) { setPane(null); return; }
        let dead = false;
        setPaneLoading(true);
        Promise.all([
          adminFetch(`/api/admin/orders/${activeId}`),
          adminFetch(`/api/admin/orders/${activeId}/purchase-orders`),
          adminFetch(`/api/admin/orders/${activeId}/activity`),
        ]).then(([detail, pos, act]) => {
          if (dead) return;
          setPane({ detail, pos: pos.purchase_orders || [], activity: act.activity || [] });

      const keyDate = o =>

            </div>

            <div className="ordl-filters">

                  <span>STAGE</span><span>KEY DATE</span>
                </div>
                {loading && <div className="opsq-empty">loading orders…</div>}
                {!loading && rows.length === 0 && <div className="opsq-empty">no orders in this view</div>}
                {rows.map(o => {
                  const on = o.id === activeId;
                  return (
                    <div key={o.id} className={'ordl-row' + (on ? ' active' : '')}
                      onClick={() => { if (window.innerWidth < 1100) navigate('order-detail', o.id); else setSel(o.id); }}>
                      <div className="ordl-grid" style={{ gridTemplateColumns: COLS }}>
                        <span className="ordl-num">
                          <span className="ops-dot" style={{ width: 5, height: 5, background: ORDL_RISK[o.risk] }} />
                          {(o.order_number || '')}
                        </span>
                        <span style={{ minWidth: 0 }}>
                          <span className="ordl-cust">{o.customer_name}</span>
                          <span className="ordl-co">{o.trade_company || o.customer_email || 'Direct retail'}</span>
                        </span>
                        <span className="ordl-val">{fmt(o.total)}</span>
                        <OrdlStageBar i={o.stage} status={o.status} />
                        <span className="ordl-date">{keyDate(o)}</span>
                      </div>
                      <div className="ordl-sub">
                        {o.status !== 'cancelled' && o.status !== 'refunded' && (
                          <span style={{ color: ORDL_RISK[o.risk], font: '400 10px/1 var(--mono)', letterSpacing: '0.06em', flexShrink: 0 }}>
                            {ORDL_RISK_LABEL[o.risk]}
                          </span>
                        )}
                        <span className="ordl-blocker">{o.blocker}</span>
                        <span className="ordl-rep">{o.rep_name || 'house'}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="ordl-foot">
              <span style={{ letterSpacing: '0.08em' }}>{rows.length} ORDERS</span>
              <span style={{ color: 'var(--dim)' }}>{fmt(openValue)} {view === 'closed' ? 'closed' : 'open'} value</span>
            </div>
          </section>

          <aside className="ordl-pane">
            {!activeRow ? (
              <div style={{ flex: 1, display: 'grid', placeItems: 'center', font: '400 12px/1 var(--mono)', color: 'var(--faint)' }}>NO ORDER SELECTED</div>
            ) : (
              <React.Fragment>
                <div className="ordl-pane-head">
                  <div className="opsq-meta">
                    <span style={{ color: 'var(--ink)' }}>{activeRow.order_number}</span>
                    <span style={{ color: ORDL_RISK[activeRow.risk] }}>{ORDL_RISK_LABEL[activeRow.risk]}</span>
                    <span style={{ marginLeft: 'auto', color: 'var(--faint)' }}>{activeRow.rep_name || ''}</span>
                  </div>
                  <h1 className="ordl-pane-title">{activeRow.customer_name}</h1>
                  <div className="ordl-pane-meta">
                    <span>{activeRow.trade_company || activeRow.customer_email || 'Direct retail'}</span>
                    <span style={{ color: 'var(--ink)' }}>{fmt(activeRow.total)}</span>
                  </div>
                  <div className="ordl-next" style={{ borderLeftColor: ORDL_RISK[activeRow.risk] }}>
                    <div className="opsq-block-label" style={{ marginBottom: 0 }}>NEXT</div>
                    <div style={{ marginTop: 6, font: '400 12px/1.5 var(--sans)', textWrap: 'pretty' }}>{activeRow.blocker}</div>
                  </div>
                </div>
                <div className="opsq-pane-body">
                  {paneLoading && <div className="opsq-empty">loading record…</div>}
                  {!paneLoading && pane && (
                    <React.Fragment>
                      <OpsBlock label={`Lines · ${pane.detail.items.length}`}>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: 9 }}>
                          {pane.detail.items.map(l => (
                            <div key={l.id} style={{ display: 'grid', gridTemplateColumns: '1fr 66px 72px', gap: 10, alignItems: 'baseline' }}>
                              <span style={{ minWidth: 0 }}>
                                <span style={{ display: 'block', font: '400 12px/1.35 var(--sans)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{l.product_name}</span>
                                <span style={{ display: 'block', marginTop: 3, font: '400 9px/1 var(--mono)', color: 'var(--faint)' }}>{l.vendor_sku || l.item_type || ''}</span>
                              </span>
                              <span style={{ font: '400 11px/1 var(--mono)', color: 'var(--dim)', textAlign: 'right' }}>
                                {l.item_type === 'labor' ? '—' : l.sqft_needed ? parseFloat(l.sqft_needed) + ' sf' : (l.num_boxes || 0) + (l.sell_by === 'unit' ? ' ea' : ' bx')}
                              </span>
                              <span style={{ font: '400 11px/1 var(--mono)', textAlign: 'right' }}>{fmt(l.subtotal)}</span>

                      <OpsBlock label="Purchase orders">
                        {pane.pos.length === 0 ? (

                                <span style={{ minWidth: 0 }}>
                                  <span style={{ display: 'block', font: '400 12px/1.35 var(--sans)' }}>{p.vendor_name}</span>
                                  <span style={{ display: 'block', marginTop: 3, font: '400 9px/1.4 var(--mono)', color: 'var(--dim)' }}>
                                    {p.po_number} · {p.status}{p.edi_ack_status ? ' · ack ' + p.edi_ack_status : ''}
                                  </span>
                                </span>
                                <span style={{ font: '400 11px/1 var(--mono)', textAlign: 'right' }}>{fmt(p.subtotal)}</span>
                              </div>
                            ))}
                          </div>
                        )}
                      </OpsBlock>
                      <OpsBlock label="Money">
                        <div className="opsq-facts">
                          {[
                            ['Total', fmt(activeRow.total)],
                            ['Paid', fmt(activeRow.amount_paid)],
                            ['Balance', fmt(activeRow.balance)],
                            ['Method', (activeRow.payment_method || '—') + ' · ' + (activeRow.delivery_method || 'shipping')],
                          ].map(m => (
                            <div key={m[0]} className="opsq-fact">
                              <div className="opsq-fact-k">{m[0]}</div>
                              <div className="opsq-fact-v">{m[1]}</div>
                            </div>
                          ))}
                        </div>
                      </OpsBlock>
                      <OpsBlock label="Trail">
                        {pane.activity.length === 0 ? (
                          <div style={{ font: '400 11px/1.5 var(--mono)', color: 'var(--faint)' }}>no activity recorded</div>
                        ) : (
                          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                            {pane.activity.slice(0, 6).map(t => (
                              <div key={t.id} style={{ display: 'grid', gridTemplateColumns: '54px 1fr', gap: 12 }}>
                                <span style={{ font: '400 10px/1.5 var(--mono)', color: 'var(--faint)' }}>{dfmt(t.created_at)}</span>

                <div className="ordl-pane-foot">

          </aside>
        </div>
      );
    }

    // ========== QuotesListView ==========
    // Staff ledger over every rep's quote pipeline — same console grammar as orders
    const QUOTE_STAGES = ['Drafted', 'Sent', 'Viewed', 'Replied', 'Accepted', 'Converted'];
    const QUOTE_VIEWS = [
      { id: 'open', label: 'Open', hint: 'in market' },

          <span style={{ display: 'flex', gap: 2 }}>

            ))}
          </span>
          <span style={{ display: 'block', marginTop: 6, font: '400 10px/1 var(--mono)', color: 'var(--dim)' }}>{QUOTE_STAGES[i]}</span>
        </span>

    function QuotesListView({ navigate }) {
      const [quotes, setQuotes] = useState([]);
      const [loading, setLoading] = useState(true);
      const [view, setView] = useState('open');

      const [sel, setSel] = useState(null);
      const [pane, setPane] = useState(null);
      const [paneLoading, setPaneLoading] = useState(false);

      useEffect(() => {
        adminFetch('/api/admin/quotes/ledger')
          .then(d => { setQuotes(d.quotes || []); setLoading(false); })
          .catch(() => setLoading(false));
      }, []);

      const reps = [...new Set(quotes.map(o => o.rep_name).filter(Boolean))].sort();
      const rows = quotes
        .filter(o => o.views.includes(view))
        .filter(o => !repFilter || o.rep_name === repFilter)
        .filter(o => !q || (o.quote_number + ' ' + o.customer_name + ' ' + (o.customer_email || '') + ' ' + (o.trade_company || '') + ' ' + o.blocker).toLowerCase().includes(q.toLowerCase()))
        .sort((a, b) => sortByValue ? parseFloat(b.total) - parseFloat(a.total) : new Date(b.created_at) - new Date(a.created_at));

      const activeId = rows.some(r => r.id === sel) ? sel : (rows[0] ? rows[0].id : null);
      const activeRow = quotes.find(o => o.id === activeId) || null;
      const openValue = rows.reduce((s, o) => s + parseFloat(o.total || 0), 0);
      const fmt = n => '$' + parseFloat(n || 0).toLocaleString('en-US', { maximumFractionDigits: 0 });
      const dfmt = ts => ts ? new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';

      useEffect(() => {
        if (!activeId) { setPane(null); return; }
        let dead = false;
        setPaneLoading(true);

          setPane(detail);
          setPaneLoading(false);
        }).catch(() => { if (!dead) { setPane(null); setPaneLoading(false); } });
        return () => { dead = true; };
      }, [activeId]);

      const keyDate = o =>
        o.status === 'converted' ? 'Won ' + dfmt(o.updated_at) :
        o.status === 'declined' ? 'Lost ' + dfmt(o.updated_at) :
        o.expired ? 'Expired ' + dfmt(o.expires_at) :
        o.status === 'sent' && o.expires_at ? 'Expires ' + dfmt(o.expires_at) :
        o.status === 'accepted' ? 'Accepted ' + dfmt(o.updated_at) :
        'Drafted ' + dfmt(o.created_at);

      const COLS = 'minmax(84px, 110px) minmax(120px, 1fr) minmax(70px, 90px) minmax(110px, 140px) minmax(90px, 110px)';

      return (
        <div className="ordl">
          <section className="ordl-main">
            <div className="ordl-tabs">
              {QUOTE_VIEWS.map(v => {
                const on = v.id === view;
                const n = quotes.filter(o => o.views.includes(v.id)).length;
                return (
                  <button key={v.id} className={'ordl-tab' + (on ? ' active' : '')} onClick={() => setView(v.id)}>
                    <span className="ordl-tab-row">
                      <span className="ordl-tab-label">{v.label}</span>
                      <span className="ordl-tab-n">{n}</span>
                    </span>
                    <span className="ordl-tab-hint">{v.hint.toUpperCase()}</span>
                  </button>
                );
              })}
            </div>

            <div className="ordl-filters">
              <select value={repFilter} onChange={e => setRepFilter(e.target.value)} className="ordl-chip">
                <option value="">Any rep</option>
                {reps.map(r => <option key={r} value={r}>{r}</option>)}
              </select>
              <button className={'ordl-chip' + (sortByValue ? ' on' : '')} onClick={() => setSortByValue(s => !s)}>
                {sortByValue ? 'VALUE ↓' : 'NEWEST'}
              </button>
              <input className="ordl-search" value={q} onChange={e => setQ(e.target.value)} placeholder="filter quotes…" />
            </div>

            <div className="ordl-scroll">
              <div style={{ minWidth: 640 }}>
                <div className="ordl-head" style={{ gridTemplateColumns: COLS }}>
                  <span>QUOTE</span><span>CUSTOMER</span>
                  <span style={{ textAlign: 'right' }}>VALUE</span>
                  <span>STAGE</span><span>KEY DATE</span>
                </div>
                {loading && <div className="opsq-empty">loading quotes…</div>}
                {!loading && rows.length === 0 && <div className="opsq-empty">no quotes in this view</div>}
                {rows.map(o => {
                  const on = o.id === activeId;
                  const settled = o.status === 'converted' || o.status === 'declined' || o.expired;
                  return (
                    <div key={o.id} className={'ordl-row' + (on ? ' active' : '')}
                      onClick={() => { if (window.innerWidth < 1100) navigate('quote-detail', o.id); else setSel(o.id); }}>
                      <div className="ordl-grid" style={{ gridTemplateColumns: COLS }}>
                        <span className="ordl-num">
                          <span className="ops-dot" style={{ width: 5, height: 5, background: o.status === 'converted' ? 'var(--green)' : settled ? 'var(--faint)' : ORDL_RISK[o.risk] }} />
                          {(o.quote_number || '')}
                        </span>
                        <span style={{ minWidth: 0 }}>
                          <span className="ordl-cust">{o.customer_name}</span>
                          <span className="ordl-co">{o.trade_company || o.customer_email || 'Direct retail'}</span>
                        </span>
                        <span className="ordl-val">{fmt(o.total)}</span>
                        <QtlStageBar i={o.stage} status={o.status} expired={o.expired} />
                        <span className="ordl-date">{keyDate(o)}</span>
                      </div>
                      <div className="ordl-sub">
                        {!settled && (
                          <span style={{ color: ORDL_RISK[o.risk], font: '400 10px/1 var(--mono)', letterSpacing: '0.06em', flexShrink: 0 }}>
                            {QTL_RISK_LABEL[o.risk]}
                          </span>
                        )}
                        {o.status === 'converted' && (
                          <span style={{ color: 'var(--green)', font: '400 10px/1 var(--mono)', letterSpacing: '0.06em', flexShrink: 0 }}>WON</span>
                        )}
                        <span className="ordl-blocker">{o.blocker}</span>
                        <span className="ordl-rep">{o.rep_name || 'house'}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="ordl-foot">
              <span style={{ letterSpacing: '0.08em' }}>{rows.length} QUOTES</span>
              <span style={{ color: 'var(--dim)' }}>{fmt(openValue)} {view === 'converted' ? 'won' : view === 'closed' ? 'closed' : 'quoted'} value</span>
            </div>
          </section>

          <aside className="ordl-pane">
            {!activeRow ? (
              <div style={{ flex: 1, display: 'grid', placeItems: 'center', font: '400 12px/1 var(--mono)', color: 'var(--faint)' }}>NO QUOTE SELECTED</div>
            ) : (
              <React.Fragment>
                <div className="ordl-pane-head">
                  <div className="opsq-meta">
                    <span style={{ color: 'var(--ink)' }}>{activeRow.quote_number}</span>
                    <span style={{ color: activeRow.status === 'converted' ? 'var(--green)' : activeRow.status === 'declined' || activeRow.expired ? 'var(--faint)' : ORDL_RISK[activeRow.risk] }}>
                      {activeRow.status === 'converted' ? 'WON' : activeRow.status === 'declined' ? 'LOST' : activeRow.expired ? 'EXPIRED' : QTL_RISK_LABEL[activeRow.risk]}
                    </span>
                    <span style={{ marginLeft: 'auto', color: 'var(--faint)' }}>{activeRow.rep_name || ''}</span>
                  </div>
                  <h1 className="ordl-pane-title">{activeRow.customer_name}</h1>
                  <div className="ordl-pane-meta">
                    <span>{activeRow.trade_company || activeRow.customer_email || 'Direct retail'}</span>
                    <span style={{ color: 'var(--ink)' }}>{fmt(activeRow.total)}</span>
                  </div>
                  <div className="ordl-next" style={{ borderLeftColor: activeRow.status === 'converted' ? 'var(--green)' : activeRow.status === 'declined' || activeRow.expired ? 'var(--line2)' : ORDL_RISK[activeRow.risk] }}>
                    <div className="opsq-block-label" style={{ marginBottom: 0 }}>NEXT</div>
                    <div style={{ marginTop: 6, font: '400 12px/1.5 var(--sans)', textWrap: 'pretty' }}>{activeRow.blocker}</div>
                  </div>
                </div>
                <div className="opsq-pane-body">
                  {paneLoading && <div className="opsq-empty">loading record…</div>}
                  {!paneLoading && pane && (
                    <React.Fragment>
                      <OpsBlock label={`Lines · ${pane.items.length}`}>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: 9 }}>
                          {pane.items.map(l => (
                            <div key={l.id} style={{ display: 'grid', gridTemplateColumns: '1fr 66px 72px', gap: 10, alignItems: 'baseline' }}>
                              <span style={{ minWidth: 0 }}>
                                <span style={{ display: 'block', font: '400 12px/1.35 var(--sans)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                                  {(l.collection || l.current_collection || l.product_name || '—') + (l.color ? ' ' + l.color : '')}
                                </span>
                                <span style={{ display: 'block', marginTop: 3, font: '400 9px/1 var(--mono)', color: 'var(--faint)' }}>{l.vendor_sku || l.vendor_name || ''}</span>
                              </span>
                              <span style={{ font: '400 11px/1 var(--mono)', color: 'var(--dim)', textAlign: 'right' }}>
                                {l.sqft_needed ? parseFloat(l.sqft_needed) + ' sf' : (l.num_boxes || 0) + (l.sell_by === 'unit' ? ' ea' : ' bx')}
                              </span>
                              <span style={{ font: '400 11px/1 var(--mono)', textAlign: 'right' }}>{fmt(l.subtotal)}</span>
                            </div>
                          ))}
                        </div>
                      </OpsBlock>
                      <OpsBlock label="Engagement">
                        <div className="opsq-facts">
                          {[
                            ['Opens', pane.engagement.opens],
                            ['Viewers', pane.engagement.viewers],
                            ['Replies', pane.engagement.replies],
                            ['Last opened', pane.engagement.last_viewed_at ? dfmt(pane.engagement.last_viewed_at) : '—'],
                          ].map(m => (
                            <div key={m[0]} className="opsq-fact">
                              <div className="opsq-fact-k">{m[0]}</div>
                              <div className="opsq-fact-v">{m[1]}</div>
                            </div>
                          ))}
                        </div>
                      </OpsBlock>
                      <OpsBlock label="Money">
                        <div className="opsq-facts">
                          {[
                            ['Total', fmt(activeRow.total)],
                            ['Discount', parseFloat(pane.quote.discount_amount || 0) > 0 ? '-' + fmt(pane.quote.discount_amount) : '—'],
                            ['Delivery', activeRow.delivery_method || 'shipping'],
                            ['Expires', activeRow.expires_at ? dfmt(activeRow.expires_at) : 'on send'],
                          ].map(m => (
                            <div key={m[0]} className="opsq-fact">
                              <div className="opsq-fact-k">{m[0]}</div>
                              <div className="opsq-fact-v">{m[1]}</div>
                            </div>
                          ))}
                        </div>
                      </OpsBlock>
                      <OpsBlock label="Trail">
                        {pane.events.length === 0 ? (
                          <div style={{ font: '400 11px/1.5 var(--mono)', color: 'var(--faint)' }}>no activity recorded</div>
                        ) : (
                          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                            {[...pane.events].reverse().slice(0, 6).map(t => (
                              <div key={t.id} style={{ display: 'grid', gridTemplateColumns: '54px 1fr', gap: 12 }}>
                                <span style={{ font: '400 10px/1.5 var(--mono)', color: 'var(--faint)' }}>{dfmt(t.created_at)}</span>
                                <span style={{ font: '400 12px/1.5 var(--sans)' }}>
                                  {QUOTE_EVENT_LABELS[t.event_type] || t.event_type}{t.actor_name ? ' · ' + t.actor_name : ''}
                                </span>
                              </div>
                            ))}
                          </div>
                        )}
                      </OpsBlock>
                    </React.Fragment>
                  )}
                </div>
                <div className="ordl-pane-foot">
                  <button className="opsq-primary" style={{ marginTop: 0, flex: 1, width: 'auto' }} onClick={() => navigate('quote-detail', activeRow.id)}>
                    <span>Open full record</span>
                  </button>
                </div>
              </React.Fragment>
            )}
          </aside>
        </div>
      );
    }

    // ========== QuoteDetailView ==========
    // Full quote record in the order-record console grammar: pinned header,
    // stage rail, independently scrolling left column + right rail.
    function QuoteDetailView({ navigate, editId, staffRole }) {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [qTab, setQTab] = useState('record');
      const [docPreview, setDocPreview] = useState(null);
      const [updating, setUpdating] = useState(false);
      const [showLostSheet, setShowLostSheet] = useState(false);
      const [lostReason, setLostReason] = useState('');
      const [noteText, setNoteText] = useState('');
      const [postingNote, setPostingNote] = useState(false);

      const load = async () => {
        try {
          const d = await adminFetch('/api/admin/quotes/' + editId);
          setData(d);
        } catch (e) { setData(null); }
        setLoading(false);
      };
      useEffect(() => { setLoading(true); load(); }, [editId]);

      if (loading) return <div className="recd-page"><div className="opsq-empty">loading quote record…</div></div>;
      if (!data || !data.quote) return <div className="recd-page"><div className="opsq-empty">quote not found</div></div>;

      const { quote, items, customer, events, engagement } = data;
      const canManage = ['admin', 'manager'].includes(staffRole);
      const qTotal = parseFloat(quote.total || 0);
      const now = Date.now();
      const qExpired = quote.status === 'sent' && quote.expires_at && new Date(quote.expires_at).getTime() < now;
      const qSettled = quote.status === 'converted' || quote.status === 'declined' || qExpired;
      const daysLeft = quote.expires_at ? (new Date(quote.expires_at).getTime() - now) / 86400000 : null;
      const ageDays = (now - new Date(quote.created_at).getTime()) / 86400000;
      const dshort = ts => ts ? new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
      const qDd = ts => ts ? new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }).toUpperCase() : '';

      // Risk + blocker, mirroring the ledger's read of the pipeline
      let qRisk = 'ok', qBlocker = null;
      if (qExpired) { qRisk = 'breach'; qBlocker = 'Expired ' + dshort(quote.expires_at) + ' — close it out, or have the rep send a revision'; }
      else if (quote.status === 'draft' && ageDays > 3) { qRisk = 'today'; qBlocker = 'Drafted ' + Math.floor(ageDays) + ' days ago and never sent to the customer'; }
      else if (quote.status === 'accepted') { qRisk = 'today'; qBlocker = 'Customer said yes — the rep converts it to an order from the rep workspace'; }
      else if (quote.status === 'sent' && daysLeft !== null && daysLeft <= 3) {
        qRisk = 'today';
        qBlocker = 'Expires ' + dshort(quote.expires_at) + ' — ' + (engagement.opens ? 'the customer has opened it ' + engagement.opens + '×' : 'the customer never opened it');
      }
      else if (quote.status === 'sent' && engagement.opens >= 3) { qRisk = 'today'; qBlocker = 'Hot — the customer opened this quote ' + engagement.opens + ' times'; }

      const qStatusLabel = quote.status === 'converted' ? 'WON'
        : quote.status === 'declined' ? 'LOST'
        : qExpired ? 'EXPIRED'
        : quote.status === 'accepted' ? 'ACCEPTED'
        : quote.status === 'draft' ? 'DRAFT'
        : qRisk === 'today' ? 'NEEDS ACTION' : 'IN MARKET';
      const qStatusColor = quote.status === 'converted' ? 'var(--green)'
        : quote.status === 'declined' ? 'var(--faint)'
        : qExpired ? 'var(--hot)'
        : qRisk === 'today' ? 'var(--gold)'
        : quote.status === 'draft' ? 'var(--dim)' : 'var(--cool)';

      const evFirst = t => { const e = events.find(ev => ev.event_type === t); return e ? e.created_at : null; };
      const lastSentEvent = [...events].reverse().find(e => e.event_type === 'sent');
      const railDead = quote.status === 'declined' || qExpired;
      // 6-step lifecycle, same ladder the rep workspace walks:
      // Drafted → Sent → Viewed → Replied → Accepted → Converted
      let qStage = 0;
      if (quote.status === 'converted') qStage = 5;
      else if (quote.status === 'accepted' || railDead) qStage = 4;
      else if (quote.status === 'sent') qStage = engagement.replies > 0 ? 3 : engagement.opens > 0 ? 2 : 1;
      const qRail = [
        ['Drafted', qDd(quote.created_at)],
        ['Sent', quote.status === 'draft' ? 'NOT YET' : lastSentEvent ? qDd(lastSentEvent.created_at) : ['accepted', 'converted'].includes(quote.status) ? 'DIRECT' : 'EMAILED'],
        ['Viewed', engagement.opens ? engagement.opens + (engagement.opens === 1 ? ' OPEN' : ' OPENS') : 'NO OPENS'],
        ['Replied', engagement.replies ? qDd(engagement.last_reply_at) : 'NONE LOGGED'],
        ['Accepted', railDead ? (quote.status === 'declined' ? 'MARKED LOST' : 'EXPIRED') : ['accepted', 'converted'].includes(quote.status) ? (qDd(evFirst('accepted')) || 'COMMITTED') : quote.expires_at ? 'EXP ' + qDd(quote.expires_at) : ''],
        ['Converted', quote.converted_order_number || (quote.status === 'converted' ? 'ORDER' : '')],
      ];

      // Rep-workspace economics surfaced for staff: a $0 vendor cost means
      // "cost unknown", not 100% margin; samples excluded
      const showMargin = ['admin', 'manager'].includes(staffRole);
      const costedItems = items.filter(i => parseFloat(i.vendor_cost) > 0 && parseFloat(i.unit_price) > 0 && !i.is_sample);
      const costedSell = costedItems.reduce((s, i) => s + parseFloat(i.subtotal || 0), 0);
      const grossProfit = costedItems.reduce((s, i) => s + (1 - parseFloat(i.vendor_cost) / parseFloat(i.unit_price)) * parseFloat(i.subtotal || 0), 0);
      const blendedMargin = costedSell > 0 ? grossProfit / costedSell * 100 : null;
      const lineMargin = (item) => {
        const p = parseFloat(item.unit_price || 0);
        if (!(parseFloat(item.vendor_cost) > 0) || p <= 0 || item.is_sample) return null;
        return (1 - parseFloat(item.vendor_cost) / p) * 100;
      };

      // Thread: collapse consecutive opens so a curious customer doesn't flood it
      const threadEntries = [];
      events.forEach(e => {
        const prev = threadEntries[threadEntries.length - 1];
        if (e.event_type === 'viewed' && prev && prev.event_type === 'viewed') { prev._count += 1; prev.created_at = e.created_at; }
        else threadEntries.push({ ...e, _count: 1 });
      });
      const threadHot = !!(engagement.last_reply_at && lastSentEvent &&
        new Date(engagement.last_reply_at) > new Date(lastSentEvent.created_at) &&
        new Date(engagement.last_reply_at) - new Date(lastSentEvent.created_at) < 86400000);
      const fmtDT = ts => new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' +
        new Date(ts).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

      const markAccepted = async () => {
        if (!confirm('Mark ' + quote.quote_number + ' accepted — the customer confirmed?')) return;
        setUpdating(true);
        try {
          await adminFetch('/api/admin/quotes/' + editId + '/status', { method: 'POST', body: JSON.stringify({ status: 'accepted' }) });
          await load();
        } catch (err) { alert(err.message); }
        setUpdating(false);
      };
      const markLost = async () => {
        setUpdating(true);
        try {
          await adminFetch('/api/admin/quotes/' + editId + '/status', { method: 'POST', body: JSON.stringify({ status: 'declined', reason: lostReason.trim() || undefined }) });
          setShowLostSheet(false); setLostReason('');
          await load();
        } catch (err) { alert(err.message); }
        setUpdating(false);
      };
      const postThread = async (kind) => {
        if (!noteText.trim()) return;
        setPostingNote(true);
        try {
          await adminFetch('/api/admin/quotes/' + editId + '/events', { method: 'POST', body: JSON.stringify({ event_type: kind, body: noteText.trim() }) });
          setNoteText('');
          await load();
        } catch (err) { alert(err.message); }
        setPostingNote(false);
      };

      const customerNavId = quote.trade_customer_id ? 'trade_' + quote.trade_customer_id
        : quote.customer_id ? 'retail_' + quote.customer_id
        : quote.customer_email ? 'guest_' + quote.customer_email : null;

      return (
        <React.Fragment>
        <div className="recd-page">
          <div className="recd-head">
            <div className="recd-top">
              <div style={{ minWidth: 0 }}>
                <div className="opsq-meta">
                  <button className="recd-crumb" onClick={() => navigate('quotes')}>← QUOTES</button>
                  <span style={{ color: 'var(--faint)' }}>/</span>
                  <span style={{ color: 'var(--ink)' }}>{quote.quote_number}</span>
                  <span style={{ color: qStatusColor }}>{qStatusLabel}</span>
                </div>
                <h1 className="recd-title">{quote.customer_name}</h1>
                <div className="recd-meta">
                  <span>{quote.customer_email}</span>
                  {quote.rep_name && <span>{quote.rep_name}</span>}
                  <span>{items.length} lines</span>
                  <span>{engagement.opens} open{engagement.opens === 1 ? '' : 's'}</span>
                  {quote.expires_at && !qSettled && <span style={{ color: qExpired || (daysLeft !== null && daysLeft <= 3) ? 'var(--gold)' : undefined }}>expires {dshort(quote.expires_at)}</span>}
                </div>
              </div>
              <div style={{ marginLeft: 'auto', textAlign: 'right', flexShrink: 0 }}>
                <div className="opsq-block-label" style={{ marginBottom: 0 }}>QUOTE VALUE</div>
                <div className="recd-value">${qTotal.toLocaleString('en-US', { minimumFractionDigits: 2 })}</div>
              </div>
              <div style={{ display: 'flex', gap: 8, alignSelf: 'center', flexShrink: 0, flexWrap: 'wrap' }}>
                {quote.status === 'converted' && (
                  <button className="recd-exc-primary" onClick={() => navigate('order-detail', quote.converted_order_id)}>
                    Open {quote.converted_order_number || 'order'}
                  </button>
                )}
                {canManage && ['draft', 'sent'].includes(quote.status) && (
                  <button className="recd-exc-primary" disabled={updating} onClick={markAccepted}>
                    {updating ? 'Updating…' : 'Mark accepted'}
                  </button>
                )}
                <button className="opsq-alt" onClick={() => setDocPreview({ path: '/api/staff/quotes/' + editId + '/pdf', title: 'Quote ' + quote.quote_number })}>Quote PDF</button>
                {canManage && !['converted', 'declined'].includes(quote.status) && (
                  <button className="opsq-alt" style={{ color: 'var(--hot)' }} disabled={updating} onClick={() => setShowLostSheet(true)}>Mark lost</button>
                )}
              </div>
            </div>
            <div className="recd-rail">
              {qRail.map(([s, when], n) => (
                <div key={s} className="recd-stage">
                  <div style={{ height: 3, background: railDead ? (n === 4 ? 'var(--hot)' : 'var(--line)') : n < qStage ? 'var(--dim)' : n === qStage ? 'var(--gold)' : 'var(--line)' }} />
                  <div className="recd-stage-name" style={{ color: railDead ? (n === 4 ? 'var(--hot)' : 'var(--faint)') : n === qStage ? 'var(--ink)' : n < qStage ? 'var(--dim)' : 'var(--faint)' }}>{s}</div>
                  <div className="recd-stage-when" style={railDead && n === 4 ? { color: 'var(--hot)' } : undefined}>{when}</div>
                </div>
              ))}
            </div>
            <div className="recd-tabs">
              {['record', 'activity'].map(t => (
                <button key={t} className={'recd-tab' + (qTab === t ? ' active' : '')} onClick={() => setQTab(t)}>{t}</button>
              ))}
            </div>
          </div>

          <div className="recd-scroll">
          <div className="rec-body">
          <div className="rec-left">
          {qBlocker && qTab === 'record' && (
            <div className="recd-exception" style={{ borderLeftColor: qExpired ? 'var(--hot)' : 'var(--gold)' }}>
              <div className="recd-exc-head">
                <span style={{ color: qExpired ? 'var(--hot)' : 'var(--gold)' }}>
                  {QTL_RISK_LABEL[qRisk]} · {qExpired ? 'EXPIRED' : quote.status === 'accepted' ? 'AWAITING CONVERSION' : quote.status === 'draft' ? 'STALE DRAFT' : engagement.opens >= 3 ? 'HOT QUOTE' : 'EXPIRING'}
                </span>
                <span style={{ marginLeft: 'auto', color: 'var(--faint)' }}>{quote.quote_number}</span>
              </div>
              <div className="recd-exc-title">{qBlocker}</div>
              {qExpired && canManage && (
                <div className="recd-exc-actions">
                  <button className="recd-exc-primary" disabled={updating} onClick={() => setShowLostSheet(true)}>Close out as lost</button>
                </div>
              )}
            </div>
          )}

          {qTab === 'record' && <div className="form-card">
            <h3>Lines · {items.length}</h3>
            {items.length === 0 ? (
              <div style={{ font: '400 11px/1.5 var(--mono)', color: 'var(--faint)' }}>no lines on this quote yet</div>
            ) : (
            <div className="table-scroll-wrapper">
            <table className="admin-table">
              <thead>
                <tr>
                  <th>Product</th>
                  <th style={{ width: 140 }}>Vendor</th>
                  <th style={{ width: 110 }}>Qty</th>
                  <th style={{ width: 110 }}>Unit Price</th>
                  {showMargin && <th style={{ width: 80, textAlign: 'right' }}>Margin</th>}
                  <th style={{ width: 100, textAlign: 'right' }}>Subtotal</th>
                </tr>
              </thead>
              <tbody>
                {items.map(item => (
                  <tr key={item.id}>
                    <td data-label="Product">
                      <div style={{ fontWeight: 500 }}>
                        {item.collection || item.current_collection || item.product_name || '—'}
                        {item.color ? ' ' + item.color : ''}
                        {item.variant_name && item.variant_name !== item.color ? ' ' + item.variant_name : ''}
                        {item.is_sample && <span className="badge" style={{ fontSize: '0.6rem', marginLeft: '0.5rem', background: 'var(--stone-200)', color: 'var(--stone-700)' }}>Sample</span>}
                      </div>
                      <div style={{ fontSize: '0.6875rem', color: '#a4a09a' }}>
                        {(item.collection || item.current_collection) && item.product_name ? item.product_name : ''}
                        {item.vendor_sku ? ((item.collection || item.current_collection) && item.product_name ? ' · ' : '') + item.vendor_sku : ''}
                      </div>
                    </td>
