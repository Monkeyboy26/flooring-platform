  <!-- Self-hosted React (was cdnjs). A third-party CDN as a BLOCKING dependency
       is a single point of failure: on a flaky mobile network a slow/failed
       cdnjs fetch left storefront-app.js throwing "React is not defined" and the
       whole SPA never mounted (blank page). Serving from our own origin lets the
       service worker precache it, so boot no longer depends on cdnjs uptime. -->
  <!-- defer keeps document-order execution (react → react-dom → app bundle)
       while unblocking HTML parse/paint — these were costing ~1.5s of
       render-blocking time on mobile. -->

  <script defer src="/vendor/react-dom-18.3.1.production.min.js"></script>

  <!-- Roomvo room visualizer. Loads the integration API (window.roomvo) that powers the
       "Visualize in Your Room" button on product pages. We deliberately suppress Roomvo's
       floating assistant bubble: it's armored with inline !important on every CSS property
       so a stylesheet can't hide it — instead we remove the #assistantPopup iframe on sight
       with a MutationObserver. The visualizer/button API is unaffected. -->
  <script async type="text/javascript" src="https://www.roomvo.com/static/scripts/b2b/common/assistant.js"></script>
  <script>
  (function(){
    function killBubble(){ var e = document.getElementById('assistantPopup'); if (e) e.remove(); }
    function start(){ killBubble(); try { new MutationObserver(killBubble).observe(document.body, { childList: true }); } catch(e){} }
    if (document.body) start(); else document.addEventListener('DOMContentLoaded', start);
  })();
  </script>
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      var hadController = !!navigator.serviceWorker.controller;
      var reloaded = false;

      navigator.serviceWorker.register('/sw.js').then(function(reg) {
        // The SW no longer skips waiting on its own — promote a genuinely new
        // worker (installed over an existing controller) so a new deploy still
        // gets picked up, but only ever via this explicit, one-shot handshake.
        function promote() { if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING'); }
        reg.addEventListener('updatefound', function() {
          var nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', function() {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) promote();
          });
        });
        if (reg.waiting && navigator.serviceWorker.controller) promote();
        reg.update();
      }).catch(function() {
        // Registration fails for bots (Google Read-Aloud, headless scrapers our
        // nginx 403s) and flaky Safari sessions — the site works fine without a
        // SW, so never let this surface as an unhandled rejection.
      });

      // Reload once when a new version takes control. The reload is keyed to the
      // worker's version in sessionStorage, so if a load balancer flaps between
      // two builds the tab reloads at most once per version and then converges
      // instead of looping forever. hadController skips the first-install claim.
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        if (!hadController || reloaded) return;
        var ctrl = navigator.serviceWorker.controller;
        if (!ctrl) return;
        var chan = new MessageChannel();
        chan.port1.onmessage = function(ev) {
          var v = ev.data && ev.data.version;
          if (!v) return;
          var key = 'sw_reload_' + v;
          if (sessionStorage.getItem(key)) return; // already picked up this version
          sessionStorage.setItem(key, '1');
          reloaded = true;
          location.reload();
        };
        ctrl.postMessage({ type: 'GET_VERSION' }, [chan.port2]);
      });
    });
  }
  </script>
