<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="theme-color" content="#1c1917">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Roma Rep">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Sales Rep Portal - Roma Flooring Designs</title>
  <!-- Self-hosted React (was cdnjs). The JSX is precompiled to /rep-app.js via
       esbuild (`npm run build:rep`), so there is NO runtime Babel — the login
       page renders without transpiling ~27K lines in the browser. Mirrors the
       storefront build. See CLAUDE.md + package.json build:rep/watch:rep. -->
  <script src="/vendor/react-18.3.1.production.min.js"></script>
  <script src="/vendor/react-dom-18.3.1.production.min.js"></script>
  <script src="https://js.stripe.com/v3/"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&family=Pinyon+Script&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&family=Pinyon+Script&display=swap"></noscript>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --roma-serif: 'Cormorant Garamond', serif;
      --roma-sans: 'Inter', sans-serif;
      --primary: #c9a668;
      --stone-50: #fafaf9;
      --stone-100: #f5f5f4;
      --stone-200: #e7e5e4;
      --stone-300: #d6d3d1;
      --stone-400: #a8a29e;
      --stone-500: #78716c;
      --stone-600: #57534e;
      --stone-700: #44403c;
      --stone-800: #292524;
      --stone-900: #1c1917;
      --gold: #c9a668;
      --gold-light: #d4b87a;
      --green: #16a34a;
      --green-light: #dcfce7;
      --red: #dc2626;
      --red-light: #fee2e2;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-full: 9999px;
      --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 6px rgba(0,0,0,0.05), 0 2px 4px rgba(0,0,0,0.03);
      --shadow-lg: 0 10px 15px rgba(0,0,0,0.06), 0 4px 6px rgba(0,0,0,0.03);
      --transition-fast: 0.15s ease;
      --transition-base: 0.2s ease;
      --transition-slow: 0.3s ease;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: #ece5d8;
      color: var(--stone-800);
    }

    /* Auth – Two-column staff portal */
    .rep-auth {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 640px 1fr;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }
    .rep-auth-form {
      background: var(--stone-900);
      color: #ece5d8;
      padding: 40px 64px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 24px;
      overflow: hidden;
    }
    .rep-auth-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .rep-auth-wordmark {
      font: 300 32px/1 'Cormorant Garamond', serif;
      color: #ece5d8;
      letter-spacing: -0.014em;
    }
    .rep-auth-badge {
      padding: 4px 9px;
      border: 0.5px solid var(--gold);
      font: 500 9px/1 ui-monospace, monospace;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .rep-auth-version {
      font: 500 11px/1 ui-monospace, monospace;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #ece5d880;
    }
    .rep-auth-eyebrow {
      font: 500 11px/1 ui-monospace, monospace;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
    }
    .rep-auth-title {
      font: 300 60px/0.95 'Cormorant Garamond', serif;
      letter-spacing: -0.022em;
      margin: 0;
      color: #ece5d8;
    }
    .rep-auth-body {
      align-self: center;
    }
    .rep-auth-body-inner {
      display: grid;
      gap: 28px;
      max-width: 460px;
    }
    .rep-auth-fields {
      display: grid;
      gap: 18px;
    }
    .rep-auth-field {
      padding-bottom: 8px;
      border-bottom: 0.5px solid #ece5d833;
    }
    .rep-auth-field-label {
      font: 500 10px/1 ui-monospace, monospace;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #ece5d880;
      margin-bottom: 8px;
    }
    .rep-auth-field-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .rep-auth-field input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font: 400 18px/1.3 'Cormorant Garamond', serif;
      color: #ece5d8;
      padding: 0;
    }
    .rep-auth-field input::placeholder {
      color: #ece5d850;
    }
    .rep-auth-field-hint {
      font: 500 10px/1 ui-monospace, monospace;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #ece5d880;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      margin-left: 12px;
    }
    .rep-auth-field-hint:hover {
      color: #ece5d8;
    }
    .rep-auth-actions {
      display: grid;
      gap: 14px;
    }
    .rep-auth-cta {
      width: 100%;
      padding: 16px 24px;
      background: #ece5d8;
      color: var(--stone-900);
      border: none;
      font: 500 12px/1 'Inter', sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity var(--transition-fast);
    }
    .rep-auth-cta:hover { opacity: 0.9; }
    .rep-auth-cta:disabled { opacity: 0.5; cursor: not-allowed; }
    .rep-auth-error {
      font: 400 13px/1.4 'Inter', sans-serif;
      color: #ef4444;
      padding: 10px 14px;
      background: #ef444418;
      border: 0.5px solid #ef444444;
    }
    .rep-auth-security {
      padding-top: 14px;
      border-top: 0.5px solid #ece5d833;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      font: 400 12px/1.5 'Inter', sans-serif;
      color: #ece5d880;
    }
    .rep-auth-security-icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 1px;
      border: 0.5px solid var(--gold);
      color: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font: 400 11px/1 'Cormorant Garamond', serif;
    }
    .rep-auth-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font: 400 12px/1.4 'Inter', sans-serif;
      color: #ece5d880;
    }
    .rep-auth-footer a {
      color: #ece5d8;
      text-decoration: none;
      cursor: pointer;
      border-bottom: 1px solid #ece5d833;
      padding-bottom: 3px;
      font: 500 11px/1 'Inter', sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .rep-auth-footer a:hover { border-color: #ece5d8; }
    /* Editorial right panel */
    .rep-auth-panel {
      position: relative;
      overflow: hidden;
      color: #ece5d8;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 56px 64px;
    }
    .rep-auth-panel-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(40% 60% at 25% 30%, #3a3733, #23211e 80%),
        radial-gradient(30% 30% at 70% 60%, #3a373388, transparent),
        radial-gradient(20% 20% at 50% 80%, #100f0d55, transparent),
        #23211e;
    }
    .rep-auth-panel-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #1c191733 0%, #1c191777 60%, #1c191799 100%);
    }
    .rep-auth-panel-eyebrow {
      position: relative;
      font: 500 11px/1 ui-monospace, monospace;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .rep-auth-panel-headline {
      position: relative;
      font: 300 72px/0.95 'Cormorant Garamond', serif;
      letter-spacing: -0.022em;
      margin: 0;
      color: #ece5d8;
      text-wrap: pretty;
    }
    .rep-auth-panel-headline em {
      font-style: italic;
    }
    .rep-auth-panel-sub {
      position: relative;
      font: 400 16px/1.55 'Inter', sans-serif;
      color: #ece5d8cc;
      margin: 20px 0 0;
      max-width: 460px;
    }
    .rep-auth-panel-attr {
      position: relative;
      margin-top: 26px;
      padding-top: 20px;
      border-top: 0.5px solid #ece5d844;
      font: 500 11px/1.5 ui-monospace, monospace;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #ece5d8cc;
      max-width: 360px;
    }
    @media (max-width: 1080px) {
      .rep-auth { grid-template-columns: 1fr; }
      .rep-auth-panel { display: none; }
      .rep-auth-form { padding: 40px 32px; }
      .rep-auth-title { font-size: 44px; }
    }
    @media (max-width: 480px) {
      .rep-auth-form { padding: 28px 20px; }
      .rep-auth-title { font-size: 36px; }
      .rep-auth-footer { flex-direction: column; gap: 12px; align-items: flex-start; }
    }

    /* Top Bar */
    .rep-topbar {
      padding: 16px 40px;
      background: #ece5d8;
      border-bottom: 0.5px solid rgba(28,25,23,0.13);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      position: sticky;
      top: 0;
      z-index: 95;
    }
    .rep-topbar-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .rep-topbar-wordmark {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 28px;
      line-height: 1;
      letter-spacing: -0.014em;
      color: var(--stone-900);
    }
    .rep-topbar-badge {
      padding: 4px 10px;
      background: var(--stone-900);
      color: #ece5d8;
      font-family: ui-monospace, monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      line-height: 1;
    }
    .rep-topbar-search {
      flex: 1;
      max-width: 520px;
      display: flex;
      align-items: center;
      border: 0.5px solid rgba(28,25,23,0.2);
      background: #ece5d8;
    }
    .rep-topbar-search-icon {
      padding: 9px 14px;
      font-size: 14px;
      color: var(--brass-muted);
    }
    .rep-topbar-search input {
      flex: 1;
      padding: 9px 0;
      border: none;
      background: transparent;
      outline: none;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: var(--stone-900);
    }
    .rep-topbar-search input::placeholder {
      color: var(--brass-muted);
    }
    .rep-topbar-search-kbd {
      padding: 6px 8px;
      margin: 0 6px;
      font-family: ui-monospace, monospace;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.14em;
      color: var(--brass-muted);
      background: var(--brass-warm);
      border: 0.5px solid rgba(28,25,23,0.13);
    }
    .rep-topbar-search { cursor: pointer; }
    .rep-topbar-search input { cursor: pointer; pointer-events: none; }

    /* Global search palette */
    .gs-backdrop {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(28,25,23,0.7);
      display: flex; justify-content: center; padding-top: 80px;
    }
    .gs-palette {
      width: 720px; max-width: 94vw; max-height: calc(100vh - 120px);
      background: #ece5d8;
      border: 0.5px solid rgba(28,25,23,0.2);
      box-shadow: 0 30px 80px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.04) inset;
      display: flex; flex-direction: column;
      align-self: flex-start;
    }
    .gs-input-row {
      padding: 18px 22px;
      border-bottom: 0.5px solid rgba(28,25,23,0.1);
      display: grid; grid-template-columns: 24px 1fr auto; gap: 14px; align-items: center;
    }
    .gs-input-row input {
      border: none; background: transparent; outline: none;
      font: 300 22px/1.2 'Cormorant Garamond', serif;
      letter-spacing: -0.012em; color: var(--stone-900);
      width: 100%;
    }
    .gs-input-row input::placeholder {
      color: var(--brass-muted); font-style: italic;
    }
    .gs-chips {
      padding: 10px 22px; display: flex; gap: 6px; flex-wrap: wrap;
      border-bottom: 0.5px solid rgba(28,25,23,0.07);
    }
    .gs-chip {
      padding: 4px 10px; border: none; cursor: pointer;
      font: 500 10px/1 ui-monospace, monospace;
      letter-spacing: 0.12em; text-transform: uppercase;
      background: transparent; color: var(--brass-muted);
      border: 0.5px solid rgba(28,25,23,0.14);
    }
    .gs-chip.active {
      background: var(--stone-900); color: #ece5d8; border-color: var(--stone-900);
    }
    .gs-results {
      flex: 1; overflow-y: auto; min-height: 0;
    }
    .gs-group-label {
      padding: 8px 22px;
      font: 500 9px/1 ui-monospace, monospace;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--brass-muted);
      background: rgba(28,25,23,0.025);
    }
    .gs-row {
      padding: 10px 22px;
      display: grid; grid-template-columns: 24px 1fr auto; gap: 14px; align-items: center;
      cursor: pointer; border-left: 3px solid transparent;
    }
    .gs-row:hover, .gs-row.selected {
      background: var(--brass-warm, #d8cdb6);
      border-left-color: var(--gold, #c9a668);
    }
    .gs-row .gs-icon {
      font: 400 14px/1 'Cormorant Garamond', serif;
      color: var(--brass-muted);
    }
    .gs-row.selected .gs-icon, .gs-row:hover .gs-icon {
      color: var(--gold, #c9a668);
    }
    .gs-row .gs-title {
      font: 400 13px/1.3 'Inter', sans-serif; color: var(--stone-900);
    }
    .gs-row .gs-sub {
      font: 500 10px/1.4 ui-monospace, monospace;
      letter-spacing: 0.1em; color: var(--brass-muted);
      text-transform: uppercase; margin-top: 2px;
    }
    .gs-row .gs-kbd {
      padding: 2px 8px; background: #fff; border: 0.5px solid rgba(28,25,23,0.2);
      font: 500 10px/1 ui-monospace, monospace; color: var(--brass-muted);
    }
    .gs-footer {
      padding: 10px 22px; border-top: 0.5px solid rgba(28,25,23,0.1);
      background: rgba(28,25,23,0.04);
      display: flex; justify-content: space-between; align-items: center;
    }
    .gs-footer-hints {
      display: flex; gap: 14px;
      font: 500 10px/1 ui-monospace, monospace;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--brass-muted);
    }
    .gs-footer-count {
      font: 500 10px/1 ui-monospace, monospace;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold, #c9a668);
    }
    .gs-footer-see-all {
      font: 500 11px/1 'Inter', sans-serif;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--gold, #c9a668); cursor: pointer;
    }
    .gs-footer-see-all:hover { text-decoration: underline; }

    /* Full search results page */
    .sr-header {
      background: #ece5d8; border: 0.5px solid rgba(28,25,23,0.14);
      padding: 16px 22px; margin-bottom: 14px;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
    }
    .sr-header-label {
      font: 500 10px/1 ui-monospace, monospace;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--brass-muted); margin-bottom: 6px;
    }
    .sr-header-title {
      font: 300 26px/1 'Cormorant Garamond', serif;
      color: var(--stone-900); letter-spacing: -0.012em;
    }
    .sr-header-title em { color: var(--gold, #c9a668); font-style: italic; }
    .sr-header-actions { display: flex; gap: 8px; }
    .sr-header-btn {
      padding: 8px 14px; border: 0.5px solid rgba(28,25,23,0.2);
      background: transparent; cursor: pointer;
      font: 500 10px/1 'Inter', sans-serif;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--stone-900);
    }
    .sr-header-btn:hover { border-color: rgba(28,25,23,0.4); }
    .sr-grid {
      display: grid; grid-template-columns: 220px 1fr; gap: 14px;
    }
    .sr-facets {
      background: #ece5d8; border: 0.5px solid rgba(28,25,23,0.14);
      padding: 14px 16px; align-self: start;
    }
    .sr-facet-heading {
      font: 500 10px/1 ui-monospace, monospace;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--brass-muted); margin: 0 0 10px;
    }
    .sr-facet-group { margin-bottom: 14px; }
    .sr-facet-group-label {
      font: 500 10px/1 ui-monospace, monospace;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--brass-muted); margin-bottom: 6px;
    }
    .sr-facet-item {
      padding: 5px 0; display: flex; justify-content: space-between; align-items: center;
      font: 400 13px/1.4 'Inter', sans-serif; cursor: pointer; color: var(--stone-900);
    }
    .sr-facet-item.active { color: var(--gold, #c9a668); font-weight: 500; }
    .sr-facet-count {
      font: 500 10px/1 ui-monospace, monospace; color: var(--brass-muted);
    }
    .sr-results {
      background: #ece5d8; border: 0.5px solid rgba(28,25,23,0.14);
    }
    .sr-result-row {
      padding: 14px 22px;
      border-bottom: 0.5px solid rgba(28,25,23,0.07);
      display: grid; grid-template-columns: 28px 110px 1fr; gap: 16px; align-items: center;
      cursor: pointer;
    }
    .sr-result-row:hover { background: rgba(28,25,23,0.03); }
    .sr-result-row:last-child { border-bottom: none; }
    .sr-result-icon {
      font: 400 16px/1 'Cormorant Garamond', serif; color: var(--brass-muted);
    }
    .sr-result-badge {
      padding: 3px 10px; display: inline-block;
      background: var(--brass-warm, #d8cdb6);
      font: 500 10px/1 ui-monospace, monospace;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--brass-muted); text-align: center;
    }
    .sr-result-title {
      font: 400 14px/1.3 'Inter', sans-serif; color: var(--stone-900);
    }
    .sr-result-sub {
      font: 400 12px/1.4 'Inter', sans-serif;
      color: rgba(28,25,23,0.6); margin-top: 3px;
    }
    .sr-pagination {
      padding: 14px 22px; border-top: 0.5px solid rgba(28,25,23,0.1);
      display: flex; justify-content: space-between; align-items: center;
    }
    .sr-pagination-count {
      font: 500 10px/1 ui-monospace, monospace;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--brass-muted);
    }
    .sr-load-more {
      font: 500 11px/1 'Inter', sans-serif; color: var(--gold, #c9a668);
      letter-spacing: 0.08em; text-transform: uppercase;
      cursor: pointer; background: none; border: none; padding: 0;
    }
    .sr-load-more:hover { text-decoration: underline; }
    .sr-search-input-row {
      display: flex; align-items: center; gap: 12px;
      background: #ece5d8; border: 0.5px solid rgba(28,25,23,0.14);
      padding: 12px 22px; margin-bottom: 14px;
    }
    .sr-search-input-row input {
      flex: 1; border: none; background: transparent; outline: none;
      font: 300 20px/1.2 'Cormorant Garamond', serif;
      letter-spacing: -0.012em; color: var(--stone-900);
    }
    .sr-search-input-row input::placeholder {
      color: var(--brass-muted); font-style: italic;
    }
    @media (max-width: 768px) {
      .sr-grid { grid-template-columns: 1fr; }
      .sr-facets { order: -1; }
      .sr-result-row { grid-template-columns: 28px 1fr; }
      .sr-result-badge { display: none; }
    }
    .gs-empty {
      padding: 40px 22px; text-align: center;
      font: 400 13px/1.5 'Inter', sans-serif; color: var(--brass-muted);
    }
    .gs-loading {
      padding: 30px 22px; text-align: center;
      font: 500 10px/1 ui-monospace, monospace;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--brass-muted);
    }
    @media (max-width: 768px) {
      .gs-backdrop { padding-top: 20px; }
      .gs-palette { max-height: calc(100vh - 40px); }
      .gs-input-row input { font-size: 18px; }
      .gs-footer-hints span:nth-child(n+3) { display: none; }
    }

    /* Orders list redesign */
    .ol-header {
      margin-bottom: 18px; display: flex; justify-content: space-between;
      align-items: flex-end; flex-wrap: wrap; gap: 12px;
    }
    .ol-header-label {
      font: 500 11px/1 ui-monospace, monospace; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--gold, #c9a668); margin-bottom: 12px;
    }
    .ol-header h1 {

    /* Payments tab — balance */
    .cdv-pay-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; align-items: start; }
    .cdv-bal { padding: 4px 0 16px; border-bottom: 0.5px solid rgba(28,25,23,0.12); margin-bottom: 16px; }
    .cdv-bal-label { font: 500 10px/1 ui-monospace, monospace; letter-spacing: 0.16em; text-transform: uppercase; color: var(--brass-muted); }
    .cdv-bal-amt { font: 300 42px/1 'Cormorant Garamond', serif; letter-spacing: -0.02em; margin-top: 12px; }
    .cdv-bal-note { font: 400 12.5px/1.4 'Inter', sans-serif; color: rgba(28,25,23,0.6); margin-top: 8px; }
    .cdv-bal-rows { display: grid; gap: 11px; }
    .cdv-bal-row { display: flex; justify-content: space-between; align-items: baseline; }
    .cdv-bal-row .k { font: 400 13px/1.4 'Inter', sans-serif; color: var(--brass-muted); }
    .cdv-bal-row .v { font: 400 16px/1 'Cormorant Garamond', serif; color: var(--stone-900); }
    @media (max-width: 900px) { .cdv-pay-grid { grid-template-columns: 1fr; } }

    .cdv-mats { padding: 18px 22px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 14px; }
    .cdv-mat { position: relative; cursor: pointer; }
    .cdv-mat-face { height: 96px; width: 100%; border: 0.5px solid rgba(28,25,23,0.14); background: var(--brass-warm); object-fit: cover; display: block; }
    .cdv-mat:hover .cdv-mat-face { box-shadow: 0 3px 12px rgba(28,25,23,0.14); }
    .cdv-mat:hover .cdv-mat-label { color: var(--gold); }
    .cdv-mat, .cdv-mat-face, .cdv-mat-label { transition: box-shadow 0.18s ease, color 0.15s ease; }
    .cdv-mat-badge { position: absolute; top: 8px; right: 8px; padding: 2px 8px; background: #fff; border: 0.5px solid rgba(28,25,23,0.14); font: 500 9px/1 ui-monospace, monospace; letter-spacing: 0.1em; color: var(--stone-900); }
    .cdv-mat-label { margin-top: 8px; font: 400 12px/1.35 'Cormorant Garamond', serif; color: var(--stone-900); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.7em; }
    .cdv-mat-sub { font: 500 9px/1.4 ui-monospace, monospace; letter-spacing: 0.1em; color: var(--brass-muted); text-transform: uppercase; margin-top: 2px; }

    .cdv-tl-item { display: grid; grid-template-columns: 118px 22px 1fr; gap: 14px; padding: 11px 0; border-bottom: 0.5px solid rgba(28,25,23,0.06); align-items: baseline; }
    .cdv-tl-item:last-child { border-bottom: none; }
    .cdv-tl-item.click { cursor: pointer; }
    .cdv-tl-item.click:hover .cdv-tl-title { color: var(--gold); }
    .cdv-tl-time { font: 500 10px/1.4 ui-monospace, monospace; letter-spacing: 0.1em; text-transform: uppercase; color: var(--brass-muted); }
    .cdv-tl-glyph { font: 400 15px/1 'Cormorant Garamond', serif; text-align: center; }
    .cdv-tl-body { font: 400 13px/1.5 'Inter', sans-serif; color: var(--stone-900); min-width: 0; }
    .cdv-tl-kind { font: 500 9px/1 ui-monospace, monospace; letter-spacing: 0.14em; text-transform: uppercase; color: var(--brass-muted); margin-right: 8px; }
    .cdv-tl-title { color: var(--stone-900); transition: color 0.15s ease; }
    .cdv-tl-desc { color: rgba(28,25,23,0.6); }
    .cdv-tl-view { font: 500 9px/1 ui-monospace, monospace; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); margin-left: 8px; white-space: nowrap; }
    @media (max-width: 640px) { .cdv-tl-item { grid-template-columns: 78px 18px 1fr; gap: 10px; } }

    @media (max-width: 1200px) { .cdv-kpis { grid-template-columns: repeat(3, 1fr); } .cdv-mats { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 900px) {
      .cdv-grid2 { grid-template-columns: 1fr; }
      .cdv-fields { grid-template-columns: 1fr; }
      .cdv-otable-head, .cdv-otable-row { grid-template-columns: 110px 1fr 110px 24px; }
      .cdv-otable-head > :nth-child(2), .cdv-otable-row > :nth-child(2),
      .cdv-otable-head > :nth-child(5), .cdv-otable-row > :nth-child(5) { display: none; }
    }
    @media (max-width: 640px) { .cdv-kpis { grid-template-columns: 1fr 1fr; } .cdv-mats { grid-template-columns: repeat(2, 1fr); } .cdv-name { font-size: 32px; } }

    /* ws-* : unified workspace header (shared) — the cdv-head/cdv-kpis pattern
       generalized for document pages (orders, quotes, estimates, …).
       Breadcrumb trail → serif title + status chip → KPI strip. */
    .ws-crumbs-bar {
      padding-bottom: 14px; border-bottom: 0.5px solid rgba(28,25,23,0.12); margin-bottom: 18px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .ws-crumbs {
      font: 500 10px/1 ui-monospace, monospace; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--brass-muted); display: flex; gap: 12px; align-items: center;
    }
    .ws-crumbs a { color: var(--brass-muted); text-decoration: none; cursor: pointer; }
    .ws-crumbs a:hover { color: var(--stone-900); }
    .ws-crumb-sep { width: 12px; height: 1px; background: rgba(28,25,23,0.25); }
    .ws-crumb-cur { color: var(--stone-900); }
    .ws-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; margin-bottom: 18px; flex-wrap: wrap; }
    .ws-title-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .ws-title {
      font: 300 44px/1 'Cormorant Garamond', serif; letter-spacing: -0.018em;
      margin: 0; color: var(--stone-900);
    }
    .ws-title em { color: var(--gold, #c9a668); font-style: italic; }
    .ws-head-actions { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
    .ws-kpis {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      background: #ece5d8; border: 0.5px solid rgba(28,25,23,0.14); margin-bottom: 16px;
    }
    .ws-kpi { padding: 14px 18px; border-right: 0.5px solid rgba(28,25,23,0.07); min-width: 0; }
    .ws-kpi:last-child { border-right: none; }
    .ws-kpi-l { font: 500 9px/1 ui-monospace, monospace; letter-spacing: 0.16em; text-transform: uppercase; color: var(--brass-muted); }
    .ws-kpi-v { font: 300 22px/1.05 'Cormorant Garamond', serif; letter-spacing: -0.014em; margin-top: 8px; color: var(--stone-900); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ws-kpi-s { font: 400 12px/1.4 'Inter', sans-serif; color: rgba(28,25,23,0.6); margin-top: 6px; }
    /* ws-owner : sidebar "who owns this record" card body (rep/owner chip) */
    .ws-owner { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .ws-owner-name { font: 500 13px/1.25 'Inter', sans-serif; color: var(--stone-900); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .ws-owner-meta {
      font: 500 10px/1.4 ui-monospace, monospace; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--brass-muted); margin-top: 3px; word-break: break-word;
    }
    .ws-you-tag {
      font: 500 8px/1 ui-monospace, monospace; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--gold, #c9a668); border: 0.5px solid rgba(201,166,104,0.5); padding: 2px 5px;
    }
    @media (max-width: 768px) { .ws-title { font-size: 34px; } }

    /* ── Product detail (pd-*) ── */
    .pd-breadcrumb {
      padding-bottom: 16px; border-bottom: 0.5px solid rgba(28,25,23,0.1);
      margin-bottom: 18px; display: flex; align-items: flex-start; justify-content: space-between;
      flex-wrap: wrap; gap: 8px;
    }
    .pd-breadcrumb-trail {
      font: 500 11px/1 ui-monospace, monospace; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--brass-muted);
      display: flex; gap: 12px; align-items: center;
    }
    .pd-breadcrumb-trail a { color: var(--brass-muted); text-decoration: none; cursor: pointer; }
    .pd-breadcrumb-trail a:hover { color: var(--stone-900); }
    .pd-breadcrumb-trail .pd-sep { width: 12px; height: 1px; background: rgba(28,25,23,0.2); }
    .pd-breadcrumb-trail .pd-current { color: var(--stone-900); }
    .pd-breadcrumb-status {
      font: 500 10px/1 ui-monospace, monospace; letter-spacing: 0.14em; text-transform: uppercase;
    }
    .pd-header { display: grid; grid-template-columns: 320px 1fr; gap: 28px; margin-bottom: 18px; }
    .pd-image {
      height: 240px; border: 0.5px solid rgba(28,25,23,0.13);
      position: relative; overflow: hidden; background: var(--brass-warm, #d8cdb6);
      display: flex; align-items: center; justify-content: center;
    }
    .pd-image img { width: 100%; height: 100%; object-fit: cover; }
    .pd-image-sku {
      position: absolute; bottom: 12px; left: 12px;
      padding: 4px 10px; background: #fff;
      font: 500 9px/1 ui-monospace, monospace; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--stone-900);
    }
    .pd-meta-tag {
      padding: 4px 12px; display: inline-block; background: var(--brass-warm, #d8cdb6);
      font: 500 10px/1 ui-monospace, monospace; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--brass-muted); margin-bottom: 10px;
    }
    .pd-title {
      font: 300 44px/1 'Cormorant Garamond', serif; letter-spacing: -0.018em;
      margin: 0 0 8px; color: var(--stone-900);
    }
    .pd-title em { color: var(--gold, #c9a668); font-style: italic; }
    .pd-description { font: 400 14px/1.5 'Inter', sans-serif; color: rgba(28,25,23,0.7); max-width: 640px; }
    .pd-actions { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
    .pd-stats-strip {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0;
      background: #ece5d8; border: 0.5px solid rgba(28,25,23,0.13); margin-bottom: 16px;
    }
    .pd-stat-cell { padding: 16px 20px; }
    .pd-stat-cell:not(:last-child) { border-right: 0.5px solid rgba(28,25,23,0.07); }
    .pd-stat-label { font: 500 10px/1 ui-monospace, monospace; letter-spacing: 0.16em; text-transform: uppercase; color: var(--brass-muted); }
    .pd-stat-value { font: 300 24px/1.1 'Cormorant Garamond', serif; color: var(--stone-900); letter-spacing: -0.014em; margin-top: 8px; }
    .pd-stat-sub { font: 400 12px/1.4 'Inter', sans-serif; color: rgba(28,25,23,0.6); margin-top: 4px; }
    .pd-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
    .pd-pricing-row {
      padding: 12px 22px; display: grid; grid-template-columns: 1fr 80px 100px 70px;
      gap: 14px; align-items: center;
    }
    .pd-pricing-row:not(:last-child) { border-bottom: 0.5px solid rgba(28,25,23,0.07); }
    .pd-pricing-row.highlight { background: var(--brass-warm, #d8cdb6); }
    .pd-pricing-label { font: 400 14px/1.3 'Inter', sans-serif; }
    .pd-pricing-mult { font: 500 10px/1 ui-monospace, monospace; letter-spacing: 0.12em; color: var(--brass-muted); text-align: right; }
    .pd-pricing-price { font: 300 22px/1 'Cormorant Garamond', serif; text-align: right; }
    .pd-pricing-margin { font: 500 11px/1 ui-monospace, monospace; letter-spacing: 0.08em; text-align: right; }
    .pd-spec-grid { padding: 18px 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .pd-spec-label { font: 500 10px/1 ui-monospace, monospace; letter-spacing: 0.14em; text-transform: uppercase; color: var(--brass-muted); margin-bottom: 6px; }
    .pd-spec-value { font: 400 14px/1.3 'Cormorant Garamond', serif; color: var(--stone-900); }
    .pd-spec-wide { grid-column: 1 / -1; }
    .pd-usage-row {
      padding: 12px 22px; display: grid; grid-template-columns: 130px 1fr 1fr 1fr 24px;
      gap: 14px; align-items: center; cursor: pointer;
    }
    .pd-usage-row:not(:last-child) { border-bottom: 0.5px solid rgba(28,25,23,0.07); }
    .pd-usage-id { font: 500 11px/1 ui-monospace, monospace; letter-spacing: 0.06em; color: var(--stone-900); }
    .pd-usage-who { font: 400 13px/1.3 'Cormorant Garamond', serif; color: var(--stone-900); }
    .pd-usage-state { font: 500 10px/1.3 ui-monospace, monospace; letter-spacing: 0.1em; text-transform: uppercase; }
    @media (max-width: 1200px) {
      .pd-header { grid-template-columns: 1fr; }
      .pd-two-col { grid-template-columns: 1fr; }
      .pd-stats-strip { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 768px) {
      .pd-stats-strip { grid-template-columns: repeat(2, 1fr); }
      .pd-title { font-size: 32px; }
    }

    .rep-topbar-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .rep-topbar-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
      padding: 8px 12px;
      background: transparent;
      border: 0.5px solid rgba(28,25,23,0.13);
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--stone-900);
    }
    .rep-topbar-btn:hover {
      border-color: rgba(28,25,23,0.3);
    }
    .rep-topbar-btn .glyph {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      font-weight: 400;
    }
    .rep-topbar-dot {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--brass);
    }
    .rep-topbar-user {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-left: 14px;
      border-left: 0.5px solid rgba(28,25,23,0.13);
    }
    .rep-topbar-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--brass);
      color: #ece5d8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 500;
    }
    .rep-topbar-user-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--stone-900);
      line-height: 1.2;
    }
    .rep-topbar-user-role {
      font-family: ui-monospace, monospace;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--brass-muted);
      margin-top: 2px;
    }

    /* Layout */
    .rep-layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: 100vh;
    }

    /* Sidebar — brass/charcoal redesign */
    .rep-sidebar {
      background: transparent;
      color: var(--stone-900);
      padding: 1.5rem 0;
      position: sticky;
      top: 57px;
      max-height: calc(100vh - 57px);
      align-self: start;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .sidebar-logo {
      padding: 0 1.375rem;
      margin-bottom: 0.125rem;
    }
    .sidebar-logo img {
      width: 80px;
      height: auto;
      display: block;
    }
    .sidebar-subtitle {
      font-family: var(--mono);
      font-size: 0.625rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--brass-muted);
      padding: 0 1.375rem;
      margin-bottom: 1.75rem;
    }
    .sidebar-nav {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .sidebar-section-label {
      padding: 0 1.375rem 0.375rem;
      font-family: var(--mono);
      font-size: 0.625rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--brass-muted);
    }
    .sidebar-section-items {
      display: grid;
      gap: 1px;
    }
    .sidebar-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.625rem;
      padding: 0.5rem 1.375rem;
      font-size: 0.8125rem;
      color: var(--stone-900);
      cursor: pointer;
      transition: all var(--transition-fast);
      border-left: 2px solid transparent;
      border-radius: 0;
      margin: 0;
    }
    .sidebar-item:hover {
      color: var(--stone-900);
      background: rgba(28,25,23,0.04);
    }
    .sidebar-item.active {
      color: var(--stone-900);
      font-weight: 500;
      background: var(--brass-warm);
      border-left-color: var(--brass);
      box-shadow: none;
    }
    .sidebar-item svg { display: none; }
    .sidebar-item-left {
      display: flex;
      align-items: center;
      gap: 0.625rem;
    }
    .sidebar-glyph {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.8125rem;
      width: 16px;
      text-align: center;
      color: var(--brass-muted);
    }
    .sidebar-item.active .sidebar-glyph {
      color: var(--stone-900);
    }
    .sidebar-item-badge {
      font-family: var(--mono);
      font-size: 0.625rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: var(--brass-muted);
    }
    .sidebar-item.active .sidebar-item-badge {
      color: var(--brass);
    }
    .sidebar-logout {
      padding: 0.75rem 1.375rem;
      border-top: 0.5px solid rgba(28,25,23,0.12);
      margin-top: 0.5rem;
    }
    .sidebar-rep-info {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      padding: 0 0 0.5rem;
    }
    .sidebar-rep-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--brass);
      color: var(--stone-50);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.625rem;
      font-weight: 500;
      flex-shrink: 0;
    }
    .sidebar-rep-name {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--stone-900);
      padding: 0;
      margin-bottom: 0;
    }
    .sidebar-rep-role {
      font-family: var(--mono);
      font-size: 0.5625rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--brass-muted);
      margin-top: 0.0625rem;
    }

    /* Content area */
    .rep-content {
      padding: 32px 40px 60px;
      min-height: 100vh;
      /* grid item: allow it to stay within its track instead of expanding to
         max-content when a child is very wide (e.g. a long image thumbnail row) */
      min-width: 0;
      border-left: 0.5px solid rgba(28,25,23,0.09);
    }
    .content-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    .content-header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 300;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.625rem 1.25rem;
      font-size: 0.8125rem;
      font-family: 'Inter', sans-serif;
      border: none;
      border-radius: 0;
      cursor: pointer;
      transition: all var(--transition-base);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--stone-900); color: #ece5d8; }
    .btn-primary:hover { background: var(--stone-800); }
    .btn-secondary { background: transparent; color: var(--stone-800); border: 0.5px solid rgba(28,25,23,0.3); }
    .btn-secondary:hover { background: rgba(28,25,23,0.04); }
    .btn-danger { background: var(--red); color: white; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-success { background: var(--green); color: white; }
    .btn-success:hover { background: #15803d; }
    .btn-sm { padding: 0.4rem 0.75rem; font-size: 0.75rem; border-radius: var(--radius-sm); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Stat cards */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }
    .stat-card {
      background: #f5f0e8;
      border: 0.5px solid rgba(28,25,23,0.1);
      border-radius: 0;
      box-shadow: none;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
      transition: background var(--transition-base);
    }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      transform: scaleX(0);
      transition: transform var(--transition-base);
    }
    .stat-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    .stat-card:hover::before { transform: scaleX(1); }
    .stat-card-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--stone-500);
      margin-bottom: 0.5rem;
    }
    .stat-card-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.5rem;
      font-weight: 400;
      color: var(--stone-900);
    }

    /* Metrics Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }
    .metric-card {
      background: white;
      border: none;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      padding: 1.5rem;
      transition: box-shadow var(--transition-base), transform var(--transition-base);
    }
    .metric-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    .metric-card-label {
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--stone-500);
      margin-bottom: 0.5rem;
    }
    .metric-card-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 400;
      color: var(--stone-900);
    }
    .metric-card-sub {
      font-size: 0.75rem;
      color: var(--stone-400);
      margin-top: 0.25rem;
    }
    .metric-change-up { color: var(--green); font-weight: 500; }
    .metric-change-down { color: var(--red); font-weight: 500; }
    .top-products-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .top-products-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.625rem 0;
      border-bottom: 1px solid var(--stone-100);
      font-size: 0.8125rem;
    }
    .top-products-list li:last-child { border-bottom: none; }

    /* Commission badges */
    .badge-earned { background: var(--green-light); color: var(--green); }
    .badge-paid { background: #dbeafe; color: #2563eb; }
    .badge-forfeited { background: var(--red-light); color: var(--red); }

    /* Timeline */
    .timeline {
      position: relative;
      padding-left: 2rem;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 0.5rem;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--stone-200);
    }
    .timeline-item {
      position: relative;
      padding-bottom: 1.25rem;
      padding-top: 0.5rem;
      padding-right: 0.5rem;
      border-radius: var(--radius-sm);
      transition: background var(--transition-fast), padding-left var(--transition-fast);
    }
    .timeline-item:hover {
      background: var(--stone-50);
    }
    .timeline-dot {
      position: absolute;
      left: -1.625rem;
      top: 0.65rem;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--stone-400);
      border: 2px solid white;
      box-shadow: 0 0 0 1px var(--stone-200);
    }
    .timeline-dot-order_placed { background: #2563eb; }
    .timeline-dot-status_change { background: var(--stone-400); }
    .timeline-dot-payment { background: var(--green); }
    .timeline-dot-sample_request { background: #d97706; }
    .timeline-dot-standalone_sample { background: #d97706; }
    .timeline-dot-quote { background: #7c3aed; }
    .timeline-dot-note { background: var(--stone-500); }
    .timeline-dot-showroom_visit { background: #0d9488; }
    .timeline-dot-installation_inquiry { background: #ea580c; }
    .timeline-type-badge {
      display: inline-block;
      padding: 0.1rem 0.4rem;
      font-size: 0.6rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      border-radius: var(--radius-full);
      margin-right: 0.5rem;
    }
    .timeline-type-order_placed { background: #dbeafe; color: #1e40af; }
    .timeline-type-status_change { background: var(--stone-100); color: var(--stone-600); }
    .timeline-type-payment { background: var(--green-light); color: var(--green); }
    .timeline-type-sample_request { background: #fef3c7; color: #92400e; }
    .timeline-type-standalone_sample { background: #fef3c7; color: #92400e; }
    .timeline-type-quote { background: #ede9fe; color: #6d28d9; }
    .timeline-type-note { background: var(--stone-100); color: var(--stone-600); }
    .timeline-type-showroom_visit { background: #ccfbf1; color: #0f766e; }
    .timeline-type-installation_inquiry { background: #fff7ed; color: #c2410c; }

    .badge-opened { background: #fef3c7; color: #d97706; }
    .badge-carted { background: var(--green-light); color: var(--green); }

    .timeline-title {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--stone-800);
    }
    .timeline-desc {
      font-size: 0.8125rem;
      color: var(--stone-500);
      margin-top: 0.15rem;
    }
    .timeline-time {
      font-size: 0.75rem;
      color: var(--stone-400);
      margin-top: 0.15rem;
    }

    /* Tables */
    .rep-table {
      width: 100%;
      background: #f5f0e8;
      border: 0.5px solid rgba(28,25,23,0.1);
      border-collapse: separate;
      border-spacing: 0;
      border-radius: 0;
      box-shadow: none;
      overflow: hidden;
    }
    .rep-table th {
      text-align: left;
      padding: 0.75rem 1rem;
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--brass-muted);
      border-bottom: 0.5px solid rgba(28,25,23,0.12);
      background: transparent;
    }
    .rep-table td {
      padding: 0.875rem 1rem;
      font-size: 0.875rem;
      border-bottom: 0.5px solid rgba(28,25,23,0.07);
      vertical-align: middle;
    }
    .rep-table tbody tr { transition: background var(--transition-fast); }
    .rep-table tr:hover td { background: rgba(28,25,23,0.03); }
    .rep-table .actions { white-space: nowrap; }
    .rep-table .actions button { margin-right: 0.5rem; }

    /* Status badges */
    .badge {
      display: inline-block;
      padding: 0.2rem 0.65rem;
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      border-radius: var(--radius-full);
    }
    .badge-active, .badge-confirmed { background: var(--green-light); color: var(--green); }
    .badge-draft { background: var(--stone-100); color: var(--stone-500); }
    .badge-inactive { background: var(--red-light); color: var(--red); }
    .badge-pending { background: #fef3c7; color: #d97706; }
    .badge-shipped { background: #dbeafe; color: #2563eb; }
    .badge-delivered { background: var(--green-light); color: #15803d; }
    .badge-cancelled, .badge-declined, .badge-expired { background: var(--red-light); color: var(--red); }
    .badge-refunded { background: #ede9fe; color: #6d28d9; }
    .badge-sent { background: #dbeafe; color: #2563eb; }
    .badge-acknowledged { background: #fef3c7; color: #d97706; }
    .badge-fulfilled { background: var(--green-light); color: #15803d; }
    .badge-accepted { background: #fef3c7; color: #d97706; }
    .badge-converted { background: var(--green-light); color: var(--green); }
    .badge-requested { background: #fef3c7; color: #d97706; }
    .badge-ready_for_pickup { background: #ccfbf1; color: #0d9488; }

    /* Forms */
    .form-card {
      background: #f5f0e8;
      border: 0.5px solid rgba(28,25,23,0.1);
      border-radius: 0;
      box-shadow: none;
      padding: 2rem;
      margin-bottom: 1.5rem;
    }
    .form-card h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      font-weight: 400;
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--stone-200);
    }
    .order-stepper {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      position: relative;
      padding: 0.5rem 0 1rem;
    }
    .stepper-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
      flex: 1;
    }
    .stepper-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.875rem;
      font-weight: 600;
      border: 2px solid var(--stone-300);
      background: white;
      color: var(--stone-400);
      transition: all 0.3s ease;
    }
    .stepper-step.completed .stepper-circle {
      background: var(--green);
      border-color: var(--green);
      color: white;
    }
    .stepper-step.current .stepper-circle {
      border-color: var(--gold);
      background: white;
      color: var(--gold);
      box-shadow: 0 0 0 4px rgba(180, 151, 90, 0.15);
      animation: stepper-pulse 2s ease-in-out infinite;
    }
    @keyframes stepper-pulse {
      0%, 100% { box-shadow: 0 0 0 4px rgba(180, 151, 90, 0.15); }
      50% { box-shadow: 0 0 0 8px rgba(180, 151, 90, 0.08); }
    }
    .stepper-step.cancelled .stepper-circle {
      background: var(--red);
      border-color: var(--red);
      color: white;
    }
    .stepper-label {
      margin-top: 0.5rem;
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--stone-400);
    }
    .stepper-step.completed .stepper-label { color: var(--green); font-weight: 600; }
    .stepper-step.current .stepper-label { color: var(--stone-800); font-weight: 700; }
    .stepper-step.cancelled .stepper-label { color: var(--red); font-weight: 600; }
    .stepper-timestamp {
      font-size: 0.6875rem;
      color: var(--stone-400);
      margin-top: 0.2rem;
    }
    .stepper-connector {
      position: absolute;
      top: 18px;
      height: 2px;
      background: var(--stone-200);
      border: none;
      z-index: 0;
    }
    .stepper-connector.completed {
      background: var(--green);
    }
    .stepper-connector.upcoming {
      background: transparent;
      border-top: 2px dashed var(--stone-300);
    }
    .stepper-cancelled-banner {
      background: var(--red-light);
      border: 1px solid var(--red);
      border-radius: var(--radius-sm);
      color: var(--red);
      text-align: center;
      padding: 0.5rem 1rem;
      font-size: 0.8125rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }
    .stepper-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--stone-100);
    }
    .stepper-cancel-link {
      background: none;
      border: none;
      color: var(--stone-400);
      font-size: 0.8125rem;
      cursor: pointer;
      text-decoration: underline;
      font-family: 'Inter', sans-serif;
      padding: 0;
    }
    .stepper-cancel-link:hover { color: var(--red); }
    .stepper-revert-link {
      background: none;
      border: none;
      color: var(--stone-400);
      font-size: 0.8125rem;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      padding: 0.35rem 0.75rem;
      border: 1px solid var(--stone-300);
      transition: all 0.15s ease;
    }
    .stepper-revert-link:hover { color: var(--stone-700); border-color: var(--stone-400); background: var(--stone-50); }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group.full { grid-column: 1 / -1; }
    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--stone-600);
      margin-bottom: 0.4rem;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 0.5px solid rgba(28,25,23,0.2);
      border-radius: 0;
      font-size: 0.875rem;
      font-family: 'Inter', sans-serif;
      background: #ece5d8;
      transition: border-color var(--transition-fast);
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--brass);
    }
    .form-group textarea { resize: vertical; min-height: 80px; }

    .form-section {
      background: #f5f0e8;
      border: 0.5px solid rgba(28,25,23,0.1);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }
    .form-section-title {
      font-family: 'Inter', sans-serif;
      font-size: 0.8125rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--stone-600);
      margin: 0 0 1rem;
    }
    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .form-grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1rem;
    }
    .form-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--stone-300);
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      font-family: 'Inter', sans-serif;
      background: white;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }
    .form-input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201,166,104,0.1);
    }

    .order-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .order-info-item label {
      display: block;
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--stone-500);
      margin-bottom: 0.25rem;
    }
    .order-info-item span {
      font-size: 0.875rem;
      color: var(--stone-800);
    }

    /* Filter bar */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .filter-bar input,
    .filter-bar select,
    .catalog-filters input,
    .catalog-filters select,
    .catalog-filters-more input,
    .catalog-filters-more select {
      padding: 0.5rem 0.75rem;
      font-size: 0.8125rem;
      font-family: 'Inter', sans-serif;
      border: 0.5px solid rgba(28,25,23,0.2);
      border-radius: 0;
      background: #ece5d8;
      color: var(--stone-800);
      transition: border-color var(--transition-fast);
    }
    .filter-bar input:focus, .filter-bar select:focus,
    .catalog-filters input:focus, .catalog-filters select:focus,
    .catalog-filters-more input:focus, .catalog-filters-more select:focus {
      outline: none;
      border-color: var(--brass);
    }
    .filter-bar input[type="text"] { min-width: 220px; }
    .filter-bar .filter-count {
      margin-left: auto;
      font-size: 0.75rem;
      color: var(--stone-400);
    }

    /* Catalog filter rows */
    .catalog-filters {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
    }
    .catalog-filters-more {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
    }
    .catalog-filters .filter-count {
      margin-left: auto;
      font-size: 0.75rem;
      color: var(--stone-400);
      white-space: nowrap;
    }
    .more-filters-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.5rem 0.7rem;
      font-size: 0.8125rem;
      font-family: 'Inter', sans-serif;
      border: 1px solid var(--stone-300);
      border-radius: var(--radius-sm);
      background: white;
      color: var(--stone-600);
      cursor: pointer;
      transition: all var(--transition-fast);
      white-space: nowrap;
    }
    .more-filters-btn:hover { border-color: var(--stone-400); background: var(--stone-50); }
    .more-filters-btn.active { background: var(--stone-800); color: white; border-color: var(--stone-800); }
    .catalog-active-filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 0.75rem;
    }
    .filter-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.2rem 0.4rem 0.2rem 0.55rem;
      font-size: 0.7rem;
      background: var(--stone-100);
      border: 1px solid var(--stone-200);
      border-radius: var(--radius-full);
      color: var(--stone-600);
    }
    .filter-pill button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 15px;
      height: 15px;
      border: none;
      background: var(--stone-300);
      color: var(--stone-600);
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.6rem;
      line-height: 1;
      padding: 0;
      transition: background var(--transition-fast);
    }
    .filter-pill button:hover { background: var(--stone-500); color: white; }

    /* Loading */
    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--stone-400);
      font-size: 0.875rem;
    }

    /* Modal */
    @keyframes modal-enter {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-box {
      background: white;
      padding: 2rem;
      width: 480px;
      max-width: 90vw;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      animation: modal-enter 0.2s ease-out;
    }
    .modal-box h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 400;
      margin-bottom: 1rem;
    }
    .modal-box p {
      color: var(--stone-600);
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }
    .modal-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
    }
    .modal-box.modal-wide {
      width: 720px;
      max-height: 85vh;
      overflow-y: auto;
    }
    /* Reassign-rep modal */
    .rrm-box { width: 460px; max-width: 92vw; padding: 0; overflow: hidden; }
    .rrm-head { padding: 1.5rem 1.75rem 1.15rem; border-bottom: 1px solid var(--stone-200); }
    .rrm-eyebrow { font: 500 10px/1 ui-monospace, monospace; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); margin-bottom: 9px; }
    .rrm-title { margin: 0; font: 400 1.6rem/1.15 'Cormorant Garamond', serif; color: var(--stone-900); }
    .rrm-sub { margin: 0.55rem 0 0; font: 400 13px/1.5 'Inter', sans-serif; color: var(--stone-500); }
    .rrm-transition { display: flex; align-items: center; gap: 10px; padding: 0.85rem 1.75rem; background: var(--stone-50); border-bottom: 1px solid var(--stone-200); }
    .rrm-tlabel { font: 500 9px/1.3 ui-monospace, monospace; letter-spacing: 0.14em; text-transform: uppercase; color: var(--stone-400); }
    .rrm-tname { font: 500 14px/1.3 'Inter', sans-serif; color: var(--stone-800); }
    .rrm-arrow { margin: 0 2px 0 auto; color: var(--gold); font: 300 22px/1 'Inter', sans-serif; }
    .rrm-list { max-height: 264px; overflow-y: auto; padding: 0.5rem 0.75rem; }
    .rrm-avatar { border-radius: 50%; background: radial-gradient(circle at 32% 28%, #e4dac2, var(--brass-warm)); display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-weight: 300; color: var(--stone-900); flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(28,25,23,0.10); }
    .rrm-avatar.sel { box-shadow: inset 0 0 0 1px rgba(28,25,23,0.10), 0 0 0 2px var(--gold); }
    .rrm-row { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; padding: 0.6rem 0.7rem; border: 1px solid transparent; border-radius: 10px; background: transparent; cursor: pointer; margin-bottom: 2px; transition: background 0.12s, border-color 0.12s; }
    .rrm-row:hover:not(:disabled) { background: var(--stone-50); }
    .rrm-row.sel, .rrm-row.sel:hover { border-color: var(--gold); background: rgba(201,166,104,0.09); }
    .rrm-row:disabled { cursor: default; opacity: 0.5; }
    .rrm-name { font: 500 14px/1.3 'Inter', sans-serif; color: var(--stone-900); display: flex; align-items: center; gap: 7px; }
    .rrm-email { font: 400 12px/1.3 'Inter', sans-serif; color: var(--stone-400); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rrm-badge { font: 500 9px/1 ui-monospace, monospace; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); border: 1px solid var(--gold); border-radius: 4px; padding: 2px 5px; flex-shrink: 0; }
    .rrm-current-tag { font: 500 9px/1 ui-monospace, monospace; letter-spacing: 0.12em; text-transform: uppercase; color: var(--stone-400); flex-shrink: 0; }
    .rrm-radio { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--stone-300); flex-shrink: 0; }
    .rrm-check { width: 20px; height: 20px; border-radius: 50%; background: var(--gold); color: #fff; display: flex; align-items: center; justify-content: center; font: 700 12px/1 'Inter', sans-serif; flex-shrink: 0; }
    .rrm-foot { display: flex; gap: 10px; justify-content: flex-end; align-items: center; padding: 1rem 1.75rem; border-top: 1px solid var(--stone-200); background: var(--stone-50); }
    .rrm-err { padding: 0.75rem 1.75rem 0; color: var(--red); font-size: 13px; }
    .email-preview-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.5rem;
      padding: 0.75rem 1rem;
      background: var(--stone-50);
      border: 1px solid var(--stone-200);

    /* Redesigned quote email preview modal — matches the rep panel's warm palette */
    .qw-email-modal { background: #f7f3ec; border: 0.5px solid rgba(28,25,23,0.14); }
    .qw-email-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1.1rem; }
    .qw-email-head h3 { font: 400 1.5rem/1.15 'Cormorant Garamond', serif; color: #1c1917; }
    .qw-email-eyebrow { font: 600 9px/1 ui-monospace, monospace; letter-spacing: 0.18em; text-transform: uppercase; color: #a87935; margin-bottom: 5px; }
    .qw-email-x { border: none; background: none; cursor: pointer; font-size: 0.85rem; color: rgba(28,25,23,0.4); line-height: 1; padding: 4px; }
