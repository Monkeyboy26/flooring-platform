      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 0.25rem;
    }
    .rof-timeline-text {
      font: 400 0.8125rem/1.4 'Inter', sans-serif;
      color: #1c1917;
    }
    .rof-quick-btn {
      display: block;
      width: 100%;
      padding: 0.625rem 0.875rem;
      text-align: left;
      font: 500 0.75rem/1 'Inter', sans-serif;
      color: #1c1917;
      background: transparent;
      border: 0.5px solid rgba(28,25,23,0.12);
      cursor: pointer;
      transition: all 0.15s;
      margin-bottom: 0.5rem;
    }
    .rof-quick-btn:hover { border-color: #a87935; color: #a87935; }

    /* Summary sidebar */
    .rof-summary {
      background: #f5f0e8;
      border: 0.5px solid rgba(28,25,23,0.13);
      padding: 1.25rem;
    }
    .rof-summary-title {
      font: 500 0.5625rem/1 ui-monospace, 'SF Mono', monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #8a7e68;
      margin-bottom: 1rem;
      padding-bottom: 0.625rem;
      border-bottom: 0.5px solid rgba(28,25,23,0.08);
    }
    .rof-summary-section { margin-bottom: 1rem; }
    .rof-summary-label {
      font: 500 0.5rem/1 ui-monospace, 'SF Mono', monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #8a7e68;
      margin-bottom: 0.3rem;
    }
    .rof-summary-value {
      font: 400 0.8125rem/1.4 'Inter', sans-serif;
      color: #1c1917;
    }
    .rof-summary-line {
      display: flex;
      justify-content: space-between;
      padding: 0.2rem 0;
      font: 400 0.8125rem/1.4 'Inter', sans-serif;
      color: #1c1917;
    }
    .rof-summary-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.625rem 0 0;
      border-top: 0.5px solid rgba(28,25,23,0.12);
      margin-top: 0.375rem;
    }
    .rof-summary-total-label {
      font: 500 0.5625rem/1 ui-monospace, 'SF Mono', monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #8a7e68;
    }
    .rof-summary-total-amount {
      font: 300 1.5rem/1 'Cormorant Garamond', serif;
      color: #1c1917;
    }
    .rof-summary-pill {
      display: inline-block;
      font: 600 0.5rem/1 ui-monospace, 'SF Mono', monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.125rem 0.4rem;
      margin-top: 0.5rem;
    }
    .rof-summary-pill.draft { color: #8a7e68; background: rgba(28,25,23,0.06); }
    .rof-summary-pill.live { color: var(--green); background: rgba(22,163,74,0.1); }

    /* Context card (sidebar) */
    .rof-context {
      background: #f5f0e8;
      border: 0.5px solid rgba(28,25,23,0.13);
      padding: 1.25rem;
      margin-top: 0.75rem;
    }
    .rof-context-title {
      font: 500 0.5625rem/1 ui-monospace, 'SF Mono', monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #8a7e68;
      margin-bottom: 0.75rem;
    }
    .rof-context-text {
      font: 400 0.75rem/1.5 'Inter', sans-serif;
      color: #8a7e68;
    }

    /* Action Bar (dark ink) */
    .rof-action-bar {
      position: fixed;
      bottom: 0;
      left: 220px; /* clear the 220px sidebar column so the bar can't cover Logout */
      right: 0;
      background: #1c1917;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.625rem;
      z-index: 50;
    }
    .rof-action-left {
      margin-right: auto;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .rof-action-order {
      font: 500 0.5625rem/1 ui-monospace, 'SF Mono', monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(245,240,232,0.5);
    }
    .rof-action-total {
      font: 300 1.25rem/1 'Cormorant Garamond', serif;
      color: #f5f0e8;
    }
    .rof-btn {
      padding: 0.5rem 1.25rem;
      font: 500 0.625rem/1 ui-monospace, 'SF Mono', monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 0.5px solid rgba(245,240,232,0.2);
      background: transparent;
      color: rgba(245,240,232,0.7);
      cursor: pointer;
      transition: all 0.15s;
    }
    .rof-btn:hover { border-color: rgba(245,240,232,0.5); color: #f5f0e8; }
    .rof-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .rof-btn-primary {
      background: #a87935;
      color: #f5f0e8;
      border-color: #a87935;
    }
    .rof-btn-primary:hover { background: #c9a668; border-color: #c9a668; }
    .rof-btn-primary:disabled { background: #8a7e68; border-color: #8a7e68; }

    /* Light buttons (used inside cards) */
    .rof-btn-light {
      padding: 0.5rem 1.25rem;
      font: 500 0.625rem/1 ui-monospace, 'SF Mono', monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 0.5px solid rgba(28,25,23,0.18);
      background: transparent;
      color: #1c1917;
      cursor: pointer;
      transition: all 0.15s;
    }
    .rof-btn-light:hover { border-color: #1c1917; }
    .rof-btn-light:disabled { opacity: 0.35; cursor: not-allowed; }
    .rof-btn-light.primary {
      background: #1c1917;
      color: #f5f0e8;
      border-color: #1c1917;
    }
    .rof-btn-light.primary:hover { background: #292524; }
    .rof-btn-light.primary:disabled { background: #8a7e68; border-color: #8a7e68; }
    .rof-btn-light.danger {
      color: var(--red);
      border-color: rgba(220,38,38,0.25);
    }
    .rof-btn-light.danger:hover { border-color: var(--red); }

    /* Inline alert */
    .rof-alert {
      padding: 0.5rem 0.75rem;
      font: 400 0.8125rem/1.4 'Inter', sans-serif;
      border: 0.5px solid;
      margin-bottom: 0.75rem;
    }
    .rof-alert.info { color: #1e40af; background: #eff6ff; border-color: #93c5fd; }
    .rof-alert.warn { color: #92400e; background: #fef3c7; border-color: #f59e0b; }
    .rof-alert.error { color: #991b1b; background: #fef2f2; border-color: #f5c6c6; }
    .rof-alert.success { color: #166534; background: #dcfce7; border-color: #86efac; }

    /* Remove button */
    .rof-remove-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(28,25,23,0.25);
      font-size: 0.8125rem;
      padding: 0.2rem;
      border-radius: 3px;
      transition: color 0.15s, background 0.15s;
    }
    .rof-item-row:hover .rof-remove-btn { color: #8a7e68; }
    .rof-remove-btn:hover { color: var(--red); background: rgba(197,71,49,0.08); }

    /* Modal animations */
    @keyframes rofSpin { to { transform: rotate(360deg); } }
    @keyframes rofFade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rofPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes rofPop { from { opacity: 0; transform: translateY(10px) scale(0.985); } to { opacity: 1; transform: none; } }
    @keyframes rofPopCheck { 0% { transform: scale(0); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
    .rof-spin { animation: rofSpin 0.8s linear infinite; }
    .rof-pulse { animation: rofPulse 1.3s ease-in-out infinite; }
    .rof-pop { animation: rofPop 0.32s cubic-bezier(.22,.61,.36,1); }
    .rof-pop-check { animation: rofPopCheck 0.4s cubic-bezier(.34,1.56,.64,1) 0.05s both; }
    @media (prefers-reduced-motion: reduce) {
      .rof-spin, .rof-pulse, .rof-pop, .rof-pop-check { animation: none !important; }
    }

    /* Modal overlay */
    .rof-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(28,25,23,0.47); backdrop-filter: blur(2px);
      display: flex; align-items: center; justify-content: center; padding: 24px;
      animation: rofFade 0.22s ease;
    }
    .rof-modal-card {
      width: 432px; max-width: 92%; background: #ece5d8; color: #1c1917;
      box-shadow: 0 40px 120px rgba(28,25,23,0.47), 0 0 0 0.5px rgba(28,25,23,0.2);
      display: flex; flex-direction: column; max-height: 90%; overflow: hidden;
    }
    .rof-modal-wide {
      width: 600px;
    }

    /* Step 01b — Browse catalog popup */
    .rof-cat-launch {
      width: 100%; padding: 14px 16px; cursor: pointer; text-align: left;
      border: 0.5px solid #1c1917; background: #1c1917; color: #ece5d8;
      display: grid; grid-template-columns: 40px 1fr auto; gap: 14px; align-items: center;
      margin-bottom: 0.75rem; transition: background 0.12s;
    }
    .rof-cat-launch:hover { background: #2e2a26; }
    .rof-cat-launch-icon {
      width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
      border: 0.5px solid rgba(236,229,216,0.27); font: 400 20px/1 var(--roma-serif);
    }
    .rof-cat-launch-title { display: block; font: 400 17px/1.15 var(--roma-serif); letter-spacing: -0.01em; }
    .rof-cat-launch-sub { display: block; font: 500 9px/1.4 ui-monospace, monospace; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(236,229,216,0.67); margin-top: 4px; }
    .rof-cat-launch-cta { padding: 7px 14px; border: 0.5px solid rgba(236,229,216,0.33); font: 500 10px/1 ui-monospace, monospace; letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap; }
    .rof-cat-dialog {
      width: 1264px; max-width: calc(100% - 16px); height: min(872px, calc(100vh - 40px));
      background: #ece5d8; color: #1c1917;
      box-shadow: 0 40px 120px rgba(28,25,23,0.4), 0 0 0 0.5px #1c1917;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .rof-cat-body { flex: 1; display: grid; grid-template-columns: 1fr 344px; min-height: 0; }
    .rof-cat-grid { overflow-y: auto; padding: 18px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-content: start; }
    .rof-cat-tray { border-left: 0.5px solid rgba(28,25,23,0.12); background: #d8cdb6; display: flex; flex-direction: column; min-height: 0; }
    @media (max-width: 1180px) { .rof-cat-grid { grid-template-columns: 1fr; } }
    @media (max-width: 860px) {
      .rof-cat-body { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      .rof-cat-tray { border-left: none; border-top: 0.5px solid rgba(28,25,23,0.22); max-height: 42%; }
      .rof-cat-header-chip { display: none; }
    }

    /* Responsive */
    @media (max-width: 960px) {
      .rof-body { grid-template-columns: 1fr; }
      .rof-sidebar { position: static; }
      .rof-rail { grid-template-columns: repeat(4, minmax(100px, 1fr)); overflow-x: auto; }
      .rof-mode-cards { grid-template-columns: 1fr; }
      .rof-pay-grid { grid-template-columns: 1fr 1fr; }
      .rof-field-row { grid-template-columns: 1fr; }
      .rof-field-row-3 { grid-template-columns: 1fr; }
      .rof-field-row-name { grid-template-columns: 1fr; }
      .rof-next-grid { grid-template-columns: 1fr; }
      .rof-item-row,
      .rof-items-header { grid-template-columns: 36px 1fr 60px 60px 84px 76px; gap: 0.5rem; }
      .rof-item-row.rof-nocost,
      .rof-items-header.rof-nocost { grid-template-columns: 36px 1fr 60px 84px 76px; }
    }
    @media (max-width: 640px) {
      .rof-container { padding: 0.75rem; }
      .rof-breadcrumb { font-size: 0.5rem; padding: 0.5rem 0; }
      .rof-rail { grid-template-columns: repeat(4, minmax(70px, 1fr)); }
      .rof-rail-step { padding: 0.5rem 0.4rem; gap: 0.3rem; }
      .rof-rail-num { font-size: 0.875rem; }
      .rof-rail-label { font-size: 0.4375rem; letter-spacing: 0.06em; }
      .rof-rail-sub { display: none; }
      .rof-rail-chev { font-size: 0.5rem; }
      .rof-card { padding: 0.75rem; }
      .rof-card-header { padding: 0.625rem 0.75rem; }
      .rof-section-hdr { padding: 1rem 0 0.5rem; }
      .rof-section-hdr-num { font-size: 1.25rem; }
      .rof-section-hdr-label { font-size: 0.5rem; }
      .rof-anchors { gap: 0.3rem; padding: 0.4rem 0.5rem; font-size: 0.4375rem; }
      .rof-pay-grid { grid-template-columns: 1fr 1fr; gap: 0.5rem; }
      .rof-pay-tile { padding: 0.75rem 0.375rem; }
      .rof-pay-tile-icon { font-size: 1.25rem; }
      .rof-pay-tile-label { font-size: 0.4375rem; }
      .rof-item-row { grid-template-columns: 28px 1fr 48px 48px 64px 60px; gap: 0.4rem; padding: 0.4rem 0; }
      .rof-items-header { grid-template-columns: 28px 1fr 48px 48px 64px 60px; gap: 0.4rem; }
      .rof-item-row.rof-nocost,
      .rof-items-header.rof-nocost { grid-template-columns: 28px 1fr 48px 64px 60px; }
      .rof-item-swatch { width: 28px; height: 28px; }
      .rof-item-swatch img { width: 28px !important; height: 28px !important; }
      .rof-item-name { font-size: 0.6875rem; }
      .rof-item-meta { font-size: 0.5rem; }
      .rof-hero { padding: 1.25rem 1rem; }
      .rof-hero-total { font-size: 2rem; }
      .rof-hero-stats { gap: 1rem; }
      .rof-action-bar { padding: 0.625rem 0.75rem; flex-wrap: wrap; gap: 0.375rem; }
      .rof-action-left { width: 100%; margin-bottom: 0.25rem; }
      .rof-btn, .rof-btn-primary { font-size: 0.5rem; padding: 0.4rem 0.6rem; }
      .rof-next-grid { grid-template-columns: 1fr; }
      .rof-quick-btn { font-size: 0.625rem; padding: 0.5rem; }
      .rof-summary { font-size: 0.75rem; }
      .rof-summary-total-amount { font-size: 1.25rem; }
      .rof-tender-row { font-size: 0.6875rem; }
      .rof-customer-card { padding: 0.75rem; }
    }

    /* ─── Rep Order Detail (ROD) Redesign ──────────────────────────── */
    :root {
      --rod-accent: #a87935;
      --rod-green: #3a7a4e;
      --rod-red: #c54731;
      --rod-warm: #d8cdb6;
      --rod-muted: #8a7e68;
      --rod-ink: #1c1917;
      --rod-border: rgba(28,25,23,0.12);
    }

    .rod-breadcrumb {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 18px;
      border-bottom: 0.5px solid var(--rod-border);
      margin-bottom: 18px;
    }
    .rod-breadcrumb-trail {
      font: 500 11px/1 ui-monospace, monospace;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--rod-muted);
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .rod-breadcrumb-trail a {
      color: var(--rod-muted);
      text-decoration: none;
      cursor: pointer;
    }
    .rod-breadcrumb-trail a:hover { color: var(--rod-ink); }
    .rod-breadcrumb-sep {
      width: 12px;
      height: 1px;
      background: rgba(28,25,23,0.2);
      display: inline-block;
    }
    .rod-breadcrumb-trail .rod-current { color: var(--rod-ink); }

    .rod-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 32px;
      margin-bottom: 16px;
    }
    .rod-header-left { flex: 1; }
    .rod-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 5px 12px;
      font: 500 10px/1 ui-monospace, monospace;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .rod-header h1 {
      font: 300 48px/1 'Cormorant Garamond', serif;
      letter-spacing: -0.018em;
      margin: 0;
      color: var(--rod-ink);
    }
    .rod-header h1 em {
      font-style: normal;
      color: var(--rod-accent);
    }
    .rod-header-subtitle {
      font: 400 14px/1.5 'Inter', sans-serif;
      color: rgba(28,25,23,0.7);
      margin-top: 8px;
    }
    .rod-header-money {
      display: grid;
      grid-template-columns: repeat(3, auto);
      gap: 24px;
      padding: 16px 22px;
      background: var(--rod-warm);
      text-align: right;
      flex-shrink: 0;
    }
    .rod-header-money-label {
      font: 500 10px/1 'Inter', sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--rod-muted);
    }
    .rod-header-money-value {
      font: 300 28px/1 'Cormorant Garamond', serif;
      letter-spacing: -0.014em;
      color: var(--rod-ink);
      margin-top: 6px;
    }

    .rod-action-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 24px;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 0.5px solid var(--rod-border);
      flex-wrap: wrap;
    }
    .rod-action-bar .rod-btn {
      padding: 9px 14px;
      background: transparent;
      color: var(--rod-ink);
      border: 0.5px solid rgba(28,25,23,0.2);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font: 500 12px/1 'Inter', sans-serif;
      letter-spacing: 0.04em;
      transition: background 0.15s, border-color 0.15s;
    }
    .rod-action-bar .rod-btn:hover {
      background: rgba(28,25,23,0.04);
      border-color: rgba(28,25,23,0.35);
    }
    .rod-action-bar .rod-btn-primary {
      background: var(--rod-ink);
      color: #fff;
      border-color: var(--rod-ink);
    }
    .rod-action-bar .rod-btn-primary:hover { opacity: 0.9; }
    .rod-action-bar .rod-btn-danger {
      color: var(--rod-red);
      border-color: rgba(197,71,49,0.3);
    }
    .rod-action-bar .rod-btn-danger:hover { background: rgba(197,71,49,0.06); }
    /* Editorial buttons — usable anywhere (vendor cards, modals), unlike the
       .rod-action-bar-scoped .rod-btn. Ghost by default; dark ink when primary. */
    .sd-btn {
      padding: 9px 16px; background: transparent; color: var(--rod-ink);
      border: 0.5px solid rgba(28,25,23,0.28); cursor: pointer;
      font: 500 12px/1 'Inter', sans-serif; letter-spacing: 0.02em;
      display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, opacity 0.15s ease;
    }
    .sd-btn:hover { background: rgba(28,25,23,0.05); border-color: rgba(28,25,23,0.45); }
    .sd-btn:disabled { opacity: 0.4; cursor: default; }
    .sd-btn-primary { background: var(--rod-ink); color: #f5f0e8; border-color: var(--rod-ink); }
    .sd-btn-primary:hover { background: #322d29; border-color: #322d29; }
    .sd-btn-primary:disabled:hover { background: var(--rod-ink); border-color: var(--rod-ink); }
    .sd-btn-sm { padding: 7px 13px; font-size: 11px; letter-spacing: 0.04em; }
    .sd-x {
      width: 24px; height: 24px; flex-shrink: 0; padding: 0; border: none; border-radius: 4px;
      background: transparent; color: var(--rod-muted); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      font: 400 17px/1 'Inter', sans-serif; transition: background 0.15s ease, color 0.15s ease;
    }
    .sd-x:hover { background: rgba(197,71,49,0.1); color: var(--rod-red); }
    .rod-action-bar-right {
      margin-left: auto;
      font: 500 10px/1 ui-monospace, monospace;
      letter-spacing: 0.14em;
      color: var(--rod-muted);
      text-transform: uppercase;
    }

    .rod-snapshot-band {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1px;
      background: rgba(28,25,23,0.10);
      border: 0.5px solid rgba(28,25,23,0.10);
      margin-bottom: 24px;
    }
    .rod-snapshot-tile {
      background: #ece5d8;
      padding: 14px 16px;
    }
    .rod-snapshot-tile-label {
      font: 500 10px/1.2 'Inter', sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--rod-muted);
    }
    .rod-snapshot-tile-value {
      font: 400 16px/1.2 'Cormorant Garamond', serif;
      letter-spacing: -0.008em;
      color: var(--rod-ink);
      margin-top: 8px;
    }
    .rod-snapshot-tile-sub {
      font: 500 10px/1.4 ui-monospace, monospace;
      letter-spacing: 0.12em;
      color: var(--rod-muted);
      text-transform: uppercase;
      margin-top: 4px;
    }

    .rod-body {
      display: grid;
      grid-template-columns: 1.55fr 1fr;
      gap: 20px;
    }
    .rod-col { display: grid; gap: 20px; align-content: start; }

    .rod-card {
      background: #ece5d8;
      border: 0.5px solid rgba(28,25,23,0.13);
    }
    .rod-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 0.5px solid var(--rod-border);
    }
    .rod-card-title {
      font: 500 13px/1 'Inter', sans-serif;
      letter-spacing: 0.04em;
      color: var(--rod-ink);
    }
    .rod-card-actions {
      display: flex;
      gap: 14px;
    }
    .rod-card-action {
      font: 500 11px/1 ui-monospace, monospace;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--rod-accent);
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }
    .rod-card-action:hover { text-decoration: underline; }
    .rod-card-body { padding: 0; }
    .rod-card-body-padded { padding: 18px 20px; }

    .rod-line-items-header {
      padding: 10px 20px;
      display: grid;
      grid-template-columns: 52px 1.7fr 1fr 80px 100px 90px 110px;
      gap: 12px;
      background: var(--rod-warm);
      border-bottom: 0.5px solid var(--rod-border);
      font: 500 9px/1 ui-monospace, monospace;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--rod-muted);
    }
    .rod-line-item-row {
      padding: 14px 20px;
      display: grid;
      grid-template-columns: 52px 1.7fr 1fr 80px 100px 90px 110px;
      gap: 12px;
      align-items: center;
      border-bottom: 0.5px solid rgba(28,25,23,0.06);
    }
    .rod-line-item-row:last-child { border-bottom: none; }
    .rod-line-item-thumb {
      width: 48px;
      height: 44px;
      object-fit: cover;
      background: var(--stone-100);
      flex-shrink: 0;
    }
    .rod-line-item-name {
      font: 400 14px/1.2 'Cormorant Garamond', serif;
      color: var(--rod-ink);
      letter-spacing: -0.005em;
    }
    .rod-line-item-meta {
      font: 500 9px/1.4 ui-monospace, monospace;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--rod-muted);
      margin-top: 3px;
    }
    .rod-line-item-qty {
      text-align: right;
      font: 400 13px/1.2 'Inter', sans-serif;
      color: var(--rod-ink);
    }
    /* Order-detail line items — swatch summary row (rof-item-row look) + expandable detail */
    .rod-li-head {
      padding: 10px 20px;
      display: grid;
      grid-template-columns: 36px 1fr 70px 78px 78px 92px 26px;
      gap: 12px;
      background: var(--rod-warm);
      border-bottom: 0.5px solid var(--rod-border);
      font: 500 9px/1 ui-monospace, monospace;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--rod-muted);
    }
    .rod-li-sum {
      padding: 12px 20px;
      display: grid;
      grid-template-columns: 36px 1fr 70px 78px 78px 92px 26px;
      gap: 12px;
      align-items: center;
      cursor: pointer;
      border-bottom: 0.5px solid rgba(28,25,23,0.06);
      transition: background 0.12s ease;
    }
    /* Cost hidden (showCost off) — one fewer column */
    .rod-li-head.nocost,
    .rod-li-sum.nocost { grid-template-columns: 36px 1fr 70px 84px 98px 26px; }
    .rod-li-chip {
      display: inline-flex;
      align-items: center;
      font: 500 9.5px/1 'Inter', sans-serif;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 4px 9px;
      border-radius: 3px;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    button.rod-li-chip { cursor: pointer; }
    button.rod-li-chip:hover { filter: brightness(0.92); }
    .rod-li-sum:hover { background: rgba(28,25,23,0.025); }
    .rod-li-sum.open { background: rgba(28,25,23,0.035); border-bottom-color: transparent; }
    .rod-li-chev {
      font-size: 10px;
      line-height: 1;
      text-align: center;
      color: var(--rod-muted);
      transition: transform 0.15s ease;
    }
    .rod-li-chev.open { transform: rotate(180deg); }
    .rod-li-detail {
      padding: 4px 20px 16px 20px;
      background: rgba(28,25,23,0.035);
      border-bottom: 0.5px solid rgba(28,25,23,0.06);
    }
    .rod-li-detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
      gap: 12px 20px;
    }
    .rod-li-cell-label {
      font: 500 8.5px/1 ui-monospace, monospace;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--rod-muted);
      margin-bottom: 4px;
    }
    .rod-li-cell-value {
      font: 400 13px/1.35 'Inter', sans-serif;
      color: var(--rod-ink);
    }
    @media (max-width: 720px) {
      /* Qty / Unit / Cost columns hide on mobile (they live in the dropdown) */
      .rod-li-head, .rod-li-sum { grid-template-columns: 36px 1fr 84px 18px !important; gap: 7px; }
      .rod-li-head > :nth-child(3), .rod-li-sum > :nth-child(3),
      .rod-li-head > :nth-child(4), .rod-li-sum > :nth-child(4),
      .rod-li-head:not(.nocost) > :nth-child(5), .rod-li-sum:not(.nocost) > :nth-child(5) { display: none; }
    }
    .rod-line-item-price {
      text-align: right;
      font: 400 13px/1 'Cormorant Garamond', serif;
      color: var(--rod-ink);
      letter-spacing: -0.005em;
    }
    .rod-line-item-subtotal {
      text-align: right;
      font: 400 14px/1 'Cormorant Garamond', serif;
      letter-spacing: -0.008em;
      color: var(--rod-ink);
    }
    .rod-line-item-po a {
      font: 400 13px/1.2 'Inter', sans-serif;
      color: var(--rod-ink);
      text-decoration: underline rgba(28,25,23,0.2);
      cursor: pointer;
    }
    .rod-line-item-status {
      font: 500 10px/1 ui-monospace, monospace;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .rod-totals-row {
      padding: 14px 20px;
      border-top: 0.5px solid var(--rod-border);
      display: flex;
      justify-content: flex-end;
      align-items: baseline;
      gap: 32px;
    }
    .rod-totals-label {
      font: 500 10px/1 ui-monospace, monospace;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--rod-muted);
    }
    .rod-totals-value {
      font: 400 14px/1 'Cormorant Garamond', serif;
      letter-spacing: -0.008em;
      color: var(--rod-ink);
      margin-top: 4px;
    }
    .rod-totals-value-big {
      font: 300 24px/1 'Cormorant Garamond', serif;
      letter-spacing: -0.008em;
      color: var(--rod-ink);
      margin-top: 4px;
    }

    .rod-activity-entry {
      padding: 11px 20px;
      display: grid;
      grid-template-columns: 130px 56px 36px 1fr;
      gap: 12px;
      align-items: flex-start;
      border-bottom: 0.5px solid rgba(28,25,23,0.06);
    }
    .rod-activity-entry:last-child { border-bottom: none; }
    .rod-activity-ts {
      font: 500 10px/1.5 ui-monospace, monospace;
      letter-spacing: 0.14em;
      color: var(--rod-muted);
      text-transform: uppercase;
    }
    .rod-category-badge {
      display: inline-block;
      padding: 2px 6px;
      font: 500 9px/1.4 ui-monospace, monospace;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-align: center;
    }
    .rod-customer-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--rod-warm);
      color: var(--rod-ink);
      display: flex;
      align-items: center;
      justify-content: center;
      font: 500 10px/1 'Inter', sans-serif;
      flex-shrink: 0;
    }
    .rod-customer-avatar-lg {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--rod-accent);
      color: #faf7f2;
      display: flex;
      align-items: center;
      justify-content: center;
      font: 500 14px/1 'Cormorant Garamond', serif;
      flex-shrink: 0;
    }

    .rod-customer-info {
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 12px;
      align-items: center;
    }
    .rod-customer-name {
      font: 400 18px/1.1 'Cormorant Garamond', serif;
      color: var(--rod-ink);
      letter-spacing: -0.012em;
    }
    .rod-customer-type {
      font: 500 10px/1.4 ui-monospace, monospace;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--rod-accent);
      margin-top: 3px;
    }
    .rod-customer-details {
      font: 400 12px/1.6 'Inter', sans-serif;
      color: rgba(28,25,23,0.8);
      margin-top: 12px;
    }
    .rod-customer-actions {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }
    .rod-customer-actions a {
      flex: 1;
      padding: 8px 0;
      text-align: center;
      border: 0.5px solid rgba(28,25,23,0.4);
      font: 500 10px/1 'Inter', sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--rod-ink);
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }
    .rod-customer-actions a:hover { background: rgba(28,25,23,0.04); }

    .rod-customer-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      border-top: 0.5px solid rgba(28,25,23,0.10);
      border-bottom: 0.5px solid rgba(28,25,23,0.10);
      padding: 12px 0;
      margin: 12px 0 0;
    }
    .rod-customer-stat-label {
      font: 500 10px/1 ui-monospace, monospace;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--rod-muted);
    }
    .rod-customer-stat-value {
      font: 400 16px/1 'Cormorant Garamond', serif;
      letter-spacing: -0.008em;
      color: var(--rod-ink);
      margin-top: 4px;
    }

    .rod-commission-earning {
      padding: 12px 14px;
      background: var(--rod-warm);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: baseline;
    }
    .rod-commission-earning-label {
      font: 500 10px/1 ui-monospace, 'SF Mono', monospace;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--rod-muted);
    }
    .rod-commission-earning-value {
      font: 300 32px/1 'Cormorant Garamond', serif;
      color: var(--rod-ink);
      letter-spacing: -0.014em;
      margin-top: 6px;
    }
    .rod-commission-row {
      display: flex;
      justify-content: space-between;
      font: 400 13px/1.3 'Inter', sans-serif;
      padding: 6px 0;
      border-bottom: 0.5px solid rgba(28,25,23,0.07);
    }
    .rod-commission-row-label { color: var(--rod-muted); }
    .rod-commission-row-value {
      font: 400 14px/1 'Cormorant Garamond', serif;
      letter-spacing: -0.005em;
      color: var(--rod-ink);
    }
    .rod-commission-footer {
      font: 500 10px/1.4 ui-monospace, 'SF Mono', monospace;
      letter-spacing: 0.12em;
      color: var(--rod-muted);
      text-transform: uppercase;
    }

    /* Shared rod form controls & inline panels */
    .rod-input {
      width: 100%; box-sizing: border-box; padding: 8px 10px;
      border: 0.5px solid rgba(28,25,23,0.3); border-radius: 0; background: #fff;
      font: 400 13px/1.3 'Inter', sans-serif; color: var(--rod-ink); outline: none;
      transition: border-color 0.15s ease;
    }
    .rod-input:focus { border-color: var(--rod-accent); }
    textarea.rod-input { resize: vertical; font-family: 'Inter', sans-serif; }
    .rod-field-label {
      display: block; font: 500 9px/1 ui-monospace, monospace;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--rod-muted); margin-bottom: 6px;
    }
    .rod-mini-btn {
      padding: 8px 12px; border: 0.5px solid rgba(28,25,23,0.35); border-radius: 0;
      background: transparent; cursor: pointer;
      font: 500 10px/1 'Inter', sans-serif; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--rod-ink);
    }
    .rod-mini-btn:hover:not(:disabled) { border-color: var(--rod-ink); }
    .rod-mini-btn.primary { background: var(--rod-ink); color: #ece5d8; border-color: var(--rod-ink); }
    .rod-mini-btn.primary:hover:not(:disabled) { opacity: 0.9; }
    .rod-mini-btn.danger { color: var(--rod-red); border-color: rgba(197,71,49,0.4); }
    .rod-mini-btn.danger:hover:not(:disabled) { border-color: var(--rod-red); background: rgba(197,71,49,0.06); }
    .rod-mini-btn.selected { background: var(--rod-ink); color: #ece5d8; border-color: var(--rod-ink); }
    .rod-mini-btn:disabled { opacity: 0.4; cursor: default; }
    .rod-inline-panel {
      margin-top: 12px; padding: 14px 16px;
      border: 0.5px solid var(--rod-border); background: rgba(28,25,23,0.025);
    }
    /* Collect-payment — flows inline within the Totals card (native components) */
    @keyframes rodCollectExpand {
      from { opacity: 0; max-height: 0; }
      to   { opacity: 1; max-height: 760px; }
    }
    .rod-collect-wrap {
      display: grid; gap: 12px; overflow: hidden;
      padding-top: 12px; border-top: 0.5px solid var(--rod-border);
      animation: rodCollectExpand 0.28s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    .rod-collect-methods { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; }
    .rod-collect-note { font: 400 12.5px/1.4 'Inter', sans-serif; color: var(--rod-muted); }
    .rod-banner {
      padding: 8px 12px; margin-top: 10px; text-align: center;
      font: 500 10px/1.4 ui-monospace, monospace; letter-spacing: 0.12em; text-transform: uppercase;
    }

<body>
  <div id="root"></div>
  <script>
    // Scrolling over a focused number input silently changes its value — blur so the wheel just scrolls.
    document.addEventListener('wheel', (e) => {
      const el = document.activeElement;
      if (el && el.tagName === 'INPUT' && el.type === 'number' && el.contains(e.target)) el.blur();
    }, { passive: true });
  </script>
