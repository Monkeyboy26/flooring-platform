    # SPA routes without crawler detection (no SEO value)
    location /visit/ { add_header Cache-Control "no-cache, no-store, must-revalidate"; add_header X-Frame-Options "SAMEORIGIN" always; add_header X-Content-Type-Options "nosniff" always; add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; add_header Referrer-Policy "strict-origin-when-cross-origin" always; add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(self)" always; try_files /storefront.html =404; }
    location /account { add_header Cache-Control "no-cache, no-store, must-revalidate"; add_header X-Frame-Options "SAMEORIGIN" always; add_header X-Content-Type-Options "nosniff" always; add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; add_header Referrer-Policy "strict-origin-when-cross-origin" always; add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(self)" always; try_files /storefront.html =404; }
