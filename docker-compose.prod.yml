version: '3.8'

services:
  db:
    restart: unless-stopped
    ports: []
    # SECURITY: require real secrets in prod — fail the deploy if unset rather than
    # silently booting with the dev defaults (postgres / minioadmin) from the base file.
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER must be set in prod}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in prod}
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend_net

  minio:
    restart: unless-stopped
    ports: []
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in prod}
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend_net

  api:
    restart: unless-stopped
    ports: []
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in prod}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in prod}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in prod}
    deploy:
      resources:
        limits:
          memory: 2G
    volumes:
      - ./uploads:/app/uploads
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend_net
      - backend_net

  frontend:
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./uploads:/usr/share/nginx/html/uploads:ro
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend_net

  certbot:
    image: certbot/certbot
    container_name: flooring-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    image: postgres:14-alpine
    container_name: flooring-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-flooring_pim}
      DB_USER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in prod}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-west-2}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./scripts/backup-cron:/etc/crontabs/root:ro
      - backup_data:/backups
      - ./uploads:/uploads:ro
    entrypoint: "/bin/sh -c 'apk add --no-cache aws-cli && crond -f -l 2'"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend_net

networks:
  frontend_net:
  backend_net:

volumes:
  backup_data:
